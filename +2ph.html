wr:[{m:3,q:"Assuming V_CE(sat) = 0.2 V and \u03b2 = 50, find the minimum base current (I_B) required to drive the transistor (3 V supply, 1 k\u03a9 collector resistor) to saturation.",a:"(Worked by me; the result matches the book\u2019s answer of 56 \u00b5A.)\nAt saturation the collector current is limited by the collector resistor: I_C(sat) = (3 \u2212 0.2)/(1 \u00d7 10\u00b3) = 2.8 mA.\nThe minimum base current is I_B = I_C(sat)/\u03b2 = 2.8 mA/50 = 56 \u00b5A.",k:[["56"],["2.8"],["(3 \u2212 0.2)","2.8 ma","3 - 0.2"],["50"],["saturation"]]},{m:3,q:"In the circuit, the BJT has a current gain (\u03b2) of 50. For an emitter\u2013base voltage V_EB = 600 mV, calculate the emitter\u2013collector voltage V_EC. (3 V supply, 60 k\u03a9 base resistor, 500 \u03a9 collector resistor)",a:"(Worked by me; the result matches the book\u2019s answer of 2 V.)\nBase current: I_B = (3 \u2212 0.6)/60 000 = 40 \u00b5A.\nCollector current: I_C = \u03b2 I_B = 50 \u00d7 40 \u00b5A = 2 mA.\nVoltage drop across the 500 \u03a9 resistor: 2 mA \u00d7 500 \u03a9 = 1 V.\nV_EC = 3 V \u2212 1 V = 2 V.",k:[["2 v","2v","2"],["40"],["2 ma","2mA"],["1 v","1v","500"],["3 \u2212 0.6","2.4","2.4 v"]]},{m:5,q:"Sketch the static characteristics of a common emitter transistor and bring out the essential features of input and output characteristics.",a:"The static characteristics are obtained with the circuit of the NPN transistor in common emitter configuration, with a dc voltage source and meters for the base and collector currents.\nINPUT CHARACTERISTICS: a plot of base current IB against base-emitter voltage VBE, at a constant collector-emitter voltage VCE. VCE is first set to a value above 0.7 V (to reverse bias the collector junction), VBE is increased in steps, and IB is recorded; the procedure is repeated for other values of VCE. The features are: (i) the curve looks like the forward characteristic of a p-n junction diode; (ii) there is a threshold or knee voltage Vknee (0.7 V for silicon and 0.3 V for germanium), below which IB is very small, and beyond which IB increases with VBE; (iii) an increase in VCE decreases IB and shifts the curve outward, because a wider depletion region reduces the effective base width. The input resistance ri = \u0394VBE/\u0394IB at constant VCE is high, and it is not constant in the lower part of the curve.\nOUTPUT CHARACTERISTICS: a plot of collector current IC against collector-emitter voltage VCE, at constant base current IB. For each value of IB the collector current first rises sharply with VCE, and then becomes almost constant. The region where IC is almost constant for a given IB is the active region, where the transistor acts as an amplifier and IC = \u03b2IB. The curve for IB = 0 shows only the small leakage current. The region near the origin, where IC rises steeply, is the saturation region, where the transistor acts as a closed switch, and the region below the curve for IB = 0 is the cut-off region, where it acts as an open switch.",k:[["input characteristic","input"],["base current","ib"],["vbe","base-emitter"],["vce","collector-emitter"],["knee","threshold"],["depletion","width"],["output characteristic","output"],["active region","active"],["saturation"],["cut-off","cut off"],["constant"]]},{m:5,q:"List out the advantages and limitations of frequency modulation.",a:"ADVANTAGES OF FM: (i) In FM the noise is greatly reduced, so the signal-to-noise ratio is increased, giving a much better quality of reception. (ii) The operating range is quite large. (iii) The transmission efficiency is very high, because all the transmitted power is useful; the amplitude of the FM wave is constant, so no power is wasted on the carrier amplitude as in AM.\nLIMITATIONS OF FM: (i) FM requires a much wider channel (bandwidth) than AM, because the frequency deviation is large. (ii) FM transmitters and receivers are more complex and costly. (iii) In FM reception, a smaller area is covered than in AM for the same transmitter power, because the signal has a shorter range. The centre (resting) frequency of an FM transmitter is the allotted carrier frequency when there is no input signal.",k:[["noise","signal-to-noise","signal noise"],["range"],["efficiency"],["bandwidth","channel","wider"],["complex","costly"],["area","range"],["centre","center","resting"]]},{m:5,q:"Explain ground wave and space wave propagation of electromagnetic waves through space.",a:"GROUND WAVE (SURFACE WAVE) PROPAGATION: the wave travels along the surface of the Earth, following its curvature. It is used for frequencies up to about 2 MHz, for example in medium-wave AM broadcasting, radio navigation and ship-to-shore communication. The wave is attenuated as it travels, because the Earth absorbs some of its energy, so the range is limited, but the wave is not affected by changes in the ionosphere.\nSPACE WAVE PROPAGATION: waves at frequencies above about 30 MHz pass through the ionosphere and do not get reflected back to the Earth. They travel in a straight line from the transmitting antenna to the receiving antenna, so the range is limited by the line of sight, which depends on the height of the antennas. Space wave propagation is used for television and FM broadcasting, and for satellite communication, where the waves travel to a satellite high above the Earth. The range can be extended by using towers, or by placing the antennas at a greater height.",k:[["surface","ground"],["curvature"],["2 mhz","2mhz","2 MHz"],["attenuat","absorb"],["ionosphere"],["straight line","line of sight"],["30 mhz","30mhz","30 MHz"],["television","tv","fm"],["satellite"],["height","tower"]]},{m:5,q:"Explain the basic elements of a communication system with the necessary block diagram.",a:"A communication system transfers information from a source to a destination. Its basic elements, shown in the block diagram, are:\n(i) Information source: the message, which can be speech, music, pictures or computer data.\n(ii) Input transducer: converts the information into an electrical signal, called the baseband signal (for example, a microphone converts sound energy into electrical energy).\n(iii) Transmitter: feeds the electrical signal to the communication channel. It consists of an amplifier (the transducer output is weak), an oscillator (which generates the high-frequency carrier wave, whose high frequency gives it high energy), a modulator (which superimposes the baseband signal on the carrier) and a power amplifier (which raises the power to cover a large distance).\n(iv) Transmitting antenna: radiates the radio signal into space as electromagnetic waves, travelling at the speed of light.\n(v) Communication channel: carries the signal from transmitter to receiver with the least noise or distortion; it may be wires, cables or optical fibres (wireline) or free space (wireless).\n(vi) Receiving antenna: picks up the signal from the channel.\n(vii) Receiver: contains an amplifier (to amplify the weak received signal), a demodulator (which separates the baseband signal from the carrier) and an output amplifier.\n(viii) Output transducer: converts the electrical signal back into the original information, for example a loudspeaker.",k:[["information"],["transducer"],["baseband"],["transmitter"],["oscillator","carrier"],["modulator","modulat"],["power amplifier"],["antenna"],["channel"],["demodulat"],["receiver"],["loudspeaker","output"]]},{m:5,q:"Write a note on satellite communication and on fibre optic communication, and state their applications.",a:"SATELLITE COMMUNICATION: a communication satellite is placed in orbit around the Earth and acts as a relay station. A ground station transmits a signal to the satellite in the uplink, the satellite amplifies it and retransmits it in the downlink to receiving stations on the Earth. Because the signals are at microwave frequencies, which pass through the ionosphere, space wave propagation is used, and a satellite in a geostationary orbit allows continuous communication over a large area. Applications include television broadcasting, long-distance telephone and internet links, weather forecasting and navigation.\nFIBRE OPTIC COMMUNICATION: information is carried as light pulses along an optical fibre, which works on total internal reflection in a core of higher refractive index surrounded by a cladding of lower index. Optical fibres have a very large bandwidth, low loss, low cost of material, and are immune to electrical interference. They are used in telephone and internet cables, in medical endoscopes, and for communication over long distances under the sea.",k:[["satellite"],["uplink","up link"],["downlink","down link"],["relay"],["geostationary"],["microwave"],["fibre","fiber"],["total internal","core"],["cladding"],["bandwidth","loss"],["endoscope","telephone","internet"]]},{m:5,q:"Describe the transistor as an amplifier with a neat circuit diagram, and explain the working of a common emitter amplifier.",a:"CIRCUIT: a single-stage amplifier uses an NPN transistor in the common emitter configuration. The base is biased through a resistor RB from the supply VCC, the collector is connected to VCC through a load resistor RC, and the input signal VS is coupled to the base through a capacitor. The output is taken from the collector across RC through a coupling capacitor. The transistor works in the active region, where the emitter-base junction is forward biased and the collector-base junction is reverse biased.\nWORKING: during the positive half cycle of the input, the forward voltage across the emitter-base junction increases, so the base current IB increases. The collector current IC increases by a factor \u03b2. This increases the voltage drop across RC, which decreases the collector-emitter voltage VCE. So the positive half cycle of the input produces a negative half cycle at the output. During the negative half cycle of the input, the base current decreases, the collector current falls, and the voltage across RC decreases, so VCE rises. The output is therefore an amplified copy of the input, reversed in phase by 180\u00b0.\nAMPLIFICATION: the voltage gain is large because a small change in base current produces a large change in collector current, and the change in the output voltage across RC is larger than the input change. Multistage amplifiers are made by cascading stages with coupling elements such as resistors, capacitors and transformers.",k:[["common emitter","ce"],["active region","active"],["forward","reverse"],["base current","ib"],["beta","\u03b2"],["collector current","ic"],["180"],["amplif"],["cascad","multistage"],["vce","collector-emitter"]]},{m:5,q:"Explain the transistor as a switch, with the DC load line and the operating point.",a:"A transistor works as an electronic switch that turns a circuit ON or OFF with a small control signal. It is operated only in two regions: in saturation it acts as a closed switch, and in cut-off it acts as an open switch.\nDC LOAD LINE: the straight line joining the points A (VCC, 0) on the voltage axis and B (0, VCC/RC) on the current axis is the DC load line, with slope determined by RC. It is drawn on the output characteristics of the transistor.\nOPERATING POINT: the point where the load line intersects the characteristic curve for the chosen base current is the operating point. For switching, the input signal is made high enough to drive the transistor into saturation, where the collector-emitter voltage is almost zero and the lamp or load is fully on; when the input is removed, the transistor is cut off, no collector current flows, and the load is off.",k:[["switch"],["saturation","closed"],["cut-off","cut off","open"],["load line"],["vcc"],["operating point"],["base current","input"],["on","off"]]},{m:5,q:"What is an LED? Give the principle of its operation with a diagram.",a:"A light emitting diode (LED) is a p-n junction diode that emits visible or invisible light when it is forward biased. Since electrical energy is converted into light energy, the process is called electroluminescence. Its circuit symbol has arrows pointing away from the diode to show that light is emitted.\nPRINCIPLE: when the p-n junction is forward biased, electrons from the conduction band of the n-side and holes from the valence band of the p-side diffuse across the junction. On crossing it they become excess minority carriers: electrons in the p-side and holes in the n-side. These excess carriers recombine with the oppositely charged majority carriers in their regions, the electrons in the conduction band recombining with holes in the valence band. During recombination energy is released. In radiative recombination the energy is emitted as a photon of energy h\u03bd, which is visible light; in non-radiative recombination it is released as heat.\nCOLOUR: the colour of the light depends on the energy band gap of the material, E = hc/\u03bb, so the LEDs are made in a range of colours: blue (SiC), green (AlGaP), red (GaAsP), and white light (GaInN) is also available.\nAPPLICATIONS: indicator lamps on instrument panels, seven-segment displays, traffic and emergency vehicle lights, and remote controls of television and air conditioners.",k:[["electroluminescence"],["forward"],["recombin"],["conduction band"],["valence band"],["photon","radiative"],["heat","non-radiative"],["band gap","energy gap"],["blue","green","red"],["indicator","traffic","remote"]]},{m:5,q:"Explain the working of a photodiode and a solar cell.",a:"PHOTODIODE: a photodiode is a p-n junction diode, reverse biased, that is used to detect light. When light of suitable energy (hv greater than the band gap) falls on the junction, it creates electron\u2013hole pairs in the depletion region. The electric field of the junction separates them: electrons move to the n-side and holes to the p-side. This produces a reverse current that is proportional to the intensity of the light. It is used in optical communication and in detectors.\nSOLAR CELL: a solar cell is a p-n junction, operated without bias, that converts light energy directly into electrical energy (photovoltaic action). When sunlight falls on the junction, the electron\u2013hole pairs created in and near the depletion region are separated by the built-in electric field, so a potential difference and a current are produced in an external circuit. Solar cells are used to power satellites, calculators, and remote equipment.",k:[["reverse"],["electron-hole","electron\u2013hole","electron hole","pair"],["depletion"],["electric field","built-in"],["light energy","electrical energy"],["photovoltaic"],["satellite","calculator"]]},{m:5,q:"Draw the circuit diagram of a half-wave rectifier and explain its working.",a:"CIRCUIT: a half-wave rectifier consists of a step-down transformer, a p-n junction diode in series with the secondary winding, and a load resistor RL in series with the diode. The alternating input is applied to the primary of the transformer, and the output is taken across RL.\nWORKING: during the positive half cycle of the input, the diode is forward biased (its anode is at a positive potential with respect to its cathode). It conducts, and a current flows through the load, producing an output voltage across RL. During the negative half cycle the diode is reverse biased and does not conduct, so no current flows and the output is zero. The output is therefore a series of positive half cycles with the negative half cycles missing, which is a pulsating dc.\nThe output frequency is the same as the input frequency. The efficiency of the half-wave rectifier is about 40.6%. A filter (usually a capacitor) and a voltage regulator are used to smooth the output to steady dc.",k:[["step-down","transformer"],["diode"],["forward"],["reverse"],["positive half","positive"],["negative half","negative"],["pulsating"],["40.6","efficiency"],["filter","capacitor"]]},{m:5,q:"Explain the process of amplitude modulation with the necessary diagrams.",a:"Amplitude modulation (AM) is the process in which the amplitude of a high-frequency carrier wave is varied in proportion to the instantaneous amplitude of the low-frequency baseband (message) signal, while its frequency and phase remain constant.\nDIAGRAMS AND PRINCIPLE: the baseband signal, with frequency of about 20 Hz to 20 kHz, is shown as a low-frequency wave; the carrier is a high-frequency sine wave, of frequency much greater than that of the baseband signal. The modulated wave has the same frequency as the carrier, but its envelope (the peaks of the wave) follows the shape of the baseband signal. The amplitude of the carrier is greater than the amplitude of the baseband signal, so that the envelope does not cross zero.\nSINGLE TRANSISTOR AM CIRCUIT: the baseband and the carrier are applied to the base of a transistor (or a diode), which is operated in a nonlinear region, and the output contains the carrier and the sum and difference frequencies of the carrier and the baseband. A tuned circuit selects the sidebands.\nUSES: AM is used in radio broadcasting. Its advantages are a small bandwidth requirement and low cost; its disadvantages are high noise and a small operating range.",k:[["amplitude"],["carrier"],["baseband","message"],["envelope"],["frequency"],["sideband","sum","difference"],["noise"],["radio"]]},{m:5,q:"Explain the formation of the depletion region and the barrier potential in a p-n junction diode.",a:"When a p-type and an n-type semiconductor are joined, the majority carriers diffuse across the junction: electrons from the n-side move into the p-side and holes from the p-side move into the n-side. This gives a diffusion current. When an electron leaves the n-side, the pentavalent atom there becomes a positive ion. The electron that enters the p-side recombines with a hole near the junction, and the trivalent atom there becomes a negative ion. These ions are fixed in the crystal lattice and cannot move. A layer of positive ions builds up on the n-side and a layer of negative ions on the p-side.\nThe region near the junction, which is depleted of free charge carriers, is called the depletion region. The layers of ions set up an electric field directed from the positive ions on the n-side to the negative ions on the p-side. This field exerts a force on the carriers, in the opposite direction to the diffusion, and it opposes further diffusion. Diffusion continues until the field is strong enough to stop it.\nThe potential difference across the depletion region is the barrier potential. It is about 0.3 V for germanium and 0.7 V for silicon at room temperature. The barrier potential depends on the type of semiconductor, the amount of doping and the temperature.",k:[["diffusion"],["majority"],["positive ion","positive"],["negative ion","negative"],["depletion"],["barrier"],["electric field","field"],["0.7","0.3"],["doping"],["temperature"]]},{m:5,q:"Explain the construction and working of a full-wave rectifier.",a:"CONSTRUCTION: a full-wave rectifier uses a centre-tapped transformer, two p-n junction diodes D1 and D2 and a load resistor RL. The centre tap is connected to the load and taken as the reference (zero) point. The two ends of the secondary winding are connected to the anodes of the diodes, and the cathodes are joined to the load.\nWORKING: during the positive half cycle of the input, the top end of the secondary is positive and the bottom end negative. Diode D1 is forward biased and conducts, and D2 is reverse biased and blocks. Current flows through the load from the centre tap towards the top. During the negative half cycle, the top end is negative and the bottom end positive. D2 now conducts and D1 is blocked. The current through the load again flows in the same direction, from the centre tap to the top. So both half cycles of the input give an output in the same direction.\nOUTPUT: the output across the load is a pulsating dc with positive humps for every half cycle. Its frequency is twice that of the input. The output is smoothed by a filter, and a voltage regulator gives a steady dc. The efficiency of the full-wave rectifier is about 81.2%, which is twice that of the half-wave rectifier.",k:[["centre","center","tap"],["two diodes","d1","d2","diodes"],["forward","reverse"],["half cycle","half-cycle"],["same direction"],["pulsating"],["twice","frequency"],["filter"],["81","efficiency"]]},{m:2,q:"Write a short note on diffusion current across a p-n junction.",a:"Diffusion of the majority charge carriers across the junction gives rise to an electric current called the diffusion current. When an electron leaves the n-side, the pentavalent atom there becomes a positive ion. The electron that diffuses into the p-side recombines with a hole near the junction, and the trivalent atom there becomes a negative ion. These ions are fixed in the crystal lattice and cannot move, so a layer of positive ions on the n-side and negative ions on the p-side is formed. This thin region near the junction, without free carriers, is the depletion region, and it sets up the barrier potential that opposes further diffusion.",k:[["diffusion current","diffusion"],["majority"],["positive ion","positive"],["negative ion","negative"],["depletion"],["barrier"],["recombin"]]},{m:2,q:"Explain the need for a feedback circuit in a transistor oscillator.",a:"The tank circuit of LC components produces electrical oscillations, but these are damped: energy is lost as heat in the coil and capacitor, so the amplitude of the oscillations decreases gradually. A feedback network supplies a part of the output back to the input in phase, which is positive feedback. This feedback compensates for the energy lost in the tank circuit, so that the oscillations become undamped and of constant amplitude.",k:[["damped"],["energy","loss","lost"],["amplitude"],["positive feedback","feedback"],["undamped","constant"]]},{m:2,q:"What is meant by biasing of a transistor? Mention its types.",a:"Biasing is the application of suitable dc voltages across the transistor terminals so that it operates in the required region. The main modes are: (i) forward active mode, with the emitter\u2013base junction forward biased and the collector\u2013base junction reverse biased, in which the transistor works as an amplifier; (ii) saturation, with both junctions forward biased, in which the transistor acts as a closed switch; and (iii) cut-off, with both junctions reverse biased, in which the transistor acts as an open switch.",k:[["dc","direct"],["forward active","active"],["saturation"],["cut-off","cut off","cutoff"],["amplifier"],["switch"]]},{m:2,q:"Explain the current flow in an NPN transistor.",a:"In an NPN transistor the emitter-base junction is forward biased, so electrons from the heavily doped emitter flow into the base; this gives the emitter current IE. The base is very thin and lightly doped, so only a few electrons recombine with holes there, and most electrons pass into the collector region, which is at a positive potential. They flow through the external circuit as the collector current IC. The holes lost by recombination in the base are replaced from the bias supply, giving the small base current IB. Since IE = IC + IB, and the collector current depends on the emitter current, a BJT is called a current-controlled device.",k:[["emitter","emitter current"],["forward"],["base","thin","lightly"],["recombin"],["collector"],["base current","ib"],["ie = ic","ie = ic + ib","kirchhoff"],["current controlled","current-controlled"]]},{m:2,q:"Why can\u2019t we interchange the emitter and collector of a transistor, even though they are made of the same type of semiconductor?",a:"The emitter is heavily doped to supply a large number of charge carriers, while the collector is moderately doped and physically larger, because it must dissipate more power. Because of this difference in size and doping, the emitter and collector cannot be interchanged; the transistor would not work as an amplifier if they were swapped.",k:[["doped","doping"],["larger","size"],["power","dissipat"],["interchange"]]},{m:2,q:"Distinguish between avalanche breakdown and Zener breakdown.",a:"In avalanche breakdown, minority carriers gain energy from the reverse voltage in a lightly doped, wide depletion region, collide with atoms and create electron\u2013hole pairs, which multiply into an avalanche. In Zener breakdown, the junction is heavily doped and the depletion region is very thin, so a strong electric field breaks covalent bonds directly and creates carriers without collisions. Zener breakdown occurs at lower reverse voltages than avalanche breakdown.",k:[["avalanche"],["zener"],["lightly","heavily"],["collision","collide"],["covalent","bond"],["thin","wide"],["lower"]]},{m:2,q:"Draw the input and output waveforms of a full wave rectifier.",a:"The input is a sinusoidal alternating voltage. In a full-wave rectifier both half cycles are rectified: the output is a series of positive humps, one for each half cycle, with no gap between them. The output frequency is twice the input frequency, so the output is a pulsating dc. Filters and voltage regulators are used to smooth it.",k:[["sinusoidal","sine","sin"],["both half","both","two half"],["positive"],["twice","double","2"],["pulsating"]]},{m:2,q:"What do you mean by doping?",a:"Doping is the process of adding a small, controlled amount of impurity atoms (dopants, about 100 ppm) to a pure intrinsic semiconductor to increase its number of charge carriers and so its conductivity. Pentavalent impurities such as phosphorus or arsenic give n-type semiconductors with extra electrons; trivalent impurities such as boron or indium give p-type semiconductors with extra holes.",k:[["impurity","dopant","impurities"],["conductivity","charge carrier"],["pentavalent","phosphorus","arsenic"],["trivalent","boron","indium"],["n-type","p-type"]]},{m:2,q:"Distinguish between intrinsic and extrinsic semiconductors.",a:"An intrinsic semiconductor is a pure semiconductor, with no impurity, in which the number of electrons equals the number of holes; its carrier concentration depends only on temperature. An extrinsic semiconductor is an intrinsic semiconductor doped with impurity atoms, which makes one type of carrier dominate: electrons in an n-type and holes in a p-type semiconductor.",k:[["pure","no impurit"],["equal","same number"],["doped","impurit"],["dominate","majority"],["n-type","p-type"]]},{m:2,q:"Define forbidden energy gap.",a:"The forbidden energy gap is the energy range between the top of the valence band and the bottom of the conduction band in which no electron can exist. Its value for silicon is about 1.1 eV and for germanium about 0.7 eV at room temperature.",k:[["valence","conduction"],["no electron","cannot exist","no electrons"],["1.1"],["0.7"],["band"]]},{m:2,q:"Why is the temperature coefficient of resistance of a semiconductor negative?",a:"As the temperature increases, more electrons gain enough energy to cross the forbidden gap into the conduction band, and they leave holes behind. This increases the number of charge carriers, so the conductivity rises and the resistance falls. The temperature coefficient of resistance of a semiconductor is therefore negative.",k:[["electrons"],["conduction band","conduction"],["hole"],["resistance"],["falls","decrease","decreas"],["negative"]]},{m:2,q:"What is the common emitter leakage current I_CEO?",a:"In a transistor in common emitter configuration, a small collector current I_CEO flows even when the base current is zero. It is due to the flow of minority charge carriers across the reverse-biased collector\u2013base junction.",k:[["small","collector current"],["base current","zero"],["minority"],["reverse"]]},{m:2,q:"Why is a diode called a unidirectional device?",a:"A diode conducts current easily in one direction, forward bias, when the p-side is connected to the positive terminal, and offers a very high resistance in the reverse direction, so only a negligible current flows. Current therefore flows in one direction only, which is why a diode is called a unidirectional device.",k:[["one direction","single direction","one way"],["forward"],["reverse"],["high resistance","resistance"],["negligible","small"]]},{m:2,q:"What is leakage current in a diode?",a:"The leakage current, or reverse saturation current, is the very small current that flows through a reverse-biased p-n junction. It is due to minority charge carriers, and it is almost independent of the reverse voltage up to the breakdown voltage.",k:[["reverse"],["minority"],["small"],["independent","voltage"]]},]},
11:{exp:[
"Nanotechnology: the design, production, characterisation and application of nanostructured materials. A solid whose particles are smaller than 100 nm is a nano solid; above 100 nm it is a bulk solid. Nanomaterials have strikingly different properties from their bulk counterparts, because of quantum confinement effects and surface effects. Nano-scale structures existed in nature long before they were studied in laboratories.",
"Preparing nanomaterials: there are two approaches. In the top-down approach, bulk material is broken into smaller and smaller pieces until nano-size particles are obtained (for example by milling or etching). In the bottom-up approach, the atoms or molecules are assembled to build the nanostructure, for example by chemical vapour deposition or sol-gel methods.",
"Nanoparticles and health: because nanoparticles have dimensions similar to biological molecules such as proteins, they can be absorbed onto the surface of living organisms and enter the tissues and fluids of the body. This property can be used to deliver a drug to a specific cell by designing the surface of the nanoparticle, but it also raises concern about harmful effects.",
"Higgs particle: discovered in 2013, the Higgs particle (sometimes called the God particle) gives mass to many particles such as protons and neutrons. Peter Higgs and Englert received the Nobel prize in physics for the theory.",
"Gravitational waves: disturbances in the curvature of space-time that travel at the speed of light. Any accelerated mass emits gravitational waves, but they are very weak even for masses like the Earth. The strongest sources are black holes, for example when two black holes merge. Einstein proposed their existence in 1915, and they were detected in 2015, leading to the Nobel prize in 2017. Their discovery makes it possible to study black holes.",
"Robotics: an integrated study of mechanical engineering, electronic engineering, computer engineering and science. A robot is a mechanical device designed with electronic circuitry and programmed to perform a specific task. Robots can work in dangerous environments that are hazardous to people, such as defusing bombs, finding survivors in unstable ruins, and exploring mines and shipwrecks.",
"Components of a robot: (1) the controller, the brain, run by a computer program, which gives commands to the moving parts; (2) mechanical parts, such as motors, pistons, grippers, wheels and gears, which make the robot move, grab, turn and lift; and (3) sensors, which tell the robot about its surroundings, including the size and shape of objects, the distance between them and their direction. A robot also has a power conversion unit, actuators, a user interface, and a manipulator with linkages.",
"Types of robots and their parts: human robots resemble humans in appearance and replicate activities such as walking, lifting and sensing. Robots are powered by batteries, solar power or hydraulics. Actuators convert energy into movement, usually rotational or linear. Electric motors (AC, brushed DC, brushless DC and geared DC) drive the wheels, arms, fingers and legs. Pneumatic air muscles contract by about 40% when air is pumped in, and muscle wires are thin strands that contract when heated.",
"Applications of nanomaterial-based products: nano products are used in many areas. In the automotive industry they give lightweight construction, paints and coatings (fillers, base coat and clear coat), catalysts, tyre fillers, sensors and scratch-resistant windscreen coatings. In the chemical and engineering fields they are used as switchable adhesives, magnetic fluids, wear protection for tools and machines, and lubricant-free bearings. In the electronics and construction industries they are used in sensors and coatings. Ski wax, a sports application, is a nano product.",
"Cosmology: the branch of physics that studies the origin and evolution of the universe, including the formation of stars and galaxies. Gravitational waves, discovered in 2015, give a new way to study the universe, especially black holes."],

function S(id){return st[id]||(st[id]={})}

 e.textContent=v?'Voice used: '+v.name+' ('+v.lang+')':any.length?'No female English voice could be identified; using the default English voice ('+any[0].name+').':'No English voice found on this device. Install one in Android Settings > Text-to-speech.'}

function playSpeech(text,title,el){if(!synth){alert('Speech is not supported in this browser. Please use Chrome on Android.');return}stopAudio();
 var parts=(clean(text).match(/[^.!?]+[.!?]*/g)||[text]),cur2='';chunks=[];parts.forEach(function(p){if((cur2+p).length>220&&cur2){chunks.push(cur2.trim());cur2=''}cur2+=p+' '});if(cur2.trim())chunks.push(cur2.trim());
 ci=0;curEl=el||null;if(curEl)curEl.classList.add('speaking-active');$('audioCurrentTitle').textContent=title;$('audioPlayerBar').style.display='flex';$('stopSpeechBtn').style.display='inline-flex';spk=true;barUi();say(tok)}
