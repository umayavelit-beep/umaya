wr:[
{m:2,q:"Why do metals have a large number of free electrons?",a:"In a metal the valence electrons of the atoms are not bound to individual atoms; they are shared and move freely throughout the crystal lattice. This is why metals have a very large number of free electrons, which conduct electricity and heat and which can absorb energy from light and escape from the surface.",k:[["free"],["valence","outer"],["lattice","shared"],["conduct"],["surface"]]},
{m:2,q:"What is photoelectric emission and what is the intensity of light according to the quantum concept?",a:"Photoelectric emission is the emission of electrons from a metal surface when electromagnetic radiation of suitable frequency is incident on it, the energy being transferred to free electrons which then escape the surface barrier. According to the quantum concept, the intensity of light of a given wavelength is the number of photons incident per unit area per unit time, each photon having the same energy; its unit is W m\u207b\u00b2.",k:[["photon"],["per unit area"],["per unit time","unit time"],["same energy","energy"],["w m","w/m","wm"]]},
{m:2,q:"Give the photon energy and momentum, and state two characteristic properties of photons.",a:"A photon of frequency \u03bd and wavelength \u03bb has energy E = h\u03bd = hc/\u03bb and momentum p = h/\u03bb = h\u03bd/c. Photons travel with the speed of light, and they are electrically neutral, so they are unaffected by electric and magnetic fields. The energy of a photon depends on the frequency and not on the intensity of the beam.",k:[["hv","h\u03bd","hc/"],["h/\u03bb","p = h","h\u03bd/c"],["speed of light","c"],["neutral"],["frequency","not"]]},
{m:5,q:"Describe the construction and working of an electron microscope and explain why it has a higher resolving power than an optical microscope.",a:"PRINCIPLE: the electron microscope applies the wave nature of particles. The resolving power of a microscope is inversely proportional to the wavelength of the radiation used to illuminate the object. The de Broglie wavelength of electrons, accelerated to high speeds, is a few thousand times smaller than that of visible light, so an electron microscope has much higher resolving power and magnification (more than 200 000 times).\nCONSTRUCTION AND WORKING: it is similar to an optical microscope, but the light source is replaced by an electron source, and glass lenses are replaced by electric or magnetic lenses. The electrons emitted from the source are accelerated by high potentials. A magnetic condenser lens makes the beam parallel. When the beam passes through the sample, the beam carries the image of the sample. A magnetic objective lens forms an intermediate image, and a magnetic projector lens magnifies it, so the final magnified image is obtained on a screen or photographic plate. Since electrons are focused by magnetic or electrostatic fields, the lenses can be controlled electrically.",k:[["wave"],["wavelength"],["inversely"],["de broglie","de-broglie"],["condenser"],["objective"],["projector"],["magnetic","electrostatic"],["resolving power"]]},
{m:5,q:"Explain the X-ray spectra: the continuous and characteristic spectra, and the origin of the cut-off wavelength.",a:"X-rays are produced when fast-moving electrons strike a metal target. A plot of X-ray intensity against wavelength (the X-ray spectrum) has two parts: a continuous spectrum, with a minimum (cut-off) wavelength, and a series of sharp peaks superimposed on it.\nCONTINUOUS SPECTRUM (Bremsstrahlung): when an electron approaches a target nucleus, the attraction of the nucleus decelerates it and it loses part of its kinetic energy as an X-ray photon. Since the electrons lose different amounts of energy, photons of all possible energies (wavelengths) are emitted, giving a continuous spectrum. An electron that gives up all its energy emits a photon of the highest frequency \u03bd0 and the shortest (cut-off) wavelength \u03bb0: h\u03bd0 = eV, so \u03bb0 = hc/eV (8.14), the Duane\u2013Hunt formula. The cut-off wavelength depends only on the accelerating voltage and is the same for all targets.\nCHARACTERISTIC SPECTRUM: when a fast electron removes an inner-shell electron (for example from the K-shell) of a target atom, an electron from an outer orbit falls into the vacancy and emits an X-ray photon of definite energy. The peaks are characteristic of the target material and so form the characteristic spectrum.\nThe photon theory of radiation explains both the continuous spectrum and the cut-off wavelength, which classical electromagnetic theory could not explain.",k:[["continuous"],["characteristic"],["bremsstrahlung","braking"],["cut-off","cut off","cutoff"],["h\u03bd0 = ev","hv0 = ev","hc/ev","\u03bb0 = hc"],["duane"],["inner","k-shell","k shell"],["outer"],["photon"]]},
{m:5,q:"Explain the photoelectric effect using Einstein\u2019s photoelectric equation, and show how it accounts for the laws of photoelectric emission.",a:"Each photon of frequency \u03bd gives its whole energy h\u03bd to one electron. Part of this energy is used to overcome the work function \u03c60 = h\u03bd0, and the rest appears as the kinetic energy of the photoelectron: h\u03bd = h\u03bd0 + (1/2)mv\u00b2 (8.7), so Kmax = h\u03bd \u2212 \u03c60 (8.8).\n(i) Since each photon liberates at most one electron, emission needs h\u03bd \u2265 \u03c60; below the threshold frequency \u03bd0 = \u03c60/h no electron is emitted, whatever the intensity.\n(ii) Increasing the intensity increases the number of photons per unit area per unit time, so more electrons are emitted. The photocurrent (and the saturation current) is proportional to the intensity.\n(iii) Kmax depends only on the frequency and the metal, not on the intensity, because each photon gives its energy to one electron.\n(iv) Kmax = h\u03bd \u2212 \u03c60 increases linearly with \u03bd, with slope h.\n(v) The energy transfer is one photon to one electron, which happens almost instantaneously, so there is no time lag.",k:[["photon"],["work function","\u03c60","\u03c6"],["threshold"],["intensity"],["kinetic energy","kmax"],["linear","slope"],["instant","time lag","no time"]]},
{m:5,q:"Explain why the classical wave theory of light fails to explain the photoelectric effect.",a:"According to the wave theory, the energy of light is spread continuously over the wavefront, and an electron absorbs energy gradually from it. The wave theory makes three predictions that experiments contradict:\n(i) Kmax would depend on the intensity of light, since a more intense wave delivers more energy. In experiments Kmax is independent of intensity.\n(ii) An intense enough beam of any frequency should release electrons, because electrons could accumulate energy over time. In experiments there is a threshold frequency below which no emission takes place, however intense the light.\n(iii) Electrons would need a considerable time (of the order of hours) to absorb enough energy from the spread-out wave before emission. Experiments show emission is almost instantaneous, with a time lag less than 10\u207b\u2079 s.\nThe wave theory therefore cannot explain the photoelectric effect, and Einstein\u2019s photon picture is needed.",k:[["intensity"],["threshold"],["instant","time lag","hours"],["spread","wavefront","continuous"],["photon","einstein"]]},
{m:5,q:"Describe the Davisson\u2013Germer experiment and explain how it confirms the wave nature of electrons.",a:"APPARATUS: a filament F is heated by a low tension battery, and electrons are emitted by thermionic emission. They are accelerated through a potential difference V (a high tension battery) and collimated by two thin aluminium diaphragms into a narrow beam. The beam strikes a single crystal of nickel. A detector that can rotate in the plane of the paper measures the intensity of the scattered electrons as a function of the angle \u03b8 between the incident beam and the scattered beam.\nOBSERVATION: the intensity of the scattered electrons varies with \u03b8 and shows a sharp maximum at a particular angle for a given accelerating voltage. The scattering is strongly peaked at specific angles, which is the characteristic of diffraction.\nCONCLUSION: the crystal acts as a three-dimensional diffraction grating whose spacing is of the order of the electron wavelength. The electron wave is diffracted in specific directions, given by the Bragg condition, and the wavelength found from this agrees with the de Broglie wavelength h/\u221a(2meV). Hence electrons show wave behaviour, confirming de Broglie\u2019s hypothesis.",k:[["filament"],["thermionic"],["diaphragm","collimat"],["nickel","ni"],["detector"],["maximum","peak"],["diffract","grating"],["de broglie","h/"],["wave"]]},
{m:2,q:"Write the de Broglie wavelength of an electron accelerated through a potential difference V.",a:"An electron accelerated through a potential difference V gains kinetic energy eV, so its speed is v = \u221a(2eV/m). Its de Broglie wavelength is \u03bb = h/mv = h/\u221a(2meV) (8.11). For V = 100 V, \u03bb \u2248 1.227 \u00c5.",k:[["2meV","2 m e v","\u221a(2me"],["h/mv","h / mv"],["kinetic"],["1.227"]]},
{m:3,q:"Calculate the maximum kinetic energy and maximum velocity of the photoelectrons emitted when the stopping potential is 81 V in the photoelectric emission experiment.",a:"(Worked by me; the results match the book\u2019s answers of 1.3 \u00d7 10\u207b\u00b9\u2077 J and 5.3 \u00d7 10\u2076 m s\u207b\u00b9.)\nKmax = eV0 = 1.6 \u00d7 10\u207b\u00b9\u2079 \u00d7 81 = 1.3 \u00d7 10\u207b\u00b9\u2077 J.\nFrom Kmax = (1/2)mv\u00b2: vmax = \u221a(2Kmax/m) = \u221a(2 \u00d7 1.3 \u00d7 10\u207b\u00b9\u2077 / 9.1 \u00d7 10\u207b\u00b3\u00b9) = 5.3 \u00d7 10\u2076 m s\u207b\u00b9.",k:[["1.3"],["5.3"],["kmax = ev","ev0","e v0","eV"],["2k","2 k","\u221a(2"],["kinetic"]]},
{m:3,q:"Calculate the energies of photons associated with (i) violet light of wavelength 413 nm, (ii) X-rays of wavelength 0.1 nm and (iii) radio waves of wavelength 10 m.",a:"(Worked by me using E = hc/\u03bb with hc = 1240 eV nm; the results match the book\u2019s answers.)\n(i) Violet light: E = 1240/413 = 3 eV.\n(ii) X-rays: E = 1240/0.1 = 12 400 eV (about 12424 eV in the book\u2019s value).\n(iii) Radio waves: E = 1240/(10 \u00d7 10\u2079) eV = 1.24 \u00d7 10\u207b\u2077 eV.",k:[["3 ev","3eV","3 e"],["12","12424","12 4"],["1.24"],["hc","1240"],["10\u207b\u2077","10-7","10^-7"]]},
{m:2,q:"Define work function of a metal and give its unit.",a:"The work function of a metal is the minimum energy required to remove an electron from the surface of the metal, against the attraction of the positive ions. Its unit is the electron volt (eV), where 1 eV = 1.6 \u00d7 10\u207b\u00b9\u2079 J.",k:[["minimum energy"],["electron"],["surface"],["ev","electron volt"],["1.6"]]},
{m:2,q:"Define threshold frequency and give the expression for it.",a:"The threshold frequency \u03bd0 of a metal is the minimum frequency of incident light below which no photoelectrons are emitted, whatever the intensity. It is related to the work function by \u03c60 = h\u03bd0, so \u03bd0 = \u03c60/h.",k:[["minimum frequency"],["no photoelectron","no electron","not emitted"],["h\u03bd0","h\u03bd0 = \u03c6","\u03bd0 = \u03c6","\u03c6/h","\u03c60/h"],["work function"]]},
{m:2,q:"What is the Davisson\u2013Germer experiment and what does it prove?",a:"The Davisson\u2013Germer experiment (1927) showed that a beam of electrons is diffracted when it falls on a nickel crystal. The crystal acts as a three-dimensional diffraction grating for matter waves, and the intensity of the scattered electrons, measured against the angle \u03b8, shows a maximum at a particular angle. This confirmed de Broglie\u2019s hypothesis that moving electrons have a wave nature.",k:[["diffract"],["nickel","ni"],["crystal"],["de broglie","wave"],["intensity","angle"]]}
,
{m:3,q:"A 150 W lamp emits light of mean wavelength of 5500 Å. If the efficiency is 12%, find out the number of photons emitted by the lamp in one second.",a:"(Worked by me; the result matches the book\u2019s answer of 4.98 \u00d7 10\u00b9\u2079.)\nUseful power = 0.12 \u00d7 150 = 18 W. Energy per photon E = hc/\u03bb = (6.63 \u00d7 10\u207b\u00b3\u2074 \u00d7 3 \u00d7 10\u2078)/(5.5 \u00d7 10\u207b\u2077) = 3.6 \u00d7 10\u207b\u00b9\u2079 J.\nNumber of photons per second = 18/(3.6 \u00d7 10\u207b\u00b9\u2079) = 4.98 \u00d7 10\u00b9\u2079.",k:[["4.98","4.9"],["0.12","12%","efficiency"],["hc/\u03bb","hc / \u03bb"],["18"]]},
{m:3,q:"How many photons of frequency 10\u00b9\u2074 Hz will make up 19.8 J of energy?",a:"(Worked by me; the result matches the book\u2019s answer of 3 \u00d7 10\u00b2\u2070.)\nEnergy of one photon E = h\u03bd = 6.63 \u00d7 10\u207b\u00b3\u2074 \u00d7 10\u00b9\u2074 = 6.63 \u00d7 10\u207b\u00b2\u2070 J.\nNumber of photons = 19.8/(6.63 \u00d7 10\u207b\u00b2\u2070) = 2.99 \u00d7 10\u00b2\u2070 \u2248 3 \u00d7 10\u00b2\u2070.",k:[["3 \u00d7 10\u00b2\u2070","3x10^20","3\u00d710","2.99"],["h\u03bd","h v","hv"],["6.63"]]},
{m:3,q:"What should be the velocity of the electron so that its momentum equals that of 4000 Å wavelength photon?",a:"(Worked by me; the result matches the book\u2019s answer of 1818 m s\u207b\u00b9.)\nPhoton momentum p = h/\u03bb = 6.63 \u00d7 10\u207b\u00b3\u2074/(4 \u00d7 10\u207b\u2077) = 1.66 \u00d7 10\u207b\u00b2\u2077 kg m s\u207b\u00b9.\nElectron velocity v = p/m = 1.66 \u00d7 10\u207b\u00b2\u2077/(9.1 \u00d7 10\u207b\u00b3\u00b9) \u2248 1.82 \u00d7 10\u00b3 m s\u207b\u00b9.",k:[["1.8","1818","1.82"],["h/\u03bb","h / \u03bb","momentum"],["p = mv","p/m"]]},
{m:3,q:"When a light of frequency 9 \u00d7 10\u00b9\u2074 Hz is incident on a metal surface, photoelectrons are emitted with a maximum speed of 8 \u00d7 10\u2075 m s\u207b\u00b9. Determine the threshold frequency of the surface.",a:"(Worked by me; the result matches the book\u2019s answer of 4.61 \u00d7 10\u00b9\u2074 Hz.)\nKmax = (1/2)mv\u00b2 = 0.5 \u00d7 9.1 \u00d7 10\u207b\u00b3\u00b9 \u00d7 (8 \u00d7 10\u2075)\u00b2 = 2.91 \u00d7 10\u207b\u00b9\u2079 J.\nh\u03bd0 = h\u03bd \u2212 Kmax = 5.96 \u00d7 10\u207b\u00b9\u2079 \u2212 2.91 \u00d7 10\u207b\u00b9\u2079 = 3.05 \u00d7 10\u207b\u00b9\u2079 J.\n\u03bd0 = 3.05 \u00d7 10\u207b\u00b9\u2079/(6.63 \u00d7 10\u207b\u00b3\u2074) = 4.6 \u00d7 10\u00b9\u2074 Hz.",k:[["4.6","4.61"],["kmax","k max","1/2","\u00bd"],["h\u03bd0","h\u03bd \u2212","h v0"],["threshold"]]},
{m:3,q:"When a 6000 Å light falls on the cathode of a photo cell, photoemission takes place. If a potential of 0.8 V is required to stop emission of electrons, determine (i) the frequency of the light, (ii) the energy of the incident photon, (iii) the work function of the cathode material, (iv) the threshold frequency and (v) the net energy of the electron after it leaves the surface.",a:"(Worked by me; the results match the book\u2019s answers.)\n(i) \u03bd = c/\u03bb = (3 \u00d7 10\u2078)/(6 \u00d7 10\u207b\u2077) = 5 \u00d7 10\u00b9\u2074 Hz.\n(ii) E = h\u03bd = hc/\u03bb = 1240/600 eV = 2.07 eV.\n(iii) Work function \u03c60 = E \u2212 eV0 = 2.07 \u2212 0.8 = 1.27 eV.\n(iv) \u03bd0 = \u03c60/h = (1.27 \u00d7 1.6 \u00d7 10\u207b\u00b9\u2079)/(6.63 \u00d7 10\u207b\u00b3\u2074) = 3.07 \u00d7 10\u00b9\u2074 Hz.\n(v) The net energy of the electron after it leaves the surface is the kinetic energy, eV0 = 0.8 eV.",k:[["5 \u00d7 10\u00b9\u2074","5x10^14","5\u00d710"],["2.07"],["1.27"],["3.07"],["0.8"]]},
{m:3,q:"A 3310 Å photon liberates an electron from a material with energy 3 \u00d7 10\u207b\u00b9\u2079 J while another 5000 Å photon ejects an electron with energy 0.972 \u00d7 10\u207b\u00b9\u2079 J from the same material. Determine the value of Planck\u2019s constant and the threshold wavelength of the material.",a:"(Worked by me from two photoelectric equations; the results match the book\u2019s answers.)\nSubtracting the two equations hc(1/\u03bb1 \u2212 1/\u03bb2) = K1 \u2212 K2 = 2.03 \u00d7 10\u207b\u00b9\u2079 J.\n1/\u03bb1 \u2212 1/\u03bb2 = 1/(3.31 \u00d7 10\u207b\u2077) \u2212 1/(5 \u00d7 10\u207b\u2077) = 1.02 \u00d7 10\u2076 m\u207b\u00b9, so hc = 1.99 \u00d7 10\u207b\u00b2\u2075 J m and h = 6.62 \u00d7 10\u207b\u00b3\u2074 J s.\nWork function \u03c6 = hc/\u03bb1 \u2212 K1 = 6.0 \u00d7 10\u207b\u00b9\u2079 \u2212 3.0 \u00d7 10\u207b\u00b9\u2079 = 3.0 \u00d7 10\u207b\u00b9\u2079 J.\nThreshold wavelength \u03bb0 = hc/\u03c6 = 6.62 \u00d7 10\u207b\u2077 m = 6620 \u00c5.",k:[["6.62","6.6"],["6620","6.62 \u00d7 10\u207b\u2077","6.62x10"],["hc/\u03bb","hc / \u03bb"],["threshold"]]},
{m:3,q:"UV light of wavelength 1800 Å is incident on a lithium surface whose threshold wavelength is 4965 Å. Determine the maximum energy of the electron emitted.",a:"(Worked by me; the result matches the book\u2019s answer of 4.40 eV.)\nPhoton energy = hc/\u03bb = 12400/1800 = 6.89 eV.\nWork function = hc/\u03bb0 = 12400/4965 = 2.50 eV.\nKmax = 6.89 \u2212 2.50 = 4.39 \u2248 4.40 eV.",k:[["4.4","4.39","4.40"],["6.89","6.9"],["2.5","2.50"],["hc/"]]},
{m:3,q:"Calculate the de Broglie wavelength of a proton whose kinetic energy is equal to 81.9 × 10⁻¹⁵ J. (Given: mass of proton is 1836 times that of electron.)",a:"(Worked by me from λ = h/\u221a(2mK); the result matches the book\u2019s answer of 4 × 10⁻¹⁴ m.)\nm_p = 1836 \u00d7 9.1 \u00d7 10\u207b\u00b3\u00b9 = 1.67 \u00d7 10\u207b\u00b2\u2077 kg.\n\u03bb = 6.63 \u00d7 10\u207b\u00b3\u2074/\u221a(2 \u00d7 1.67 \u00d7 10\u207b\u00b2\u2077 \u00d7 81.9 \u00d7 10\u207b\u00b9\u2075) = 6.63 \u00d7 10\u207b\u00b3\u2074/(1.65 \u00d7 10\u207b\u00b2\u2070) = 4 \u00d7 10\u207b\u00b9\u2074 m.",k:[["4 \u00d7 10\u207b\u00b9\u2074","4x10","4\u00d710","4 x 10"],["\u221a(2mk)","\u221a(2mk","2mk","2 m k"],["1836"]]},
{m:3,q:"A deuteron and an alpha particle are accelerated with the same potential. Which of the two has a greater value of de Broglie wavelength associated with it, and which has less kinetic energy? Explain.",a:"(Worked by me from λ = h/\u221a(2mqV); the results match the book\u2019s answer.)\nThe deuteron has mass 2m_p and charge e; the alpha particle has mass 4m_p and charge 2e. For the same V, \u03bb \u221d 1/\u221a(mq): \u03bb_d/\u03bb_\u03b1 = \u221a(8/2) = 2, so \u03bb_d = 2\u03bb_\u03b1. The deuteron has the greater de Broglie wavelength.\nKinetic energies K = qV: K_d = eV and K_\u03b1 = 2eV, so K_d = K_\u03b1/2. The deuteron has less kinetic energy.",k:[["2\u03bb","\u03bb_d = 2","greater","deuteron"],["k_d","k d","kd","less"],["q","charge"],["\u221a"]]},
{m:3,q:"An electron is accelerated through a potential difference of 81 V. What is the de Broglie wavelength associated with it? To which part of the electromagnetic spectrum does this wavelength correspond?",a:"(Worked by me from λ = h/\u221a(2meV) ≈ 12.27/\u221aV Å; the result matches the book\u2019s answer of 1.36 Å.)\nλ = 12.27/\u221a81 Å = 1.36 Å. This lies in the X-ray region of the electromagnetic spectrum.",k:[["1.36"],["12.27","12.3"],["x-ray","x ray","xray"],["√81","9"]]},
{m:3,q:"The ratio between the de Broglie wavelength associated with a proton accelerated through a potential of 512 V and that of an alpha particle accelerated through a potential of X volts is found to be one. Find the value of X.",a:"(Worked by me; the result matches the book\u2019s answer of 64 V.)\nEqual wavelengths need equal √(mqV). Proton: m = m_p, q = e, V = 512 V. Alpha: m = 4m_p, q = 2e.\nm_p \u00d7 e \u00d7 512 = 4m_p \u00d7 2e \u00d7 X, so X = 512/8 = 64 V.",k:[["64"],["4 m","4m","2e","2 e"],["512"],["√"]]}
]},
9:{exp:[
"Radioactivity: the spontaneous emission of penetrating radiation (alpha, beta and gamma rays) by an unstable nucleus, which then decays to a more stable nucleus. It occurs mainly for nuclei with Z > 82 and for unstable isotopes of lighter nuclei. Alpha decay (A, Z to A\u22124, Z\u22122 plus a helium nucleus) lowers Z by 2 and A by 4; beta decay emits an electron (beta minus) or a positron (beta plus); gamma decay is the emission of high-energy photons from an excited nucleus.",
"Law of radioactive decay: the rate of decay is proportional to the number of undecayed nuclei, dN/dt = \u2212\u03bbN (9.32), where \u03bb is the decay constant. Integrating gives N = N0e^(\u2212\u03bbt) (9.35). The decay is a random process: we cannot predict which nucleus will decay, only the number that decay in a time.",
"Activity: the number of decays per second, R = \u2212dN/dt = \u03bbN (9.36 to 9.38), with R = R0e^(\u2212\u03bbt). The SI unit is the becquerel (Bq), one decay per second; the curie is 3.7 \u00d7 10\u00b9\u2070 Bq.",
"Half-life: the time taken for half of the initial number of nuclei to decay. Putting N = N0/2 at t = T1/2 gives T1/2 = ln2/\u03bb = 0.693/\u03bb (9.39). After n half-lives, N = (1/2)^n N0 (9.40). A shorter half-life sample is more radioactive, because it has the higher activity.",
"Isotopes, isobars and isotones: isotopes are atoms of the same element with the same atomic number Z but different mass number A (for example hydrogen, deuterium and tritium). Isobars are atoms of different elements with the same mass number A (for example 40S, 40Cl, 40Ar, 40K and 40Ca). Isotones are atoms with the same number of neutrons (for example 11B and 12C, each with 7 neutrons).",
"Nuclear radius and density: the nuclei are approximately spherical, and for Z > 10 the radius is R = R0 A^(1/3) (9.19), with R0 = 1.2 fermi (1 fermi = 10\u207b\u00b9\u2075 m). Since the volume is proportional to A, the nuclear density is the same for all nuclei: about 2.3 \u00d7 10\u00b9\u2077 kg m\u207b\u00b3, which shows that nucleons are packed very closely.",
"Mass defect and binding energy: the mass of a stable nucleus is less than the total mass of its separate protons and neutrons. The difference \u0394m = Zmp + Nmn \u2212 M (9.20) is the mass defect. By Einstein\u2019s relation this missing mass is converted into the binding energy BE = \u0394m c\u00b2 (9.21), which must be supplied to separate the nucleus into its constituents. Binding energy per nucleon is the average energy needed per nucleon, and it is about 8 MeV for medium-mass nuclei; 1 u of mass is equivalent to about 931 MeV.",
"Average atomic mass: an element in nature is a mixture of isotopes, so the atomic mass in the periodic table is the average of the isotopic masses weighted by their abundances. For chlorine, 75.77% of 35Cl (34.96885 u) and 24.23% of 37Cl (36.96593 u) give an average of 35.453 u.",
"Radius and velocity in Bohr orbits: rn \u221d n\u00b2 and the velocity vn \u221d 1/n, so the electron moves fastest in the ground state. For a hydrogen-like atom of atomic number Z, rn = a0n\u00b2/Z and the energy is En = \u2212 13.6 Z\u00b2/n\u00b2 eV.",
"Energy of the electron in Bohr orbits: the kinetic energy is KEn = (1/2)mvn\u00b2 = me\u2074Z\u00b2/(8\u03b50\u00b2h\u00b2n\u00b2), and the potential energy is Un = \u22122KEn, so the total energy is En = \u2212KEn = \u2212me\u2074Z\u00b2/(8\u03b50\u00b2h\u00b2n\u00b2) (9.17). For hydrogen, E1 = \u221213.6 eV, E2 = \u22123.4 eV, E3 = \u22121.51 eV. The negative sign means the electron is bound. The ground-state energy 13.6 eV is called 1 Rydberg, and the energy needed to remove the electron from the ground state (13.6 eV) is the ionisation energy.",
"Spectral series of hydrogen: when an electron jumps from a higher orbit to a lower one, a photon of energy hc/\u03bb = E_upper \u2212 E_lower is emitted. The Lyman series (ending in n = 1) lies in the ultraviolet, the Balmer series (n = 2) in the visible, and the Paschen series (n = 3) in the infrared. An atom absorbs a photon only if its energy exactly equals the difference between two energy levels.",
"Geiger\u2013Marsden alpha scattering experiment (1911, Rutherford\u2019s model): a beam of alpha particles from a radioactive source (polonium) was directed at a thin gold foil in a vacuum, and the scattered particles were detected at different angles. Most alpha particles passed straight through, some were deflected through small angles, and about one in a thousand was deflected through more than 90\u00b0.",
"Rutherford\u2019s nuclear model: an atom has a lot of empty space, with a tiny positively charged nucleus of size about 10\u207b\u00b9\u2074 m at its centre containing most of the mass of the atom, and electrons revolving around it. The model could not explain the stability of the atom, because an accelerating electron should radiate energy and spiral into the nucleus, and it could not explain the line spectrum of hydrogen.",
"Bohr\u2019s postulates: (a) electrons move in circular orbits under the Coulomb attraction of the nucleus, which provides the centripetal force; (b) only certain discrete stationary orbits are allowed, in which electrons do not radiate energy, and the angular momentum is quantised: mvr = nh/2\u03c0 (n = 1, 2, 3, ...). The circumference of the orbit is then an integral multiple of the de Broglie wavelength, 2\u03c0r = n\u03bb.",
"Radius of the Bohr orbits: rn = a0 n\u00b2, where a0 = 0.529 \u00c5 is the Bohr radius, the smallest radius of the orbit in hydrogen (1 Bohr = 0.53 \u00c5). For hydrogen, r1 = a0 = 0.529 \u00c5 and r2 = 4a0 = 2.116 \u00c5.",
"Nuclear fission: the splitting of a heavy nucleus (such as uranium-235) into two smaller nuclei of comparable masses, with the release of a large amount of energy and some neutrons. It was discovered by Hahn and Strassmann in 1939 when a slow neutron bombards uranium. The energy released is many orders of magnitude greater than in chemical reactions. In a chain reaction the emitted neutrons cause further fissions; in an uncontrolled chain reaction, as in an atom bomb, the energy is released in a fraction of a second, while in a controlled chain reaction, as in a nuclear reactor, the rate is kept steady.",
"Nuclear fusion: the combination of two or more light nuclei (A < 20) into a heavier nucleus, with the mass difference released as energy. Fusion needs temperatures of about 10\u2077 K to overcome the Coulomb repulsion between the nuclei (thermonuclear fusion). It occurs in the core of stars, where hydrogen fuses into helium and gives the energy of the Sun and other stars, and it is the principle of the hydrogen bomb. Binding energy per nucleon is higher for medium-mass nuclei, which is why both fusion of light nuclei and fission of heavy nuclei release energy.",
"Distance of closest approach r0: the distance from the nucleus at which an alpha particle coming straight at it stops and is reflected back through 180\u00b0. All its kinetic energy is then converted into electrostatic potential energy, so (1/2)mv\u00b2 = (1/4\u03c0\u03b50)(2e)(Ze)/r0, giving r0 = (1/4\u03c0\u03b50)(2Ze\u00b2)/Ek. The nuclear size is smaller than this distance.",
"Impact parameter b: the perpendicular distance between the centre of the nucleus and the line of motion of the alpha particle when it is far away. The scattering angle depends on b: a small impact parameter (a head-on collision) gives a large deflection, and a large impact parameter gives a small deflection.",
"Cathode rays: a beam of electrons produced in a discharge tube at low pressure. They travel in straight lines with speeds up to about one-tenth of the speed of light, carry energy and momentum, are deflected by electric and magnetic fields (showing they are negatively charged), produce heat and fluorescence, affect photographic plates, produce X-rays when they hit a heavy metal, and ionise gases.",
"Thomson\u2019s experiment (1897) for the specific charge: cathode rays pass through a pin hole and between parallel plates with a uniform electric field E and a perpendicular magnetic field B. The beam is undeflected when eE = evB, so v = E/B (9.1). With the magnetic field switched off, the deflection due to the electric field alone is used, together with the velocity v, to find e/m (the book\u2019s equations 9.3 to 9.5). The specific charge is e/m = 1.7 \u00d7 10\u00b9\u00b9 C kg\u207b\u00b9 and is independent of the gas and of the electrodes.",
"Millikan\u2019s oil drop experiment (1909): the charge of an electron is measured by balancing the weight of a charged oil drop against an electric force. Fine drops from an atomizer fall through a hole into the chamber between horizontal plates A and B about 1.5 cm apart at about 10 kV. The radius of a drop is found from its terminal velocity when the field is off, and then the field is adjusted so the drop is balanced, giving qE = mg. Millikan found that all measured charges are integral multiples of e = 1.6 \u00d7 10\u207b\u00b9\u2079 C, which is the quantisation of charge.",
"Average binding energy per nucleon: BE/A = [Zmp + Nmn \u2212 M]c\u00b2/A (9.25). It is the average energy required to remove one nucleon from the nucleus. When plotted against A for all known nuclei, it rises sharply for light nuclei, reaches about 8.5 MeV for mass numbers between 40 and 120 (the most stable nuclei, near iron), and then falls slowly to about 7.6 MeV for uranium. The features are: light nuclei combining to form a medium-mass nucleus release energy (nuclear fusion, the hydrogen bomb), and a heavy nucleus splitting into medium-mass nuclei also releases energy (nuclear fission, the atom bomb).",
"Nuclear force: the force that holds protons and neutrons together in the nucleus. The Coulomb repulsion between protons a few fermi apart would be about 230 N, so there must be a much stronger attractive force. Its properties are: (i) it is very short range, acting only up to a few fermi, and it is the strongest force in nature in the nucleus; (ii) it is attractive and of equal strength between proton\u2013proton, proton\u2013neutron and neutron\u2013neutron pairs (charge independence); (iii) it does not act on electrons, so it does not affect the chemical properties of atoms.",
"Alpha decay: an unstable nucleus emits an alpha particle (a helium-4 nucleus, two protons and two neutrons), so Z falls by 2 and A by 4: A\u2082X \u2192 A\u22124 Z\u22122 Y + \u2074\u2082He (9.26). Example: U-238 decays to Th-234. The nucleus emits an alpha particle, rather than four separate nucleons, because the energy Q for emitting four separate nucleons would be negative, which violates conservation of energy.",
"Beta decay: in beta-minus decay a neutron changes into a proton and an electron and an antineutrino are emitted: n \u2192 p + e\u207b + \u03bd\u0305 (9.28). Example: C-14 becomes N-14. In beta-plus decay a proton changes into a neutron and a positron and a neutrino are emitted: p \u2192 n + e\u207a + \u03bd (9.29). Example: Na-22 becomes Ne-22. The positron is the antiparticle of the electron, with the same mass and charge +e.",
"Gamma decay: after an alpha or beta decay the daughter nucleus is often left in an excited state. It returns to a lower energy state by emitting a gamma ray, which is a high-energy photon. Gamma emission does not change Z or A.",
"Radioactivity and mass: the mass of the initial nucleus is always greater than the sum of the masses of the final nucleus and the emitted particle. The difference \u0394m appears as energy, E = \u0394mc\u00b2. Radioactivity was discovered by Becquerel in 1896, and studied by the Curies. Radioisotopes such as C-14 are used in carbon dating and cancer treatment.",
"Neutrino: beta decay seemed to violate conservation of energy and momentum, because the electrons emitted have a continuous range of energies while alpha particles have discrete ones. In 1931 Pauli proposed a third particle, the neutrino (symbol \u03bd), carrying away the missing energy. It has zero charge, a very small mass, an antiparticle (anti-neutrino), and interacts very weakly with matter, so it is extremely hard to detect.",
"Nuclear reactor: a device in which fission takes place in a self-sustained, controlled manner, with the energy used for research or power generation. The first reactor was built by Fermi in Chicago in 1942. Its main parts are: the fuel (uranium or plutonium, enriched to 2\u20134% U-235, since natural uranium has only 0.7% U-235); a neutron source to start the chain reaction; a moderator (heavy water or graphite) that slows fast neutrons, since light nuclei of mass comparable to the neutron remove most of its energy; control rods (cadmium or boron) that absorb neutrons and keep the reaction steady; a coolant and heat exchanger that produce steam to drive a turbine; and shielding.",
"Carbon dating: living things take in carbon-14 in a fixed ratio to carbon-12 while alive. After death no more C-14 is taken in and the C-14 decays with a half-life of 5730 years. Measuring the C-14 content of an old sample compared with a living sample gives its age from N = N0 e^(\u2212\u03bbt).",
"Elementary particles: until the 1960s protons, neutrons and electrons were thought to be the fundamental building blocks of matter. In 1964 Gell-Mann and Zweig proposed that protons and neutrons are made of quarks, and quarks were confirmed experimentally at SLAC in 1968. Electrons are elementary, as they are not made of anything. There are six quarks (up, down, charm, strange, top and bottom), each with an antiparticle, and they carry fractional charges (+2/3 e for up-type and \u22121/3 e for down-type quarks). A proton is made of two up quarks and one down quark (charge +e), and a neutron of one up and two down quarks (charge 0). The study of elementary particles is particle physics."],

wr:[,
{m:3,q:"Consider two hydrogen atoms H_A and H_B in ground state. Hydrogen atom H_A is at rest and hydrogen atom H_B is moving with a speed and makes head-on collision with the stationary hydrogen atom H_A. After the collision, both of them move together. What is the minimum value of the kinetic energy of the moving hydrogen atom H_B, such that any one of the hydrogen atoms reaches first excitation state?",a:"(Worked by me; the result matches the book\u2019s answer of 20.4 eV.)\nThe energy needed to excite a hydrogen atom from the ground state to the first excited state is 13.6 \u2212 3.4 = 10.2 eV.\nIn a perfectly inelastic collision the atoms move together after impact, so the energy that is available for excitation is the kinetic energy in the centre-of-mass frame. For equal masses this is half the lab kinetic energy, so the lab kinetic energy of H_B must be 2 \u00d7 10.2 = 20.4 eV for 10.2 eV to be available.",k:[["20.4"],["10.2"],["centre of mass","centre-of-mass","cm"],["half","2 \u00d7","twice"],["inelastic"]]},
{m:5,q:"Describe J. J. Thomson\u2019s experiment to determine the specific charge of the electron.",a:"APPARATUS: a highly evacuated discharge tube has a cathode from which cathode rays are emitted, and an anode disc with a pin hole that gives a narrow beam. The beam passes between parallel metal plates maintained at a high voltage (producing a uniform electric field E) and between the poles of a magnet, so that the electric and magnetic fields are perpendicular to each other. When the beam strikes the screen, which is coated with zinc sulphide, a bright spot is seen.\nVELOCITY: the electron gains kinetic energy from the potential difference V between cathode and anode: eV = (1/2)mv\u00b2, so v = \u221a(2eV/m). Balancing the electric and magnetic forces so that the beam is undeflected gives eE = evB, so v = E/B (9.1).\nSPECIFIC CHARGE: substituting the velocity gives e/m = E\u00b2/(2VB\u00b2) (9.2). The electric and magnetic fields E and B and the accelerating voltage V are measured, and the specific charge is found to be 1.7 \u00d7 10\u00b9\u00b9 C kg\u207b\u00b9.\nNOTE: the specific charge is independent of the gas used and of the nature of the electrodes.",k:[["cathode"],["pin hole","pinhole"],["perpendicular"],["zinc sulphide","zns"],["eV","kinetic energy"],["E/B","v = e/b","e/b"],["E\u00b2/2VB\u00b2","e\u00b2/2vb\u00b2","e2/2vb2","e\u00b2","2vb"],["1.7"],["independent"]]},
{m:5,q:"Describe Millikan\u2019s oil drop experiment to determine the charge of an electron.",a:"APPARATUS: two horizontal circular metal plates A and B, about 20 cm in diameter and 1.5 cm apart, are enclosed in a glass chamber and maintained at a potential difference of about 10 kV, so that the electric field acts vertically downward. A fine droplet of a non-volatile liquid such as glycerine is sprayed from an atomizer through a small hole in the upper plate. The drops are illuminated by a light beam and seen through a microscope placed at right angles to the beam. Friction with air or X-rays can give the drops a negative charge.\nRADIUS OF THE DROP: with the field off, the drop falls and reaches a steady terminal velocity, which is measured by timing its fall through a known distance. From this the radius of the drop is found, since at terminal velocity the viscous and buoyant forces balance the weight.\nCHARGE OF THE DROP: the field is switched on and adjusted until the drop is held balanced, so that the electric force qE balances the weight mg, giving the charge q on the drop.\nRESULT: Millikan repeated this for many drops and found that all the measured charges are integral multiples of a basic value e = 1.6 \u00d7 10\u207b\u00b9\u2079 C. This is the charge of the electron, and it shows that charge is quantised.",k:[["plates","plate"],["atomizer","atomiser"],["microscope"],["terminal velocity"],["radius"],["balanced","balance"],["qe","q e","mg"],["integral","multiple"],["1.6"],["quantis","quantiz"]]},
{m:3,q:"A hydrogen atom is excited by radiation of wavelength 97.5 nm. Find the principal quantum number of the excited state, and the number of possible lines in the emission spectrum.",a:"(Worked by me; the result matches the book\u2019s answer n = 4 with 6 possible transitions.)\nEnergy of the radiation: E = 1240/97.5 = 12.7 eV. The excited state has energy 13.6 \u2212 13.6/n\u00b2 = 12.7 eV, so 1/n\u00b2 = 0.0625 and n = 4.\nNumber of lines in the emission spectrum: n(n \u2212 1)/2 = 4 \u00d7 3/2 = 6.",k:[["n = 4","4"],["6"],["12.7"],["n(n"],["97.5"]]},
{m:3,q:"Calculate the radius of the earth if the density of the earth is equal to the density of the nucleus. [mass of earth 5.97 \u00d7 10\u00b2\u2074 kg]",a:"(Worked by me from the nuclear density 2.3 \u00d7 10\u00b9\u2077 kg m\u207b\u00b3; the result matches the book\u2019s answer of about 180 m.)\nEarth\u2019s density = mass/volume = 5.97 \u00d7 10\u00b2\u2074/((4/3)\u03c0R\u00b3) = 2.3 \u00d7 10\u00b9\u2077.\nR\u00b3 = 3 \u00d7 5.97 \u00d7 10\u00b2\u2074/(4\u03c0 \u00d7 2.3 \u00d7 10\u00b9\u2077) = 6.2 \u00d7 10\u2076 m\u00b3, so R \u2248 1.8 \u00d7 10\u00b2 m = 180 m.",k:[["180"],["2.3"],["4/3","4 / 3"],["r\u00b3","r3","r^3"]]},
{m:3,q:"Half-lives of two radioactive elements A and B are 20 minutes and 40 minutes respectively. Initially the samples have equal number of nuclei. Calculate the ratio of decayed numbers of A and B nuclei after 80 minutes.",a:"(Worked by me; the result matches the book\u2019s answer of 5 : 4.)\nA: after 80 min (4 half-lives) the remaining fraction is 1/16, so the decayed fraction is 15/16.\nB: after 80 min (2 half-lives) the remaining fraction is 1/4, so the decayed fraction is 3/4 = 12/16.\nRatio of decayed numbers = 15 : 12 = 5 : 4.",k:[["5 : 4","5:4","5/4"],["15/16","15"],["12/16","12"],["1/16","1/4"]]},
{m:3,q:"On your birthday you measure the activity of a sample of Bi-210, which has a half-life of 5.01 days. The initial activity that you measure is 1 \u00b5Ci. (a) What is the approximate activity on your next birthday? (b) Calculate the decay constant, (c) the mean life and (d) the initial number of atoms.",a:"(Worked by me; the results match the book\u2019s answers.)\n(a) One year is about 365/5.01 = 72.9 half-lives, so the activity falls by 2\u207b\u2077\u00b2\u00b7\u2079, which is about 10\u207b\u00b2\u00b2 \u00b5Ci.\n(b) \u03bb = 0.693/T1/2 = 0.693/(5.01 \u00d7 86400 s) = 1.6 \u00d7 10\u207b\u2076 s\u207b\u00b9.\n(c) Mean life = 1/\u03bb = T1/2/0.693 = 7.23 days.\n(d) Initial activity R0 = 1 \u00b5Ci = 3.7 \u00d7 10\u2074 Bq, so N0 = R0/\u03bb = 3.7 \u00d7 10\u2074/1.6 \u00d7 10\u207b\u2076 = 2.31 \u00d7 10\u00b9\u2070 atoms.",k:[["10\u207b\u00b2\u00b2","10^-22","10-22"],["1.6","1.6 \u00d7 10"],["7.23"],["2.31","2.3"],["0.693"]]},
{m:3,q:"Calculate the time required for 60% of a sample of radon to undergo decay. Given T1/2 of radon = 3.8 days.",a:"(Worked by me; the result matches the book\u2019s answer of 5.022 days.)\nRemaining fraction = 0.4, so 0.4 = (1/2)^(t/T), giving t/T = ln(0.4)/ln(0.5) = 1.32.\nt = 1.32 \u00d7 3.8 = 5.02 days.",k:[["5.02","5.022"],["0.4","40"],["1.32"],["ln"]]},
{m:3,q:"Assuming that the energy released by the fission of a single U-235 nucleus is 200 MeV, calculate the number of fissions per second required to produce 1 watt of power.",a:"(Worked by me; the result matches the book\u2019s answer of 3.125 \u00d7 10\u00b9\u2070.)\n200 MeV = 200 \u00d7 1.6 \u00d7 10\u207b\u00b9\u00b3 J = 3.2 \u00d7 10\u207b\u00b9\u00b9 J per fission.\nFissions per second = 1 W/(3.2 \u00d7 10\u207b\u00b9\u00b9 J) = 3.125 \u00d7 10\u00b9\u2070.",k:[["3.125","3.1"],["3.2"],["200"],["10\u00b9\u2070","10^10","10\u00b9"]]},
{m:3,q:"Show that the mass of radium (226 88 Ra) with an activity of 1 curie is almost a gram. Given T1/2 = 1600 years.",a:"(Worked by me; the result is about 1 g, as the book states.)\nActivity R = \u03bbN, so N = R/\u03bb = R T1/2/0.693, with 1 Ci = 3.7 \u00d7 10\u00b9\u2070 Bq and T1/2 = 1600 \u00d7 3.156 \u00d7 10\u2077 s.\nN = (3.7 \u00d7 10\u00b9\u2070 \u00d7 5.05 \u00d7 10\u00b9\u2070)/0.693 = 2.7 \u00d7 10\u00b2\u00b9 atoms.\nMass = N \u00d7 226 u = 2.7 \u00d7 10\u00b2\u00b9 \u00d7 226 \u00d7 1.66 \u00d7 10\u207b\u00b2\u2077 kg \u2248 1.0 \u00d7 10\u207b\u00b3 kg = 1 g.",k:[["1 g","1g","gram"],["3.7"],["1600"],["0.693"],["226"]]},
{m:3,q:"Charcoal pieces of a tree are found at an archaeological site. The carbon-14 content of the charcoal is only 17.5% of that of an equivalent sample of carbon from a living tree. What is the age of the tree? (Take T1/2 of carbon-14 as 5730 years.)",a:"(Worked by me, assuming T1/2 = 5730 years for carbon-14; the result matches the book\u2019s answer of 1.44 \u00d7 10\u2074 years.)\n0.175 = (1/2)^(t/T), so t = T \u00d7 ln(1/0.175)/ln2 = 5730 \u00d7 2.51 = 1.44 \u00d7 10\u2074 years.",k:[["1.44","14 400","14400","1.4"],["5730"],["17.5","0.175"],["ln"]]}

{m:5,q:"Describe the main parts of a nuclear reactor and explain the working of a nuclear reactor.",a:"A nuclear reactor is a device in which nuclear fission takes place in a self-sustained, controlled manner, and the energy produced is used for research or for generating power. The first reactor was built by Enrico Fermi in Chicago in 1942.\nMAIN PARTS: (1) Fuel: a fissionable material, usually uranium-235 or plutonium. Natural uranium has only 0.7% U-235, so it is enriched to 2% to 4% U-235. (2) Neutron source: a mixture such as beryllium with polonium or plutonium, which starts the chain reaction the first time. (3) Moderator: a material, such as heavy water or graphite, that converts fast neutrons (which are emitted in fission but rarely cause further fission) into slow neutrons. Light nuclei of mass comparable to the neutron are used, because they take away the most energy from each collision. (4) Control rods: made of materials such as cadmium or boron that absorb neutrons, so that the number of neutrons, and hence the rate of fission, is kept steady. (5) Cooling system: a coolant carries the heat away to a heat exchanger, which makes steam to drive a turbine connected to a generator. (6) Shielding: thick concrete or lead walls protect against radiation.\nWORKING: a slow neutron is absorbed by a U-235 nucleus, which splits into two smaller nuclei, releasing a large energy and two or three neutrons. These neutrons, slowed by the moderator, cause further fissions, and the chain reaction is maintained. The control rods are moved in or out to keep exactly one neutron from each fission causing a further fission, so the reaction is self-sustained and controlled.",k:[["fuel","fissionable"],["enrich","2%","4%"],["neutron source"],["moderator","graphite","heavy water"],["control rod","cadmium","boron"],["cooling","coolant","heat exchanger"],["turbine"],["shield"],["slow neutron","slow"],["chain reaction","chain"]]},
{m:5,q:"Compare the processes of nuclear fission and nuclear fusion, and explain how energy is generated in the Sun.",a:"NUCLEAR FISSION: the splitting of a heavy nucleus (such as uranium-235) into two medium-mass nuclei, with the release of energy and some neutrons. It is started by a neutron, and it is the basis of nuclear reactors and atom bombs. It releases energy because the binding energy per nucleon of the fragments is larger than that of the heavy nucleus.\nNUCLEAR FUSION: the combining of two or more light nuclei (mass number less than about 20) into a heavier nucleus, with the release of energy. Because the nuclei are positively charged, they must be brought together at very high temperatures (about 10\u2077 K) to overcome the Coulomb repulsion. It is the principle of the hydrogen bomb.\nCOMPARISON: both release energy because the binding energy per nucleon increases towards the medium-mass region; fission needs a neutron to start it and a chain reaction, while fusion needs extreme temperatures.\nENERGY OF THE SUN: in the core of the Sun and other stars, hydrogen nuclei fuse into helium. The overall reaction converts about 4 hydrogen nuclei into one helium nucleus, and a small fraction of the mass difference is released as energy (E = \u0394mc\u00b2) as photons, positrons and neutrinos. This is the source of the Sun\u2019s energy.",k:[["heavy"],["medium"],["neutron"],["chain"],["light"],["10\u2077","10^7","10\u00b9\u2070"],["coulomb"],["binding energy"],["hydrogen","helium"],["sun"],["mass"]]},
{m:5,q:"Describe the alpha decay and beta decay processes with examples.",a:"ALPHA DECAY: an unstable nucleus emits an alpha particle (a helium-4 nucleus, \u2074\u2082He), so the mass number falls by 4 and the atomic number by 2: A\u2082X \u2192 A\u22124 Z\u22122 Y + \u2074\u2082He. For example, uranium-238 decays to thorium-234. The alpha particle has discrete energies, and the nucleus emits an alpha particle rather than separate nucleons, because the energy needed to emit four separate nucleons would be negative.\nBETA DECAY: in beta-minus decay a neutron in the nucleus changes into a proton, emitting an electron and an antineutrino: n \u2192 p + e\u207b + \u03bd\u0305, so Z increases by 1 and A is unchanged. For example, carbon-14 becomes nitrogen-14. In beta-plus decay a proton changes into a neutron, emitting a positron and a neutrino: p \u2192 n + e\u207a + \u03bd, so Z decreases by 1. For example, sodium-22 becomes neon-22. The electrons from beta decay have a continuous range of energies, which led Pauli to propose the neutrino.",k:[["alpha particle","helium"],["4","mass number"],["2","atomic number"],["u-238","uranium","238"],["th-234","thorium","234"],["beta-minus","beta minus","\u03b2\u207b","\u03b2-"],["beta-plus","beta plus","positron"],["antineutrino","neutrino"],["c-14","carbon","n-14"],["na-22","sodium","ne-22"],["continuous"]]},
,
{m:5,q:"Explain the average binding energy per nucleon as a function of mass number, and discuss its significance for nuclear fusion and fission.",a:"The average binding energy per nucleon is BE/A = [Zmp + Nmn \u2212 M]c\u00b2/A (9.25). It is the average energy required to remove one nucleon from the nucleus. When BE/A is plotted against the mass number A for all known nuclei, the curve has these features:\n(i) For light nuclei (A < 20) the value rises steeply, so the nuclei are less tightly bound than those of medium mass.\n(ii) For mass numbers between about 40 and 120 the value is nearly constant, about 8.5 MeV per nucleon, so these are the most stable nuclei (for example iron and nickel).\n(iii) For heavy nuclei (A above about 120) the value falls slowly, to about 7.6 MeV per nucleon for uranium.\nSIGNIFICANCE: if two light nuclei combine to form a heavier nucleus, the binding energy per nucleon of the product is larger, so the total binding energy increases and the difference is released as energy. This is nuclear fusion. Likewise, if a heavy nucleus splits into two medium-mass nuclei, the fragments are more tightly bound, and the difference is released. This is nuclear fission. Both processes therefore release energy, and the energy released per reaction is about 1 MeV per nucleon for fusion and about 200 MeV per fission of uranium.",k:[["binding energy per nucleon","be/a","average binding"],["mass number"],["8.5","8.5 mev"],["7.6"],["iron","nickel"],["fusion"],["fission"],["released","release"],["stable"]]},
{m:5,q:"Describe the properties of the nuclear force.",a:"The force that holds the protons and neutrons together in the nucleus is called the nuclear force. It must be much stronger than the electrostatic repulsion between protons, because the nucleus is stable. Its properties are:\n(i) Short range: the nuclear force acts only up to a distance of a few fermi (about 1 to 2 fm). Within the nucleus the Coulomb repulsion between protons and the gravitational attraction are much weaker than the nuclear force, so the nuclear force is the strongest force in nature in the nucleus.\n(ii) Charge independence: the nuclear force is attractive and has equal strength between proton\u2013proton, proton\u2013neutron and neutron\u2013neutron pairs.\n(iii) Spin dependence: the force depends on the relative spins of the nucleons.\n(iv) No action on electrons: the nuclear force does not act on electrons, so it does not affect the chemical properties of atoms.\n(v) Saturation: each nucleon interacts only with a few of its nearest neighbours, which is why the binding energy per nucleon is nearly constant.",k:[["short range","short-range","fermi"],["charge independ","equal strength","equal"],["spin"],["electron","chemical"],["saturat","nearest","neighbour","neighbor"],["strongest"]]},
,
{m:5,q:"Explain the spectral series of hydrogen atom (Lyman, Balmer and Paschen series), with the transitions and the wavelength regions.",a:"When hydrogen is excited, its electrons jump to higher energy levels and then fall back, emitting photons of definite energy. The energy of the photon is hc/\u03bb = E_upper \u2212 E_lower, so each transition gives a spectral line of definite wavelength. The lines are grouped into series according to the lower level in which the electron ends:\n(i) LYMAN SERIES: transitions to the ground state (n = 1) from n = 2, 3, 4, ... They lie in the ultraviolet region, with wavelengths from about 91 nm to 122 nm.\n(ii) BALMER SERIES: transitions to n = 2 from n = 3, 4, 5, ... They lie in the visible region, from about 365 nm to 656 nm (the red line H\u03b1 at 656 nm).\n(iii) PASCHEN SERIES: transitions to n = 3 from n = 4, 5, 6, ... They lie in the infrared region, starting at about 820 nm and reaching 1875 nm.\nIn each series the lines become closer together as the upper level increases, and the series limit is reached when the electron is removed from the atom (the ionisation limit). The Rydberg formula gives all the wavelengths: 1/\u03bb = R(1/n\u2081\u00b2 \u2212 1/n\u2082\u00b2), where R is the Rydberg constant.",k:[["lyman"],["balmer"],["paschen"],["ground state","n = 1","n=1"],["ultraviolet","uv"],["visible"],["infrared","ir"],["rydberg","1/\u03bb"],["series limit","ionisation","ionization"],["hc/\u03bb","hc/\u03bb = e"]]},
{m:5,q:"Derive the expression for the energy of an electron in the n-th Bohr orbit of a hydrogen-like atom and obtain the energy levels.",a:"Bohr\u2019s postulates give two equations. (i) The Coulomb attraction provides the centripetal force: (1/4\u03c0\u03b50)(Ze\u00b2/r\u00b2) = mv\u00b2/r, so mv\u00b2 = Ze\u00b2/(4\u03c0\u03b50 r). (ii) The quantised angular momentum: mvr = nh/2\u03c0, so v = nh/(2\u03c0mr).\nSubstituting v into (i) and solving gives the radius of the n-th orbit rn = (\u03b50 h\u00b2 n\u00b2)/(\u03c0 m Z e\u00b2), which is proportional to n\u00b2/Z.\nTotal energy E = KE + PE, with KE = (1/2)mv\u00b2 and PE = \u2212Ze\u00b2/(4\u03c0\u03b50 r). Using mv\u00b2 = Ze\u00b2/(4\u03c0\u03b50 r), KE = \u2212PE/2, so the total energy is En = \u2212KEn = \u2212m Z\u00b2 e\u2074/(8\u03b50\u00b2 h\u00b2 n\u00b2) (9.17).\nNumerically, for hydrogen (Z = 1) this gives E1 = \u221213.6 eV, E2 = \u22123.4 eV, E3 = \u22121.51 eV, and in general En = \u221213.6 Z\u00b2/n\u00b2 eV. The energy of the transition from n2 to n1 gives the spectral line: hc/\u03bb = 13.6 Z\u00b2(1/n1\u00b2 \u2212 1/n2\u00b2) eV.",k:[["centripetal"],["coulomb"],["angular momentum","mvr"],["n\u00b2","n2","n^2"],["kinetic","ke"],["potential","pe"],["\u221213.6","13.6"],["\u22123.4","3.4"],["z\u00b2","z2","z^2"],["9.17"]]},
,
{m:5,q:"Discuss the gamma emission process with an example.",a:"After an alpha or beta decay the daughter nucleus is often left in an excited state, with more energy than its ground state. It returns to a lower energy state by emitting a gamma ray, which is a high-energy photon. For example, when carbon-14 undergoes beta decay it can leave nitrogen-14 in an excited state; the nucleus then decays to its ground state by emitting a gamma photon of definite energy, equal to the difference between the two nuclear energy levels.\nThe emission of gamma rays does not change the atomic number Z or the mass number A of the nucleus, because the photon carries away only energy and no charge or nucleons. Gamma rays are very penetrating electromagnetic radiation, with wavelengths much shorter than X-rays, and they have discrete energies that are characteristic of the nucleus.",k:[["excited"],["ground state","lower"],["photon"],["energy","difference"],["z","atomic number"],["a","mass number"],["penetrat"],["discrete","characteristic"],["carbon","nitrogen"]]},
{m:5,q:"Discuss the elementary particles and the quark model of nucleons.",a:"Until the 1960s protons, neutrons and electrons were thought to be the fundamental building blocks of matter. In 1964 Gell-Mann and Zweig proposed that protons and neutrons are not fundamental, but are made of quarks. The quarks were confirmed experimentally at the Stanford Linear Accelerator Centre in 1968. Electrons remain elementary, because they are not made of anything.\nQUARKS: there are six quarks, up, down, charm, strange, top and bottom, each with an antiparticle. They carry fractional charges: the up-type quarks have +2/3 e and the down-type quarks \u22121/3 e.\nNUCLEONS: a proton is made of two up quarks and one down quark, with charge (2/3 + 2/3 \u2212 1/3)e = +e. A neutron is made of one up quark and two down quarks, with charge (2/3 \u2212 2/3 \u2212 1/3)e = 0.\nThe study of elementary particles is called particle physics, which is still an active area of research, and more than 20 Nobel prizes have been awarded in the field.",k:[["1964","gell-mann","gellman","zweig"],["1968","slac"],["six"],["up","down"],["2/3","+2/3"],["\u22121/3","-1/3"],["proton","neutron"],["electron"],["particle physics"]]},
]},
10:{exp:[
"Energy bands: the valence band is formed by the valence orbitals filled with electrons, and the conduction band by the unoccupied orbitals to which electrons can jump when energised. The energy gap between them is the forbidden energy gap Eg = EC \u2212 EV, in which electrons cannot exist. Insulators have a large gap (about 6 eV), so electrons cannot reach the conduction band and resistivity is 10\u00b9\u00b9 to 10\u00b9\u2079 \u03a9 m. In conductors the valence and conduction bands overlap, so many free electrons are available.",
"Semiconductors: materials whose forbidden gap is small (below about 3 eV; about 1.1 eV for silicon and 0.7 eV for germanium). At 0 K they behave like insulators; as temperature rises, electrons gain energy, jump into the conduction band, and leave holes in the valence band, so the conductivity increases.",
"Intrinsic semiconductor: a pure semiconductor without impurity. Its electrons and holes are equal in number, and the carrier concentration is set by temperature.",
"Extrinsic semiconductor and doping: adding impurity atoms (dopants, about 100 ppm) to an intrinsic semiconductor increases the number of charge carriers and so its conductivity. An n-type semiconductor is made by doping silicon or germanium with pentavalent atoms (phosphorus, arsenic, antimony), which give free electrons; a p-type semiconductor is made with trivalent atoms (boron, aluminium, gallium, indium), which create holes.",
"P-n junction and depletion region: when a p-type and an n-type piece are joined, electrons diffuse from the n-side to the p-side and holes from the p-side to the n-side. This diffusion gives a diffusion current. Each diffusing electron leaves a positive ion on the n-side and each hole leaves a negative ion on the p-side; these immobile ions set up an electric field across the junction. The region near the junction, with no free carriers, is the depletion region. The potential difference across it is the barrier potential, about 0.7 V for silicon and 0.3 V for germanium at 25 \u00b0C.",
"P-n junction diode and biasing: a diode is a p-n junction with two terminals. Biasing is the external voltage that makes the charge carriers move across the barrier. In forward bias the p-side is connected to the positive terminal and the n-side to the negative terminal; this narrows the depletion region, so a large current flows and rises exponentially. In reverse bias the n-side is connected to the positive terminal; the depletion region widens and only a very small reverse saturation current flows, so the diode blocks current.",
"V\u2013I characteristics of a p-n junction diode: in forward bias, the current is negligible until the applied voltage reaches the threshold (knee or cut-in) voltage, about 0.7 V for silicon and 0.3 V for germanium. Beyond it the current rises rapidly with a small increase in voltage. In reverse bias a very small leakage (reverse saturation) current of microampere order flows, which is independent of the voltage up to the breakdown voltage. An ideal diode has zero forward resistance and negligible barrier potential, and acts as a conductor in forward bias and an insulator in reverse bias.",
"Rectification and half-wave rectifier: rectification is the conversion of alternating voltage or current into direct voltage or current, and the device is a rectifier. In a half-wave rectifier, a transformer, a p-n diode and a load resistor RL are used. During the positive half cycle the diode is forward biased and conducts, giving an output across RL; during the negative half cycle the diode is reverse biased and blocks the current. The output is a pulsating dc, which needs a filter and a voltage regulator to give steady dc. The efficiency of a half-wave rectifier is 40.6%.",
"Full-wave rectifier: both half cycles of the AC input are rectified. It uses two diodes and a centre-tap transformer, with the centre tap taken as the zero (ground) reference. Each diode conducts during one half cycle, so the current through the load flows in the same direction in both halves, and the output is a pulsating dc of twice the frequency of the input.",
"Avalanche and Zener breakdown: a diode breaks down when the reverse voltage is large enough to make a sharp rise in reverse current. In avalanche breakdown, found in lightly doped junctions with a wide depletion region, minority carriers gain energy from the reverse voltage, collide with atoms and create electron\u2013hole pairs, which in turn create more pairs, producing an avalanche of carriers. In Zener breakdown, found in heavily doped junctions with a narrow depletion region (width below 10\u207b\u2076 m), a strong electric field of about 3 \u00d7 10\u2077 V m\u207b\u00b9 breaks the covalent bonds directly, the Zener effect.",
"Zener diode: a heavily doped silicon diode designed to work in the reverse breakdown region, named after Clarence Zener. Its breakdown voltage can be set from 2 V to over 1000 V by the doping. Once the reverse voltage reaches VZ the current rises sharply while the voltage stays almost constant over a wide range of currents, so it is used as a voltage regulator. The current must stay between the minimum needed and the maximum IZ(max), beyond which the diode is damaged.",
"Bipolar junction transistor (BJT): a semiconductor with three regions. An NPN transistor has a thin, lightly doped p-type base between two n-type regions; a PNP transistor has an n-type base between two p-type regions. The three regions are the emitter (heavily doped, to supply majority carriers), the base (very thin, about 10\u207b\u2076 m, and lightly doped) and the collector (moderately doped and physically larger, to dissipate more power). Because of these differences the emitter and collector cannot be interchanged. The arrow on the emitter shows the direction of conventional current.",
"Transistor biasing and forward active mode: applying suitable dc voltages to the terminals is biasing. In the forward active mode the emitter\u2013base junction is forward biased and the collector\u2013base junction is reverse biased; the transistor then works as an amplifier. The three configurations are common base (CB), common emitter (CE) and common collector (CC), named after the terminal common to the input and output circuits.",
"Current gains: the forward current gain in the common emitter configuration is \u03b2 = \u0394IC/\u0394IB at constant VCE (10.5), which is usually 50 to 200. The current gain in the common base configuration is \u03b1 = \u0394IC/\u0394IE, and the two are related by \u03b2 = \u03b1/(1 \u2212 \u03b1) (10.6). The collector current is independent of the collector\u2013emitter voltage in the active region. A small leakage current ICEO flows even when IB is zero, because of minority carriers.",
"Electronic oscillator: a circuit that converts dc energy into ac energy of frequency from a few Hz to several MHz. It needs no external signal source. Sinusoidal oscillators give sine waves of constant amplitude; non-sinusoidal (relaxation) oscillators give other waveforms, such as square or sawtooth.",
"Transistor oscillator: it has three parts, the tank circuit (an LC circuit that generates the electrical oscillations), an amplifier (a transistor), and a feedback network that feeds part of the output back to the input in phase. This positive feedback compensates the energy lost as heat in the coil and capacitor, which would otherwise make the oscillations damped. The frequency is f = 1/(2\u03c0\u221a(LC)). Oscillators are used to generate audio tones, clock signals in digital circuits, and sweep circuits in TV sets and CROs.",
"Logic gates: electronic circuits whose function is based on binary digital signals, and the basic building blocks of digital systems. There are three basic gates: AND, OR and NOT; the others (Ex-OR, NAND and NOR) are built from them. Digital electronics uses logical addition (+) and logical multiplication (.) as the logical operators.",
"Modulation: long-distance transmission of an audio signal (20 Hz to 20 kHz) needs a high-frequency carrier. The low-frequency baseband signal is superimposed on a high-frequency sine carrier e = Ec sin(2\u03c0\u03bdct + \u03c6), because a high-frequency carrier can travel long distances with less attenuation. The amplitude, frequency or phase of the carrier can be changed in proportion to the baseband signal, giving amplitude, frequency or phase modulation.",
"Amplitude modulation (AM): the amplitude of the carrier is changed in proportion to the instantaneous amplitude of the baseband signal, while its frequency and phase stay constant. It has a lesser bandwidth requirement and low cost, but it has high noise, low efficiency and a small operating range. It is used in radio broadcasting.",
"Frequency and phase modulation: in frequency modulation (FM) the carrier frequency changes in proportion to the baseband amplitude, while its amplitude and phase stay constant; a louder signal gives a larger frequency change. In phase modulation the phase of the carrier is varied by the baseband signal, keeping its amplitude and frequency constant. Phase modulation is similar to FM and is used to generate FM signals.",
"Propagation of electromagnetic waves: ground wave (surface wave) propagation, for frequencies of about 2 kHz to 2 MHz, where the wave glides over the Earth\u2019s surface and is used for local broadcasting, radio navigation and ship-to-shore communication. Sky wave (ionospheric) propagation, for about 3 MHz to 30 MHz, where the wave is reflected by the ionosphere, which lies about 50 km to 400 km above the Earth. Space wave propagation, for about 30 MHz to 400 GHz, which travels in a straight line between the antennas and is used for TV and satellite communication.",
"Positive and negative logic: digital systems have two voltage levels, for example 5 V (high) and 0 V (low). In positive logic 1 stands for 5 V and 0 for 0 V; in negative logic 1 stands for 0 V and 0 for 5 V. The truth table of a gate lists the output for every combination of inputs, and the Boolean equation gives the logical statement.",
"AND gate: output is 1 only when all inputs are 1, Y = A.B (logical multiplication). For two inputs the truth table has Y = 1 only for A = B = 1. OR gate: output is 1 when at least one input is 1, Y = A + B (logical addition). NOT gate (inverter): the output is the complement of the input, Y = A\u0304, so 1 gives 0 and 0 gives 1.",
"Universal gates and De Morgan\u2019s theorems: NAND and NOR gates are universal gates, because any logic function can be built from either alone. De Morgan\u2019s first theorem: (A + B)\u2032 = A\u2032.B\u2032, so a NOR gate is an AND gate with inverted inputs. De Morgan\u2019s second theorem: (A.B)\u2032 = A\u2032 + B\u2032, so a NAND gate is an OR gate with inverted inputs. The Boolean algebra laws simplify logic circuits.",
"Barkhausen conditions for sustained oscillations: (i) there must be positive feedback; (ii) the loop phase shift must be 0\u00b0 or an integral multiple of 2\u03c0; (iii) the loop gain must be unity, that is A\u03b2 = 1, where A is the voltage gain of the amplifier and \u03b2 the feedback fraction. Without positive feedback the oscillations die away, and the loop gain of unity keeps the amplitude constant."],
