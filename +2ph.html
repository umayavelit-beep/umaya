wr:[
{m:2,q:"State Lenz\u2019s law.",a:"Lenz\u2019s law states that the direction of the induced current is such that it always opposes the cause responsible for its production. When the magnetic flux linked with a coil changes, the induced current flows in a direction that opposes that change of flux.",k:[["opposes","oppose"],["cause"],["induced current","induced"],["flux"],["direction"]]},
{m:2,q:"What is meant by self-induction?",a:"Self-induction is the phenomenon in which a changing current in a coil produces a changing magnetic flux linked with the same coil, which induces an emf in that coil itself. The total flux linkage is proportional to the current: N\u03a6B = Li, where L is the self-inductance of the coil. The induced emf is called the self-induced emf.",k:[["same coil","itself","the coil"],["changing current","current"],["flux"],["self-induced emf","emf"],["li","l i","l =","self-inductance"]]},
{m:2,q:"What is meant by mutual induction?",a:"Mutual induction is the phenomenon in which a change of current in one coil induces an emf in a neighbouring coil that is magnetically linked with it. The flux linked with coil 2 is proportional to the current in coil 1: N2\u03a621 = M21 i1, and the induced emf is called the mutually induced emf.",k:[["neighbouring","neighboring","nearby"],["current"],["coil 1","coil"],["emf"],["mutual","mutually"]]},
{m:2,q:"Give the principle of AC generator.",a:"An AC generator (alternator) works on the principle of electromagnetic induction. The relative motion between a conductor and a magnetic field changes the magnetic flux linked with the conductor, which induces an emf in it. It converts mechanical energy into electrical energy.",k:[["electromagnetic induction"],["relative motion"],["flux"],["mechanical"],["electrical"]]},
{m:2,q:"What are step-up and step-down transformers?",a:"A step-up transformer converts an alternating current with low voltage into an alternating current with high voltage; in it the secondary has more turns (Ns > Np), so the voltage increases and the current decreases. A step-down transformer converts alternating current with high voltage into one with low voltage; the secondary has fewer turns (Ns < Np), so the voltage decreases and the current increases.",k:[["step-up","step up"],["step-down","step down"],["low voltage","high voltage"],["turns"],["voltage"],["current"]]},
{m:2,q:"Define electrical resonance and resonant frequency.",a:"In a series RLC circuit, electrical resonance occurs when the frequency of the applied alternating source equals the natural frequency of the circuit, 1/\u221a(LC). At this frequency the current reaches its maximum value. The frequency at which resonance takes place is called the resonant frequency.",k:[["maximum","max"],["natural frequency","1/\u221a","lc"],["resonant frequency"],["applied","source"]]},
{m:2,q:"How will you define Q-factor?",a:"The Q-factor (quality factor) of a series resonant RLC circuit is the ratio of the voltage across the inductor or capacitor at resonance to the applied voltage. It describes the magnification of voltage at series resonance, because the current is maximum at resonance.",k:[["ratio"],["voltage"],["resonance"],["inductor","capacitor","l or c"],["applied"],["magnification","magnify"]]},
{m:5,q:"Obtain an expression for motional emf using the Lorentz force.",a:"Consider a straight conducting rod AB of length l in a uniform magnetic field B directed into the plane of the paper. The rod is normal to the field and moves with constant velocity v to the right.\nThe free electrons in the rod move with the rod, so each electron experiences a Lorentz force FB = \u2212e(v \u00d7 B), directed from B to A. This force drives the electrons to accumulate at end A, leaving end B positively charged. The accumulated charge sets up an electric field E directed from B to A, and this produces a Coulomb force eE on each electron, opposite to the Lorentz force.\nThe accumulation stops when the two forces balance: eE = evB, so E = vB.\nThe potential difference between the ends of the rod is the emf induced in it: \u03b5 = El = Blv.\nThe induced emf is therefore \u03b5 = Blv, where B, l and v are mutually perpendicular. Since the emf is produced by the magnetic force on moving charges, this is called motional emf. It is the same result as from Faraday\u2019s law, because the rod sweeps out a changing flux.",k:[["lorentz"],["accumulat"],["end a","a end","end b","b end"],["electric field","e = vb","e=vb","vb"],["coulomb"],["balance","equilibrium"],["\u03b5 = blv","e = blv","blv","b l v","bl v"],["motional"],["mutually perpendicular","perpendicular"]]},
{m:5,q:"Explain Lenz\u2019s law with an example and state how it agrees with the law of conservation of energy.",a:"Lenz\u2019s law: the direction of the induced current is such that it always opposes the cause responsible for its production.\nEXAMPLE (copper pipe): take a narrow copper pipe held vertically and drop a strongly magnetised button magnet into it. The magnet falls more slowly than in free fall. The moving magnet induces a current in the pipe, and this current produces a magnetic field that opposes the motion of the magnet, so the magnet is slowed down.\nEXAMPLE (flux increase): when the flux linked with a loop increases with time, the induced current flows so as to produce a magnetic field opposite to the increasing field, so the flux change is opposed.\nCONSERVATION OF ENERGY: because the induced current opposes the motion, mechanical work has to be done against the opposing force to keep the magnet or conductor moving. This mechanical work is converted into electrical energy and then into heat in the circuit. If the induced current instead helped the motion, energy would be created from nothing, which contradicts the law of conservation of energy. Lenz\u2019s law is therefore a consequence of energy conservation.",k:[["oppos"],["cause"],["copper pipe","pipe"],["slow"],["flux"],["mechanical","work"],["heat","electrical energy"],["conservation"],["created","from nothing"]]},
{m:5,q:"Obtain an expression for the self-inductance of a long solenoid.",a:"Consider a long solenoid of length l and cross-sectional area A, with n turns per unit length. When a current i flows through it, the field inside is almost uniform and along the axis: B = \u00b50 n i (from the solenoid result in the magnetism chapter).\nThe magnetic flux through each turn is \u03a6B = BA cos\u03b8 = BA = \u00b50 n i A, since the field is normal to the turns.\nThe number of turns in length l is N = n l, so the total flux linkage is\nN\u03a6B = (n l)(\u00b50 n i A) = \u00b50 n\u00b2 A l i\nSelf-inductance is defined by N\u03a6B = Li, so\nL = \u00b50 n\u00b2 A l   (the coefficient of i, with N\u03a6B \u221d i)\nSince A l is the volume of the solenoid, L = \u00b50 n\u00b2 (volume). It depends only on the geometry (turn density, area and length) and the permeability of the core, not on the current.",k:[["\u00b50 n i","\u00b50ni","b = \u00b50 n","b = \u00b50n","\u00b50 n"],["flux","\u03a6"],["n l","nl","total number of turns"],["n\u00b2","n2","n^2"],["li","l i","l = \u00b50","l = \u00b5"],["volume"],["geometry","independent","not depend","current"]]},
{m:2,q:"State the advantages of stationary armature rotating field alternator.",a:"In the stationary armature rotating field construction, the armature winding is on the stationary stator and the field magnet rotates. The advantages are: (1) the current is drawn directly from fixed terminals on the stator, without brush contacts; (2) the rotor carries only a small direct current for the field, so the slip rings and brushes carry less current; (3) the stator windings can be insulated and supported more easily, so the machine can handle high current and high voltage. This is why the rotating-field method is used in large power stations.",k:[["brush"],["fixed terminals","stator"],["high current","high voltage"],["insulat"],["power station","large"]]},
{m:2,q:"Mention the ways of producing induced emf.",a:"An emf is induced in a circuit whenever its magnetic flux changes. The flux can be changed in three ways: (1) by changing the magnetic field through a fixed circuit (relative motion between a coil and a magnet, or a changing current in a nearby coil); (2) by changing the area of the coil in a field, for example by moving a conducting rod on a rectangular metallic frame; (3) by changing the relative orientation of the coil with the field, as in a rotating coil in an AC generator.",k:[["magnetic field","magnetic flux","flux"],["area"],["orientation","rotat"],["relative motion","changing current","coil"],["three","3"]]},
{m:2,q:"What is the principle of a transformer?",a:"A transformer works on the principle of mutual induction. When an alternating current passing through one coil (the primary) changes with time, it induces an emf in the neighbouring coil (the secondary) that is magnetically linked with it through a common core.",k:[["mutual induction"],["alternating","changes with time"],["primary"],["secondary"],["core"]]},
{m:5,q:"Describe the construction and working of a transformer, and explain why AC is used for long distance power transmission.",a:"CONSTRUCTION: a transformer has two coils of high mutual inductance wound over the same laminated core made of a good magnetic material such as silicon steel. The coils are electrically insulated from each other but magnetically linked through the core. The coil connected to the AC source is the primary, and the coil that supplies the load is the secondary.\nWORKING: an alternating voltage applied to the primary produces a changing magnetic flux in the core, which links the secondary coil. By mutual induction an alternating emf is induced in the secondary. For an ideal transformer, Vs/Vp = Ns/Np = K. A step-up transformer (Ns > Np) increases the voltage and decreases the current; a step-down transformer (Ns < Np) decreases the voltage and increases the current. Transformers work only with alternating current, because a steady direct current produces no changing flux. Transformers have no moving parts, so their efficiency is high. Energy losses include core (iron) loss from hysteresis and eddy currents in the core.\nLONG DISTANCE TRANSMISSION: power stations are usually far from towns, so the power must travel long distances through transmission lines. The power lost in the line is I2R, where R is the resistance of the line. To reduce this loss, the current I must be reduced. A step-up transformer at the power station raises the voltage so that, for the same power, the current is much smaller; a step-down transformer near the consumers then reduces the voltage to a safe level. AC is used because its voltage can be changed easily with transformers.",k:[["mutual induction"],["laminated","silicon steel","core"],["primary"],["secondary"],["step-up","step up"],["step-down","step down"],["hysteresis","eddy"],["i2r","i\u00b2r","i^2 r","i^2r"],["lower current","reduce the current","current"],["transformer"]]},
{m:5,q:"Give the uses of Foucault current (eddy current).",a:"Production of eddy current is undesirable in some cases (it dissipates energy as heat, so transformer cores are laminated), but it is useful in others:\ni. Induction stove: below the cooking zone is a tightly wound coil of insulated wire. An alternating current in the coil (the domestic supply frequency is raised from 50\u201360 Hz to about 20\u201340 kHz) produces a high-frequency alternating magnetic field, which induces very strong eddy currents in the cooking pan. The eddy currents produce a large amount of heat by Joule heating, which cooks the food quickly and safely with less energy consumption.\nii. Eddy current brake: used in high speed trains and roller coasters. Strong electromagnets fixed just above the rails are switched on to stop the train; their field induces eddy currents in the rails, which oppose or resist the motion of the train (linear eddy current brake). In some cases a circular disc connected to the wheel through a common shaft is made to rotate between electromagnet poles, and the eddy currents in it oppose the rotation.\niii. Eddy current testing: a non-destructive testing method used to find defects such as surface cracks in metal parts.\niv. Electromagnetic damping: the eddy currents produced in a conductor moving in a magnetic field oppose the motion, so a pendulum or the coil of a galvanometer comes to rest quickly.",k:[["induction stove","stove"],["brake"],["testing","defect"],["damping"],["heat","joule"],["high frequency","high-frequency"],["train"],["oppose"]]},
{m:5,q:"Explain the working of an AC generator (alternator) and give its emf equation.",a:"PRINCIPLE: the alternator works on electromagnetic induction \u2013 the relative motion between a conductor and a magnetic field changes the flux linked with the conductor. It converts mechanical energy into electrical energy. In large generators the armature is the stator and the field magnet rotates.\nWORKING (rotating field): consider a rectangular armature loop PQRS on the stator and a field magnet rotating inside it. When the field is parallel to the plane of the loop, the induced emf is maximum (point A on the graph) and the current flows along PQRS. After a 180\u00b0 rotation the field is perpendicular to the loop and the emf is zero (point B). After 270\u00b0 the field is again parallel and the emf is maximum but reversed, so the current flows along SRQP (point C). After 360\u00b0 the emf is again zero (point D). So the emf induced in PQRS is alternating, and one rotation of the field magnet gives one cycle of the emf.\nEMF EQUATION (rotating coil): for a coil of N turns and area A in a field B rotating with angular velocity \u03c9, at time t the flux linked is \u03a6 = NBA cos\u03c9t, so the induced emf is \u03b5 = \u2212d\u03a6/dt = NBA\u03c9 sin\u03c9t = \u03b5m sin\u03c9t, where the peak emf is \u03b5m = NBA\u03c9. The emf varies sinusoidally with time and alternates in direction every half cycle.",k:[["electromagnetic induction"],["mechanical","electrical"],["stator"],["rotor","field magnet"],["maximum"],["zero"],["alternat"],["one cycle","one rotation","complete"],["nba\u03c9","nba","\u03b5m"],["sin\u03c9t","sin \u03c9t","\u03c9t"]]},
{m:3,q:"A square coil of side 30 cm with 500 turns is kept in a uniform magnetic field of 0.4 T. The plane of the coil is inclined at an angle of 30° to the field. Calculate the magnetic flux linking the coil.",a:"(Worked by me; the result matches the book\u2019s answer.)\nArea A = (0.3)^2 = 0.09 m^2. The plane makes 30\u00b0 with the field, so the angle between the field and the normal is 60\u00b0.\nFlux linkage = N B A sin30\u00b0 = 500 \u00d7 0.4 \u00d7 0.09 \u00d7 0.5 = 9 Wb.\nBook answer: 9 Wb.",k:[["nba","n b a","\u03a6 = nba"],["0.09"],["sin30","sin 30","0.5"],["9 wb","9"]]},
{m:3,q:"A straight metal wire crosses a magnetic field of flux 4 mWb in a time 0.4 s. Find the magnitude of the emf induced in the wire.",a:"(Worked by me; the result matches the book\u2019s answer.)\n\u03b5 = \u0394\u03a6/\u0394t = (4 \u00d7 10^-3) / 0.4 = 10 \u00d7 10^-3 V = 10 mV.\nBook answer: 10 mV.",k:[["\u0394\u03a6/\u0394t","d\u03a6/dt","rate of change"],["4 \u00d7 10","4x10","4 mwb"],["10 mv","10 \u00d7 10","0.01"]]},
{m:3,q:"The magnetic flux passing through a coil perpendicular to its plane is a function of time and is given by ΦB = (2t³ + 4t² + 8t + 8) Wb. If the resistance of the coil is 5 Ω, determine the induced current through the coil at a time t = 3 second.",a:"(Worked by me; the result matches the book\u2019s answer.)\nInduced emf \u03b5 = d\u03a6/dt = 6t^2 + 8t + 8. At t = 3 s: \u03b5 = 54 + 24 + 8 = 86 V.\nCurrent I = \u03b5/R = 86/5 = 17.2 A.\nBook answer: 17.2 A.",k:[["d\u03a6/dt","6t","derivative"],["86"],["17.2"],["r","5"]]},
{m:3,q:"A closely wound circular coil of radius 0.02 m is placed perpendicular to the magnetic field. When the magnetic field is changed from 8000 T to 2000 T in 6 s, an emf of 44 V is induced in it. Calculate the number of turns in the coil. (Take π = 22/7)",a:"(Worked by me; the result matches the book\u2019s answer.)\n\u03b5 = N A (\u0394B/\u0394t), with A = \u03c0r^2 = (22/7)(0.02)^2 = 1.257 \u00d7 10^-3 m^2 and \u0394B/\u0394t = 6000/6 = 1000 T/s.\nN = 44 / (1.257 \u00d7 10^-3 \u00d7 1000) = 35 turns.\nBook answer: 35 turns.",k:[["\u03c0r","pi r"],["1000"],["35"],["\u0394b","delta b"]]},
{m:3,q:"A rectangular coil of area 6 cm² having 3500 turns is kept in a uniform magnetic field of 0.4 T. Initially, the plane of the coil is perpendicular to the field and is then rotated through an angle of 180°. If the resistance of the coil is 35 Ω, find the amount of charge flowing through the coil.",a:"(Worked by me; the result matches the book\u2019s answer.)\nChange of flux linkage on turning through 180\u00b0 = 2 N B A = 2 \u00d7 3500 \u00d7 0.4 \u00d7 6 \u00d7 10^-4 = 1.68 Wb.\nCharge q = \u0394\u03a6/R = 1.68/35 = 0.048 C = 48 \u00d7 10^-3 C.\nBook answer: 48 \u00d7 10^-3 C.",k:[["2nba","2 n b a","2 \u00d7 3500"],["\u0394\u03a6/r","q =","1.68"],["48","0.048"]]},
{m:3,q:"An induced current of 2.5 mA flows through a single conductor of resistance 100 Ω. Find out the rate at which the magnetic flux is cut by the conductor.",a:"(Worked by me; the result matches the book\u2019s answer.)\nThe rate of flux cut equals the induced emf: \u03b5 = IR = 2.5 \u00d7 10^-3 \u00d7 100 = 0.25 V, so d\u03a6/dt = 0.25 Wb/s = 250 mWb/s.\nBook answer: 250 mWb s^-1.",k:[["emf","d\u03a6/dt"],["ir","i r","2.5"],["0.25","250"]]},
{m:3,q:"A bicycle wheel with metal spokes of 1 m long rotates in Earth’s magnetic field. The plane of the wheel is perpendicular to the horizontal component of Earth’s field of 4 × 10⁻⁵ T. If the emf induced across the spokes is 31.4 mV, calculate the rate of revolution of the wheel.",a:"(Worked by me; the result matches the book\u2019s answer.)\nFor a rotating spoke, \u03b5 = (1/2) B \u03c9 r^2 = \u03c0 f B r^2.\nf = \u03b5 / (\u03c0 B r^2) = 31.4 \u00d7 10^-3 / (3.14 \u00d7 4 \u00d7 10^-5 \u00d7 1) = 250 revolutions per second.\nBook answer: 250 revolutions/second.",k:[["1/2","\u00bd","\u03c0 f b","\u03c0fb"],["b \u03c9 r","b\u03c9r","b r"],["250"]]},
{m:3,q:"Determine the self-inductance of 4000 turn air-core solenoid of length 2 m and diameter 0.04 m.",a:"(Worked by me; the result matches the book\u2019s answer.)\nL = \u00b50 N^2 A / l, with A = \u03c0 (0.02)^2 = 1.257 \u00d7 10^-3 m^2.\nL = (4\u03c0 \u00d7 10^-7 \u00d7 (4000)^2 \u00d7 1.257 \u00d7 10^-3) / 2 = 12.6 \u00d7 10^-3 H \u2248 12.62 mH.\nBook answer: 12.62 mH.",k:[["\u00b50 n","\u00b50n","mu0 n"],["n^2","n2","n\u00b2"],["12.6","12.62"],["mh"]]},
{m:3,q:"A coil of 200 turns carries a current of 4 A. If the magnetic flux through the coil is 6 × 10⁻⁵ Wb, find the magnetic energy stored in the medium surrounding the coil.",a:"(Worked by me; the result matches the book\u2019s answer.)\nL = N\u03a6/i = (200 \u00d7 6 \u00d7 10^-5)/4 = 3 \u00d7 10^-3 H.\nEnergy U = (1/2) L i^2 = 0.5 \u00d7 3 \u00d7 10^-3 \u00d7 16 = 0.024 J.\nBook answer: 0.024 J.",k:[["n\u03a6","l ="],["1/2","\u00bd","u ="],["0.024"],["3 \u00d7 10","3x10","3 mh"]]},
{m:3,q:"A 50 cm long solenoid has 400 turns per cm. The diameter of the solenoid is 0.04 m. Find the magnetic flux linked with each turn when it carries a current of 1 A.",a:"(Worked by me; the result matches the book\u2019s answer.)\nn = 400 turns per cm = 4 \u00d7 10^4 turns per m. B = \u00b50 n I = 4\u03c0 \u00d7 10^-7 \u00d7 4 \u00d7 10^4 \u00d7 1 = 0.0503 T.\nArea A = \u03c0 (0.02)^2 = 1.257 \u00d7 10^-3 m^2.\nFlux per turn = B A = 0.0503 \u00d7 1.257 \u00d7 10^-3 = 6.3 \u00d7 10^-5 Wb = 0.63 \u00d7 10^-4 Wb.\nBook answer: 0.63 \u00d7 10^-4 Wb.",k:[["\u00b50 n i","\u00b50ni","b = \u00b50"],["ba","b a","flux per turn"],["0.63","6.3"],["10","wb"]]},
{m:3,q:"A coil of 200 turns carries a current of 0.4 A. If the magnetic flux of 4 mWb is linked with each turn of the coil, find the inductance of the coil.",a:"(Worked by me; the result matches the book\u2019s answer.)\nL = N\u03a6/I = (200 \u00d7 4 \u00d7 10^-3)/0.4 = 2 H.\nBook answer: 2 H.",k:[["n\u03a6","n \u03a6","l ="],["200"],["2 h","2h","2 henry"]]},
{m:3,q:"Two air core solenoids have the same length of 80 cm and same cross-sectional area 5 cm². Find the mutual inductance between them if the number of turns in the first coil is 1200 turns and that in the second coil is 400 turns.",a:"(Worked by me; the result matches the book\u2019s answer.)\nM = \u00b50 N1 N2 A / l = (4\u03c0 \u00d7 10^-7 \u00d7 1200 \u00d7 400 \u00d7 5 \u00d7 10^-4) / 0.8 = 3.77 \u00d7 10^-4 H = 0.38 mH.\nBook answer: 0.38 mH.",k:[["\u00b50 n1","n1 n2","n1n2"],["a / l","a/l","area"],["0.38","0.377","3.77"],["mh"]]},
{m:5,q:"Obtain an expression for the energy stored in an inductor.",a:"Whenever a current is established in the circuit, the inductance opposes the growth of the current. To establish the current, work is done against this opposition by an external agency, and this work is stored as magnetic potential energy. Assume the resistance of the inductor is negligible.\nThe induced emf at any instant t is \u03b5 = \u2212L (di/dt). Let dW be the work done in moving a charge dq in time dt against the opposition: dW = \u2212\u03b5 dq = \u2212\u03b5 i dt (dq = i dt). Substituting for \u03b5: dW = L i di.\nTotal work done in establishing the current i:\nW = \u222b L i di (from 0 to i) = (1/2) L i^2\nThis work is stored as magnetic potential energy:\nUB = (1/2) L i^2   (4.11)\nEnergy density: the energy stored per unit volume of the space. For a solenoid of volume Al with L = \u00b50 n^2 A l and B = \u00b50 n i, uB = UB/(Al) = (1/2) L i^2/(Al) = B^2/(2\u00b50).",k:[["opposes","opposition"],["\u03b5 = \u2212l","l di","di/dt"],["dw","l i di","lidi"],["1/2","\u00bd","li2","l i^2","li^2"],["magnetic potential energy","potential energy"],["energy density","per unit volume"],["b^2/2","b2/2","b\u00b2"]]},
{m:5,q:"Mention the various energy losses in a transformer.",a:"A transformer has no moving parts, so its efficiency is much higher than that of rotating machines like generators and motors. Still, several factors lead to energy loss:\n(i) Core loss or iron loss: this takes place in the transformer core. Hysteresis loss and eddy current loss are together known as core loss. When the core is magnetised and demagnetised repeatedly by the alternating voltage across the primary coil, hysteresis takes place, which causes loss as heat. Eddy currents in the core also cause heating; they are reduced by using a laminated core.\n(ii) Copper loss: the transformer windings have electrical resistance. When a current flows through them, energy is dissipated as Joule heating. This is minimised by using wires of larger diameter.\n(iii) Flux leakage: this happens when the magnetic lines of the primary coil are not completely linked with the secondary coil. The energy loss due to flux leakage is minimised by winding the coils one over the other.",k:[["core loss","iron loss"],["hysteresis"],["eddy"],["copper loss","joule"],["larger diameter","thick"],["flux leakage"],["one over the other","over the other"]]},
{m:5,q:"Obtain an expression for average power of AC over a cycle. Discuss its special cases.",a:"For a voltage v = Vm sin\u03c9t and current i = Im sin(\u03c9t + \u03c6) in an AC circuit, where \u03c6 is the phase angle between them, the instantaneous power is\nP = vi = Vm Im sin\u03c9t sin(\u03c9t + \u03c6) = Vm Im sin\u03c9t [sin\u03c9t cos\u03c6 + cos\u03c9t sin\u03c6]\nP = Vm Im [cos\u03c6 sin\u00b2\u03c9t + sin\u03c9t cos\u03c9t sin\u03c6]   (4.54)\nThe average of sin\u00b2\u03c9t over a cycle is 1/2 and the average of sin\u03c9t cos\u03c9t is zero. Hence the average power over a cycle is\nPav = (1/2) Vm Im cos\u03c6 = V_rms I_rms cos\u03c6   (4.55)\nV_rms I_rms is called the apparent power and cos\u03c6 is the power factor. The average power is also called the true power of the circuit.\nSPECIAL CASES: (i) purely resistive circuit: the phase angle is zero and cos\u03c6 = 1, so Pav = V_rms I_rms. (ii) Purely inductive or capacitive circuit: the phase angle is \u00b1\u03c0/2 and cos(\u00b1\u03c0/2) = 0, so Pav = 0 (wattless current). (iii) Series RLC circuit: the phase angle \u03c6 = tan\u207b\u00b9[(XL \u2212 XC)/R], and Pav = V_rms I_rms cos\u03c6. (iv) Series RLC circuit at resonance: the phase angle is zero and cos\u03c6 = 1, so Pav = V_rms I_rms.",k:[["p = vi","vi","instantaneous"],["sin2","sin\u00b2","1/2","half"],["cos\u03c6","cos \u03c6","cosphi","power factor"],["apparent power"],["resistive"],["inductive","capacitive"],["resonance"],["x","tan"]]},
{m:5,q:"Find out the phase relationship between voltage and current in a pure inductive circuit.",a:"Consider a pure inductor of inductance L connected across an alternating voltage source v = Vm sin\u03c9t (4.40). Applying Kirchhoff\u2019s loop rule, with the back emf \u03b5 = \u2212L di/dt:\nv + \u03b5 = 0, so Vm sin\u03c9t = L di/dt, i.e. di = (Vm/L) sin\u03c9t dt.\nIntegrating: i = (Vm/L) \u222b sin\u03c9t dt = (Vm/L\u03c9)(\u2212cos\u03c9t) + constant. The constant is independent of time, so it is taken as zero because the voltage has only a time-dependent part.\nUsing \u2212cos\u03c9t = sin(\u03c9t \u2212 \u03c0/2):\ni = (Vm/\u03c9L) sin(\u03c9t \u2212 \u03c0/2) = Im sin(\u03c9t \u2212 \u03c0/2), where Im = Vm/(\u03c9L).\nSo in a pure inductive circuit the current lags the voltage by \u03c0/2 (90\u00b0): the voltage leads the current by \u03c0/2. The quantity XL = \u03c9L is the inductive reactance, in ohm.",k:[["kirchhoff","loop rule"],["back emf","\u2212l di","l di/dt","di/dt"],["integrat","\u222b"],["sin(\u03c9t \u2212 \u03c0/2)","\u03c0/2","90"],["lag","lags"],["xl","\u03c9l","reactance"],["im = vm","vm/\u03c9l","vm/l\u03c9"]]},
{m:5,q:"Find out the phase relationship between voltage and current in a pure capacitive circuit.",a:"Consider a capacitor of capacitance C connected across an alternating voltage v = Vm sin\u03c9t (4.43). The charge on the capacitor is q = Cv = CVm sin\u03c9t, and the current is i = dq/dt = \u03c9CVm cos\u03c9t.\nUsing cos\u03c9t = sin(\u03c9t + \u03c0/2):\ni = \u03c9CVm sin(\u03c9t + \u03c0/2) = Im sin(\u03c9t + \u03c0/2), where Im = Vm/(1/\u03c9C) = \u03c9CVm.\n(The book writes the same result as i = Im sin(\u03c9t + \u03c0/2) with Im = Vm/(C\u03c9)-based peak value, equation 4.44.)\nSo in a pure capacitive circuit the current leads the applied voltage by \u03c0/2 (90\u00b0). The quantity XC = 1/(\u03c9C) is the capacitive reactance, in ohm.",k:[["charge","q = cv","cv"],["dq/dt","cos"],["lead","leads"],["\u03c0/2","90"],["xc","1/\u03c9c","1/(\u03c9c)","reactance"],["im"]]},
{m:5,q:"Obtain an expression for the phase angle and the resultant voltage in a series RLC circuit.",a:"In a series RLC circuit the same current Im flows through R, L and C. Their voltage drops are: across R, VR = Im R, in phase with the current; across L, VL = Im XL, leading the current by \u03c0/2; across C, VC = Im XC, lagging the current by \u03c0/2. Since VL and VC are in opposite phase, the net reactive drop is (VL \u2212 VC).\nUsing the phasor diagram, the resultant voltage is the vector sum of VR and (VL \u2212 VC), which are at right angles. By the Pythagorean theorem:\nVm^2 = VR^2 + (VL \u2212 VC)^2 = (Im R)^2 + (Im XL \u2212 Im XC)^2\nso the impedance is Z = \u221a(R^2 + (XL \u2212 XC)^2), and Vm = Im Z.\nThe phase angle between the applied voltage and the current is\n\u03c6 = tan\u207b\u00b9[(XL \u2212 XC)/R].\nIf XL > XC the circuit is effectively inductive (current lags the voltage); if XC > XL it is effectively capacitive (current leads the voltage); if XL = XC it is resistive, with \u03c6 = 0 and Z = R.",k:[["phasor"],["in phase","same phase"],["lead","lag"],["vm^2","vm2","pythag","z = \u221a","z = sqrt"],["impedance","z ="],["tan\u207b\u00b9","tan-1","arctan","tan\u207b"],["xl > xc","xl = xc","resistive","inductive","capacitive"]]},
{m:5,q:"Explain the generation of LC oscillations in a circuit containing an inductor of inductance L and a capacitor of capacitance C. Prove that the total energy is conserved during LC oscillations.",a:"GENERATION: charge the capacitor C to a charge Qm, then connect it across an inductor L. The capacitor discharges through the inductor, and the current builds up in the coil. The energy first stored in the electric field of the capacitor is transferred to the magnetic field of the inductor. When the capacitor is fully discharged the magnetic energy is maximum and the current is maximum (Im). The inductor then keeps the current flowing, which recharges the capacitor in the opposite polarity. The energy returns to the capacitor, and the cycle repeats. The electrical energy and magnetic energy therefore oscillate back and forth.\nENERGY: the energy in the capacitor is UE = q\u00b2/2C and the energy in the inductor is UB = (1/2) L i\u00b2. The total energy is U = UE + UB = q\u00b2/2C + (1/2) L i\u00b2.\nCase (i): q = Qm, i = 0: U = Qm\u00b2/2C (wholly electrical).\nCase (ii): q = 0, i = Im: U = (1/2) L Im\u00b2 (wholly magnetic).\nCase (iii) at a general instant: with q = Qm cos\u03c9t and i = \u2212dq/dt = Qm\u03c9 sin\u03c9t (the minus sign shows that the charge decreases), U = (Qm\u00b2/2C) cos\u00b2\u03c9t + (1/2) L Qm\u00b2\u03c9\u00b2 sin\u00b2\u03c9t. Using \u03c9\u00b2 = 1/(LC), the second term becomes Qm\u00b2 sin\u00b2\u03c9t/(2C), so U = (Qm\u00b2/2C)(cos\u00b2\u03c9t + sin\u00b2\u03c9t) = Qm\u00b2/2C.\nThe total energy is therefore constant at every instant. The oscillations take place in accordance with the law of conservation of energy: energy is only transferred between the capacitor and the inductor, never lost (in an ideal circuit with no resistance).",k:[["discharg"],["electric field","electrical"],["magnetic field"],["maximum"],["q\u00b2/2c","q2/2c","qm2/2c","q\u00b2/2c"],["1/2 l i","\u00bd l i","(1/2) l i","li\u00b2/2","li2/2"],["\u03c9\u00b2 = 1/lc","\u03c9^2 = 1/lc","1/lc","\u03c9 2"],["cos2","cos\u00b2","sin\u00b2","sin2"],["constant","conserv"]]},
{m:2,q:"Give the expression for the frequency of LC oscillations.",a:"The charge oscillates as q = Qm cos\u03c9t, and the angular frequency of LC oscillations is \u03c9 = 1/\u221a(LC) (from energy conservation). The frequency is f = \u03c9/2\u03c0 = 1/(2\u03c0\u221a(LC)), and the period is T = 2\u03c0\u221a(LC).",k:[["1/\u221a(lc)","1/\u221alc","1/sqrt","\u03c9 = 1/\u221a","\u03c9"],["2\u03c0\u221a","2\u03c0 \u221a","2pi","t = 2"],["f = 1/2\u03c0","1/(2\u03c0","1/2\u03c0\u221a","f ="]]},
{m:5,q:"Compare LC oscillations with the mechanical oscillations of a block-spring system, qualitatively, and find the expression for the angular frequency of the LC oscillator.",a:"There are two forms of energy in both systems. In an LC circuit the energy is electrical energy of the charged capacitor, q\u00b2/2C, and magnetic energy of the inductor, (1/2) L i\u00b2 (with i = dq/dt). In a spring-mass system the energy is the potential energy of the spring, (1/2) k x\u00b2, and the kinetic energy of the mass, (1/2) m v\u00b2. The total energy of each system stays constant.\nThe correspondences (Table 4.3) follow from comparing the energies term by term:\n\u2022 charge q \u2194 displacement x\n\u2022 current i = dq/dt \u2194 velocity v = dx/dt\n\u2022 inductance L \u2194 mass m (inertia)\n\u2022 reciprocal of capacitance 1/C \u2194 spring constant k (stiffness)\nFREQUENCY: for the spring-mass system the angular frequency is \u03c9 = \u221a(k/m). Using the correspondences, \u03c9 = \u221a[(1/C)/L] = 1/\u221a(LC). This is the angular frequency of the LC oscillator.",k:[["electrical","electric"],["magnetic"],["potential energy","spring"],["kinetic","mass"],["displacement","x"],["velocity","v"],["inductance","mass","inertia"],["spring constant","stiffness","k"],["\u221a(k/m)","k/m","sqrt"],["1/\u221a(lc)","1/\u221alc","\u03c9 = 1/"],["constant","total energy"]]},
{m:5,q:"Establish the fact that the relative motion between the coil and the magnet induces an emf in the coil of a closed circuit (Faraday\u2019s first experiment).",a:"Consider a closed circuit consisting of a coil C of insulated wire and a galvanometer G.\n(i) With no motion: when the magnet is kept stationary, the galvanometer shows no deflection, because there is no change in the magnetic flux linked with the coil and so no current.\n(ii) Magnet moved towards the coil: when a bar magnet is pushed into the stationary coil (north pole facing the coil), the galvanometer shows a momentary deflection. This shows that an electric current is set up in the coil, which means an emf is induced in it. The flux linked with the coil changes while the magnet moves.\n(iii) Magnet moved away: when the magnet is pulled out, the galvanometer deflects in the opposite direction, showing that the induced current has reversed.\n(iv) Magnet held stationary inside the coil: the deflection stops, so again no current flows.\nConclusion: an emf is induced in the closed circuit only when there is relative motion between the coil and the magnet, i.e. only while the magnetic flux linked with the coil is changing. The same effect is produced if the coil moves and the magnet is held still. The induced emf depends on the relative motion, not on which of the two is moving.\nThe same current is also produced if the magnet is kept stationary and the coil is moved, showing that it is the relative motion that matters.",k:[["relative motion","relative"],["galvanometer"],["deflection"],["opposite"],["stationary","no motion","no deflection"],["flux"],["emf"]]},
{m:5,q:"Define self-inductance in terms of (i) magnetic flux and (ii) induced emf.",a:"(i) In terms of magnetic flux: the self-inductance L of a coil is the flux linkage with the coil per unit current. If N turns of the coil have a flux \u03a6B each, the total flux linkage is N\u03a6B, and it is proportional to the current: N\u03a6B = Li. So L = N\u03a6B / i. If i = 1 A, then L = N\u03a6B, i.e. the self-inductance is equal to the flux linkage when 1 A flows through the coil.\n(ii) In terms of induced emf: when the current in the coil changes, the induced self emf is \u03b5 = \u2212d(N\u03a6B)/dt = \u2212L di/dt. So L = \u2212\u03b5/(di/dt). The self-inductance of a coil is therefore the magnitude of the induced self emf per unit rate of change of current. If di/dt = 1 A/s and \u03b5 = 1 V, then L = 1 H.\nThe negative sign shows that the self-induced emf opposes the change in current (Lenz\u2019s law).",k:[["flux linkage","n\u03c6","n\u03a6","nflux","n \u03c6"],["per unit current","current"],["l = n\u03c6","l = n\u03a6","l = \u2212\u03b5","l = \u2212e","\u2212\u03b5/"],["1 a","1a","1 h","1h","henry"],["di/dt","di dt","rate"],["oppos"]]},
{m:5,q:"Show that the mutual inductance between a pair of coils is the same whether it is defined by coil 1 or coil 2 (M12 = M21).",a:"Take two long co-axial solenoids, solenoid 1 (N1 turns, turn density n1, area A1) and solenoid 2 (N2 turns, turn density n2, area A2), with A1 > A2, both of length l.\nMutual inductance M21 (solenoid 2 with respect to solenoid 1): current i1 in solenoid 1 gives B1 = \u00b50 n1 i1 inside it. Only the area A2 of solenoid 2 lies in this uniform field (the field outside solenoid 1 is almost zero), so the flux per turn of solenoid 2 is \u03a621 = B1 A2 = \u00b50 n1 i1 A2. With N2 = n2 l, the total flux linkage is N2\u03a621 = \u00b50 n1 n2 A2 l i1. Comparing with N2\u03a621 = M21 i1 gives\nM21 = \u00b50 n1 n2 A2 l   (4.13)\nMutual inductance M12 (solenoid 1 with respect to solenoid 2): current i2 in solenoid 2 gives B2 = \u00b50 n2 i2 inside solenoid 2, which is zero outside. For solenoid 1 the field is present only over the area A2, so the flux per turn of solenoid 1 is \u03a612 = \u00b50 n2 i2 A2. The total flux linkage is N1\u03a612 = \u00b50 n1 n2 A2 l i2. Comparing with N1\u03a612 = M12 i2 gives\nM12 = \u00b50 n1 n2 A2 l\nTherefore M12 = M21 = M = \u00b50 n1 n2 A2 l. The mutual inductance of a pair of coils is the same whichever coil is taken as the source. In general it depends on the size, shape, number of turns, relative orientation and permeability of the medium.",k:[["co-axial","coaxial"],["a2"],["flux per turn","\u03a621","\u03a612","flux"],["n1 n2","n1n2"],["l"],["m21 = m12","m12 = m21","same","m = "],["\u00b50","\u00b5 0","\u00b5 n","mu"]]},
{m:5,q:"Describe the construction and working of a three-phase AC generator, and state its advantages.",a:"CONSTRUCTION: in the simplified three-phase generator the armature core has 6 slots cut on its inner rim, each 60\u00b0 from the next. Six armature conductors are placed in these slots. Conductors 1 and 4 are joined in series to form coil 1; conductors 3 and 6 form coil 2; conductors 5 and 2 form coil 3. The three rectangular coils are 120\u00b0 apart. The field magnet rotates inside them.\nWORKING: the field magnet starts horizontal, perpendicular to the plane of coil 1. When it rotates clockwise, the alternating emf \u03b51 in coil 1 begins its cycle. Coil 2 begins its cycle after the field magnet has rotated through 120\u00b0, and coil 3 after 240\u00b0. So the three emfs \u03b51, \u03b52 and \u03b53 are alternating and have a phase difference of 120\u00b0 between one another.\nADVANTAGES: (1) for a given dimension, a three-phase machine gives a higher power output than a single-phase machine; (2) for the same capacity, a three-phase alternator is smaller in size; (3) a three-phase transmission system is cheaper, because a thinner wire is sufficient for transmitting three-phase power.",k:[["6 slots","six slots","slots"],["120"],["240"],["phase difference"],["coil 1","coil 1","three coils","coils"],["power output","higher power"],["smaller","size"],["cheaper","thinner","wire"]]},
{m:2,q:"Give the units of inductive reactance and capacitive reactance, and explain how they depend on frequency.",a:"Both reactances are measured in ohm (\u03a9). Inductive reactance XL = \u03c9L = 2\u03c0fL (4.42) varies directly with frequency f: a higher frequency gives a larger XL. Capacitive reactance XC = 1/(\u03c9C) = 1/(2\u03c0fC) (4.45) varies inversely with frequency: a higher frequency gives a smaller XC.",k:[["ohm","\u03c9"],["2\u03c0fl","\u03c9l","\u03c9 l","2\u03c0 f l"],["1/\u03c9c","1/(\u03c9c)","1/2\u03c0fc","2\u03c0fc"],["directly","direct","increase"],["inversely","inverse","decrease"],["frequency"]]},
{m:5,q:"Explain why an inductor blocks AC but allows DC.",a:"An inductor is a closely wound helical coil. For steady DC, the current is constant, so the magnetic field and the flux linked with the coil are constant. There is no change of flux, so no self-induced (back) emf is produced. The inductor therefore behaves like a plain conductor and DC flows through it. The inductive reactance XL = \u03c9L = 2\u03c0fL is zero when f = 0 (for a steady current), so an ideal inductor offers no resistance to DC.\nFor AC, the current changes in magnitude and direction, so the magnetic field is time-varying. This induces a self-induced (back) emf which, by Lenz\u2019s law, opposes any change of the current. Since AC is always changing, its flow is continually opposed. For an ideal inductor of zero ohmic resistance, the back emf is equal and opposite to the applied emf, so the inductor blocks AC. The higher the frequency, the larger the reactance and the stronger the blocking.",k:[["steady","constant"],["flux","magnetic field"],["back emf","self-induced","self induced"],["lenz"],["time-varying","changing","change"],["equal and opposite","opposite"],["frequency","xl","2\u03c0fl"],["zero resistance","no resistance","resistance"]]},
{m:2,q:"Explain the physical significance of inductance.",a:"Inductance plays the same role in an electric circuit as mass plays in linear motion and as moment of inertia plays in rotational motion. Inertia means opposition to a change in the state of motion. When a circuit is switched on, the increasing current induces an emf that opposes the growth of the current. When the circuit is broken, the decreasing current induces an emf in the reverse direction that opposes the decay of the current. So inductance opposes any change in current and tries to maintain the original state.",k:[["mass","inertia"],["opposes","opposition"],["change"],["switched on","growth","increasing"],["decay","decreasing","broken"],["original state"]]},
{m:3,q:"A solenoid has 400 turns per cm and carries a current of 2 A. A 100 turn coil of cross-sectional area 4 cm\u00b2 is placed co-axially inside the solenoid so that the coil is in the field produced by the solenoid. Find the emf induced in the coil if the current through the solenoid reverses its direction in 0.04 s.",a:"(Worked by me; the result matches the book\u2019s answer of 0.20 V.)\nField of the solenoid: B = \u00b50 n I = 4\u03c0 \u00d7 10\u207b\u2077 \u00d7 4 \u00d7 10\u2074 \u00d7 2 = 0.1005 T.\nWhen the current reverses, the field reverses, so the flux through each turn changes from +BA to \u2212BA: change 2BA. For 100 turns: change in flux linkage = 100 \u00d7 2 \u00d7 0.1005 \u00d7 4 \u00d7 10\u207b\u2074 = 8.04 \u00d7 10\u207b\u00b3 Wb.\nEmf = (8.04 \u00d7 10\u207b\u00b3)/0.04 = 0.20 V.",k:[["0.1005","0.1"],["\u00b50 n i","\u00b50ni","b = \u00b50"],["2ba","2 b a","2 \u00d7"],["reverses","reverse"],["0.2"],["8.04","8 \u00d7 10"]]},
{m:3,q:"A 200 turn circular coil of radius 2 cm is placed co-axially within a long solenoid of 3 cm radius. If the turn density of the solenoid is 90 turns per cm, calculate the mutual inductance of the coil and the solenoid.",a:"(Worked by me; the result matches the book\u2019s answer of 2.84 mH.)\nThe field of the solenoid is B = \u00b50 n1 i1 with n1 = 90 turns per cm = 9000 turns per m. The flux through the coil is the field times the coil area: \u03a621 = \u00b50 n1 i1 \u03c0r\u00b2, where r = 2 cm, so the coil area is \u03c0(0.02)\u00b2 = 1.257 \u00d7 10\u207b\u00b3 m\u00b2.\nTotal flux linkage with the 200-turn coil: N2\u03a621 = 200 \u00d7 \u00b50 \u00d7 9000 \u00d7 1.257 \u00d7 10\u207b\u00b3 \u00d7 i1.\nM = N2\u03a621 / i1 = 200 \u00d7 4\u03c0 \u00d7 10\u207b\u2077 \u00d7 9000 \u00d7 1.257 \u00d7 10\u207b\u00b3 = 2.84 \u00d7 10\u207b\u00b3 H = 2.84 mH.",k:[["9000","9 \u00d7 10","90 turns"],["1.257","\u03c0r","\u03c0 r","\u03c0(0.02)"],["n2","200"],["2.84","2.8"],["mh","m h"],["\u00b50 n","\u00b50n","mu0"]]},
{m:3,q:"The solenoids S1 and S2 are wound on an iron core of relative permeability 900. Their areas of cross-section and their lengths are the same and are 4 cm\u00b2 and 0.04 m respectively. If the number of turns in S1 is 200 and that in S2 is 800, calculate the mutual inductance between the solenoids. If the current in solenoid 1 is increased from 2 A to 8 A in 0.04 second, calculate the induced emf in solenoid 2.",a:"(Worked by me; the results match the book\u2019s answers of 1.81 H and \u2212271.5 V.)\nM = \u00b50 \u00b5r N1 N2 A / l = (4\u03c0 \u00d7 10\u207b\u2077)(900)(200)(800)(4 \u00d7 10\u207b\u2074)/0.04 = 1.81 H.\nCurrent change: di = 8 \u2212 2 = 6 A in dt = 0.04 s, so di/dt = 150 A/s.\nInduced emf in solenoid 2: \u03b52 = \u2212M di/dt = \u2212(1.81)(150) = \u2212271.5 V (the minus sign is Lenz\u2019s law).",k:[["1.81"],["\u00b50 \u00b5r","\u00b50\u00b5r","\u03bc0 \u03bcr","mu0","\u00b50 n"],["n1 n2","n1n2","200 \u00d7 800"],["150"],["\u2212m di","\u2212 m","\u2212271","271.5","-271"],["lenz","opposes"]]},
{m:3,q:"A step-down transformer connected to main supply of 220 V is used to operate 11 V, 88 W lamp. Calculate (i) the voltage transformation ratio and (ii) the current in the primary.",a:"(Worked by me; the results match the book\u2019s answers of 1/20 and 0.4 A.)\n(i) Voltage transformation ratio = Vs/Vp = 11/220 = 1/20.\n(ii) Assuming an ideal transformer, the input power equals the output power: Vp Ip = 88 W, so Ip = 88/220 = 0.4 A.",k:[["1/20","1 / 20","0.05"],["vs/vp","vs / vp","11/220"],["0.4"],["ideal","input","power"]]},
{m:3,q:"A 200 V/120 V step-down transformer of 90% efficiency is connected to an induction stove of resistance 40 \u03a9. Find the current drawn by the primary of the transformer.",a:"(Worked by me; the result matches the book\u2019s answer of 2 A.)\nSecondary current Is = 120 V / 40 \u03a9 = 3 A, and the output power is 120 \u00d7 3 = 360 W.\nInput power = output / efficiency = 360 / 0.9 = 400 W.\nPrimary current Ip = 400 W / 200 V = 2 A.",k:[["3 a","3a"],["360"],["400"],["2 a","2a"],["efficiency","90"]]},
{m:3,q:"An alternating current has a peak value of 20 A. Calculate the instantaneous value at 60\u00b0, the average value and the RMS value of the alternating current.",a:"(Worked by me; the results match the book\u2019s answers of 17.32 A, 12.74 A and 14.14 A.)\nInstantaneous value: i = Im sin60\u00b0 = 20 \u00d7 0.866 = 17.32 A.\nAverage value (over a half cycle): Iav = 2Im/\u03c0 = 40/3.14 = 12.74 A.\nRMS value: Irms = Im/\u221a2 = 20/1.414 = 14.14 A.",k:[["17.32"],["12.74","12.7"],["14.14","14.1"],["2im/\u03c0","2 im","2i"],["im/\u221a2","im/\u221a","i/\u221a"]]},
{m:3,q:"(Conceptual) Using Lenz\u2019s law, predict the direction of induced current in conducting rings 1 and 2 when the current in the wire is steadily decreasing. [Figure described in words: a long horizontal straight wire carrying current to the left; ring 1 is above the wire and ring 2 is below it.]",a:"(Worked by me from Lenz\u2019s law and the right-hand rule. Check against the book\u2019s answer.)\nWith current to the left, the field of the wire at a point above it points into the page, and at a point below it points out of the page.\nAs the current decreases, the flux into the page through ring 1 decreases. The induced current must produce a field into the page inside ring 1 to oppose this decrease, so the induced current in ring 1 is clockwise.\nThe flux out of the page through ring 2 decreases. The induced current must produce a field out of the page inside ring 2, so the induced current in ring 2 is anticlockwise.",k:[["clockwise"],["anticlockwise","counterclockwise","counter-clockwise","anti-clockwise"],["into the page","into page"],["out of the page","out of page"],["oppos"],["decreas"]]},
{m:3,q:"(Conceptual) A flexible metallic loop abcd in the shape of a square is kept in a magnetic field with its plane perpendicular to the field. The field is directed into the paper normally. Find the direction of the induced current when the square loop is crushed into an irregular shape. [Figure described in words: the loop with corners a (top left), b (top right), c (bottom right) and d (bottom left) is being pushed into an irregular shape; the field is into the page.]",a:"(Worked by me from Lenz\u2019s law. Check against the book\u2019s answer.)\nThe field is into the page, and the loop\u2019s area is shrinking, so the flux into the page through the loop is decreasing.\nThe induced current must produce a field into the page inside the loop to oppose this decrease. A field into the page requires a clockwise current.\nSo the induced current flows clockwise, in the order a \u2192 b \u2192 c \u2192 d.",k:[["clockwise"],["a \u2192 b","a->b","abcd","a to b"],["decreas","shrink","area"],["into the page","into page"],["oppos"]]},
{m:5,q:"Explain the construction and working of a single-phase AC generator with the necessary diagram.",a:"CONSTRUCTION: in a single-phase AC generator the armature conductors are connected in series so that they form a single circuit, which generates a single-phase alternating emf; hence it is called a single-phase alternator. In the simplified version, a single-turn rectangular loop PQRS is mounted on the stator, so it is stationary. The field magnet (field winding) is inside the stator and can be rotated about an axis perpendicular to the plane of the paper. When the field winding is excited, a magnetic field is produced around it. Slip rings and brushes connect the loop to the external circuit.\nWORKING: let the field magnet be rotated clockwise by an external means. In the initial position the field is horizontal, and the flux through the loop is changing as the magnet turns. As the field magnet rotates, the flux linked with the loop PQRS changes, so an emf is induced in the loop by electromagnetic induction. The induced emf is alternating: it reaches its maximum when the field is parallel to the plane of the loop and falls to zero when the field is perpendicular to it, and it reverses direction every half turn. One full rotation of the field magnet gives one cycle of the alternating emf. This is the single-phase alternating emf of the generator.",k:[["series","single circuit"],["single-phase","single phase"],["stator","stationary"],["field magnet","field winding","rotat"],["electromagnetic induction","induction"],["maximum"],["zero"],["reverse","alternat"],["one cycle","one rotation","full rotation"],["slip ring","brush"]]},
{m:3,q:"(Conceptual) A graph between the magnitude of the magnetic flux linked with a closed loop and time is given in the figure. Arrange the regions of the graph (a, b, c, d) in ascending order of the magnitude of induced emf in the loop. [Figure described in words: magnetic flux against time; flux rises steeply from zero in region a, stays constant in region b, falls steeply in region c, and falls more gently in region d to zero.]",a:"(Worked by me from Faraday\u2019s law, \u03b5 = |d\u03a6/dt|, which is the magnitude of the slope of the flux\u2013time graph. Check against the book\u2019s answer.)\nRegion b: the flux is constant, so the slope and the emf are zero.\nRegion d: the flux falls gently, so the slope is small.\nRegion c: the flux falls more steeply than in d, so the emf is larger than in d.\nRegion a: the flux rises steeply, giving the largest slope.\nAscending order of induced emf: b < d < c < a.",k:[["b"],["d"],["c"],["a"],["zero","constant"],["slope","d\u03a6/dt","faraday"],["gent","small"],["steep","largest"]]},
{m:2,q:"What is meant by eddy currents? Give one use.",a:"When the magnetic flux linked with a sheet or plate changes, an emf is induced, but there is no definite loop for the current to follow. The induced currents therefore flow in closed concentric circular paths inside the conductor. Because they look like eddies of water, they are called eddy currents, also known as Foucault currents. Eddy currents produce heating and a damping force that opposes the motion (electromagnetic damping). This is used, for example, to bring the moving parts of a balance or a pendulum to rest quickly. Eddy currents are unwanted in transformer and motor cores, where laminated cores are used to reduce them.",k:[["concentric","circular"],["no definite","no loop","no path"],["foucault"],["oppose","damping"],["laminat","reduce"]]},
{m:2,q:"Define the unit of inductance (henry).",a:"The inductance of a coil is one henry if a current changing at the rate of 1 A per second induces an opposing emf of 1 volt in it. Equivalently, 1 H = 1 Wb A\u207b\u00b9 = 1 V s A\u207b\u00b9. Self-inductance is also defined as the flux linkage with the coil when 1 A flows through it.",k:[["1 a s","1a/s","1 a per second","rate"],["1 v","1v","opposing emf"],["wb a","wb/a","v s a","vs/a"],["flux linkage"]]},
{m:2,q:"Define the average (mean) value of an alternating current.",a:"The average value of an alternating current is measured over one half of a cycle, because over a full cycle it is zero (the positive and negative halves cancel). For a sinusoidal current i = Im sin\u03c9t, the average over a half cycle is Iav = 2Im/\u03c0 = 0.637 Im (equation 4.32).",k:[["half cycle","half-cycle"],["zero"],["2im/\u03c0","2i","0.637","2 im"],["average","mean"]]},
{m:2,q:"Define the RMS value of an alternating current.",a:"The RMS (root mean square) value of an alternating current is the value of the steady direct current that would produce the same heat in the same resistance in the same time. For a sinusoidal current it is I_rms = Im/\u221a2 = 0.707 Im. The RMS value is used in AC calculations and is the value shown by AC meters.",k:[["same heat","heat"],["direct current","dc"],["im/\u221a2","im / \u221a2","0.707","\u221a2"],["root mean square","rms"]]},
{m:2,q:"State Faraday\u2019s laws of electromagnetic induction.",a:"First law: whenever the magnetic flux linked with a coil or circuit changes, an emf (and hence a current) is induced in it. The emf lasts only as long as the flux is changing. Second law: the magnitude of the induced emf is equal to the rate of change of the magnetic flux linked with the circuit, \u03b5 = \u2212d\u03a6B/dt. The negative sign is Lenz\u2019s law: the induced emf opposes the change.",k:[["flux","magnetic flux"],["changes","change"],["rate of change","rate"],["dφ/dt","d\u03a6/dt","dphi/dt","\u2212d","-d"],["lenz","oppose"]]},
{m:2,q:"What is meant by wattless current?",a:"The current in an AC circuit is wattless when the power consumed by it is zero. This is the component of the current that is 90\u00b0 out of phase with the voltage. It occurs in a purely inductive or purely capacitive circuit, and it is also called the reactive component.",k:[["power","zero"],["90","\u03c0/2","out of phase"],["reactive"],["inductive","capacitive"]]}
]},
5:{exp:[
"Displacement current: a time-varying electric field (or electric flux) behaves like a current. Maxwell called this the displacement current, id = \u03b50 dΦE/dt. It exists wherever the electric field changes with time, for example between the plates of a capacitor while it is being charged.",
"Maxwell\u2019s correction to Ampere\u2019s circuital law: the magnetic field around a closed loop is produced by both the conduction current and the displacement current, so \u222e B\u00b7dl = \u00b50 (ic + id) = \u00b50 ic + \u00b50\u03b50 dΦE/dt. The time-varying electric field produces a magnetic field, just as the time-varying magnetic field produces an electric field (Faraday\u2019s law). This symmetry is the basis of electromagnetic waves.",
"Maxwell\u2019s equations in integral form: Gauss\u2019s law for electricity (the electric flux through a closed surface is Qenclosed/\u03b50), Gauss\u2019s law for magnetism (the magnetic flux through a closed surface is zero), Faraday\u2019s law, and the modified Ampere\u2013Maxwell law. Together they describe electricity and magnetism and predict electromagnetic waves.",
"Electromagnetic waves: they are non-mechanical, transverse waves that do not need a medium and travel at the speed of light in vacuum, c = 3 \u00d7 10\u2078 m s\u207b\u00b9. The electric and magnetic fields are perpendicular to each other and to the direction of propagation. Hertz produced and detected them in 1888, confirming Maxwell\u2019s prediction."],
