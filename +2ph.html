<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><meta name="mobile-web-app-capable" content="yes">
<title>Class 12 Physics - Smart Learning &amp; Practice System</title>
<style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-dark: #1e3a8a;
      --accent: #0ea5e9;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --sidebar-w: 320px;
      --header-h: 68px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.06);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.08);
      --code-bg: #1e293b;
      --code-text: #f1f5f9;
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e293b;
      --primary-dark: #93c5fd;
      --bg: #090d16;
      --surface: #111827;
      --border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --text-light: #6b7280;
      --code-bg: #030712;
      --code-text: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header.app-header {
      height: var(--header-h);
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 40;
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      display: none;
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px;
      cursor: pointer;
      color: var(--text-main);
    }

    .app-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.15rem;
      box-shadow: var(--shadow-sm);
    }

    .brand-info h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-container {
      position: relative;
      width: 250px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background-color: var(--bg);
      color: var(--text-main);
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background-color: var(--bg);
    }

    .btn-icon {
      padding: 8px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .read-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .read-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    .speaking-active {
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.4) !important;
      border-color: var(--primary) !important;
    }

    /* Main Layout */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - var(--header-h));
      overflow: hidden;
      position: relative;
    }

    /* Sidebar Navigation */
    aside.sidebar {
      width: var(--sidebar-w);
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      z-index: 30;
      transition: transform 0.3s ease;
    }

    .sidebar-unit-header {
      padding: 12px 18px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      background: var(--primary-light);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .sidebar-unit-header:first-child {
      border-top: none;
    }

    .sidebar-item {
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s ease;
      text-decoration: none;
      color: var(--text-main);
    }

    .sidebar-item:hover {
      background-color: var(--bg);
    }

    .sidebar-item.active {
      background-color: var(--primary-light);
      border-left-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .sidebar-item-content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-item-num {
      font-size: 0.7rem;
      color: var(--text-light);
      font-weight: 600;
    }

    .sidebar-item.active .sidebar-item-num {
      color: var(--primary);
    }

    .sidebar-item-title {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-q-count {
      font-size: 0.7rem;
      padding: 2px 6px;
      background: var(--bg);
      border-radius: 12px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* Content Area */
    main.content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px 90px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Chapter Header Banner */
    .chapter-hero {
      background: linear-gradient(135deg, var(--surface), var(--primary-light));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .chapter-unit-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .chapter-title-main {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .chapter-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 900px;
      line-height: 1.5;
    }

    .chapter-stats-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .stat-chip strong {
      color: var(--text-main);
    }

    /* Tab Navigation */
    .tabs-nav {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 2px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 20;
      padding-top: 4px;
    }

    .tab-btn {
      padding: 10px 18px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      margin-bottom: -2px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .tab-btn * {
      pointer-events: none;
    }

    .tab-btn:hover {
      color: var(--primary);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--surface);
      border-top-left-radius: var(--radius-sm);
      border-top-right-radius: var(--radius-sm);
    }

    .tab-badge {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--border);
      color: var(--text-main);
    }

    .tab-btn.active .tab-badge {
      background: var(--primary);
      color: #fff;
    }

    /* Tab Panes */
    .tab-pane {
      display: none !important;
      animation: fadeIn 0.2s ease;
    }

    .tab-pane.active {
      display: block !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards & Containers */
    .content-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
    }

    .concept-item, .def-item {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background-color: var(--bg);
      border-left: 3px solid var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .def-term {
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .def-meaning {
      font-size: 0.9rem;
      color: var(--text-main);
    }

    /* Code Blocks */
    pre.code-block {
      background-color: var(--code-bg);
      color: var(--code-text);
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      margin: 10px 0;
      position: relative;
    }

    .code-container {
      position: relative;
      margin-bottom: 16px;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 8px 14px;
      border-top-left-radius: var(--radius-sm);
      border-top-right-radius: var(--radius-sm);
      color: #94a3b8;
      font-size: 0.8rem;
      font-family: monospace;
    }

    .code-header pre {
      margin: 0;
    }

    .copy-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #f1f5f9;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .copy-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Quiz Area */
    .quiz-control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }

    .score-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .stat-correct { color: var(--success); }
    .stat-wrong { color: var(--danger); }
    .stat-pct { color: var(--primary); }

    .mcq-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .mcq-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .mcq-num {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-light);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 4px;
      height: fit-content;
    }

    .mcq-question {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      flex: 1;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin: 14px 0 10px;
    }

    @media (min-width: 768px) {
      .options-grid.two-col {
        grid-template-columns: 1fr 1fr;
      }
    }

    .opt-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-main);
      font-size: 0.9rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .opt-btn .opt-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .opt-btn.correct {
      background-color: var(--success-light) !important;
      border-color: var(--success) !important;
      color: #065f46 !important;
      font-weight: 600;
    }

    .opt-btn.correct .opt-badge {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    .opt-btn.incorrect {
      background-color: var(--danger-light) !important;
      border-color: var(--danger) !important;
      color: #991b1b !important;
      font-weight: 600;
    }

    .opt-btn.incorrect .opt-badge {
      background: var(--danger);
      color: #ffffff;
      border-color: var(--danger);
    }

    .mcq-feedback {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .mcq-feedback.show {
      display: block;
    }

    .feedback-correct {
      background: var(--success-light);
      border: 1px solid var(--success);
      color: #065f46;
    }

    .feedback-incorrect {
      background: var(--danger-light);
      border: 1px solid var(--danger);
      color: #991b1b;
    }

    .explanation-box {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px dashed rgba(0,0,0,0.1);
      padding-top: 6px;
    }

    /* Question Bank */
    .filter-pills {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .pill-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .pill-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .qa-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      background: var(--surface);
      transition: background 0.15s;
    }

    .qa-header:hover {
      background: var(--bg);
    }

    .mark-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .tag-2m { background: #e0f2fe; color: #0284c7; }
    .tag-3m { background: #fef3c7; color: #d97706; }
    .tag-5m { background: #fee2e2; color: #dc2626; }
    .tag-prac { background: #ede9fe; color: #7c3aed; }

    .qa-title {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
    }

    .toggle-icon {
      font-size: 1.1rem;
      color: var(--text-light);
      transition: transform 0.2s;
    }

    .qa-card.open .toggle-icon {
      transform: rotate(180deg);
    }

    .qa-body {
      display: none;
      padding: 16px 20px 20px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .qa-card.open .qa-body {
      display: block;
    }

    /* Fixed Bottom Audio Bar */
    .audio-player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--surface);
      border-top: 2px solid var(--primary);
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.12);
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 80;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .audio-info {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .soundwave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 22px;
    }

    .soundwave span {
      display: inline-block;
      width: 3px;
      background: var(--primary);
      border-radius: 2px;
      animation: soundwave-pulse 1s infinite ease-in-out;
    }

    .soundwave.paused span {
      animation-play-state: paused;
    }

    .soundwave span:nth-child(1) { height: 8px; animation-delay: 0.1s; }
    .soundwave span:nth-child(2) { height: 16px; animation-delay: 0.3s; }
    .soundwave span:nth-child(3) { height: 22px; animation-delay: 0.15s; }
    .soundwave span:nth-child(4) { height: 12px; animation-delay: 0.4s; }

    @keyframes soundwave-pulse {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }

    .audio-text-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .audio-status-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .audio-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 350px;
    }

    .audio-controls {
      display: flex;

{m:2,q:"What is meant by quantisation of charges?",a:"The charge q on any object is equal to an integral multiple of the fundamental unit of charge e:\nq = ne, where n = 0, \u00b11, \u00b12, \u00b13, ...\nThis is called quantisation of electric charge. (e = 1.6 \u00d7 10^-19 C; electron charge = \u2212e, proton charge = +e.)",k:[["integral multiple","integer","whole number"],["fundamental unit","e"],["q = ne","q=ne","ne"],["quantisation"]]},
{m:2,q:"What is an equipotential surface?",a:"An equipotential surface is a surface on which all the points are at the same electric potential. For a point charge the equipotential surfaces are concentric spherical surfaces.",k:[["surface"],["all the points","all points","every point"],["same"],["potential"]]},
{m:2,q:"Define \u2018electric flux\u2019.",a:"The number of electric field lines crossing a given area kept normal to the electric field lines is called electric flux. It is denoted by \u03a6E, its unit is N m^2 C^-1, and it is a scalar quantity (positive or negative).",k:[["number of"],["field lines"],["area"],["normal","perpendicular"],["scalar"],["n m2","n m^2","nm2"]]},
{m:2,q:"What is polarisation?",a:"In the presence of an external electric field, a dipole moment is induced in the dielectric material. Polarisation P is defined as the total dipole moment per unit volume of the dielectric. For most (linear isotropic) dielectrics, P is directly proportional to the strength of the external electric field.",k:[["dipole moment"],["per unit volume","unit volume"],["dielectric"],["proportional"],["external"]]},
{m:2,q:"What is dielectric strength?",a:"The maximum electric field a dielectric can withstand before it breaks down is called dielectric strength. Beyond this the bound charges become free and the dielectric starts to conduct. For air it is 3 \u00d7 10^6 V m^-1.",k:[["maximum"],["electric field"],["breaks down","breakdown","break down"],["dielectric"],["3 x 10","3\u00d710","3 \u00d7 10"]]},
{m:2,q:"What is corona discharge?",a:"The end of a conductor with a smaller radius of curvature collects a large charge density. The electric field near this sharp edge is very high and ionises the surrounding air. The positive ions are repelled at the sharp edge and negative ions are attracted towards it, which reduces the total charge near the sharp edge. This is called action of points or corona discharge.",k:[["sharp","smaller radius","curvature"],["charge density","large charge","charge accumulation"],["ionise","ionize","ionis"],["air"],["action of points"]]},
{m:3,q:"When two objects are rubbed with each other, approximately a charge of 50 nC can be produced in each object. Calculate the number of electrons that must be transferred to produce this charge.",a:"By quantisation of charge, q = ne, so n = q/e.\nq = 50 nC = 50 \u00d7 10^-9 C, e = 1.6 \u00d7 10^-19 C\nn = (50 \u00d7 10^-9) / (1.6 \u00d7 10^-19) = 31.25 \u00d7 10^10 electrons\n(Book answer: 31.25 \u00d7 10^10 electrons.)",k:[["q = ne","q=ne","n = q/e","n=q/e"],["1.6"],["31.25"],["10^10","10\u00b9\u2070","1010"]]},
{m:5,q:"Discuss the various properties of conductors in electrostatic equilibrium.",a:"In a conductor the mobile charges (free electrons in a metal) are free to move. With no external field they move randomly with no net motion, so there is no net current: the conductor is in electrostatic equilibrium. Its properties:\n(i) The electric field is zero everywhere inside the conductor (solid or hollow). If it were not zero, the mobile charges would feel a force and move, contradicting equilibrium. When an external field is applied, the free electrons shift until the internal field they create nullifies the external one (in about 10^-16 s).\n(ii) There is no net charge inside; charges reside only on the surface. Proof by Gauss law: E = 0 inside, so the flux over a Gaussian surface just inside the surface is zero, hence no net charge inside.\n(iii) The electric field just outside is perpendicular to the surface with magnitude \u03c3/\u03b50, i.e. E = (\u03c3/\u03b50) n, where \u03c3 is the surface charge density. A parallel component would make surface electrons move.\n(iv) The electrostatic potential has the same value on the surface and inside: the conductor is an equipotential.",k:[["zero inside","zero everywhere","e = 0","e=0"],["no net charge","surface"],["gauss"],["perpendicular","normal"],["\u03c3/\u03b5","sigma/e","\u03c3/e0"],["equipotential","same potential","same value"],["free electron","mobile charge"]]},
{m:5,q:"Explain the process of electrostatic induction.",a:"Charging a conductor without actual contact is called electrostatic induction.\n(i) A neutral conducting sphere rests on an insulating stand. A negatively charged rod is brought near it without touching. The rod repels electrons to the far side, so positive charges are induced near the rod and negative charges on the farther side; the total charge is still zero.\n(ii) The sphere is connected to the ground by a conducting wire (grounding). The ground removes electrons from the sphere; positive charges do not flow away because they are attracted by the negative rod.\n(iii) The grounding wire is removed; the positive charges remain near the rod.\n(iv) The rod is taken away; the positive charge spreads uniformly over the surface of the sphere. The neutral sphere has become positively charged. For an arbitrarily shaped conductor the steps are the same, but the final distribution of positive charge is not uniform.",k:[["without contact","without touching","no contact"],["negatively charged rod","charged rod"],["repel"],["ground","earth"],["wire removed","remove","removed"],["positively charged","positive charge"],["uniform"]]},
{m:2,q:"What are the differences between Coulomb force and gravitational force?",a:"1. The gravitational force between two masses is always attractive, but the Coulomb force between two charges can be attractive or repulsive, depending on the nature of the charges.\n2. The gravitational constant is G = 6.67 \u00d7 10^-11 N m^2 kg^-2, whereas the constant in Coulomb\u2019s law is k = 9 \u00d7 10^9 N m^2 C^-2.\n3. The electrostatic force is enormously greater than the gravitational force (between a proton and an electron it is about 10^39 times larger), so gravity is negligible in the atomic domain.",k:[["attractive"],["repulsive"],["two masses","masses","mass"],["charges","charge"],["6.67"],["9 \u00d7 10","9x10","9 x 10"],["greater","larger","stronger"]]},
{m:2,q:"Write a short note on superposition principle.",a:"Coulomb\u2019s law explains the interaction between two point charges. When there are more than two charges, the superposition principle explains the interaction between multiple charges. According to this principle, the total force acting on a given charge is equal to the vector sum of the forces exerted on it by all the other charges.",k:[["more than two","multiple charges","many charges"],["total force"],["vector sum"],["all the other","all other"],["given charge"]]},
{m:2,q:"Define \u2018electric field\u2019.",a:"The electric field at a point P at a distance r from a point charge q is defined as the force that would be experienced by a unit positive charge placed at that point P: E = F/q0 = (1/4\u03c0\u03b50)(q/r^2) r-hat. It is a vector quantity and its SI unit is newton per coulomb (N C^-1).",k:[["force"],["unit positive charge","unit charge"],["point"],["vector"],["n c","newton per coulomb","n/c"],["f/q","f / q"]]},
{m:2,q:"The electric field lines never intersect. Justify.",a:"If two electric field lines crossed at a point, there would be two different electric field vectors (two different directions of the field) at that same point. This is not possible, because the electric field at a point has a single, definite direction. Hence no two electric field lines intersect each other.",k:[["two"],["different"],["same point"],["field vector","direction"],["cross","intersect"]]},
{m:2,q:"Give the relation between electric field and electric potential.",a:"E = \u2212dV/dx. The electric field is the negative gradient of the electric potential. In vector form E = \u2212(\u2202V/\u2202x i + \u2202V/\u2202y j + \u2202V/\u2202z k). For a uniform electric field the equipotential surfaces are planes normal to the field E.",k:[["negative gradient","negative"],["gradient","dv/dx","dv"],["electric potential","potential"],["e = \u2212","e = -","e=-"],["normal","perpendicular"]]},
{m:2,q:"Define \u2018electrostatic potential energy\u2019.",a:"The work done in bringing a charge q2 from infinity to a point at distance r from a fixed charge q1 is stored as the electrostatic potential energy U of the system of charges: U = q2V = (1/4\u03c0\u03b50)(q1q2/r). It depends only on the distance between the two point charges.",k:[["work done","work"],["infinity"],["stored"],["u = q","u=q","q1q2","q1 q2"],["distance"]]},
{m:2,q:"What is meant by electrostatic energy density?",a:"The energy stored per unit volume of space between the plates of a capacitor is the electrostatic energy density: u = (1/2) \u03b50 E^2, where \u03b50 is the permittivity and E the electric field.",k:[["per unit volume","unit volume"],["energy"],["1/2","\u00bd","half"],["e^2","e2","\u03b50 e","e0 e"]]},
{m:2,q:"Write a short note on \u2018electrostatic shielding\u2019.",a:"The electric field inside both hollow and solid conductors is zero. Consider a cavity inside a conductor: whatever the charges on its surfaces and whatever the electrical disturbances outside, the electric field inside the cavity is zero. A sensitive electrical instrument to be protected from external electrical disturbance can be kept inside this cavity. This is called electrostatic shielding.",k:[["cavity"],["zero"],["inside"],["protect","protected"],["instrument"],["disturbance","outside"]]},
{m:2,q:"Write down Coulomb\u2019s law in vector form and mention what each term represents.",a:"The force on the point charge q2 exerted by another point charge q1 (both at rest in vacuum) is\nF21 = k (q1 q2 / r^2) r12-hat\nq1, q2 \u2013 the two point charges; r \u2013 the distance between them; r12-hat \u2013 the unit vector directed from charge q1 to charge q2; k \u2013 the proportionality constant, k = 1/(4\u03c0\u03b50) = 9 \u00d7 10^9 N m^2 C^-2, where \u03b50 = 8.85 \u00d7 10^-12 C^2 N^-1 m^-2 is the permittivity of free space.\nThe force lies along the line joining the two charges; the force on q1 exerted by q2 is along \u2212r12-hat (opposite direction).",k:[["f21","f = k","k q1 q2","kq1q2"],["unit vector"],["q1"],["q2"],["distance","r^2","r2"],["9 \u00d7 10","9x10","9 x 10","1/4\u03c0","4\u03c0"],["permittivity","\u03b50","e0"],["proportionality constant","constant"]]},
{m:2,q:"What is meant by \u2018electric field lines\u2019?",a:"Electric field lines are a visual representation of the electric field. For a positive point charge they start from the charge and end only at infinity (directed radially outward); for a negative point charge they start at infinity and end at the charge (radially inward). The electric field vector at a point is tangential to the field line at that point. The lines are denser where the field is stronger and less dense where it is weaker, and no two lines intersect.",k:[["visual representation","representation"],["tangent","tangential"],["positive","start"],["negative","end"],["infinity"],["denser","closer","density"],["intersect"]]},
{m:2,q:"Define \u2018electric dipole\u2019. Give the expression for the magnitude of its electric dipole moment and the direction.",a:"Two equal and opposite point charges (+q and \u2212q) separated by a distance 2a form an electric dipole. The electric dipole moment is p = q r+ + (\u2212q) r\u2212 = 2qa (taking the charges on the x-axis, p = 2qa i). Its magnitude is p = 2qa. The dipole moment vector lies along the line joining the two charges and is directed from \u2212q to +q. Its SI unit is coulomb metre (C m).",k:[["equal and opposite","two equal","opposite charges"],["2a","distance"],["p = 2qa","p=2qa","2qa"],["from \u2212q to +q","from -q to +q","-q to +q","negative to positive"],["line joining","along the line"],["c m","coulomb metre","coulomb meter"]]},
{m:2,q:"Write the general definition of electric dipole moment for a collection of point charge.",a:"The electric dipole moment for a collection of n point charges is given by\np = \u03a3 qi ri (sum from i = 1 to n)\nwhere ri is the position vector of the charge qi from the origin.",k:[["\u03a3","sum"],["qi","q i","q1","charge"],["ri","position vector"],["origin"],["collection","n point charges","n charges"]]},
{m:2,q:"Define \u2018electrostatic potential\u2019.",a:"The electric potential at a point P is the work done by an external force to bring a unit positive charge from infinity to the point P (with constant velocity, so that no kinetic energy is imparted):\nVP = \u2212\u222b E \u00b7 dr (from \u221e to P), taking the potential at infinity as zero.\nIt depends only on the source charge, not on the test charge. Its unit is joule per coulomb, called volt (V).",k:[["work done","work"],["unit positive charge","unit charge"],["infinity"],["external"],["volt","joule per coulomb","j/c","j c"],["\u222b","integral","e \u00b7 dr","e.dr"]]},
{m:2,q:"What are the properties of an equipotential surface?",a:"(i) The work done to move a charge q between any two points A and B is W = q(VB \u2212 VA). If A and B lie on the same equipotential surface, the work done is zero because VA = VB.\n(ii) The electric field is normal to an equipotential surface. If it were not normal, there would be a component of the field parallel to the surface, and work would have to be done to move a charge between two points on the same surface, which is a contradiction.",k:[["work done is zero","zero work","no work","work done"],["w = q","q(vb","va = vb","va=vb"],["normal","perpendicular"],["component"],["same potential","same equipotential","same surface"],["contradiction"]]},
{m:2,q:"Define \u2018capacitance\u2019. Give its unit.",a:"The capacitance C of a capacitor is defined as the ratio of the magnitude of charge on either of the conductor plates to the potential difference existing between them: C = Q/V. Its SI unit is coulomb per volt, called farad (F).",k:[["ratio"],["charge"],["potential difference","voltage"],["c = q/v","c=q/v","q/v"],["farad"],["coulomb per volt","c/v","c v"]]},
{m:5,q:"Discuss the basic properties of electric charges.",a:"(i) Electric charge: atoms are made of protons, neutrons and electrons, which have mass as an inherent property. Similarly, electric charge is another intrinsic and fundamental property of particles. The SI unit of charge is the coulomb.\n(ii) Conservation of charges: Benjamin Franklin argued that when one object is rubbed with another, charges are transferred from one to the other. Before rubbing both objects are neutral. (For example, when a glass rod is rubbed with silk cloth, some negative charge is transferred from glass to silk: the glass rod becomes positively charged and the silk negatively charged.) Charges are neither created nor destroyed but can only be transferred from one object to another. The total electric charge in the universe is constant, and in any physical process the net change in charge is zero.\n(iii) Quantisation of charges: the charge q on any object is an integral multiple of the fundamental unit of charge e: q = ne, n = 0, \u00b11, \u00b12, ... Millikan found e = 1.6 \u00d7 10^-19 C. The electron charge is \u22121.6 \u00d7 10^-19 C and the proton charge is +1.6 \u00d7 10^-19 C. When a glass rod is rubbed with silk, the number of charges transferred is very large (of order 10^10), so quantisation is not appreciable at the macroscopic level and charge is treated as continuous; at the microscopic level quantisation plays a vital role.",k:[["intrinsic","fundamental property"],["coulomb"],["conservation","neither created nor destroyed","not created"],["franklin"],["transferred","transfer"],["quantisation","quantization","quantised"],["q = ne","q=ne","ne"],["millikan"],["1.6"],["macroscopic","microscopic"]]},
{m:5,q:"Obtain the expression for capacitance for a parallel plate capacitor.",a:"Consider a capacitor with two parallel plates, each of cross-sectional area A, separated by a distance d. The plates carry charges +Q and \u2212Q.\nThe electric field between two infinite parallel plates is uniform and is E = \u03c3/\u03b50, where \u03c3 = Q/A is the surface charge density. If the separation d is very much smaller than the size of the plates, the result can be used even for a finite-sized parallel plate capacitor. So\nE = Q / (A \u03b50)\nSince the field is uniform, the potential difference between the plates is\nV = Ed = Qd / (A \u03b50)\nTherefore the capacitance is\nC = Q/V = \u03b50 A / d.",k:[["parallel plate","two parallel"],["area","a"],["distance","separation","d"],["\u03c3/\u03b5","sigma/e","q/a\u03b5","q / a","q/(a"],["uniform"],["v = ed","v=ed","ed"],["c = q/v","c=q/v","q/v"],["\u03b50 a/d","\u03b50a/d","e0a/d","e0 a / d","\u03b50 a / d"]]},
{m:5,q:"Derive the expression for resultant capacitance, when capacitors are connected in series and in parallel.",a:"CAPACITORS IN SERIES: three capacitors C1, C2, C3 are connected in series with a battery of voltage V. Each capacitor stores the same charge Q (the charge \u2212Q from the battery pushes an equal charge from plate to plate by electrostatic induction). The sum of the voltages across the capacitors equals the battery voltage:\nV = V1 + V2 + V3 = Q/C1 + Q/C2 + Q/C3 = Q (1/C1 + 1/C2 + 1/C3)\nIf they are replaced by a single equivalent capacitor Cs, V = Q/Cs. Hence\n1/Cs = 1/C1 + 1/C2 + 1/C3.\n\nCAPACITORS IN PARALLEL: the capacitors are connected to the same voltage V, so the charge stored in each is different. By conservation of charge, the total charge from the battery is\nQ = Q1 + Q2 + Q3\nSince Q = CV: Q = C1V + C2V + C3V. For a single equivalent capacitor Cp storing the total charge, Q = Cp V. Hence\nCp = C1 + C2 + C3.\nThe equivalent capacitance in parallel is the sum of the individual capacitances and is always greater than the largest individual capacitance (it is as if the areas add up).",k:[["series"],["parallel"],["same charge","each capacitor stores the same"],["v = v1","v1 + v2","v1+v2"],["1/cs","1/c1"],["q = q1","q1 + q2","conservation"],["cp = c1","c1 + c2","sum"],["same voltage","same potential"],["q = cv","q=cv"]]},
{m:5,q:"Calculate the electric field due to a dipole on its axial line and equatorial plane.",a:"CASE (i) AXIAL LINE: dipole of charges \u2212q and +q at A and B on the x-axis, midpoint O, separation 2a. Point C is at distance r from O on the axial line, on the side of +q.\nField due to +q: E+ = (1/4\u03c0\u03b50) q/(r\u2212a)^2 p-hat (p-hat = unit vector of dipole moment from \u2212q to +q).\nField due to \u2212q: E\u2212 = \u2212(1/4\u03c0\u03b50) q/(r+a)^2 p-hat.\nBy superposition: Etot = E+ + E\u2212 = (q/4\u03c0\u03b50) [1/(r\u2212a)^2 \u2212 1/(r+a)^2] p-hat = (1/4\u03c0\u03b50) q [4ra/(r^2\u2212a^2)^2] p-hat.\nThe total field is along E+ because +q is closer to C. For r >> a, (r^2\u2212a^2)^2 \u2248 r^4, so with 2aq p-hat = p:\nEtot = (1/4\u03c0\u03b50)(4aq/r^3) p-hat = (1/4\u03c0\u03b50)(2p/r^3)   (r >> a).\n\nCASE (ii) EQUATORIAL PLANE: point C is at distance r from O on the perpendicular bisector. C is equidistant from +q and \u2212q, so |E+| = |E\u2212| = (1/4\u03c0\u03b50) q/(r^2+a^2). E+ is along BC and E\u2212 along CA. Each is resolved into a component parallel to the dipole axis and one perpendicular to it. The perpendicular components |E|sin\u03b8 are equal and opposite and cancel. The parallel components add, along \u2212p-hat:\nEtot = \u2212|E+|cos\u03b8 p-hat \u2212 |E\u2212|cos\u03b8 p-hat = \u2212(1/4\u03c0\u03b50)(2q cos\u03b8/(r^2+a^2)) p-hat\nwith cos\u03b8 = a/\u221a(r^2+a^2):\nEtot = \u2212(1/4\u03c0\u03b50) p/(r^2+a^2)^(3/2)   (p = 2qa p-hat)\nFor r >> a: Etot = \u2212(1/4\u03c0\u03b50) p/r^3.\nInferences: at very large distances the axial field is twice the equatorial field at the same distance; on the axis it is along p, on the equatorial plane it is opposite to p. At large distances the dipole field varies as 1/r^3.",k:[["axial"],["equatorial"],["superposition"],["4ra","4raq","4 r a","4aq"],["2p","2 p","p/r"],["r >> a","r>>a"],["cos\u03b8","cos"],["cancel"],["\u2212p","-p","opposite"],["1/r3","1/r^3","r3","r^3"]]},
{m:5,q:"Derive an expression for the torque experienced by a dipole due to a uniform electric field.",a:"Consider an electric dipole of moment p placed in a uniform electric field E (field lines equally spaced and in the same direction). The charge +q experiences a force qE along the field and the charge \u2212q a force \u2212qE opposite to the field. Since the field is uniform, the total force on the dipole is zero. The two forces act at different points and constitute a couple, so the dipole experiences a torque which tends to rotate it.\nThe total torque about the point O:\n\u03c4 = OA \u00d7 (\u2212qE) + OB \u00d7 qE\nBy the right-hand corkscrew rule the total torque is perpendicular to the plane of the paper. Its magnitude is\n\u03c4 = |OA||\u2212qE| sin\u03b8 + |OB||qE| sin\u03b8 = qE \u00b7 2a sin\u03b8\nwhere \u03b8 is the angle between p and E. Since p = 2aq, in vector form\n\u03c4 = p \u00d7 E\nand its magnitude is \u03c4 = pE sin\u03b8, which is maximum when \u03b8 = 90\u00b0.\nThis torque tends to rotate the dipole and align it with the field E; once p is aligned with E the torque becomes zero. (If the field is not uniform, there is also a net force on the dipole in addition to the torque.)",k:[["uniform"],["qe","q e"],["couple"],["total force","zero"],["\u03c4 = qe","qe \u00b7 2a","2a sin","2a sin\u03b8","qe.2a"],["p \u00d7 e","pxe","p x e","p\u00d7e","pe sin","pesin"],["\u03b8","theta"],["maximum","90"],["align"]]},
{m:5,q:"Derive an expression for electrostatic potential due to a point charge.",a:"Consider a positive charge q kept fixed at the origin. Let P be a point at distance r from the charge. The electric potential at P is the work done by an external force to bring a unit positive charge from infinity to P:\nV = \u222b(\u221e to r) (\u2212E)\u00b7dr = \u2212\u222b(\u221e to r) E\u00b7dr\nThe electric field due to the positive point charge is E = (1/4\u03c0\u03b50)(q/r^2) r-hat. The infinitesimal displacement is dr = dr r-hat and r-hat\u00b7r-hat = 1, so\nV = \u2212(1/4\u03c0\u03b50) \u222b(\u221e to r) (q/r^2) dr\nAfter the integration,\nV = (1/4\u03c0\u03b50) q [\u22121/r] from \u221e to r = (1/4\u03c0\u03b50) (q/r)\nHence the electric potential due to a point charge q at a distance r is\nV = (1/4\u03c0\u03b50)(q/r)\nImportant points: (i) if the source charge q is positive, V > 0; if q is negative, V is negative: V = \u2212(1/4\u03c0\u03b50)(q/r). (ii) The potential due to a positive charge decreases as the distance increases, but for a negative charge it increases as the distance increases. At infinity (r = \u221e) the electrostatic potential is zero (V = 0).",k:[["work done","work"],["unit positive charge","unit charge"],["infinity"],["e = ","1/4\u03c0\u03b5","e=","1/4"],["integra"],["v = ","v=","(1/4\u03c0\u03b50)(q/r)","q/r","q / r"],["positive","negative"],["decreases","increases"],["zero"]]},
{m:5,q:"Obtain Gauss law from Coulomb\u2019s law.",a:"A positive point charge Q is surrounded by an imaginary sphere of radius r. The total electric flux through the closed surface of the sphere is\n\u03a6E = \u222e E\u00b7dA = \u222e E dA cos\u03b8\nThe electric field of the point charge is directed radially outward at all points of the sphere, so dA is along E and \u03b8 = 0\u00b0 (cos 0\u00b0 = 1): \u03a6E = \u222e E dA.\nE is uniform on the surface of the sphere, so \u03a6E = E \u222e dA. Substituting \u222e dA = 4\u03c0r^2 and (from Coulomb\u2019s law) E = (1/4\u03c0\u03b50)(Q/r^2):\n\u03a6E = (1/4\u03c0\u03b50)(Q/r^2) \u00d7 4\u03c0r^2 = Q/\u03b50\nThis is Gauss\u2019s law. The result is equally true for any arbitrarily shaped closed surface enclosing the charge Q: the total flux is the same through all such closed surfaces.\nStatement: if a charge Q is enclosed by an arbitrary closed surface, then the total electric flux \u03a6E through the closed surface is \u03a6E = \u222e E\u00b7dA = Qencl/\u03b50, where Qencl is the charge within the closed surface.\nDiscussion: (i) the flux depends only on the charges enclosed; charges outside do not contribute, and the shape of the surface can be chosen arbitrarily. (ii) It is independent of the location of the charges inside the surface. (iii) The imaginary surface chosen is called a Gaussian surface; its shape depends on the symmetry of the charge configuration (spherical, cylindrical or planar). (iv) E on the left side is due to charges inside and outside, but Qencl denotes only the charges inside.",k:[["flux"],["sphere"],["\u03b8 = 0","cos 0","cos\u03b8 = 1","parallel"],["4\u03c0r","4 \u03c0 r","4\u03c0r2"],["q/\u03b5","q / \u03b5","q/e0","qencl","q encl"],["coulomb"],["enclosed","encl"],["gaussian"],["any","arbitrar"]]},
{m:5,q:"Obtain the expression for electric field due to an infinitely long charged wire.",a:"Consider an infinitely long straight wire with uniform linear charge density \u03bb (charge per unit length). Let P be a point at a perpendicular distance r from the wire. By symmetry the field at P is radially outward (for \u03bb > 0) and has the same magnitude at all points at distance r.\nChoose a cylindrical Gaussian surface of radius r and length L coaxial with the wire. The total flux:\n\u03a6E = \u222e E\u00b7dA = \u222b(curved) E\u00b7dA + \u222b(top) E\u00b7dA + \u222b(bottom) E\u00b7dA\nOn the curved surface E is parallel to dA, so E\u00b7dA = E dA. On the top and bottom surfaces E is perpendicular to dA, so E\u00b7dA = 0.\nBy Gauss law: \u03a6E = \u222b(curved) E dA = Qencl/\u03b50, with Qencl = \u03bbL.\nE is constant on the curved surface, so E \u222b dA = \u03bbL/\u03b50, where the curved area = 2\u03c0rL:\nE \u00b7 2\u03c0rL = \u03bbL/\u03b50\nE = (1/2\u03c0\u03b50)(\u03bb/r)\nIn vector form E = (1/2\u03c0\u03b50)(\u03bb/r) r-hat.\nThe field depends on 1/r (not 1/r^2 as for a point charge) and is always perpendicular to the wire: outward if \u03bb > 0, inward if \u03bb < 0. The result is true only for an infinitely long wire (approximately true near the mid-point of a finite wire, far from the ends).",k:[["linear charge density","\u03bb"],["cylindrical","cylinder"],["gauss"],["curved"],["perpendicular","top","bottom"],["\u03bbl","lambda l"],["2\u03c0rl","2\u03c0 r l","2\u03c0r","2 \u03c0 r"],["\u03bb/2\u03c0\u03b5","1/2\u03c0\u03b5","\u03bb/r","\u03bb / r","lambda/2"],["1/r"]]},
{m:5,q:"Obtain the expression for electric field due to an charged infinite plane sheet.",a:"Consider an infinite plane sheet of charge with uniform surface charge density \u03c3 (charge per unit area). Let P be a point at distance r from the sheet. Since the plane is infinitely large, the field is the same at all points equidistant from the plane and is directed radially outward (for \u03c3 > 0).\nChoose a cylindrical Gaussian surface of length 2r with two flat faces, each of area A, so that the sheet passes perpendicularly through the middle of the cylinder.\n\u03a6E = \u222e E\u00b7dA = \u222b(curved) E\u00b7dA + \u222b(P) E\u00b7dA + \u222b(P\u2032) E\u00b7dA = Qencl/\u03b50\nE is perpendicular to the area element on the curved surface (no flux) and parallel to the surface areas at P and P\u2032. Hence \u222b(P) E dA + \u222b(P\u2032) E dA = Qencl/\u03b50. E is uniform on the two flat faces and Qencl = \u03c3A:\n2E \u222b(P) dA = \u03c3A/\u03b50, and the area of either face is A, so 2EA = \u03c3A/\u03b50\nE = \u03c3/2\u03b50\nIn vector form E = (\u03c3/2\u03b50) n-hat, where n-hat is the outward unit vector normal to the plane.\nThe field of an infinite plane sheet depends on \u03c3 and is independent of the distance r. If \u03c3 > 0 the field points perpendicularly outward; if \u03c3 < 0 it points inward. For a finite sheet the result is approximately true only in the middle region and far from the ends.",k:[["surface charge density","\u03c3"],["infinite"],["cylindrical","cylinder","pillbox"],["gauss"],["2ea","2 e a","2e"],["\u03c3a","sigma a","\u03c3 a"],["\u03c3/2\u03b5","\u03c3 / 2\u03b5","sigma/2","\u03c3/2e0"],["independent","not depend","distance"],["normal","perpendicular"]]},
{m:5,q:"Obtain the expression for electric field due to an uniformly charged spherical shell.",a:"Consider a uniformly charged spherical shell of radius R carrying total charge Q. The field is found using Gauss law.\nCase (a) at a point outside the shell (r > R): choose a spherical Gaussian surface of radius r concentric with the shell. The enclosed charge is Q. The charge is spherically symmetric, so the field is radially outward if Q > 0 (inward if Q < 0), parallel to dA, and of the same magnitude at all points on the Gaussian surface.\n\u222e E\u00b7dA = Q/\u03b50, so E \u222e dA = Q/\u03b50. With \u222e dA = 4\u03c0r^2:\nE \u00b7 4\u03c0r^2 = Q/\u03b50, E = (1/4\u03c0\u03b50)(Q/r^2)\nIn vector form E = (1/4\u03c0\u03b50)(Q/r^2) r-hat. At a point outside, the field is the same as if the entire charge Q were concentrated at the centre of the shell.\nCase (b) on the surface of the shell (r = R): E = Q/(4\u03c0\u03b50 R^2) r-hat.\nCase (c) inside the shell (r < R): choose a spherical Gaussian surface of radius r < R. It encloses no charge (Qencl = 0), so by Gauss law the electric field inside the charged spherical shell is zero: E = 0.",k:[["spherical shell","shell"],["gaussian"],["r > r","outside"],["q/\u03b5","q / \u03b5","q/e0","q/4\u03c0"],["4\u03c0r","4 \u03c0 r","4\u03c0r2"],["1/4\u03c0\u03b5","(1/4","4\u03c0\u03b5"],["surface","r = r"],["inside","zero","e = 0","e=0"],["no charge","q = 0","encl"]]},
{m:5,q:"Derive an expression for electrostatic potential due to an electric dipole.",a:"Consider two equal and opposite charges (\u2212q at A and +q at B) separated by a small distance 2a. The point P is at a distance r from the midpoint O of the dipole, and \u03b8 is the angle between OP and the dipole axis AB. Let r1 be the distance of P from +q and r2 the distance of P from \u2212q.\nPotential at P due to +q = (1/4\u03c0\u03b50)(q/r1); due to \u2212q = \u2212(1/4\u03c0\u03b50)(q/r2). Total potential:\nV = (1/4\u03c0\u03b50) q (1/r1 \u2212 1/r2)   (1.35)\nFor r >> a, by the cosine law in triangle BOP: r1^2 = r^2 + a^2 \u2212 2ra cos\u03b8. Neglecting a^2/r^2: r1^2 = r^2 (1 \u2212 2a cos\u03b8/r), and using the binomial theorem retaining first-order terms,\n1/r1 = (1/r)(1 + a cos\u03b8/r)   (1.36)\nSimilarly in triangle AOP: r2^2 = r^2 + a^2 + 2ra cos\u03b8, which gives\n1/r2 = (1/r)(1 \u2212 a cos\u03b8/r)   (1.37)\nSubstituting (1.36) and (1.37) in (1.35):\nV = (q/4\u03c0\u03b50)(1/r)[(1 + a cos\u03b8/r) \u2212 (1 \u2212 a cos\u03b8/r)] = (1/4\u03c0\u03b50)(2aq cos\u03b8 / r^2)\nWith dipole moment p = 2qa:\nV = (1/4\u03c0\u03b50)(p cos\u03b8 / r^2) = (1/4\u03c0\u03b50)(p\u00b7r-hat / r^2)   (r >> a)   (1.38)\nSpecial cases: (i) on the axial line on the +q side (\u03b8 = 0): V = (1/4\u03c0\u03b50)(p/r^2); (ii) on the axial line on the \u2212q side (\u03b8 = 180\u00b0): V = \u2212(1/4\u03c0\u03b50)(p/r^2); (iii) on the equatorial line (\u03b8 = 90\u00b0): V = 0.\nThe potential of a dipole falls as 1/r^2, while that of a single point charge falls as 1/r.",k:[["r1","r2"],["cosine"],["binomial"],["r >> a","r>>a"],["p cos","pcos","2aq cos","2aqcos"],["1/r2","1/r^2","r2","r^2"],["\u03b8 = 0","\u03b8 = 90","\u03b8 = 180","axial","equatorial"],["v = 0","v=0","zero"],["p = 2qa","p=2qa","2qa"]]},
{m:5,q:"Obtain an expression for potential energy due to a collection of three point charges which are separated by finite distances.",a:"Consider three point charges q1, q2, q3 at points A, B, C separated by distances r12, r13, r23. The electrostatic potential energy of the system is the work done by an external agency to assemble them at those positions, bringing each charge in from infinity.\n(i) Bringing q1 from infinity to A requires no work, because there are no other charges already present.\n(ii) Bringing q2 to B requires work against the field of q1: W = q2 V1B, where V1B is the potential due to q1 at B:\nUI = (1/4\u03c0\u03b50)(q1 q2 / r12)   (1.46)\n(iii) Bringing q3 to C requires work against the fields of both q1 and q2: W = q3 (V1C + V2C):\nUII = (1/4\u03c0\u03b50)(q1 q3/r13 + q2 q3/r23)   (1.47)\n(iv) Adding, the total electrostatic potential energy of the system is U = UI + UII:\nU = (1/4\u03c0\u03b50)(q1q2/r12 + q1q3/r13 + q2q3/r23)   (1.48)\nThis stored potential energy equals the total external work done to assemble the three charges. The expression is the same if the charges are brought in any other order. Since the Coulomb force is a conservative force, the electrostatic potential energy is independent of the manner in which the configuration of charges is arrived at.",k:[["no work","requires no work","zero work"],["external","work done","assemble"],["q1 q2","q1q2","q1\u00b7q2"],["r12"],["r13"],["r23"],["u = ui","ui + uii","ui+uii","sum","adding"],["conservative"],["any order","any other order","independent"]]},
{m:5,q:"Derive an expression for electrostatic potential energy of the dipole in a uniform electric field.",a:"Consider a dipole placed in a uniform electric field E. It experiences a torque which tends to rotate it to align with the field. To rotate the dipole (at constant angular velocity) from its initial angle \u03b8\u2032 to another angle \u03b8 against this torque, an equal and opposite external torque must be applied.\nThe work done by the external torque in rotating the dipole from \u03b8\u2032 to \u03b8 is\nW = \u222b(\u03b8\u2032 to \u03b8) \u03c4ext d\u03b8   (1.49)\nSince \u03c4ext is equal and opposite to \u03c4E = p \u00d7 E, |\u03c4ext| = |\u03c4E| = |p \u00d7 E| = pE sin\u03b8   (1.50)\nHence W = \u222b(\u03b8\u2032 to \u03b8) pE sin\u03b8 d\u03b8 = pE (cos\u03b8\u2032 \u2212 cos\u03b8)\nThis work done equals the potential energy difference between the angular positions \u03b8 and \u03b8\u2032:\nU(\u03b8) \u2212 U(\u03b8\u2032) = \u0394U = \u2212pE cos\u03b8 + pE cos\u03b8\u2032\nIf the initial angle is \u03b8\u2032 = 90\u00b0 and is taken as the reference point, then U(\u03b8\u2032) = pE cos 90\u00b0 = 0. The potential energy stored in the system of a dipole in a uniform field is\nU = \u2212pE cos\u03b8 = \u2212p\u00b7E   (1.51)\nIn addition to p and E, the potential energy depends on the orientation \u03b8 of the dipole. It is maximum when the dipole is aligned anti-parallel (\u03b8 = \u03c0) to the field and minimum when it is aligned parallel (\u03b8 = 0).",k:[["torque"],["external"],["w = \u222b","\u222b","integral","w = pe"],["pe sin","pesin","pe sin\u03b8"],["cos\u03b8\u2032","cos\u03b8'","pe(cos","cos"],["90"],["u = \u2212pe","u = -pe","u=-pe","\u2212p\u00b7e","-p.e","-p\u00b7e"],["anti-parallel","antiparallel","\u03b8 = \u03c0"],["maximum","minimum"]]},
{m:5,q:"Obtain the expression for energy stored in the parallel plate capacitor.",a:"A capacitor stores energy as well as charge. When a battery is connected to the capacitor, electrons of total charge \u2212Q are transferred from one plate to the other. To transfer the charge, work is done by the battery, and this work is stored as electrostatic potential energy in the capacitor.\nTo transfer an infinitesimal charge dQ for a potential difference V, the work done is\ndW = V dQ, where V = Q/C   (1.85)\nThe total work done to charge the capacitor is\nW = \u222b(0 to Q) (Q/C) dQ = Q^2/(2C)   (1.86)\nThis work done is stored as electrostatic potential energy UE in the capacitor:\nUE = Q^2/2C = (1/2) C V^2   (Q = CV)   (1.87)\nThe stored energy is directly proportional to the capacitance and to the square of the voltage between the plates.\nWhere is the energy stored? Using C = \u03b50A/d and V = Ed:\nUE = (1/2)(\u03b50A/d)(Ed)^2 = (1/2) \u03b50 (Ad) E^2   (1.88)\nwhere Ad is the volume of the space between the plates. The energy stored per unit volume of space is the energy density uE = U/Volume, so\nuE = (1/2) \u03b50 E^2   (1.89)\nThe energy is stored in the electric field existing between the plates. Once the capacitor is allowed to discharge, the energy is retrieved. The energy density depends only on the electric field and not on the size of the plates; expression (1.89) is true for the electric field due to any type of charge configuration.",k:[["dw = v dq","dw=vdq","v dq","vdq"],["v = q/c","q/c"],["\u222b","integral","q^2/2c","q2/2c","q^2/(2c)"],["1/2) c v","1/2 cv","\u00bd cv","cv^2","cv2","(1/2) c v"],["energy density","per unit volume"],["\u03b50 e","e0 e","1/2 \u03b5","(1/2) \u03b50","(1/2)\u03b50"],["electric field","between the plates"],["c = \u03b50a/d","\u03b50a/d","e0a/d","v = ed","v=ed"]]},
{m:5,q:"Explain in detail the effect of a dielectric placed in a parallel plate capacitor.",a:"When a dielectric (mica, glass, paper) is placed between the plates of a parallel plate capacitor, its capacitance is altered. The dielectric can be inserted in two ways.\n(i) WHEN THE CAPACITOR IS DISCONNECTED FROM THE BATTERY: the capacitor is charged to V0 with charge Q0, and C0 = Q0/V0. The battery is disconnected and the dielectric is inserted. The charge Q0 remains constant. The dielectric decreases the electric field: E = E0/\u03b5r, where \u03b5r is the dielectric constant (\u03b5r > 1, so E < E0). Hence the potential difference V = Ed = (E0/\u03b5r) d = V0/\u03b5r also decreases, so the capacitance increases:\nC = Q0/V = \u03b5r Q0/V0 = \u03b5r C0 (so C > C0) and C = \u03b5r\u03b50A/d = \u03b5A/d, where \u03b5 = \u03b5r\u03b50 is the permittivity of the dielectric medium.\nEnergy: before insertion U0 = Q0^2/2C0; after insertion U = Q0^2/(2\u03b5rC0) = U0/\u03b5r. Since \u03b5r > 1, U < U0: the energy decreases because the capacitor spends some energy in pulling the dielectric inside.\n(ii) WHEN THE BATTERY REMAINS CONNECTED: the potential difference V0 remains constant. When the dielectric is inserted, the charge stored increases by a factor \u03b5r: Q = \u03b5r Q0. The new capacitance is C = Q/V0 = \u03b5r Q0/V0 = \u03b5r C0, and C = \u03b5A/d.\nEnergy: before insertion U0 = (1/2) C0 V0^2; after insertion U = (1/2) C V0^2 = (1/2) \u03b5r C0 V0^2 = \u03b5r U0. Since \u03b5r > 1, U > U0 (energy increases). Since V0 is constant, the electric field between the plates remains constant. The energy density is u = (1/2) \u03b5 E0^2, where \u03b5 is the permittivity of the dielectric.",k:[["disconnected"],["connected"],["\u03b5r","dielectric constant","relative permittivity"],["e0/\u03b5r","e = e0","e0/er"],["v0/\u03b5r","v = v0","v0/er"],["c = \u03b5r c0","\u03b5rc0","er c0","c0"],["q = \u03b5r q0","\u03b5rq0","er q0"],["u0/\u03b5r","u < u0","decrease"],["\u03b5ru0","u > u0","increase"],["constant"]]},
{m:5,q:"Explain in detail how charges are distributed in a conductor, and the principle behind the lightning conductor.",a:"DISTRIBUTION OF CHARGES IN A CONDUCTOR: consider two conducting spheres A and B of radii r1 and r2 connected by a thin conducting wire, the distance between them being much greater than their radii. A charge Q introduced into either sphere is redistributed into both such that the electrostatic potential is the same on both and they attain electrostatic equilibrium. Let q1 and q2 be the charges on A and B, Q = q1 + q2. The charges lie only on the surface; there is no net charge inside.\nVA = (1/4\u03c0\u03b50)(q1/r1)   (1.109);  VB = (1/4\u03c0\u03b50)(q2/r2)   (1.110)\nThe surface of a conductor is an equipotential, so the two spheres together form an equipotential surface: VA = VB, i.e. q1/r1 = q2/r2   (1.111).\nWith q1 = 4\u03c0r1^2\u03c31 and q2 = 4\u03c0r2^2\u03c32 this gives \u03c31 r1 = \u03c32 r2   (1.112), so \u03c3r = constant   (1.113).\nThe surface charge density \u03c3 is inversely proportional to the radius of the sphere: for a smaller radius the charge density is larger, and vice versa.\n\nACTION OF POINTS (CORONA DISCHARGE): the smaller the radius of curvature, the larger the charge density. The end of a conductor with larger curvature (smaller radius) has a large charge accumulation. As a result the electric field near this edge is very high and ionises the surrounding air. The positive ions are repelled at the sharp edge and negative ions are attracted towards it, which reduces the total charge of the conductor near the sharp edge.\n\nLIGHTNING ARRESTER (LIGHTNING CONDUCTOR): it protects tall buildings from lightning strikes and works on the principle of action at points (corona discharge). It consists of a long thick copper rod passing from the top of the building to the ground. The upper end of the rod has a sharp spike or needle; the lower end is connected to a copper plate buried deep in the ground. When a negatively charged cloud passes above the building, it induces a positive charge on the spike. Since the induced charge density on the sharp spike is large, it results in a corona discharge: the positive charge ionises the surrounding air, which in turn neutralises the negative charge in the cloud. The negative charge pushed to the spike passes through the copper rod and is safely diverted to the Earth. The lightning arrester does not stop the lightning; it diverts it to the ground safely.",k:[["two conducting spheres","two spheres","spheres a and b","spheres"],["same potential","equipotential","va = vb","va=vb"],["q1/r1","q1 / r1"],["\u03c3r = constant","\u03c3r=constant","\u03c31r1","inversely proportional"],["smaller radius","radius of curvature","sharp"],["ionis","ioniz"],["action of points","corona"],["copper rod","spike","needle"],["ground","earth"],["neutralis","neutraliz"]]},
{m:5,q:"Explain in detail the construction and working of a Van de Graaff generator.",a:"In 1929 Robert Van de Graaff designed a machine that produces a large electrostatic potential difference, up to several million volts (10^7 V). It works on the principle of electrostatic induction and action at points.\nCONSTRUCTION: a large hollow spherical conductor is fixed on an insulating stand. A pulley B is mounted at the centre of the hollow sphere and another pulley C is fixed at the bottom. A belt made of insulating material like silk or rubber runs over both pulleys. Pulley C is driven continuously by an electric motor. Two comb-shaped metallic conductors E and D are fixed near the pulleys. The comb D is maintained at a positive potential of 10^4 V by a power supply. The upper comb E is connected to the inner side of the hollow metal sphere.\nWORKING: due to the high electric field near comb D, the air between the belt and comb D gets ionised by the action of points. The positive charges are pushed towards the belt and the negative charges are attracted towards comb D. The positive charges stick to the belt and move up. When they reach the point near comb E, comb E acquires negative charge and the sphere acquires positive charge due to electrostatic induction. As a result, the positive charges are pushed away from comb E and reach the outer surface of the sphere. Since the sphere is a conductor, the positive charges are distributed uniformly on its outer surface. At the same time the negative charges of comb E nullify the positive charges on the belt by corona discharge before it passes over the pulley.\nWhen the belt descends it has almost no net charge. At the bottom it again gains a large positive charge, goes up and delivers the positive charges to the outer surface of the sphere. This continues until the outer surface reaches a potential difference of the order of 10^7 V, which is the limiting value: extra charge leaks into the surroundings due to ionisation of air. The leakage can be reduced by enclosing the machine in a gas-filled steel chamber at very high pressure.\nUSE: the high voltage produced is used to accelerate positive ions (protons and deuterons) for nuclear disintegrations and other applications.",k:[["hollow","sphere"],["insulating stand","insulating"],["pulley"],["belt"],["comb","combs"],["10^4","10\u2074","104 v"],["action of points","corona","ionis","ioniz"],["electrostatic induction","induction"],["10^7","10\u2077","million"],["leak"],["steel chamber","high pressure","gas"],["accelerate","protons","deuterons"]]},
{m:5,q:"Explain in detail Coulomb\u2019s law and its various aspects.",a:"In 1786 Coulomb deduced the expression for the force between two stationary point charges in vacuum or free space. For two point charges q1 and q2 at rest in vacuum, separated by a distance r, the force on q2 exerted by q1 is\nF21 = k (q1 q2 / r^2) r12-hat   (1.2)\nwhere r12-hat is the unit vector directed from q1 to q2 and k is the proportionality constant.\nImportant aspects:\n(i) Coulomb\u2019s law states that the electrostatic force is directly proportional to the product of the magnitudes of the two point charges and inversely proportional to the square of the distance between them.\n(ii) The force on q2 exerted by q1 always lies along the line joining the two charges. Likewise the force on q1 exerted by q2 is along \u2212r12-hat, the direction opposite to r12-hat.\n(iii) In SI units k = 1/(4\u03c0\u03b50) = 9 \u00d7 10^9 N m^2 C^-2, where \u03b50 = 8.85 \u00d7 10^-12 C^2 N^-1 m^-2 is the permittivity of free space.\n(iv) The coulomb is a huge unit: the force between two 1 C charges separated by 1 m is 9 \u00d7 10^9 N, almost the weight of one million tonnes. Most electrical phenomena in daily life involve charges of the order of \u00b5C or nC.\n(v) In vacuum F21 = (1/4\u03c0\u03b50)(q1q2/r^2) r12-hat; in a medium of permittivity \u03b5, F21 = (1/4\u03c0\u03b5)(q1q2/r^2) r12-hat. Since \u03b5 > \u03b50, the force between two point charges in a medium is always less than that in vacuum. The relative permittivity is \u03b5r = \u03b5/\u03b50 (\u03b5r = 1 for vacuum or air and \u03b5r > 1 for all other media).\n(vi) The forces between two charges are equal and opposite: F12 = \u2212F21. Hence the electrostatic force obeys Newton\u2019s third law.\n(vii) Coulomb\u2019s expression is true only for point charges. As a point charge is an ideal concept, the law can be applied to charged objects whose sizes are very much smaller than the distance between them (Coulomb discovered his law by treating the charged spheres of the torsion balance as point charges).",k:[["1786"],["point charge"],["directly proportional","proportional"],["square of the distance","inverse square","inversely proportional"],["line joining"],["9 \u00d7 10","9x10","9 x 10"],["8.85"],["permittivity"],["medium","\u03b5r","relative permittivity"],["newton","third law","f12 = \u2212f21","f12 = -f21"],["point charges only","only for point"]]},
{m:5,q:"Define \u2018electric field\u2019 and discuss its various aspects.",a:"The electric field at a point P at a distance r from a point charge q is defined as the force that would be experienced by a unit positive charge placed at that point P:\nE = F/q0 = (1/4\u03c0\u03b50)(q/r^2) r-hat   (1.4)\nwhere r-hat is the unit vector from q to the point of interest. The electric field is a vector quantity; its SI unit is newton per coulomb (N C^-1).\nImportant aspects:\n(i) If q is positive the electric field points away from the source charge; if q is negative it points towards the source charge.\n(ii) If the field at P is E, the force on a test charge q0 placed at P is F = q0 E   (1.5), which is Coulomb\u2019s law in terms of the electric field. For positive q the force on q0 is away from q; for negative q it is towards q.\n(iii) The electric field is independent of the test charge q0 and depends only on the source charge q.\n(iv) Being a vector, the field has a unique direction and magnitude at every point of space; as the distance increases the field decreases in magnitude (the field at a closer point is stronger).\n(v) The test charge q0 is taken sufficiently small so that it does not move the source charge or modify the field of the source.\n(vi) Expression (1.4) is valid only for point charges. For continuous, finite-sized charge distributions integration must be used, but the expression can be used as an approximation when the test point is very far away from the finite-sized source charge.\n(vii) There are two kinds of electric field: uniform (constant) \u2013 same direction and constant magnitude at all points; and non-uniform \u2013 different direction or magnitude (or both) at different points. The field of a point charge is non-uniform.",k:[["force"],["unit positive charge","unit charge"],["vector"],["n c","newton per coulomb","n/c"],["away","towards"],["f = q0 e","f=q0e","q0e","q0 e"],["independent of the test charge","independent"],["small","test charge"],["point charges","finite","integration"],["uniform","non-uniform","non uniform"]]},
{m:5,q:"Explain dielectrics in detail and how an electric field is induced inside a dielectric.",a:"DIELECTRICS: a dielectric is a non-conducting material with no free electrons; the electrons are bound within the atoms (examples: ebonite, glass, mica). When an external electric field is applied the electrons are not free to move but are realigned in a specific way. A dielectric is made up of either non-polar or polar molecules.\nNon-polar molecules: the centres of positive and negative charges coincide, so there is no permanent dipole moment (e.g. H2, O2, CO2). In an external field the centres of positive and negative charges are separated by a small distance, inducing a dipole moment along the field; the dielectric is said to be polarised.\nPolar molecules: the centres of positive and negative charges are separated even without a field, so they have a permanent dipole moment (e.g. H2O, N2O, HCl, NH3). Because of thermal motion the dipoles are randomly oriented and the net dipole moment is zero without a field. In an external field the dipoles tend to align along the field, so a net dipole moment is induced and the dielectric is polarised.\nPolarisation P is the total dipole moment per unit volume of the dielectric. For most (linear isotropic) dielectrics P is directly proportional to the external field: P = \u03c7e Eext (1.80), where \u03c7e is the electric susceptibility, a characteristic of each dielectric.\nINDUCED ELECTRIC FIELD INSIDE A DIELECTRIC: in a conductor an external field aligns the charges so that an internal field is created which cancels the external field. In a dielectric, which has no free electrons, the external field only realigns the charges, producing an internal field Eint that is smaller than the external field. Hence the net field inside the dielectric is not zero; it is parallel to the external field with magnitude less than it.\nExample: a dielectric slab between two oppositely charged plates (a capacitor). The uniform field between the plates acts as Eext and polarises the slab: positive charge is induced on one side surface and negative charge on the other, while the net charge inside any small volume is zero. The slab is equivalent to two oppositely charged sheets with surface charge densities +\u03c3b and \u2212\u03c3b, called bound charges; they are not free to move like free electrons.\nDielectric breakdown: if the applied field is very large it tears the atoms apart, the bound charges become free and the dielectric starts to conduct. The maximum field a dielectric can withstand before breakdown is its dielectric strength (for air 3 \u00d7 10^6 V m^-1; beyond this a spark is produced).",k:[["non-conducting","insulator","no free electron"],["non-polar","nonpolar"],["polar"],["dipole moment"],["polaris"],["per unit volume","unit volume"],["\u03c7e","susceptibility","p = \u03c7"],["internal","induced field","eint"],["bound charge","\u03c3b"],["breakdown","dielectric strength"],["3 \u00d7 10","3x10","3 x 10"]]},
{m:3,q:"The total number of electrons in the human body is typically in the order of 10^28. Suppose, due to some reason, you and your friend lost 1% of this number of electrons. Calculate the electrostatic force between you and your friend separated at a distance of 1 m. Compare this with your weight. Assume mass of each person is 60 kg and use point charge approximation.",a:"(Worked by me from Coulomb\u2019s law; the final values match the book\u2019s answer.)\nNumber of electrons lost = 1% of 10^28 = 10^26. Charge of each person q = 10^26 \u00d7 1.6 \u00d7 10^-19 = 1.6 \u00d7 10^7 C.\nElectrostatic force Fe = k q^2 / r^2 = 9 \u00d7 10^9 \u00d7 (1.6 \u00d7 10^7)^2 / 1^2 = 2.3 \u00d7 10^24 N = 23 \u00d7 10^23 N.\nWeight W = mg = 60 \u00d7 9.8 = 588 N.\nFe / W = 2.3 \u00d7 10^24 / 588 = 3.9 \u00d7 10^21.\nBook answer: Fe = 23 \u00d7 10^23 N, W = 588 N, Fe/W = 3.9 \u00d7 10^21.",k:[["1.6 \u00d7 10^7","1.6x10^7","1.6 x 10^7","1.6\u00d710^7"],["kq","k q","coulomb"],["9 \u00d7 10","9x10","9 x 10"],["588","mg"],["23 \u00d7 10","23x10","2.3"],["3.9"]]},
{m:3,q:"Five identical charges Q are placed equidistant on a semicircle as shown in the figure [Figure described in words: five charges Q on a semicircle of radius R, on the left of the origin, at the top, the bottom and three points in between]. Another point charge q is kept at the centre of the circle of radius R. Calculate the electrostatic force experienced by the charge q.",a:"(Worked by me; the result matches the book\u2019s answer.)\nEach charge Q exerts on q a force of magnitude F0 = (1/4\u03c0\u03b50) qQ/R^2, directed along the line joining them (repulsive for like charges, i.e. away from that Q).\nBy symmetry the components of the forces perpendicular to the x-axis from the charges above and below cancel. The charge on the axis contributes F0 along +x; the two charges at 45\u00b0 each contribute F0 cos45\u00b0 along +x; the two end charges (at 90\u00b0) contribute no x-component.\nNet force F = F0 (1 + 2 cos45\u00b0) = F0 (1 + \u221a2)\nF = (1/4\u03c0\u03b50)(qQ/R^2)(1 + \u221a2) i-hat  N.\nBook answer: F = (1/4\u03c0\u03b50)(qQ/R^2)(1 + \u221a2) i-hat N.",k:[["symmetry","cancel"],["qq","qq/r","qq/r^2","qq/r2","(1/4\u03c0\u03b50)","1/4\u03c0\u03b5","kqq"],["cos45","cos 45","45"],["1 + 2","1+2","1 + \u221a2","(1+\u221a2)","1+\u221a2"],["i-hat","i^","\u00ee","x-axis","along x","+x"]]},
{m:3,q:"Suppose a charge +q on Earth\u2019s surface and another +q charge is placed on the surface of the Moon. (a) Calculate the value of q required to balance the gravitational attraction between Earth and Moon (b) Suppose the distance between the Moon and Earth is halved, would the charge q change? (Take mE = 5.9 \u00d7 10^24 kg, mM = 7.9 \u00d7 10^22 kg)",a:"(Worked by me; the result matches the book\u2019s answer.)\n(a) For balance, the electrostatic repulsion equals the gravitational attraction:\nk q^2 / r^2 = G mE mM / r^2\nq^2 = G mE mM / k = (6.67 \u00d7 10^-11 \u00d7 5.9 \u00d7 10^24 \u00d7 7.9 \u00d7 10^22) / (9 \u00d7 10^9) = 3.45 \u00d7 10^27\nq = 5.87 \u00d7 10^13 C (approx.)\n(b) No change. Both forces vary as 1/r^2, so r cancels from the equation and q is independent of the distance.\nBook answer: (a) q \u2248 +5.87 \u00d7 10^13 C, (b) no change.",k:[["kq","k q","electrostatic","coulomb"],["g mem","g me mm","gmemm","g m","gravitational"],["q2","q^2","q\u00b2","sqrt","\u221a"],["5.87"],["no change","does not change","not change"],["1/r","r cancel","r2","r^2","distance"]]},
{m:3,q:"Consider an electron travelling with a speed v0 and entering into a uniform electric field E which is perpendicular to v0 as shown in the figure. Ignoring gravity, obtain the electron\u2019s acceleration, velocity and position as functions of time. [Figure described in words: the electron enters between two horizontal plates, the upper plate negative and the lower plate positive, with its velocity v0 along +x; the field E acts along the y-axis.]",a:"(Worked by me with the book\u2019s equations of motion; the result matches the book\u2019s answer.)\nThe force on the electron is F = \u2212eE (opposite to E), so its acceleration is perpendicular to the initial velocity:\na = F/m = \u2212(eE/m) j-hat (constant)\nAlong x there is no force, so vx = v0. Along y the motion is uniformly accelerated from rest: vy = \u2212(eE/m) t.\nVelocity: v = v0 i-hat \u2212 (eE/m) t j-hat\nPosition: x = v0 t, y = \u2212(1/2)(eE/m) t^2, so\nr = v0 t i-hat \u2212 (1/2)(eE/m) t^2 j-hat (a parabolic path).\nBook answer: a = \u2212(eE/m) j, v = v0 i \u2212 (eE/m) t j, r = v0 t i \u2212 (1/2)(eE/m) t^2 j.",k:[["f = \u2212ee","f = -ee","force"],["a = \u2212","a = -","eE/m","ee/m"],["perpendicular"],["v0"],["t^2","t2","t\u00b2"],["parabol"],["1/2","\u00bd"]]},
{m:3,q:"A spark plug in a bike or a car is used to ignite the air-fuel mixture in the engine. It consists of two electrodes separated by a gap of around 0.6 mm gap as shown in the figure. To create the spark, an electric field of magnitude 3 \u00d7 10^6 V m^-1 is required. (a) What potential difference must be applied to produce the spark? (b) If the gap is increased, does the potential difference increase, decrease or remains the same? (c) Find the potential difference if the gap is 1 mm.",a:"(Worked by me using V = Ed; the results match the book\u2019s answer.)\n(a) V = E d = 3 \u00d7 10^6 \u00d7 0.6 \u00d7 10^-3 = 1800 V\n(b) Since V = Ed and E (the field needed for a spark) is fixed, the potential difference increases when the gap d is increased.\n(c) V = E d = 3 \u00d7 10^6 \u00d7 1 \u00d7 10^-3 = 3000 V\nBook answer: (a) 1800 V, (b) increases, (c) 3000 V.",k:[["v = ed","v=ed","e d","ed"],["0.6"],["1800"],["increase"],["3000"]]}
]},
