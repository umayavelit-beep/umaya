"Current density J is the current per unit area of cross section of the conductor. Its SI unit is A m^-2. Current is a scalar but current density is a vector.",
"Mobility is the drift velocity per unit electric field: mu = vd / E. Its SI unit is m^2 V^-1 s^-1. The typical drift velocity of electrons in a wire is about 10^-4 m s^-1.",
"Macroscopic Ohm's law: the potential difference across a given conductor is directly proportional to the current passing through it when the temperature remains constant. V = IR, so R = V/I.",
"Ohmic materials have a straight-line current-voltage graph through the origin. Materials or devices that do not follow Ohm's law are non-ohmic (a diode is an example).",
"Resistance R = rho l / A: it is directly proportional to the length and inversely proportional to the area of cross section. Resistivity rho = 1/sigma (reciprocal of conductivity); its SI unit is ohm-metre.",
"Superconductors: below a critical (transition) temperature Tc the resistance becomes zero. Kammerlingh Onnes first observed this in 1911: mercury becomes superconducting at 4.2 K. Since R = 0, a current once induced persists without any potential difference.",
"Kirchhoff's current rule (junction rule): the algebraic sum of the currents at any junction of a circuit is zero. It is the law of conservation of electric charge. Current entering the junction is positive and current leaving it is negative.",
"Electric power is the rate at which electric energy is delivered: P = IV. In a resistor, the power converted to heat is P = I^2 R = V^2 / R. Heating elements of irons, heaters and toasters are made of nichrome, which has a high specific resistance.",

{m:2,q:"Define current density.",a:"The current density (J) is defined as the current per unit area of cross section of the conductor. Its SI unit is A m^-2. It is a vector quantity.",k:[["current"],["per unit area","unit area"],["cross section","cross-section"],["vector"],["a m","a/m"]]},
{m:2,q:"State macroscopic form of Ohm\u2019s law.",a:"The potential difference across a given conductor is directly proportional to the current passing through it when the temperature remains constant.\nV = IR (so R = V/I).",k:[["potential difference","voltage"],["directly proportional","proportional"],["current"],["temperature"],["constant"],["v = ir","v=ir"]]},
{m:2,q:"What are ohmic and non ohmic devices?",a:"Materials for which the current versus voltage graph is a straight line through the origin obey Ohm\u2019s law and their behaviour is said to be ohmic.\nMaterials or devices that do not follow Ohm\u2019s law are said to be non-ohmic (e.g. a diode).",k:[["straight line"],["origin"],["obey","follow"],["non-ohmic","non ohmic","nonohmic"],["diode"]]},
{m:2,q:"Define electrical resistivity.",a:"The electrical resistivity of a material is the resistance offered to current flow by a conductor of unit length having unit area of cross section (R = \u03c1l/A with l = 1 m and A = 1 m^2). It is the reciprocal of conductivity (\u03c1 = 1/\u03c3). Its SI unit is ohm-metre (\u03a9 m).",k:[["resistance"],["unit length"],["unit area","area of cross"],["reciprocal","1/"],["ohm"]]},
{m:2,q:"Write a short note on superconductors.",a:"The resistance of some materials becomes zero below a certain temperature Tc, called the critical (transition) temperature. Materials which exhibit this property are known as superconductors. It was first observed by Kammerlingh Onnes in 1911: mercury shows superconductor behaviour at 4.2 K. Since R = 0, a current once induced in a superconductor persists without any potential difference.",k:[["zero"],["critical","transition"],["temperature"],["onnes"],["mercury","4.2"],["persist"]]},
{m:2,q:"What is electric power and electric energy?",a:"Electric power is the rate at which electric energy is delivered. If a current I flows across a potential difference V, the power delivered is P = IV. In a resistor R, the power converted to heat is P = I^2 R = V^2/R.\nElectric energy: the work done (electric potential energy spent) when current I flows across potential difference V for time t is W = VIt.",k:[["rate"],["energy"],["p = iv","p=iv","vi"],["i2r","i^2 r","i^2r","v2/r","v^2"],["vit"]]},
{m:2,q:"State Kirchhoff\u2019s current rule.",a:"Kirchhoff\u2019s first rule (current rule or junction rule): the algebraic sum of the currents at any junction of a circuit is zero. It is a statement of the law of conservation of electric charge. Current entering the junction is taken as positive and current leaving the junction as negative.",k:[["algebraic sum"],["junction"],["zero"],["conservation"],["entering","enter"],["leaving","leave"]]},
{m:2,q:"What is Seebeck effect?",a:"In a closed circuit consisting of two dissimilar metals, when the junctions are maintained at different temperatures an emf (potential difference) is developed. The current that flows due to this emf is called thermoelectric current. The two dissimilar metals joined to form two junctions are called a thermocouple.",k:[["dissimilar","two different metals","two metals"],["junction"],["different temperature"],["emf","potential difference"],["thermocouple","thermoelectric"]]},
{m:2,q:"What is Peltier effect?",a:"In 1834, Peltier discovered that when an electric current is passed through a circuit of a thermocouple, heat is evolved at one junction and absorbed at the other junction. This is known as the Peltier effect.",k:[["current"],["thermocouple"],["heat"],["evolved","liberated","released"],["absorbed"],["junction"]]},
{m:3,q:"Lightning: there is 10^9 J energy transfer across the potential difference of 5 \u00d7 10^7 V during a time interval of 0.2 s. Estimate (a) the total amount of charge transferred between cloud and ground (b) the current in the lightning bolt (c) the power delivered in 0.2 s.",a:"(a) Energy = charge \u00d7 potential difference, so q = W/V = 10^9 / (5 \u00d7 10^7) = 20 C\n(b) I = q/t = 20 / 0.2 = 100 A\n(c) P = W/t = 10^9 / 0.2 = 5 \u00d7 10^9 W = 5 GW\n(Book answer: charge = 20 C, I = 100 A, P = 5 GW.)",k:[["20 c","20c","20 coulomb"],["100 a","100a","100 amp"],["5 gw","5 \u00d7 10^9","5x10^9","5 x 10^9"],["w/v","q = w","w = qv","qv"],["q/t","i = q/t"]]},
{m:2,q:"State Kirchhoff\u2019s second rule (voltage rule or loop rule).",a:"In a closed circuit the algebraic sum of the products of the current and resistance of each part of the circuit is equal to the total emf included in the circuit. This rule follows from the law of conservation of energy for an isolated system (the energy supplied by the emf sources is equal to the sum of the energy delivered to all the resistors). The product of current and resistance is taken as positive when the direction of the current is followed, and negative if the current is opposite to the direction of the loop.",k:[["algebraic sum"],["current and resistance","ir"],["emf"],["closed"],["conservation of energy","energy"],["opposite","negative"]]},
{m:5,q:"Explain the equivalent resistance of a series and parallel resistor network.",a:"RESISTORS IN SERIES: resistors connected end to end. The same current I passes through all of them, since charge cannot accumulate anywhere in the circuit. The voltages across them are V1 = IR1, V2 = IR2, V3 = IR3, and the supply voltage is the sum of these:\nV = V1 + V2 + V3 = I(R1 + R2 + R3) = I Rs\nso Rs = R1 + R2 + R3. The equivalent resistance in series is the sum of the individual resistances and is greater than each individual resistance.\n\nRESISTORS IN PARALLEL: resistors connected across the same potential difference. The total current splits: I = I1 + I2 + I3 (conservation of charge). The voltage across each resistor is the same, so I1 = V/R1, I2 = V/R2, I3 = V/R3. Hence\nI = V (1/R1 + 1/R2 + 1/R3) = V/Rp\nso 1/Rp = 1/R1 + 1/R2 + 1/R3.",k:[["series"],["parallel"],["same current"],["same potential","same voltage","same potential difference"],["sum"],["r1 + r2","r1+r2"],["1/rp","1/r1"],["conservation of charge","i = i1","i1 + i2"],["ohm"]]},
{m:5,q:"Explain the determination of the internal resistance of a cell using voltmeter.",a:"The emf \u03b5 of the cell is measured by connecting a high resistance voltmeter across it without any external resistance R (Fig. a). The voltmeter draws very little current, so the circuit may be considered open and the voltmeter reading gives the emf of the cell.\nThen an external resistance R is included and a current I is established (Fig. b). The potential difference across R equals the potential difference V across the cell: V = IR.\nDue to the internal resistance r, the voltmeter reads a value V less than the emf, because a voltage Ir drops across r:\nV = \u03b5 \u2212 Ir, so Ir = \u03b5 \u2212 V\nDividing Ir = \u03b5 \u2212 V by IR = V:\nr/R = (\u03b5 \u2212 V)/V, so r = R (\u03b5 \u2212 V) / V\nSince \u03b5, V and R are known, the internal resistance r can be determined.",k:[["voltmeter"],["high resistance"],["emf"],["open circuit","open","very little current"],["v = ir","v=ir"],["\u03b5 \u2212 ir","e - ir","\u03b5 - ir","emf - ir"],["r = r","(\u03b5","(e-v)","(e \u2212 v)"],["internal resistance"]]},
{m:2,q:"Distinguish between drift velocity and mobility.",a:"Drift velocity: the average velocity acquired by the electrons inside the conductor when it is subjected to an electric field. vd = \u2212(e\u03c4/m)E, where \u03c4 is the mean free time. Its SI unit is m s^-1.\nMobility: the magnitude of the drift velocity per unit electric field, \u00b5 = vd/E = e\u03c4/m. Its SI unit is m^2 V^-1 s^-1.",k:[["average velocity"],["electric field"],["mean free time","\u03c4","tau"],["per unit electric field","vd/e","vd / e"],["m s","m/s","ms-1"],["m2 v","m^2 v","m\u00b2"]]},
{m:2,q:"State microscopic form of Ohm\u2019s law.",a:"The current density J at a point in a conductor is directly proportional to the electric field E at that point: J = \u03c3E, where \u03c3 = ne^2\u03c4/m is the conductivity of the material (n = number of electrons per unit volume, e = electron charge, \u03c4 = mean free time, m = mass of the electron). This is called the microscopic form of Ohm\u2019s law.",k:[["j = \u03c3e","j=\u03c3e","j = sigma e","j = se"],["current density"],["electric field"],["conductivity"],["ne"]]},
{m:5,q:"Describe the microscopic model of current and obtain microscopic form of Ohm\u2019s law.",a:"Consider a conductor of area of cross section A with an electric field E applied. Let there be n electrons per unit volume, all moving with the same drift velocity vd.\nIn a small time dt an electron moves a distance dx = vd dt. The number of electrons in the volume element is (A dx) n = (A vd dt) n.\nTotal charge dQ = e (A vd dt) n, so the current I = dQ/dt = n e A vd.\nCurrent density J = I/A = n e vd (valid when the current is perpendicular to the area A; in general J = n e vd is a vector).\nThe electron acceleration in the field is a = \u2212eE/m (F = \u2212eE), and the drift velocity is vd = a\u03c4 = \u2212(e\u03c4/m)E, where \u03c4 is the mean free time.\nSubstituting: J = \u2212(n e^2 \u03c4/m) E = \u2212\u03c3E.\nTaking the direction of conventional current density as the direction of the electric field:\nJ = \u03c3E, where \u03c3 = n e^2 \u03c4/m is the conductivity.\nThis is the microscopic form of Ohm\u2019s law. The inverse of conductivity is the resistivity: \u03c1 = 1/\u03c3 = m/(n e^2 \u03c4).",k:[["drift velocity"],["n e a vd","neavd","i = nea","i = neav","nea"],["current density"],["mean free time","\u03c4","tau"],["j = \u03c3e","j=\u03c3e","j = se","\u03c3e"],["conductivity"],["a = \u2212ee/m","eqs","ee/m","f = ee","f = \u2212ee","-ee/m"],["resistivity","\u03c1"]]},
{m:5,q:"Obtain the macroscopic form of Ohm\u2019s law from its microscopic form and discuss its limitation.",a:"Take a wire of length l and area of cross section A. When a potential difference V is applied, a uniform electric field is created along the wire, so V = El.\nFrom the microscopic form, J = \u03c3E = \u03c3 V/l. But J = I/A, so I/A = \u03c3 V/l.\nRearranging: V = I (l/\u03c3A). The quantity l/(\u03c3A) is the resistance R of the conductor, so\nV = IR (macroscopic form of Ohm\u2019s law), i.e. R = V/I.\nStatement: the potential difference across a given conductor is directly proportional to the current passing through it when the temperature remains constant. The resistance is directly proportional to the length and inversely proportional to the area of cross section: R = \u03c1 l/A, with \u03c1 = 1/\u03c3.\nLimitations (from the book\u2019s discussion): Ohm\u2019s law holds only when the temperature remains constant, and only for ohmic materials whose current\u2013voltage graph is a straight line through the origin. Non-ohmic materials or devices (for example a diode) do not follow Ohm\u2019s law; their I\u2013V plot is non-linear and they do not have a constant resistance.",k:[["v = el","v=el"],["j = \u03c3e","j=\u03c3e","\u03c3e","j = se"],["j = i/a","i/a"],["v = ir","v=ir"],["l/\u03c3a","l/sa","l / \u03c3a","\u03c1l/a","\u03c1 l/a","l/(\u03c3a)"],["resistance"],["temperature","constant temperature"],["non-ohmic","non ohmic","nonohmic","diode"],["straight line","linear","non-linear"]]},
{m:5,q:"Explain the determination of unknown resistance using meter bridge.",a:"The meter bridge is another form of Wheatstone\u2019s bridge. It consists of a uniform manganin wire AB of one metre length stretched along a metre scale on a wooden board between two copper strips C and D. Between them another copper strip E is mounted to enclose two gaps G1 and G2. An unknown resistance P is connected in G1 and a standard resistance Q in G2. A jockey is connected to the central strip E through a galvanometer G and a high resistance HR. A Leclanche cell and a key K are connected between the ends of the bridge wire.\nWorking: the jockey position on the wire is adjusted until the galvanometer shows zero deflection (at J). The resistances of AJ and JB form the other two arms of the Wheatstone bridge. For balance:\nP/Q = R/S = r\u00b7AJ / r\u00b7JB = l1/l2 (r = resistance per unit length of the wire)\nso P = Q (l1/l2). Knowing Q, l1 and l2, the unknown resistance P is found.\nEnd resistances: imperfect contacts at the soldered ends introduce small errors. They are eliminated by taking a second set of readings with P and Q interchanged and finding the average value of P.\nSpecific resistance: if the radius a and length l of the wire of coil P are measured, \u03c1 = \u03c0a\u00b2P / l.",k:[["wheatstone"],["manganin"],["jockey"],["galvanometer"],["zero deflection","balance"],["l1/l2","l1 / l2","p/q"],["p = q","p=q"],["end resistance"],["interchange","interchanged"],["\u03c0a","pi a","specific resistance","resistivity"]]},
{m:5,q:"How the emf of two cells are compared using potentiometer?",a:"The potentiometer is used for the accurate measurement of potential differences, current and resistances. It has a long uniform wire of manganin or constantan (ten metres long, stretched in parallel rows of 1 m each) on a wooden board, with a metre scale and a jockey.\nCircuit: a battery Bt, key K (and rheostat Rh) are connected in series with the wire CD \u2013 this is the primary circuit. The end C is connected to terminal M of a DPDT (double pole double throw) switch and the other terminal N is connected to the jockey through a galvanometer G and a high resistance HR. The cells \u03b51 and \u03b52 to be compared are connected to terminals M1, N1 and M2, N2 of the DPDT switch. The positive terminals of Bt, \u03b51 and \u03b52 must be connected to the same end C.\nWorking: the DPDT switch is pressed towards M1, N1 so that cell \u03b51 is in the secondary circuit; the jockey is adjusted for zero galvanometer deflection and the balancing length l1 is found. Then \u03b52 is included and the balancing length l2 is found.\nIf I is the current in the wire and r the resistance per unit length, the potential difference across the balancing length equals the emf:\n\u03b51 = I r l1 and \u03b52 = I r l2\nDividing: \u03b51/\u03b52 = l1/l2.\nBy including the rheostat in the primary circuit, the experiment can be repeated several times by changing the current.",k:[["potentiometer"],["balancing length","balancing"],["dpdt"],["galvanometer"],["primary circuit"],["secondary circuit"],["\u03b51 = irl1","e1 = irl1","irl1","i r l1"],["\u03b51/\u03b52","e1/e2","l1/l2","l1 / l2"],["zero deflection","no current"]]},
{m:2,q:"Why current is a scalar?",a:"In general the current I is defined as the scalar product of the current density and the area vector through which the charges cross: I = J\u00b7A = JA cos\u03b8. Since this is a scalar (dot) product, the current is a scalar quantity; it can be positive or negative depending on the choice of the unit vector normal to the surface area A, but it is not a vector. (Current density J, in contrast, is a vector.)",k:[["scalar product","dot product","j\u00b7a","j.a","i = ja"],["current density"],["area vector","area"],["cos\u03b8","cos"],["positive or negative","sign"]]},
{m:2,q:"Obtain the condition for bridge balance in Wheatstone\u2019s bridge.",a:"The bridge has four resistances P, Q, R and S; a galvanometer G is connected between B and D and the battery between A and C. Let IG be the galvanometer current. By Kirchhoff\u2019s current rule at B and D: I1 \u2212 IG \u2212 I3 = 0 and I2 + IG \u2212 I4 = 0.\nWhen B and D are at the same potential the bridge is balanced and IG = 0, so I1 = I3 and I2 = I4. Kirchhoff\u2019s voltage rule for loop ABDA gives I1P = I2R (2.51) and for the other loop I3Q = I4S (2.52). Dividing (2.52) by (2.51):\nP/Q = R/S   (2.53)\nThis is the condition for bridge balance: only under this condition the galvanometer shows null deflection. If three of the resistances are known, the fourth can be determined.",k:[["p/q","p / q"],["r/s","r / s"],["galvanometer"],["null deflection","zero deflection","ig = 0","ig=0"],["same potential"],["kirchhoff"]]},
{m:2,q:"State the principle of potentiometer.",a:"When a constant current flows through a wire of uniform area of cross section, the potential drop across any length of the wire is directly proportional to that length. (Potential difference across length l of the wire = I r l, where r is the resistance per unit length.)",k:[["constant current"],["uniform"],["potential drop","potential difference"],["directly proportional","proportional"],["length"]]},
{m:2,q:"What is Thomson effect?",a:"Thomson showed that if two points in a conductor are at different temperatures, the density of electrons at these points differs, and as a result a potential difference is created between them. The effect is reversible. If current passes through a copper bar heated at its middle point C, heat is absorbed along AC and evolved along CB \u2013 heat is carried in the direction of the current (positive Thomson effect: copper, silver, zinc, cadmium). With an iron bar, heat is evolved along CA and absorbed along BC \u2013 heat is transferred opposite to the current direction (negative Thomson effect: platinum, nickel, cobalt, etc.).",k:[["different temperature"],["density of electrons","electron density"],["potential difference"],["reversible"],["positive thomson","positive"],["negative thomson","negative"],["heat"]]},
{m:2,q:"State the applications of Seebeck effect.",a:"1. It is used in thermoelectric generators (Seebeck generators), which are used in power plants to convert waste heat into electricity.\n2. It is utilised in automobiles as automotive thermoelectric generators for increasing fuel efficiency.\n3. It is used in thermocouples and thermopiles to measure the temperature difference between two objects.",k:[["thermoelectric generator","seebeck generator"],["waste heat"],["automobile","automotive"],["fuel efficiency"],["thermocouple","thermopile"],["temperature difference","measure"]]},
{m:3,q:"A copper wire of 10^-6 m^2 area of cross section, carries a current of 2 A. If the number of free electrons per cubic meter in the wire is 8 \u00d7 10^28, calculate the current density and average drift velocity of electrons.",a:"(Worked by me; the results match the book\u2019s answer.)\nCurrent density J = I/A = 2 / 10^-6 = 2 \u00d7 10^6 A m^-2\nFrom J = n e vd, drift velocity vd = J/(n e) = (2 \u00d7 10^6) / (8 \u00d7 10^28 \u00d7 1.6 \u00d7 10^-19) = 1.56 \u00d7 10^-4 m s^-1 = 15.6 \u00d7 10^-5 m s^-1\nBook answer: J = 2 \u00d7 10^6 A m^-2, vd = 15.6 \u00d7 10^-5 m s^-1.",k:[["j = i/a","i/a"],["2 \u00d7 10^6","2x10^6","2 x 10^6","2\u00d710^6"],["j = ne","nevd","n e vd","vd = j/"],["15.6","1.56"]]},
{m:3,q:"The resistance of a nichrome wire at 20\u00b0C is 10 \u03a9. If its temperature coefficient of resistivity of nichrome is 0.004/\u00b0C, find the resistance of the wire at boiling point of water. Comment on the result.",a:"(Worked by me using R_T = R_0 [1 + \u03b1(T \u2212 T_0)]; the result matches the book\u2019s answer.)\nR_T = 10 [1 + 0.004 (100 \u2212 20)] = 10 [1 + 0.32] = 13.2 \u03a9\nComment: as the temperature increases, the resistance of the wire also increases.\nBook answer: R_T = 13.2 \u03a9; as the temperature increases the resistance of the wire also increases.",k:[["1 + \u03b1","1+\u03b1","\u03b1(t","r0"],["0.004"],["80","100"],["13.2"],["increase"]]},
{m:2,q:"State and explain Kirchhoff\u2019s rules.",a:"Kirchhoff\u2019s first rule (current rule or junction rule): the algebraic sum of the currents at any junction of a circuit is zero. It is a statement of the law of conservation of electric charge. Current entering the junction is taken as positive and current leaving the junction as negative.\nKirchhoff\u2019s second rule (voltage rule or loop rule): in a closed circuit the algebraic sum of the products of the current and resistance of each part of the circuit is equal to the total emf included in the circuit. It follows from the law of conservation of energy. The product of current and resistance is taken as positive when the direction of the current is followed, and negative if the current is opposite to the direction of the loop.",k:[["first rule","current rule","junction rule"],["second rule","voltage rule","loop rule"],["algebraic sum"],["conservation of charge","conservation of electric charge"],["conservation of energy"],["emf"],["zero"]]},
{m:2,q:"Define temperature coefficient of resistance.",a:"The resistance of a conductor at temperature T is R_T = R_0 [1 + \u03b1 (T \u2212 T_0)], where R_0 is the resistance at the reference temperature T_0 (usually 20\u00b0C). The temperature coefficient \u03b1 is defined as the ratio of the increase in resistance (or resistivity) per degree rise in temperature to its resistance (or resistivity) at T_0:\n\u03b1 = (1/R_0)(\u0394R/\u0394T), where \u0394R = R_T \u2212 R_0 is the change in resistance for the change in temperature \u0394T = T \u2212 T_0. Its unit is per \u00b0C.",k:[["ratio"],["increase in resistance","increase in resistivity","change in resistance"],["per degree","degree rise","unit rise"],["reference temperature","t0","t_0"],["\u0394r","delta r"],["r0","r_0","resistance at"]]},
{m:2,q:"Derive the expression for power P = VI in electrical circuit.",a:"If a current I flows through a conductor kept across a potential difference V for a time t, the work done (the electric potential energy spent) is W = VIt (Joule\u2019s law, eq. 2.66).\nPower is the rate at which work is done (energy is delivered): P = W/t = VIt/t\nP = VI",k:[["w = vit","w=vit","vit"],["rate","w/t"],["p = vi","p=vi","vi"],["potential difference"],["current"]]},
{m:2,q:"Write down the various forms of expression for power in electrical circuit.",a:"Electric power P = IV, where I is the current and V the potential difference. For a resistor R, using Ohm\u2019s law V = IR, the power converted to heat is\nP = IV = I^2 R = V^2 / R.",k:[["p = iv","p=iv","iv","vi"],["i2r","i^2 r","i^2r","i\u00b2r"],["v2/r","v^2/r","v^2 / r","v\u00b2/r"],["ohm"]]},
{m:2,q:"What do you mean by internal resistance of a cell?",a:"A battery or cell is a source of electromotive force (emf), the voltage provided by the cell when no current flows in the external circuit. An ideal battery has zero internal resistance, and its terminal voltage equals its emf. In reality the cell is made of electrodes and an electrolyte, which offer resistance to the flow of charges inside the cell. This resistance is called the internal resistance r of the cell. For a real battery the terminal voltage is not equal to the emf. A freshly prepared cell has low internal resistance, which increases with ageing.",k:[["emf"],["electrodes","electrolyte"],["resistance to the flow","resistance"],["inside the cell","within the battery","within the cell","inside the battery"],["terminal voltage"],["ageing","aging"],["ideal"]]},
{m:2,q:"State Joule\u2019s law of heating.",a:"If a current I flows through a resistance R for a time t, the heat produced is H = I^2 R t (for a given potential difference H = VIt). Joule\u2019s law of heating states that the heat developed in an electrical circuit due to the flow of current varies directly as (i) the square of the current, (ii) the resistance of the circuit and (iii) the time of flow.",k:[["h = i2rt","h = i^2 rt","i^2rt","i2rt","i^2 r t","i\u00b2rt"],["square of the current","square of current"],["resistance"],["time"],["directly"]]}
]},
3:{exp:[
"Magnetic field lines: the direction of the magnetic field at any point on the curve is known by drawing a tangent to the field line at that point. Magnetic field lines never intersect each other; otherwise the compass needle would point in two different directions, which is not possible. The degree of closeness of the field lines determines the relative strength of the field: the field is strong where lines crowd and weak where they are well separated.",
"Magnetic flux: the number of magnetic field lines crossing any area normally is defined as the magnetic flux through the area. For a uniform field B and area A, the flux is maximum, \u03a6B = BA, when B is normal to the surface (\u03b8 = 0\u00b0).",
"Magnetic dipole moment of a bar magnet: if qm is the pole strength and l the distance from the geometrical centre of the magnet to one pole, the magnetic dipole moment is defined as the product of its pole strength and magnetic length. It is a vector quantity.",
"Earth\u2019s magnetic field is specified on its surface by three quantities, called the elements of the Earth\u2019s magnetic field: (a) magnetic declination D, (b) magnetic dip or inclination I, (c) the horizontal component of the Earth\u2019s magnetic field BH. The magnetic declination is the angle between the magnetic meridian and the geographic meridian.",
"Similarities between electric and magnetic fields: both obey the inverse square law, so they are long-range fields; both obey the principle of superposition and are linear with respect to the source. In magnitude, E is proportional to q and B is proportional to I dl.",
"Force on a current-carrying conductor in a magnetic field: if the conductor is placed parallel to the field (\u03b8 = 0\u00b0) the force is zero; if it is placed perpendicular to the field (\u03b8 = 90\u00b0) the force is maximum, F = BIl. The direction is given by Fleming\u2019s left hand rule: stretch out the forefinger, middle finger and thumb of the left hand in three mutually perpendicular directions.",
"Hysteresis: for a ferromagnetic material, B = \u00b5H is not a constant relation. When iron is magnetised slowly by a magnetising field H, the magnetic induction B increases from point A with the magnitude of H and then attains a saturation level."],

{m:2,q:"Define magnetic flux.",a:"The number of magnetic field lines crossing any area normally is defined as the magnetic flux \u03a6B through the area. For a uniform magnetic field B and an area A, the flux is \u03a6B = BA cos\u03b8, where \u03b8 is the angle between B and the normal to the area. It is maximum (\u03a6B = BA) when B is normal to the surface (\u03b8 = 0\u00b0).",k:[["number of"],["field lines","magnetic field lines"],["area"],["normal","normally","perpendicular"],["ba","b a","bacos","ba cos"],["maximum"]]},
{m:2,q:"Define magnetic dipole moment.",a:"For a bar magnet, let qm be the pole strength of the magnetic pole and l the distance between the geometrical centre of the magnet and one end of the pole (so the magnetic length is 2l). The magnetic dipole moment is defined as the product of its pole strength and magnetic length. It is a vector quantity, denoted by pm.",k:[["product"],["pole strength"],["magnetic length","length"],["vector"],["qm","q m"]]},
{m:2,q:"State Fleming\u2019s left hand rule.",a:"When a current-carrying conductor is placed in a magnetic field, the direction of the force experienced by it is given by Fleming\u2019s left hand rule: stretch out the forefinger, the middle finger and the thumb of the left hand so that they are in three mutually perpendicular directions. If the forefinger points in the direction of the magnetic field and the middle finger in the direction of the current, then the thumb points in the direction of the force.",k:[["forefinger"],["middle finger"],["thumb"],["mutually perpendicular","perpendicular"],["left hand"],["direction of the force","force"]]},
{m:2,q:"State Biot-Savart law.",a:"Jean-Baptiste Biot and Felix Savart (1819) did quantitative experiments on the force on a magnet near a current-carrying wire and arrived at an expression for the magnetic field at a point in terms of the current producing it, valid for any shape of the conductor. For a current element I dl at a distance r from the point, making an angle \u03b8 with the line joining them, the magnetic field is\ndB \u221d I dl sin\u03b8 / r^2, i.e. dB = k I dl sin\u03b8 / r^2, where k = \u00b50/4\u03c0 in SI units.\nSo the field is directly proportional to the current I, the length dl of the element and sin\u03b8, and inversely proportional to the square of the distance r.",k:[["current element","i dl","idl"],["sin\u03b8","sin"],["r^2","r2","square of the distance","square of distance"],["directly proportional","proportional"],["\u00b50/4\u03c0","mu/4","k ="],["inversely"]]},
{m:2,q:"What is magnetic permeability?",a:"The magnetic permeability is the measure of the ability of a material to allow the passage of magnetic field lines through it, or the measure of the capacity of the substance to take magnetisation, or the degree of penetration of the magnetic field through the substance. In free space the (absolute) permeability is denoted by \u00b50 and for any other medium by \u00b5. The relative permeability \u00b5r is the ratio between the absolute permeability of the medium and the permeability of free space: \u00b5r = \u00b5/\u00b50.",k:[["ability","measure"],["magnetic field lines","field lines"],["passage","penetration"],["free space"],["\u00b50","mu0","\u00b5 0"],["relative permeability","\u00b5r","ratio"]]},
{m:2,q:"State Ampere\u2019s circuital law.",a:"Ampere\u2019s law: the line integral of the magnetic field over a closed loop is \u00b50 times the net current enclosed by the loop:\n\u222e B\u00b7dl = \u00b50 I(enclosed)\nwhere I(enclosed) is the net current linked by the closed loop C. The line integral does not depend on the shape of the path or on the position of the conductor within the loop. It is used to calculate the magnetic field whenever there is symmetry in the problem, similar to Gauss\u2019s law in electrostatics.",k:[["line integral"],["closed loop","closed path","closed"],["\u00b50","mu0","mu"],["net current","current enclosed","enclosed"],["\u222e","b.dl","b\u00b7dl"]]},
{m:2,q:"What is resonance condition in cyclotron?",a:"The important condition in cyclotron operation is that the frequency f at which the positive ion circulates in the magnetic field must be equal to the constant frequency of the electrical oscillator, f_osc. This is called the resonance condition:\nf = f_osc = qB / (2\u03c0m), and the time period is T = 2\u03c0m / (qB).",k:[["frequency"],["oscillator"],["equal"],["resonance"],["qb/2\u03c0m","qb / 2\u03c0m","qb/(2\u03c0m)","2\u03c0m"],["circulat","magnetic field"]]},
{m:2,q:"Define ampere.",a:"One ampere is defined as that constant current which, when passed through each of two infinitely long parallel straight conductors kept side by side at a distance of one metre apart in air or vacuum, causes each conductor to experience a force of 2 \u00d7 10^-7 newton per metre length of the conductor. (In November 2018 the ampere was redefined along with three other SI base units: the kilogram, kelvin and mole.)",k:[["constant current"],["parallel"],["one metre","1 m","one meter"],["vacuum","air"],["2 \u00d7 10","2x10","2 x 10"],["newton per metre","n m","per metre length","force"]]},
{m:2,q:"Explain the concept of velocity selector.",a:"In a region between the parallel plates of a capacitor there is a uniform electric field E, and a uniform magnetic field B is maintained perpendicular to E. A charged particle of charge q enters with velocity v; the net force is F = q(E + v \u00d7 B). The electric force and the Lorentz force act in opposite directions. When they balance, qE = qvB, so\nv = E/B\nOnly a particle with this particular speed moves undeflected. The speed is independent of the mass and charge. By proper choice of E and B, particles with a particular speed can be selected. Such an arrangement of fields is called a velocity selector. The principle is used in the Bainbridge mass spectrograph to separate isotopes.",k:[["electric field","e"],["magnetic field","b"],["perpendicular"],["qe = qvb","qe=qvb","balance"],["v = e/b","v=e/b","e/b"],["independent of"],["isotopes","bainbridge"]]},
{m:2,q:"What happens to the domains in a ferromagnetic material in the presence of external magnetic field?",a:"A ferromagnetic material is made up of smaller regions called ferromagnetic domains. Within each domain the magnetic moments are spontaneously aligned in one direction (caused by the strong interaction arising from electron spin, which depends on the inter-atomic distance), but the direction varies from domain to domain, so the net magnetisation of the specimen is zero. In the presence of an external magnetic field two processes take place: (1) the domains having magnetic moments parallel to the field grow bigger in size; (2) the other domains (not parallel to the field) are rotated so that they are aligned with the field.",k:[["domain"],["parallel to the field","parallel"],["grow","bigger"],["rotate","rotated"],["aligned","align"],["net magnetisation","zero"]]},
{m:2,q:"What is magnetic susceptibility?",a:"When a substance is kept in a magnetising field H, the magnetic susceptibility gives information about how a material responds to the external (applied) magnetic field; it measures how easily and how strongly a material can be magnetised. It is defined as the ratio of the intensity of magnetisation (M) induced in the material to the magnetising field (H):\n\u03c7m = M / H.",k:[["ratio"],["intensity of magnetisation","magnetisation"],["magnetising field","h"],["\u03c7m = m/h","\u03c7m=m/h","m/h","m / h"],["how easily","responds","magnetised"]]},
{m:2,q:"What is meant by hysteresis?",a:"For a ferromagnetic material the relation B = \u00b5H is not a constant. When a ferromagnetic material is magnetised slowly, B increases with the magnetising field H up to a saturation level. When H is reduced, B does not retrace the original path but follows a different one: at H = 0 the magnetic induction is not zero (the residual magnetism, called remanence or retentivity). To bring the residual magnetism to zero, a magnetising field in the reverse direction is required; its magnitude is the coercivity. This lagging of B behind H, giving a closed B\u2013H loop, is hysteresis.",k:[["ferromagnetic"],["b\u2013h","b-h","b vs h","loop"],["saturation"],["not retrace","does not retrace","different path","lag"],["remanence","retentivity","residual"],["coercivity","reverse"]]},
{m:2,q:"Define magnetic declination and inclination.",a:"Magnetic declination (D): the angle between the magnetic meridian at a point and the geographical meridian.\nMagnetic inclination or dip (I): the angle subtended by the Earth\u2019s total magnetic field B with the horizontal direction in the magnetic meridian at that point.",k:[["declination"],["magnetic meridian"],["geographical meridian","geographic meridian"],["inclination","dip"],["total magnetic field","earth"],["horizontal"]]},
{m:2,q:"Is an ammeter connected in series or parallel in a circuit? Why?",a:"An ammeter is connected in series. An ammeter is an instrument used to measure the current flowing in an electrical circuit. It must offer low resistance so that it does not change the current passing through it; hence it is connected in series to measure the circuit current.",k:[["series"],["low resistance"],["current"],["not change","does not change","will not change"],["measure"]]},
{m:2,q:"Why is the path of a charged particle not a circle when its velocity is not perpendicular to the magnetic field?",a:"If the velocity is not perpendicular to the field, it has a component along the field and a component perpendicular to the field. The component of velocity along the field remains unchanged, while the component perpendicular to the field keeps changing direction due to the Lorentz force. Hence the path of the particle is not a circle; it is a helix around the field lines (helical path).",k:[["component"],["along the field","parallel"],["perpendicular"],["unchanged","remains"],["lorentz force"],["helical","helix"]]},
{m:2,q:"How can a galvanometer be converted into (i) an ammeter and (ii) a voltmeter?",a:"(i) Ammeter: a galvanometer is converted into an ammeter by connecting a low resistance, called shunt resistance S, in parallel with the galvanometer. The scale is calibrated in ampere, and the range of the ammeter depends on the value of the shunt resistance.\n(ii) Voltmeter: a galvanometer is converted into a voltmeter by connecting a high resistance Rh in series with the galvanometer. The voltmeter resistance is Rv = Rg + Rh. The scale is calibrated in volt.",k:[["shunt","low resistance"],["parallel"],["ammeter"],["voltmeter"],["high resistance"],["series"],["rv = rg + rh","rg + rh","rg+rh"]]},
{m:5,q:"Discuss the conversion of galvanometer into an ammeter and also a voltmeter.",a:"A galvanometer is a very sensitive instrument to detect current. It can be easily converted into an ammeter and a voltmeter.\nGALVANOMETER TO AN AMMETER: an ammeter measures the current flowing in the circuit. It must offer low resistance so that it does not change the current passing through it, so it is connected in series. A galvanometer is converted into an ammeter by connecting a low resistance, called the shunt resistance S, in parallel with the galvanometer. The scale is now calibrated in ampere, and the range depends on S. Since the deflection of the galvanometer is proportional to the current through it (\u03b8 \u221d Ig \u221d I), the deflection is a measure of the circuit current I. The shunt carries the remaining current I \u2212 Ig. With galvanometer resistance Rg, the shunt and the galvanometer are in parallel, so the effective resistance of the ammeter is Ra = Rg S/(Rg + S). If I = n Ig (the range is increased n times), the required shunt resistance is S = Rg/(n \u2212 1).\nGALVANOMETER TO A VOLTMETER: a voltmeter measures the potential difference across two points. It should not draw any current from the circuit, otherwise the potential difference being measured would change; so it must have a high resistance and is connected in parallel across the points. A galvanometer is converted into a voltmeter by connecting a high resistance Rh in series with it. The current through the galvanometer is Ig = V/(Rg + Rh), so the effective resistance of the voltmeter is Rv = Rg + Rh, and the series resistance required is Rh = V/Ig \u2212 Rg. Since Ig \u221d V, the scale is calibrated in volt.",k:[["ammeter"],["voltmeter"],["shunt"],["parallel"],["series"],["low resistance"],["high resistance"],["rg + rh","rv = rg","rh = v","rg+rh"],["s = rg","rg/(n","n \u2212 1","n - 1","n-1"],["calibrated"],["i \u2212 ig","i - ig"]]},
{m:5,q:"Deduce the relation for the magnetic field at a point due to an infinitely long straight conductor carrying current using Biot-Savart law.",a:"Let YY\u2032 be an infinitely long conductor carrying a steady current I. To find the magnetic field at a point P at a distance a from the wire, consider a small line element dl (segment AB). By Biot\u2013Savart law the field at P due to the current element I dl is\ndB = (\u00b50/4\u03c0)(I dl sin\u03b8 / r^2) n-hat\nwhere n-hat is the unit vector pointing into the page at P, \u03b8 is the angle between the element I dl and the line joining dl to P, and r is the distance of the element from P.\nDraw a perpendicular AC from A to BP. In triangle ABC, AC = AB sin\u03b8 = dl sin\u03b8. Let d\u03c6 be the angle subtended at P (\u2220APB = \u2220APC = d\u03c6). In triangle APC, sin(d\u03c6) \u2248 d\u03c6 = AC/AP, so AC = r d\u03c6. Hence dl sin\u03b8 = r d\u03c6.\nTherefore dB = (\u00b50/4\u03c0)(I/r^2)(r d\u03c6) n-hat = (\u00b50/4\u03c0)(I d\u03c6 / r) n-hat.\nLet \u03c6 be the angle between AP and OP (O the foot of the perpendicular from P). In triangle OPA, cos\u03c6 = a/r, so r = a/cos\u03c6, and\ndB = (\u00b50 I /4\u03c0a) cos\u03c6 d\u03c6 n-hat.\nThe total field due to the conductor is\nB = \u222b(\u2212\u03c61 to \u03c62) (\u00b50 I /4\u03c0a) cos\u03c6 d\u03c6 n-hat = (\u00b50 I /4\u03c0a)[sin\u03c6] n-hat = (\u00b50 I /4\u03c0a)(sin\u03c61 + sin\u03c62) n-hat.\nFor an infinitely long conductor, \u03c61 = \u03c62 = 90\u00b0, so\nB = (\u00b50 I / 2\u03c0a) n-hat   (3.36)",k:[["biot"],["current element","i dl","idl"],["sin\u03b8","dl sin"],["d\u03c6","dphi"],["cos\u03c6","a/r","r = a"],["\u222b","integral","integrat"],["sin\u03c61","sin\u03c62","90"],["\u00b50 i","\u00b50i","mu0 i","\u00b50 i/2\u03c0a","2\u03c0a"],["infinitely long"]]},
{m:5,q:"Obtain a relation for the magnetic field at a point along the axis of a circular coil carrying current using Biot-Savart law.",a:"Consider a circular loop of radius R carrying a current I. Find the magnetic field at a point P on the axis, at a distance z from the centre O of the loop. Take two diametrically opposite line elements of the coil, each of length dl, at C and D. Let r be the vector joining the current element (I dl) at C and the point P.\nBy Biot\u2013Savart law the field at P due to the element at C is dB = (\u00b50/4\u03c0)(I dl \u00d7 r-hat / r^2). Its magnitude is dB = (\u00b50/4\u03c0)(I dl sin\u03b8 / r^2) = (\u00b50/4\u03c0)(I dl / r^2), because \u03b8 = 90\u00b0 (dl is perpendicular to r). The direction of dB is perpendicular to both I dl and CP, i.e. along PR perpendicular to CP.\nThe element at D gives a field of the same magnitude (equal distance from the coil) but in the direction PS. Each dB is resolved into two components: dB cos\u03c6 along the y-direction and dB sin\u03c6 along the z-direction (the axis). The components dB cos\u03c6 cancel; only the components dB sin\u03c6 add to the net field:\nB = \u222b dB sin\u03c6 k-hat = (\u00b50 I /4\u03c0) \u222b (dl / r^2) sin\u03c6 k-hat.\nFrom triangle OCP, sin\u03c6 = R/(R^2 + z^2)^(1/2) and r^2 = R^2 + z^2. Substituting:\nB = (\u00b50 I /4\u03c0) [R/(R^2 + z^2)^(3/2)] k-hat \u222b dl.\nIntegrating the line element from 0 to 2\u03c0R gives \u222b dl = 2\u03c0R, so\nB = (\u00b50 I /2) [R^2/(R^2 + z^2)^(3/2)] k-hat.\nFor a coil of N turns: B = (\u00b50 N I /2) [R^2/(R^2 + z^2)^(3/2)] k-hat   (3.37)\nAt the centre of the coil (z = 0): B = (\u00b50 N I / 2R) k-hat   (3.38).",k:[["biot"],["diametrically opposite","two elements","opposite"],["sin\u03c6","cos\u03c6","components"],["cancel"],["r^2 = r^2 + z^2","r2 + z2","r^2 + z^2"],["2\u03c0r","2\u03c0 r","\u222b dl"],["\u00b50 i","\u00b50i","\u00b50 n i","\u00b50ni"],["(r^2 + z^2)","r2 + z2","3/2"],["z = 0","centre","center"]]},
{m:5,q:"What is tangent law? Discuss in detail.",a:"TANGENT LAW: when a magnetic needle or magnet is freely suspended in two mutually perpendicular uniform magnetic fields, it will come to rest in the direction of the resultant of the two fields. If B is the field produced by the current in the coil and BH is the horizontal component of the Earth\u2019s magnetic field, the needle comes to rest making an angle \u03b8 with BH such that\nB = BH tan\u03b8   (3.39)\nTANGENT GALVANOMETER: a moving magnet type galvanometer used to detect very small currents; its working is based on the tangent law.\nConstruction: it consists of a coil of several turns of copper wire wound on a non-magnetic circular frame (brass or wood) mounted vertically on a horizontal base table with three levelling screws. It has two or more coils of different numbers of turns (2, 5 and 50 turns), of different thickness, for measuring currents of different strengths. At the centre of the turn table is a compass box with a small magnetic needle pivoted at its centre so that the centres of the needle and the coil coincide. A thin aluminium pointer attached perpendicular to the needle moves over a circular scale divided into four quadrants, each graduated 0\u00b0 to 90\u00b0; a mirror below the pointer avoids parallax error.\nPrecautions: (1) nearby magnets and magnetic materials are kept away; (2) the levelling screws are adjusted using a spirit level so that the needle is exactly horizontal and the coil exactly vertical; (3) the plane of the coil is kept parallel to the small needle by rotating the coil about its vertical axis, so that the coil remains in the magnetic meridian; (4) the compass box alone is rotated so that the pointer reads 0\u00b0\u20130\u00b0.\nTheory: with no current the needle lies along BH. When current passes through the coil of radius R and N turns, the coil produces a field B at its centre acting normal to the plane of the coil, perpendicular to BH. The needle is deflected through an angle \u03b8, and by the tangent law B = BH tan\u03b8. The field at the centre is B = \u00b50 N I / 2R (3.40). Hence\n\u00b50 N I / 2R = BH tan\u03b8, so the horizontal component of the Earth\u2019s field is BH = \u00b50 N I / (2R tan\u03b8), and the current I is proportional to tan\u03b8.",k:[["mutually perpendicular","perpendicular"],["resultant"],["b = bh tan","bh tan","tan\u03b8","tan"],["moving magnet"],["compass","pointer","needle"],["levelling","leveling","precaution"],["magnetic meridian"],["\u00b50 ni","\u00b50ni","\u00b50 n i","ni/2r","2r"],["horizontal component"],["coil"]]},
{m:5,q:"Derive an expression for the torque on a current-carrying coil in a magnetic field.",a:"Consider a rectangular loop PQRS of length a and breadth b carrying current I, placed in a uniform magnetic field B. The unit vector n-hat normal to the plane of the loop makes an angle \u03b8 with the field.\nThe force on arm PQ is FPQ = IaB sin(\u03c0/2) = IaB, directed by the right-hand corkscrew rule. The force on arm QR is FQR = IbB sin(\u03c0/2 \u2212 \u03b8) = IbB cos\u03b8, and the forces on arm RS and arm SP are equal and opposite to FPQ and FQR respectively. FQR and FSP are equal, opposite and collinear, so they cancel. FPQ and FRS are equal and opposite but not along the same line, so they form a couple that rotates the loop.\nThe torque on arm PQ about axis AB is \u03c4PQ = (b/2) sin\u03b8 IaB, and the torque on arm RS about AB has the same magnitude and direction. The total torque is\n\u03c4 = (b/2) sin\u03b8 FPQ + (b/2) sin\u03b8 FRS = I a b sin\u03b8 B = IAB sin\u03b8   (A = ab, the area of the loop)\nIn vector form \u03c4 = I A \u00d7 B = pm \u00d7 B, where pm = IA is the magnetic dipole moment of the loop.\nFor a coil of N turns: \u03c4 = NIAB sin\u03b8.\nSpecial cases: (a) when \u03b8 = 90\u00b0 (the plane of the loop is parallel to the field) the torque is maximum, \u03c4max = IAB; (b) when \u03b8 = 0\u00b0 or 180\u00b0 (the plane of the loop is perpendicular to the field) the torque is zero. The torque tends to rotate the loop so as to align its normal vector with the direction of the magnetic field. This is the principle of the motor.",k:[["rectangular","loop"],["normal"],["iab sin","iabsin","nab sin","niab"],["iab sin","f = ibb","ibb","fpq"],["couple"],["cancel","cancels"],["pm = ia","pm=ia","p m","ia"],["x b","\u00d7 b","pm x b","p x b"],["maximum","zero"],["90","0"]]},
{m:5,q:"Describe the construction and working of a moving coil galvanometer.",a:"PRINCIPLE: a current-carrying coil placed in a uniform magnetic field experiences a torque, and this torque deflects the coil.\nCONSTRUCTION: it consists of a rectangular coil PQRS of insulated thin copper wire with a large number of turns wound over a light metallic frame. A cylindrical soft-iron core is placed symmetrically inside the coil, so the field is radial. The rectangular coil is suspended freely between the two pole pieces of a horse-shoe magnet, which has hemispherical poles and so produces a radial magnetic field. The upper end of the coil is attached to a fine strip of phosphor bronze and the lower end to a hair spring, also of phosphor bronze, which is connected to a terminal. A small plane mirror is attached to the suspension strip to measure the deflection of the coil with a lamp and scale arrangement. The other end of the mirror is connected to a torsion head, so that current can pass through the galvanometer.\nWORKING: for a single turn of length l and breadth b, the sides QR and SP are always parallel to the magnetic field and experience no force, while the sides PQ and RS are always perpendicular to the field and experience equal and opposite forces. Due to this a torque is produced: \u03c4 = bF = bBI l = BIA (A = lb). For a coil of N turns the deflecting torque is \u03c4 = NBIA. Because the field is radial, the plane of the coil is always parallel to the field at any angle, so the torque does not depend on the angle of deflection. The deflecting torque is balanced by the restoring torque of the suspension strip and the hair spring: \u03c4restoring = k\u03b8, where k is the torsional constant. At equilibrium NBIA = k\u03b8, so \u03b8 = (NBA/k) I. The deflection is therefore directly proportional to the current, and the scale is linear.",k:[["principle"],["soft iron","soft-iron","iron core"],["radial"],["horse","horseshoe","horse-shoe"],["phosphor bronze"],["mirror"],["n b i a","nbia","\u03c4 = nbia","nbia"],["torsion","restoring"],["k\u03b8","k\u03b8","\u03b8 = ","proportional","linear"],["hemispherical","hemi"]]},
{m:2,q:"State Coulomb\u2019s inverse square law for magnetic poles.",a:"The force between two magnetic poles is directly proportional to the product of their pole strengths and inversely proportional to the square of the distance between them: F = k qm_A qm_B / r^2   (3.7). In SI units k = \u00b50/4\u03c0 = 10^-7 H m^-1. Like poles repel and unlike poles attract. Because the law is an inverse square law, electric and magnetic fields are both long-range fields.",k:[["directly proportional","proportional"],["product"],["square of the distance","r^2","r2","inversely"],["10^-7","10\u207b\u2077","k = \u00b50","\u00b50/4"],["repel"],["attract"]]},
{m:2,q:"Compare diamagnetic, paramagnetic and ferromagnetic materials.",a:"DIAMAGNETIC materials (e.g. bismuth, copper, water): there is no resultant magnetic moment in an atom in the absence of a field; an induced moment opposes the field. They are repelled by a magnetic field. Susceptibility is negative and small, relative permeability is slightly less than unity, and susceptibility is nearly independent of temperature. Superconductors are perfect diamagnets (Meissner effect).\nPARAMAGNETIC materials (e.g. aluminium, platinum, chromium, oxygen): each atom has a net magnetic dipole moment, but the moments are randomly oriented, so the net moment is zero. In a field the moments align with the field, and they are attracted into the field. Susceptibility is positive and small, relative permeability is greater than unity, and susceptibility decreases with temperature (Curie\u2019s law, \u03c7m = C/T).\nFERROMAGNETIC materials (e.g. iron, nickel, cobalt): atoms have net moments that are spontaneously aligned within small regions called domains. The domains are randomly oriented, so the specimen has zero net magnetisation until a field is applied. They show strong attraction, very large positive susceptibility and permeability, and hysteresis.",k:[["diamagnetic"],["paramagnetic"],["ferromagnetic"],["repel"],["attract"],["negative"],["positive"],["domain"],["hysteresis"],["curie","temperature"],["meissner","superconduct"],["permeability"]]},
{m:3,q:"A bar magnet having a magnetic moment pm is cut into four pieces: first cut into two pieces along the axis of the magnet, and each piece is further cut along the axis into two pieces. Compute the magnetic moment of each piece.",a:"(Book answer: each piece has magnetic moment p_new = (1/4) pm. The book gives only the result; the working is in its numerical section.)\nSo each of the four pieces has one-quarter of the original magnetic moment.",k:[["1/4","one-quarter","quarter","\u00bc"],["pm","p m","magnetic moment"]]},
{m:3,q:"A conductor of linear mass density 0.2 g m\u207b\u00b9 is suspended by two flexible wires, as shown in the figure. Suppose the tension in the supporting wires is zero when it is kept inside a magnetic field of 1 T whose direction is into the page. Compute the current inside the conductor and the direction of the current. Assume g = 10 m s\u207b\u00b2.",a:"(Worked by me from the equilibrium condition; the magnitude matches the book\u2019s answer of 2 mA.)\nWith zero tension, the magnetic force must balance the weight: BIl = mg, so I = (m/l) g / B.\nLinear mass density m/l = 0.2 g m\u207b\u00b9 = 2 \u00d7 10\u207b\u2074 kg m\u207b\u00b9.\nI = (2 \u00d7 10\u207b\u2074 \u00d7 10) / 1 = 2 \u00d7 10\u207b\u00b3 A = 2 mA.\nThe magnetic force must act upward, so the direction of the current is set by Fleming\u2019s left hand rule with B into the page. Check the current direction in the book\u2019s figure, since the figure is not described in the text.",k:[["2 ma","2mA","2 \u00d7 10\u207b\u00b3","2x10"],["bil = mg","bil=mg","mg"],["upward","upward"],["fleming"],["direction"]]},
{m:3,q:"A circular coil with cross-sectional area 0.1 cm\u00b2 is kept in a uniform magnetic field of strength 0.2 T. If the current passing in the coil is 3 A and the plane of the loop is perpendicular to the direction of magnetic field, calculate (a) total torque on the coil (b) total force on the coil (c) average force on each electron in the coil due to the magnetic field. (The free electron density for the material of the wire is 10\u00b2\u2078 m\u207b\u00b3.)",a:"(a) Total torque = 0 (b) Total force = 0. In a uniform field the net force and the net torque on a closed current loop are zero, because the forces on opposite sides cancel. (c) Worked by me: drift velocity vd = I/(neA) = 3 / (10\u00b2\u2078 \u00d7 1.6 \u00d7 10\u207b\u00b9\u2079 \u00d7 10\u207b\u2075) = 1.875 \u00d7 10\u207b\u2074 m s\u207b\u00b9. The average force on each electron is f = e vd B = 1.6 \u00d7 10\u207b\u00b9\u2079 \u00d7 1.875 \u00d7 10\u207b\u2074 \u00d7 0.2 = 6 \u00d7 10\u207b\u00b2\u2074 N = 0.6 \u00d7 10\u207b\u00b2\u00b3 N.\nBook answer: (a) zero (b) zero (c) 0.6 \u00d7 10\u207b\u00b2\u00b3 N.",k:[["zero","0"],["cancel"],["neA","n e a","i/nea","i/(nea)"],["1.875","1.88"],["0.6","6 \u00d7 10","6x10"],["evb","e v b","f = evb"]]},
{m:3,q:"A bar magnet is placed in a uniform magnetic field whose strength is 0.8 T. If the bar magnet is oriented at an angle 30\u00b0 with the external field and experiences a torque of 0.2 N m, calculate (i) the magnetic moment of the magnet (ii) the work done by the applied force in moving it from the most stable configuration to the most unstable configuration and also compute the work done by the applied magnetic field in this case.",a:"(Worked by me; the results match the book\u2019s answers.)\n(i) Torque \u03c4 = pm B sin\u03b8, so pm = \u03c4 / (B sin\u03b8) = 0.2 / (0.8 \u00d7 sin30\u00b0) = 0.2 / 0.4 = 0.5 A m\u00b2.\n(ii) Most stable configuration: \u03b8 = 0\u00b0, U = \u2212pm B cos0\u00b0 = \u22120.4 J. Most unstable configuration: \u03b8 = 180\u00b0, U = \u2212pm B cos180\u00b0 = +0.4 J.\nThe work done by the applied force is the change in potential energy: W = \u0394U = 0.4 \u2212 (\u22120.4) = +0.8 J.\nThe work done by the magnetic field is the negative of this: W_mag = \u22120.8 J.\nBook answer: (i) 0.5 A m\u00b2 (ii) W = 0.8 J and W_mag = \u22120.8 J.",k:[["0.5","pm = \u03c4","\u03c4 = pm","pm b sin"],["0.4"],["0.8"],["\u221e","\u0394u","delta u","\u0394u = 0.4"],["-0.8","\u22120.8","\u22120.8 j","negative"]]},
{m:3,q:"Calculate the magnetic field at the centre of a square loop which carries a current of 1.5 A, length of each side being 50 cm.",a:"(Worked by me from the Biot\u2013Savart result for a square loop; the value matches the book\u2019s answer of 3.4 \u00d7 10\u207b\u2076 T.)\nFor a square of side a carrying current I, the field at its centre is B = 2\u221a2 \u00b50 I / (\u03c0 a) (four equal sides each contributing equally).\nB = 2\u221a2 \u00d7 (4\u03c0 \u00d7 10\u207b\u2077) \u00d7 1.5 / (\u03c0 \u00d7 0.5) = 3.4 \u00d7 10\u207b\u2076 T.",k:[["2\u221a2","2 \u221a2","2\u221a2"],["\u00b50 i","\u00b50i","\u00b50 i/\u03c0a","\u03c0 a","\u03c0a"],["3.4","3.39"],["10\u207b\u2076","10^-6","10-6","\u00d710\u207b\u2076"]]},
{m:5,q:"Explain the Lorentz force and the motion of a charged particle in a uniform magnetic field (cyclotron frequency and radius).",a:"LORENTZ FORCE: when an electric charge q is at rest in a magnetic field no force acts on it. If it moves with velocity v in a magnetic field B, it experiences the magnetic force Fm = q(v \u00d7 B), with magnitude Fm = qvB sin\u03b8, where \u03b8 is the angle between v and B. If the charge is in both an electric and a magnetic field, the total force is F = q(E + v \u00d7 B), the Lorentz force. The force is perpendicular to both v and B. It does no work on the particle, so it changes only the direction of the velocity, not its speed or kinetic energy.\nMOTION IN A UNIFORM FIELD: if the velocity is perpendicular to the field (\u03b8 = 90\u00b0), the Lorentz force acts as the centripetal force and the particle moves in a circle: qvB = mv^2/r.\nRadius r = mv/(qB) = p/(qB)   (3.57), where p = mv is the linear momentum.\nPeriod T = 2\u03c0r/v = 2\u03c0m/(qB)   (3.59), the cyclotron period. Frequency f = 1/T = qB/(2\u03c0m)   (3.60), and in terms of angular frequency \u03c9 = 2\u03c0f = qB/m   (3.61). The period and frequency do not depend on the speed of the particle.",k:[["lorentz"],["v \u00d7 b","v x b","v\u00d7b","q(v","q (v"],["sin\u03b8","sin"],["work","kinetic energy"],["centripetal"],["r = mv","mv/qb","p/qb","mv / qb"],["2\u03c0m/qb","2\u03c0m","2\u03c0r/v"],["f = qb","qb/2\u03c0m","qb / 2\u03c0m","\u03c9"]]},
{m:5,q:"Obtain an expression for the force between two long parallel current carrying conductors.",a:"Let two long straight parallel conductors A and B, separated by a distance r in air, carry currents I1 and I2 in the same direction (along the z-direction).\nField due to I1 at conductor B: B1 = (\u00b50 I1 / 2\u03c0r)(\u2212\u00ee) (by the right-hand thumb rule the field at B points into the page, i.e. along \u2212\u00ee).\nForce on an element dl of conductor B: dF = I2 dl \u00d7 B1 = \u2212(\u00b50 I1 I2 dl / 2\u03c0r) \u0135. So the force per unit length on B due to A is F/l = \u2212(\u00b50 I1 I2 / 2\u03c0r) \u0135: the element of B is attracted towards A.\nBy symmetry, the field due to I2 at conductor A is B2 = (\u00b50 I2 / 2\u03c0r) \u00ee (directed out of the page at A), and the force on a length dl of A is dF = I1 dl \u00d7 B2 = (\u00b50 I1 I2 dl / 2\u03c0r) \u0135, so A is attracted towards B.\nThus parallel currents attract each other, and the force per unit length is\nF/l = \u00b50 I1 I2 / (2\u03c0r)   (3.68)\nFor currents in opposite directions the force is repulsive, with the same magnitude. This force is the basis of the definition of the ampere (2 \u00d7 10\u207b\u2077 N per metre for I1 = I2 = 1 A and r = 1 m).",k:[["parallel"],["attract"],["\u00b50 i1 i2","\u00b50i1i2","\u00b50 i1i2","i1 i2","i1i2"],["thumb"],["2 \u00d7 10\u207b\u2077","2x10","2 \u00d7 10","2 x 10"],["opposite","repulsive"],["per unit length","f/l","f / l"]]},
{m:5,q:"Calculate the magnetic field at a point on the axial line of a bar magnet.",a:"Consider a bar magnet NS with pole strength qm at each pole, the poles separated by 2l. Its magnetic dipole moment is pm = qm \u00b7 2l. Let C be a point on the axis at a distance r from the geometric centre O. Keep a unit north pole (qmC = 1 A m) at C.\nField at C due to the north pole: BN = (\u00b50/4\u03c0) qm/(r \u2212 l)^2, directed away from N along the axis.\nField at C due to the south pole: BS = \u2212(\u00b50/4\u03c0) qm/(r + l)^2, directed towards S.\nNet field: B = BN + BS = (\u00b50 qm/4\u03c0)[1/(r \u2212 l)^2 \u2212 1/(r + l)^2] = (\u00b50/4\u03c0)(2r \u00b7 2l qm)/(r^2 \u2212 l^2)^2 = (\u00b50/4\u03c0)(2 r pm)/(r^2 \u2212 l^2)^2   (3.12)\nIf the bar magnet is short (r >> l), then (r^2 \u2212 l^2)^2 \u2248 r^4, so\nB_axial = (\u00b50/4\u03c0)(2 pm / r^3) = (\u00b50/4\u03c0)(2/r^3) pm   (3.14)\nThe field on the axial line is along the dipole moment (from S to N inside the magnet), and it falls off as 1/r^3.",k:[["axial"],["north pole","unit north"],["south pole"],["2l"],["r \u2212 l","r - l","(r \u2212 l)","(r-l)"],["r + l","r+l"],["r^2 \u2212 l^2","r^2 - l^2","(r2 - l2)"],["2 pm","2pm","2p","2 p"],["r^3","r3","1/r^3"],["r >> l","r>>l","short"]]},
{m:5,q:"Obtain the magnetic field at a point along the equatorial line of a bar magnet.",a:"Let the point C lie on the equatorial line, at a distance r from the geometric centre O of the bar magnet. Keep a unit north pole at C.\nDistance of C from each pole: r\u2032 = (r^2 + l^2)^(1/2).\nField due to the north pole: BN = (\u00b50/4\u03c0) qm/r\u2032^2, directed away from N.\nField due to the south pole: BS = (\u00b50/4\u03c0) qm/r\u2032^2, directed towards S.\nResolving each field into components: the components along the axis (\u2212\u00ee direction) are equal and add, while the components perpendicular to the axis cancel. Each field makes an angle \u03b8 with the axis, where cos\u03b8 = l/r\u2032 = l/(r^2 + l^2)^(1/2). So the net field is\nB = \u2212(BN + BS) cos\u03b8 \u00ee = \u2212(\u00b50/4\u03c0)(2 qm/(r^2 + l^2)) \u00b7 l/(r^2 + l^2)^(1/2) \u00ee\n= \u2212(\u00b50/4\u03c0)(2 qm \u00b7 2l)/(r^2 + l^2)^(3/2) \u00ee = \u2212(\u00b50/4\u03c0) pm/(r^2 + l^2)^(3/2) \u00ee   (3.19), with pm = qm \u00b7 2l.\nIf the magnet is short (r >> l): B_equatorial = \u2212(\u00b50/4\u03c0)(pm / r^3) \u00ee   (3.21)\nThe field is opposite in direction to the dipole moment on the equatorial line, and it is half the magnitude of the axial field at the same distance (B_axial = 2 B_equatorial).",k:[["equatorial"],["r\u2032","r'","(r^2 + l^2)","r^2 + l^2","r2 + l2"],["cos\u03b8","cos"],["perpendicular","cancel"],["opposite","\u2212"],["half","2 b","2b"],["r^3","r3","1/r^3"],["r >> l","r>>l","short"]]},
{m:5,q:"Obtain the magnetic field inside a long current carrying solenoid using Ampere\u2019s circuital law.",a:"A solenoid of length L with N turns carrying current I. Its diameter is much smaller than its length, and the coil is wound very closely, so the solenoid is long and the field outside is zero.\nConsider a rectangular Amperian loop abcd, with sides ab (inside the solenoid, parallel to the axis, length h) and cd (outside, far from the solenoid), and bc and da perpendicular to the axis.\nBy Ampere\u2019s circuital law \u222e B\u00b7dl = \u00b50 I(enclosed).\nLeft-hand side, split into four parts:\n\u2022 Along bc and da, B is perpendicular to dl (cos 90\u00b0 = 0), so these integrals are zero.\n\u2022 Along cd, the field outside is zero, so the integral is zero.\n\u2022 Along ab, B is parallel to dl (cos 0\u00b0 = 1): \u222b(a to b) B\u00b7dl = B \u222b dl = Bh.\nSo the left side is Bh. The loop can be taken as large as the solenoid (length L), so \u222e B\u00b7dl = BL.\nThe current enclosed by the loop is I multiplied by the number of turns the loop links, which is nL per unit length, so the enclosed current is NI for N turns (with n = N/L, the number of turns per unit length).\nBL = \u00b50 NI, so B = \u00b50 NI / L = \u00b50 n I   (3.52)\nSince n and \u00b50 are constant for a given solenoid, and I is fixed, the field inside a long solenoid is uniform and constant. The field outside a long solenoid is zero.\nSolenoid as an electromagnet: the field is strengthened by a soft-iron core, and the solenoid can be switched on or off, which is why it is used in many electrical appliances.",k:[["amperian","ampere\u2019s","ampere's","circuital"],["perpendicular","cos 90","cos90"],["parallel","cos 0","cos0"],["outside","zero"],["bl","b l","\u00b50 ni","\u00b50ni","\u00b50 n i","ni/l","nil"],["uniform","constant"],["n = n/l","n/l","turns per unit length","per unit length"]]},
{m:5,q:"Obtain the expression for the force experienced by a current carrying conductor placed in a magnetic field.",a:"Consider a small segment of conductor of length dl and cross-sectional area A, carrying current I, placed in a magnetic field B. The current is due to free electrons drifting with the drift velocity vd opposite to the direction of current.\nThe current is related to the drift velocity by I = neAvd   (3.65), where n is the number of free electrons per unit volume.\nThe average force on each electron (charge \u2212e, drift velocity vd) is f = \u2212e(vd \u00d7 B), which is the Lorentz force.\nIf N is the number of free electrons in the small segment of volume V = A dl, then N = nA dl. The Lorentz force on the elementary section is therefore the total of the forces on these N electrons:\ndF = N f = \u2212e n A dl (vd \u00d7 B)\nThe current element in the conductor is I dl = \u2212e n A vd dl, so the force on the small segment of the current carrying conductor is\ndF = I dl \u00d7 B   (3.66)\nFor a straight conductor of length l in a uniform field, F = I l \u00d7 B, with magnitude F = BIl sin\u03b8, where \u03b8 is the angle between the conductor (current direction) and the field. The force is maximum (F = BIl) when \u03b8 = 90\u00b0 and zero when the conductor is parallel to the field (\u03b8 = 0\u00b0). The direction of the force is given by Fleming\u2019s left hand rule.",k:[["drift","vd"],["n a","nav","n e a","neav","nev"],["lorentz"],["n = n/v","n = n / v","v"],["i dl \u00d7 b","idl","i dl x b","i dl\u00d7b","\u00d7 b"],["sin\u03b8","sin"],["maximum","90"],["parallel","zero"],["fleming"]]},
{m:5,q:"Compare the properties of soft and hard ferromagnetic materials.",a:"The shape and size of the hysteresis loop of a ferromagnetic material determine whether it is soft or hard.\nSOFT MAGNETIC MATERIALS (e.g. soft iron, silicon steel): the hysteresis loop has a small area; they have a high permeability, low coercivity and low retentivity (remanence). They are easily magnetised and demagnetised, and the energy lost per cycle (hysteresis loss) is small. They are used in electromagnets, transformer cores, and in the cores of motors and generators.\nHARD MAGNETIC MATERIALS (e.g. carbon steel, alloys like alnico): the hysteresis loop has a large area; they have high coercivity and high retentivity, so they retain their magnetism for a long time. They are difficult to magnetise and demagnetise, and the hysteresis loss per cycle is large. They are used to make permanent magnets, for example in loudspeakers, microphones, galvanometers and magnetic compasses.\nHYSTERESIS LOSS: the energy lost per unit volume of the material per cycle of magnetisation equals the area of the hysteresis loop. This is attributed to the rotation and orientation of molecular magnets in various directions and is dissipated as heat.",k:[["area"],["soft"],["hard"],["coercivity"],["retentivity","remanence"],["permeability"],["permanent magnet","permanent"],["electromagnet","transformer"],["hysteresis loss","heat"]]},
{m:5,q:"Explain the Earth\u2019s magnetic field and its elements (magnetic declination, dip and horizontal component).",a:"Earth behaves like a gigantic bar magnet, with its magnetic south pole near the geographic north pole and its magnetic north pole near the geographic south pole. The needle of a compass aligns approximately along the geographical north\u2013south direction. The branch of physics dealing with Earth\u2019s magnetic field is called geomagnetism or terrestrial magnetism. The origin of the field is not fully explained: the temperature inside Earth is too high for a permanent magnet to retain magnetism.\nThe field on Earth\u2019s surface is specified by three quantities, called the elements of the Earth\u2019s magnetic field:\n(a) Magnetic declination (D): the angle between the magnetic meridian and the geographic meridian at a point. The magnetic meridian is the vertical plane through the magnetic axis; the geographic meridian is the vertical plane through the geographic axis.\n(b) Magnetic dip or inclination (I): the angle subtended by the Earth\u2019s total magnetic field B_E with the horizontal in the magnetic meridian.\n(c) Horizontal component BH of the Earth\u2019s field.\nRelations: BH = BE cos I   (3.1) and BV = BE sin I   (3.2), where BV is the vertical component; hence tan I = BV/BH   (3.3). BE = (BH^2 + BV^2)^(1/2).\nAt the magnetic equator (I = 0\u00b0): BV = 0, and BH is maximum, so the needle is horizontal. At the magnetic poles (I = 90\u00b0): BH = 0 and BV is maximum, so the needle is vertical. Dip increases from the equator to the poles.",k:[["gigantic bar magnet","bar magnet"],["geomagnetism","terrestrial"],["declination"],["dip","inclination"],["magnetic meridian"],["geographic meridian","geographical meridian"],["bh = be cos","cos i","cos"],["bv = be sin","sin i","sin"],["tan i","tan"],["equator"],["pole"]]},
{m:5,q:"Derive an expression for the torque experienced by a bar magnet (magnetic dipole) placed in a uniform magnetic field.",a:"Consider a bar magnet with north pole N and south pole S, pole strength qm each, separated by 2l, placed in a uniform magnetic field B.\nForce on the north pole: FN = qm B (3.23). Force on the south pole: FS = \u2212qm B (3.24). The net force on the dipole is F = FN + FS = 0, so the dipole experiences no translational motion; only a torque.\nTorque about the centre O: \u03c4 = ON \u00d7 FN + OS \u00d7 FS = ON \u00d7 qm B + OS \u00d7 (\u2212qm B). Since |ON| = |OS| = l, and the two forces are antiparallel and act along the magnet, the magnitude is\n\u03c4 = l qm B sin\u03b8 + l qm B sin\u03b8 = 2l qm B sin\u03b8 = pm B sin\u03b8, with pm = qm \u00b7 2l.\nIn vector notation \u03c4 = pm \u00d7 B   (3.25). The torque is maximum when \u03b8 = 90\u00b0 and zero when \u03b8 = 0\u00b0 or 180\u00b0. The torque tends to align the magnetic moment with the field.\nA freely suspended magnet in a uniform field therefore experiences only rotation (torque) and no translation. In a non-uniform field, the forces on the two poles are unequal, so the magnet also undergoes translational motion (net force).",k:[["fn = qm","fn = q","qb","q b"],["net force","zero","0"],["\u03c4 = pm","\u03c4 = p","p \u00d7 b","pm \u00d7 b","pm x b","pm\u00d7b"],["pm b sin","pmbsin","pb sin","pm b sin\u03b8"],["maximum","90"],["non-uniform","non uniform"],["translational","translation"]]},
{m:5,q:"Find the magnetic field due to a long straight conductor carrying current using Ampere\u2019s circuital law.",a:"(Worked by me from Ampere\u2019s law, in the same way as the book\u2019s solenoid derivation. Please check against the book\u2019s section on this topic.)\nConsider an infinitely long straight conductor carrying current I. The field is circular around the wire, with the same magnitude at all points equidistant from the axis. Choose a circular Amperian loop of radius r, coaxial with the wire, and take dl along the loop.\nAt every point of the loop, B is tangential to the loop, so B is parallel to dl (cos 0\u00b0 = 1) and has the same magnitude B. Hence\n\u222e B\u00b7dl = B \u222e dl = B (2\u03c0r)\nBy Ampere\u2019s circuital law, \u222e B\u00b7dl = \u00b50 I(enclosed) = \u00b50 I.\nSo B (2\u03c0r) = \u00b50 I, giving\nB = \u00b50 I / (2\u03c0r)   (the same result as Biot\u2013Savart, 3.36)\nThe field lines are concentric circles around the wire, with direction given by the right-hand thumb rule. The field decreases as 1/r with distance from the wire.",k:[["circular","loop"],["tangential","parallel"],["2\u03c0r","2\u03c0 r","2pir"],["\u00b50 i","\u00b50i","\u00b50 i(enclosed)"],["b = \u00b50 i/2\u03c0r","\u00b50 i / 2\u03c0r","\u00b50i/2\u03c0r","\u00b50i / 2\u03c0r"],["1/r","r"],["thumb","right"]]}
]},
4:{exp:[
"Lenz\u2019s law: the direction of the induced current is such that it always opposes the cause responsible for its production. Whenever the magnetic flux linked with a coil changes, an electric current is induced in the circuit; the flux change is the cause and the induced current is the effect, and the effect always opposes the cause.",
"Self-induction: an electric current flowing through a coil sets up a magnetic field, and the flux of that field is linked with the coil itself. If this flux changes because the current changes, an emf is induced in the same coil. The total flux linkage N\u03a6B is proportional to the current, N\u03a6B = Li, where L is the self-inductance.",
"Mutual induction: when the current in one coil changes with time, an emf is induced in a neighbouring coil magnetically linked with it. The total flux linked with coil 2 is proportional to the current i1 in coil 1: N2\u03a621 = M21 i1.",
"AC generator (alternator): an energy conversion device that converts mechanical energy into electrical energy. It works on the principle of electromagnetic induction: the relative motion between a conductor and a magnetic field changes the magnetic flux linked with the conductor. It consists of a stator (stationary armature winding) and a rotor (rotating field magnet).",
"Transformer: a stationary device that transfers electrical power from one circuit to another without changing the frequency. A step-up transformer converts a low voltage alternating current into a high voltage one (Ns > Np), and a step-down transformer converts a high voltage into a low voltage (Ns < Np). In a step-up transformer the voltage increases and the current decreases.",
"Electrical resonance: in a series RLC circuit, when the frequency of the applied source equals the natural frequency 1/\u221a(LC) of the circuit, the current reaches its maximum value and the circuit is in resonance. The frequency at which this happens is the resonant frequency.",
"Wattless current: the current in an AC circuit is wattless when the power consumed by it is zero. This occurs in a purely inductive or purely capacitive circuit, where the phase angle is \u03c0/2 and the power is zero."],
