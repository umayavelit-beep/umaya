wr:[
{m:5,q:"Explain the types of emission spectrum.",a:"When the light emitted by a source is analysed with a spectroscope (for example a prism), the emission spectrum depends on the source. There are three types:\n(i) Continuous emission spectrum: light from an incandescent lamp (filament bulb) passed through a prism splits into all the visible colours from violet to red. It consists of all wavelengths in a continuous range. Examples: the spectrum from a carbon arc and from incandescent solids.\n(ii) Line emission spectrum: light from a hot gas, passed through a prism, gives sharp lines of definite wavelengths or frequencies. These are also called discontinuous spectra. The lines are characteristic of the element and differ for different elements. Examples: atomic hydrogen, helium.\n(iii) Band emission spectrum: several very closely spaced spectral lines overlap to form bands, separated by dark spaces, with a sharp edge at one end that fades at the other. It arises from excited molecules and is characteristic of the molecule. Example: ammonia gas in a discharge tube.",k:[["continuous"],["line"],["band"],["sharp"],["definite","characteristic"],["molecule"],["hydrogen","ammonia","carbon arc"]]},
{m:5,q:"Explain the types of absorption spectrum.",a:"When light is passed through a medium or an absorbing substance, the spectrum obtained is called the absorption spectrum. It is characteristic of the absorbing substance. There are three types:\n(i) Continuous absorption spectrum: when white light passes through a blue glass plate, it absorbs all the colours except blue, and the spectrum is continuous with some colours missing.\n(ii) Line absorption spectrum: when light from an incandescent lamp passes through a cold gas, dark lines appear at definite wavelengths in the otherwise continuous spectrum. The dark lines are at the same positions as the bright lines of the emission spectrum of that gas. The Fraunhofer lines in the solar spectrum are an example.\n(iii) Band absorption spectrum: when white light passes through iodine vapour, or through dilute solutions of blood or chlorophyll, dark bands appear on a continuous bright background.",k:[["continuous"],["line"],["band"],["dark"],["cold gas","gas"],["iodine","blood","chlorophyll"],["blue"],["fraunhofer","solar"]]},
{m:2,q:"What are Fraunhofer lines? How are they useful?",a:"When the spectrum of sunlight is examined, it consists of a large number of dark lines. These are called Fraunhofer lines; they form a line absorption spectrum produced when light from the hot interior of the Sun passes through the cooler gases of its atmosphere. The absorption spectra of various elements are compared with the Fraunhofer lines, which helps identify the elements present in the Sun\u2019s atmosphere.",k:[["dark"],["absorption"],["sun","solar"],["identify","elements","compar"]]},
{m:5,q:"Write down the properties of electromagnetic waves.",a:"(1) Electromagnetic waves are produced by any accelerated charge.\n(2) They do not require any medium for propagation, so they are non-mechanical waves.\n(3) They are transverse: the oscillating electric field vector E, the oscillating magnetic field vector B and the direction of propagation are mutually perpendicular. For example, if E is along y and B along z, the wave propagates along x.\n(4) They travel with the speed of light in vacuum or free space: c = 1/\u221a(\u03b50\u00b5\u2080) = 3 \u00d7 10\u2078 m s\u207b\u00b9, where \u03b50 and \u00b50 are the permittivity and permeability of free space. In a medium of refractive index n, the speed is v = c/n.\n(5) The electric and magnetic field amplitudes are related by E0 = c B0, and they are in phase, oscillating at every point in the same way.\n(6) They carry energy and momentum, and they can be reflected, refracted, diffracted and polarised like other waves.",k:[["accelerated"],["medium"],["transverse","perpendicular"],["3 \\u00d7 10","3 x 10","3\u00d710"],["c = 1/","1/\u221a","\u221a(\u03b5","\u221a(e"],["refractive","n"],["e0 = c","e = cb","e0 = cb","cb"],["energy","momentum"]]},
{m:5,q:"Write short notes on (a) microwave, (b) X-ray, (c) radio waves and (d) visible spectrum, with their production, frequency ranges and uses.",a:"(a) MICROWAVES: produced by special vacuum tubes such as the klystron, magnetron and Gunn diode. Frequency range 10\u2079 Hz to 10\u00b9\u00b9 Hz. They undergo reflection and can be polarised. Uses: radar systems for aircraft navigation and measuring the speed of vehicles, microwave ovens for cooking, and long-distance wireless communication through satellites.\n(b) X-RAYS: produced when high speed electrons are suddenly stopped by a metal target of high atomic number, and also by electronic transitions among the innermost orbits of atoms. Frequency range 10\u00b9\u2077 Hz to 10\u00b9\u2079 Hz. They have more penetrating power than ultraviolet. Uses: studying the structure of inner electron shells and crystals, detecting fractures and diseased organs, and detecting faults, cracks and holes in metal products.\n(c) RADIO WAVES: produced by the accelerated motion of charges in conducting wires. Frequency range from a few Hz to 10\u2079 Hz. They show reflection and diffraction. Uses: radio and television communication, and cellular phones for voice communication in the ultra high frequency band.\n(d) VISIBLE LIGHT: the small part of the electromagnetic spectrum that the human eye can detect, from violet (about 4 \u00d7 10\u00b9\u2074 Hz) to red. It is produced by the rearrangement of electrons in the outer shells of atoms. It causes the sensation of vision.",k:[["klystron","magnetron"],["10^9","10\u2079","10 9"],["reflection"],["radar"],["satellite"],["x-ray","x ray"],["high atomic number","target"],["inner"],["fractur","crack","fault"],["radio waves","accelerated"],["television","cellular","phone"],["visible","violet","red","eye"]]},
{m:5,q:"Describe the production and uses of infrared and ultraviolet radiation.",a:"INFRARED RADIATION: produced by hot bodies (also called heat waves), and by molecules undergoing rotational and vibrational transitions. Frequency range 10\u00b9\u00b9 Hz to 4 \u00d7 10\u00b9\u2074 Hz. Uses: it provides electrical energy to satellites through solar cells, it is used to keep plants warm in greenhouses, in heat therapy for muscular pain or sprain, for night vision and infrared photography, in dehydrating fruits, as a signal carrier in TV remote controls, and to see through haze and fog.\nULTRAVIOLET RADIATION: produced by the Sun, by arcs and by ionised gases. Frequency range 8 \u00d7 10\u00b9\u2074 Hz to 10\u00b9\u2077 Hz. It has less penetrating power than X-rays and is absorbed by the atmospheric ozone; in excess it is harmful to the human body. Uses: destroying bacteria in sterilising surgical instruments, burglar alarms, detecting invisible writing and finger prints, and studying atomic structure.",k:[["hot bodies","heat"],["rotational","vibrational"],["solar","satellite"],["greenhouse","plants"],["sun","arc","ionised","ionized"],["ozone"],["bacteria","steril"],["burglar","finger"]]},
{m:3,q:"Consider a parallel plate capacitor whose plates are closely spaced. Let R be the radius of the plates and the current in the wire connected to the plates is 5 A. Calculate the displacement current through the surface passing between the plates by directly calculating the rate of change of flux of electric field through the surface.",a:"(Worked by me from the definition of displacement current; the result matches the book\u2019s answer of 5 A.)\nThe displacement current equals the rate of change of the electric flux times \u03b50: id = \u03b50 dΦE/dt. The electric field between the plates grows as the capacitor charges, and the current in the wire is the conduction current ic. Since the charge on the plates is the same as the charge carried by the wire, the displacement current between the plates equals the conduction current: id = ic = 5 A.",k:[["5 a","5a"],["id = \\u03b50","\\u03b50 d","d\u03a6","dφ"],["ic","conduction"],["equal"]]},
{m:3,q:"A transmitter consists of an LC circuit with an inductance of 1 \u00b5H and a capacitance of 1 \u00b5F. What is the wavelength of the electromagnetic waves it emits?",a:"(Worked by me; the result matches the book\u2019s answer of 18.84 \u00d7 10\u00b2 m.)\nFrequency f = 1/(2\u03c0\u221a(LC)) = 1/(2\u03c0 \u00d7 10\u207b\u2076) = 1.59 \u00d7 10\u2075 Hz.\nWavelength \u03bb = c/f = (3 \u00d7 10\u2078)/(1.59 \u00d7 10\u2075) = 1884.9 m = 18.84 \u00d7 10\u00b2 m.",k:[["1/(2\u03c0","2\u03c0\u221a","\u221a(lc)","f ="],["1.59","1.6"],["c/f","c / f","\u03bb = c"],["18.8","1884","1.88"]]},
{m:3,q:"A pulse of light of duration 10\u207b\u2076 s is absorbed completely by a small object initially at rest. If the power of the pulse is 60 \u00d7 10\u207b\u00b3 W, calculate the final momentum of the object.",a:"(Worked by me from p = E/c; the result matches the book\u2019s answer of 20 \u00d7 10\u207b\u00b9\u2077 kg m s\u207b\u00b9.)\nEnergy absorbed E = P t = 60 \u00d7 10\u207b\u00b3 \u00d7 10\u207b\u2076 = 6 \u00d7 10\u207b\u2078 J.\nFor complete absorption the momentum delivered is p = E/c = (6 \u00d7 10\u207b\u2078)/(3 \u00d7 10\u2078) = 2 \u00d7 10\u207b\u00b9\u2076 kg m s\u207b\u00b9 = 20 \u00d7 10\u207b\u00b9\u2077 kg m s\u207b\u00b9.",k:[["e = p","e/c","p = e","p = e/c"],["6 \u00d7 10","6x10","6 x 10"],["2 \u00d7 10\u207b\u00b9\u2076","2x10","2 \u00d7 10-16","20 \u00d7 10\u207b\u00b9\u2077","20"]]},
{m:3,q:"An electromagnetic wave propagates along the x-direction, the magnetic field oscillates at a frequency of 10\u00b9\u2070 Hz and has an amplitude of 10\u207b\u2075 T, acting along the y-direction. Compute the wavelength of the wave. Also write down the expression for electric field in this case.",a:"(Worked by me; the results match the book\u2019s answers: \u03bb = 3 \u00d7 10\u207b\u00b2 m, and E = 3 \u00d7 10\u00b3 sin(2.09 \u00d7 10\u00b2 x \u2212 6.28 \u00d7 10\u00b9\u2070 t) (\u2212k-hat) N C\u207b\u00b9.)\n\u03bb = c/f = 3 \u00d7 10\u2078 / 10\u00b9\u2070 = 3 \u00d7 10\u207b\u00b2 m.\nE0 = c B0 = 3 \u00d7 10\u2078 \u00d7 10\u207b\u2075 = 3 \u00d7 10\u00b3 N C\u207b\u00b9.\nk = 2\u03c0/\u03bb = 2.09 \u00d7 10\u00b2 m\u207b\u00b9 and \u03c9 = 2\u03c0f = 6.28 \u00d7 10\u00b9\u2070 s\u207b\u00b9. Since E \u00d7 B must point along +x, E is along \u2212z (the \u2212k-hat direction).",k:[["3 \u00d7 10\u207b\u00b2","3x10","3 \u00d7 10-2","0.03"],["2.09","2.09 \u00d7 10"],["6.28"],["3 \u00d7 10\u00b3","3x10^3","3000"],["\u2212k","-k","k-hat"],["e0 = cb","e = cb","cb0","cb"]]},
{m:3,q:"If the relative permeability and relative permittivity of a medium are 1.0 and 2.25 respectively, find the speed of the electromagnetic wave in this medium.",a:"(Worked by me; the result matches the book\u2019s answer of 2 \u00d7 10\u2078 m s\u207b\u00b9.)\nv = 1/\u221a(\u00b5\u03b5) = c/\u221a(\u00b5r \u03b5r) = (3 \u00d7 10\u2078)/\u221a(1.0 \u00d7 2.25) = (3 \u00d7 10\u2078)/1.5 = 2 \u00d7 10\u2078 m s\u207b\u00b9.",k:[["c/\u221a","c / \u221a","\u221a(\u00b5","1/\u221a","\u221a(\u03bc"],["1.5"],["2 \u00d7 10\u2078","2x10","2 x 10","2\u00d710"]]},
{m:2,q:"What are the sources of electromagnetic waves?",a:"Electromagnetic waves are produced by accelerated charges, and in particular by oscillating charges. An oscillating charge (an oscillating electric dipole) produces time-varying electric and magnetic fields that sustain each other and radiate away as an electromagnetic wave. The frequency of the wave is the same as the frequency of oscillation of the charge. In an LC circuit, the oscillations of charge produce radio waves of frequency f = 1/(2\u03c0\u221a(LC)).",k:[["accelerat"],["oscillat"],["electric and magnetic","electric field","magnetic field"],["frequency"],["lc"]]},
{m:5,q:"Write down Maxwell\u2019s equations in integral form and explain the physical meaning of each.",a:"(1) Gauss\u2019s law for electricity: \u222e E\u00b7dA = Qenclosed/\u03b50 (5.7). The net electric flux through a closed surface equals the net charge enclosed divided by \u03b50. Electric field lines start on positive charges and end on negative charges, so isolated charges can exist.\n(2) Gauss\u2019s law for magnetism: \u222e B\u00b7dA = 0 (5.8). The net magnetic flux through any closed surface is zero. Magnetic field lines form continuous closed paths, so no isolated magnetic monopole exists.\n(3) Faraday\u2019s law of electromagnetic induction: \u222e E\u00b7dl = \u2212 dΦB/dt (5.9). The line integral of the electric field around any closed path equals the negative rate of change of magnetic flux through the surface bounded by that path. A changing magnetic flux produces an electric field.\n(4) Ampere\u2013Maxwell law: \u222e B\u00b7dl = \u00b50 ic + \u00b50\u03b50 dΦE/dt (5.10). The line integral of the magnetic field around a closed path equals \u00b50 times the conduction current plus \u00b50\u03b50 times the rate of change of electric flux. Both conduction current and displacement current produce a magnetic field.\nTogether these four equations describe electrodynamics. The fourth equation ensures the existence of electromagnetic waves: a changing electric field produces a magnetic field, and a changing magnetic field produces an electric field, so the two can sustain each other.",k:[["gauss"],["electricity"],["magnetism"],["monopole"],["faraday"],["changing","rate of change"],["ampere","ampere-maxwell","ampere\u2013maxwell"],["displacement"],["conduction"],["electromagnetic wave"]]},
{m:5,q:"Explain the importance of Maxwell\u2019s correction to Ampere\u2019s circuital law.",a:"Ampere\u2019s circuital law, \u222e B\u00b7dl = \u00b50 ic, works only when a steady or conduction current passes through the surface bounded by the loop. When a capacitor is charged, the conduction current in the wire stops at the plates, so the law gives different values of the magnetic field depending on which surface is chosen. Maxwell removed this inconsistency by adding the displacement current id = \u03b50 dΦE/dt, which exists between the plates where the electric field changes. The corrected law \u222e B\u00b7dl = \u00b50 (ic + id) gives the same answer for every surface bounded by the loop.\nThe correction is important for three reasons: (1) it makes the magnetic field around a changing electric field consistent with the field around a current; (2) it completes the symmetry between electric and magnetic fields, a changing electric field produces a magnetic field just as a changing magnetic field produces an electric field; and (3) it predicts electromagnetic waves, which travel at speed c = 1/\u221a(\u03b50\u00b50), and whose existence was confirmed by Hertz in 1888.",k:[["steady","conduction"],["surface"],["displacement"],["\u03b50 d\u03a6","e0","d\u03a6e","dphi"],["symmetr"],["electromagnetic wave","waves"],["hertz"],["consistent","same"]]},
{m:2,q:"What is displacement current?",a:"Displacement current is the current that comes into play in a region where the electric field (or electric flux) is changing with time. It is given by id = \u03b50 dΦE/dt, where ΦE is the electric flux. A changing electric field produces a displacement current, which is the source of a magnetic field in the same way as a conduction current.",k:[["changing","time"],["electric field","electric flux"],["\u03b50","e0","epsilon"],["dφ","d\u03a6","dphi","d\u03a6e/dt"],["magnetic field"]]},
{m:2,q:"Write down the integral form of the modified Ampere\u2019s circuital law.",a:"\u222e B\u00b7dl = \u00b50 (ic + id) = \u00b50 ic + \u00b50 \u03b50 (dΦE/dt), where ic is the conduction current, id = \u03b50 dΦE/dt is the displacement current, and ΦE is the electric flux through the surface bounded by the loop.",k:[["\u00b50 (ic","\u00b50(ic","ic + id","ic+id"],["displacement"],["dφ/dt","d\u03a6/dt","dphi/dt","dΦ/dt"],["\u00b50\u03b50","\u00b50 \u03b50","\u03bc0\u03b50","mu0 e0"]]},
{m:2,q:"Write notes on Gauss\u2019s law for magnetism.",a:"Gauss\u2019s law for magnetism states that the surface integral of the magnetic field over any closed surface is zero: \u222e B\u00b7dA = 0. This means that magnetic field lines form closed loops and there are no isolated magnetic poles (no magnetic monopoles) in nature. If a magnetic monopole were found, this law would have to be modified.",k:[["zero","0"],["closed"],["monopole"],["field lines","closed loop"],["isolated"]]},
{m:2,q:"Write notes on Gauss\u2019s law for electricity.",a:"Gauss\u2019s law for electricity states that the net electric flux through a closed surface equals the net charge enclosed by the surface divided by \u03b50: \u222e E\u00b7dA = Qenclosed/\u03b50. It is true for both discrete and continuous charge distributions. It shows that electric field lines start from positive charges and end on negative charges, so an isolated positive or negative charge can exist.",k:[["electric flux","net flux"],["enclosed"],["\u03b50","e0"],["positive","negative"],["isolated"]]},
{m:2,q:"Why are electromagnetic waves non-mechanical?",a:"Electromagnetic waves are non-mechanical because they do not require a material medium for their propagation. They are produced by the oscillation of electric and magnetic fields, which are sustained by each other, so they can travel through vacuum at the speed of light (3 \u00d7 10\u2078 m s\u207b\u00b9). Mechanical waves such as sound need a medium.",k:[["medium"],["vacuum"],["electric and magnetic","electric","magnetic"],["sound","mechanical"],["speed of light","3 \u00d7 10"]]},
{m:5,q:"Describe the Hertz experiment for the production and detection of electromagnetic waves.",a:"Hertz set up a spark-gap oscillator (the transmitter) to produce electromagnetic waves. It consists of two metal electrodes made of small spherical metal balls, connected to larger spheres, with the ends connected to an induction coil that has a very large number of turns. The coil maintains the electrodes at a very high potential, the air between them ionises, and a spark is produced. The discharge sends energy in the form of electromagnetic waves to a receiver: a ring-type electrode (not completely closed) kept at a distance, which contains a small spark gap.\nWhen the transmitter spark occurs, a spark is also seen across the gap of the receiver, which shows that energy has been transmitted. If the receiver is rotated by 90\u00b0, no spark is observed, which shows that electromagnetic waves are transverse, as Maxwell had predicted. Hertz detected radio waves and measured their speed, which was equal to the speed of light, 3 \u00d7 10\u2078 m s\u207b\u00b9. This confirmed Maxwell\u2019s electromagnetic theory of light.",k:[["spark"],["induction coil","coil"],["receiver","ring"],["transverse","90"],["speed of light","3 \u00d7 10","3 x 10"],["maxwell"],["ionis","ioniz"]]}
]},
6:{exp:[
"Spherical mirrors: a concave mirror is silvered on the outside and reflects from the polished inner surface; a convex mirror reflects from the outer surface. The pole P is the centre of the mirror, the principal axis is the line joining P and the centre of curvature C, and the focus F is the point where parallel rays close to the axis converge (concave) or appear to diverge from (convex). The focal length f = PF, and the radius of curvature R = PC. For a spherical mirror of small aperture, f = R/2.",
"Cartesian sign convention: the incident light travels from left to right; distances are measured from the pole; distances to the right of the pole are positive and to the left negative; heights above the principal axis are positive and below it negative. Using this convention the same formulae apply to all types of mirror and lens.",
"Mirror equation: for a spherical mirror, 1/u + 1/v = 1/f, where u is the object distance, v the image distance and f the focal length. It is derived from the similar triangles formed by the reflected rays from the top of the object. Magnification m = −v/u.",
"Refraction and total internal reflection: Snell’s law n1 sin i = n2 sin r holds at a boundary. When light goes from a denser to a rarer medium, the angle of refraction increases. The critical angle ic is the angle of incidence in the denser medium for which the refracted ray grazes the boundary (r = 90°), with sin ic = n2/n1. For i > ic, the light is totally internally reflected; this needs light to travel from denser to rarer medium and i > ic.",
"Apparent depth: when an object is viewed along the normal from a denser medium (refractive index n) into air, it appears closer to the surface. For near-normal viewing the apparent depth is d\u2032 = d/n, where d is the real depth. This is why the bottom of a tank of water looks raised.",
"Twinkling of stars: stars do not actually twinkle. Their light is refracted repeatedly by atmospheric layers of varying refractive index, which move; this makes the apparent position and brightness of a star vary, so it appears to twinkle. Planets are nearby and do not twinkle as much, because they subtend a larger angle.",
"Lens maker\u2019s formula: for a thin lens of refractive index n in air with surface radii R1 and R2, 1/f = (n \u2212 1)(1/R1 \u2212 1/R2). A thin lens has two focal points; when the media on both sides have the same refractive index, the two focal lengths are equal.",
"Power of a lens: the power P is a measure of the deviating ability of a lens, P = 1/f (f in metre). Its SI unit is the dioptre (D). A lens with a shorter focal length has greater power and bends light more strongly.",
"Prism: a triangular block of transparent glass with three plane faces. The face at the bottom is rough and is called the base; the two polished faces are the refracting faces, and the angle between them is the angle of the prism A. The angle between the incident ray and the emergent ray is the angle of deviation d. At minimum deviation the ray inside the prism is parallel to its base, and the refractive index is n = sin((A + d_min)/2)/sin(A/2).",
"Dispersion: the splitting of white light into its constituent colours. When a narrow beam of white light falls on a prism, a band of colours is obtained in the order VIBGYOR (violet, indigo, blue, green, yellow, orange, red). Violet is the most deviated and red the least deviated, because the refractive index is greater for shorter wavelengths.",
"Rainbow: formed when sunlight enters water droplets in the air after a shower, with the sun behind the observer. Light is refracted, dispersed and internally reflected in each droplet. The primary rainbow has one internal reflection (violet to red, seen at 40\u00b0 to 42\u00b0); the secondary rainbow has two (red to violet, seen at 52\u00b0 to 54\u00b0).",
"Scattering of light: when light is scattered by particles much smaller than its wavelength (a << \u03bb), the scattering is Rayleigh scattering and its intensity is inversely proportional to the fourth power of wavelength (I \u221d 1/\u03bb\u2074). Violet and blue are scattered most, so the sky appears blue by day, and at sunrise and sunset the red light reaches the eye, so the sky looks reddish. Clouds contain large droplets (a >> \u03bb), so all colours are scattered equally and clouds look white.",
"Optical path: the optical path of a medium of refractive index n and thickness d is d\u2032 = nd, the distance light would travel in vacuum in the same time it takes to travel d in the medium.",
"Principle of reversibility: light follows exactly the same path if its direction of travel is reversed. It holds for both reflection and refraction, and it gives n12 = 1/n21.",
"Glittering of diamond: diamond has refractive index about 2.417 and critical angle about 24.4\u00b0, much smaller than that of ordinary glass. A cutter shapes the diamond so that light entering it is totally internally reflected from many cut faces before leaving, which gives the sparkle.",
"Mirage and looming: in hot places the air near the ground is less dense, so its refractive index decreases towards the ground. Light from a tall object is bent away from the normal until it undergoes total internal reflection, giving the illusion of a pool of water (mirage). In cold regions (glaciers, frozen lakes) the reverse happens and an inverted image appears above the surface (looming).",
"Snell\u2019s window: light from a source inside a water tank emerges from the surface only within a circle whose angle equals the critical angle. Seen from inside, the view through the surface is restricted to a circular window of angle 2ic. For water animals the angle of view is 2ic.",
"Optical fibre: a fibre has a core of higher refractive index n1 and a cladding of lower refractive index n2. Light entering at a suitable angle undergoes repeated total internal reflection at the core\u2013cladding boundary and travels along the fibre with little loss. For this to happen the angle at the boundary must be at least the critical angle, and the acceptance angle ia at the entry face sets the limit.",
"Lateral displacement in a glass slab: a ray entering a parallel-sided glass slab and leaving it is parallel to its original direction but shifted sideways by the lateral displacement L = t sin(i \u2212 r)/cos r, where t is the thickness, i the angle of incidence and r the angle of refraction. The shift grows with thickness, with angle of incidence and with refractive index.",
"Lateral magnification: for a spherical mirror (and lens) the lateral or transverse magnification is m = h\u2032/h, the ratio of image height to object height, both measured perpendicular to the principal axis. With the sign convention, m = \u2212v/u for mirrors.",
"Endoscope: an instrument used to look inside a patient\u2019s body. It is a flexible bundle of optical fibres, which carry light in and carry the image out by repeated total internal reflection, so that the inside of the body can be seen without surgery.",
"Thin lens equation: for a thin lens, 1/v \u2212 1/u = 1/f (6.63), where u is the object distance, v the image distance and f the focal length, with the sign convention for lenses. It is obtained by adding the refraction equations for the two surfaces, and it holds for any type of lens.",
"Lateral magnification of a lens: m = h\u2032/h = v/u. For a real image the image is inverted, so m is negative with the sign convention.",
"Fizeau\u2019s method: a light beam is passed through the gaps of a rotating toothed wheel, reflected by a distant mirror (about 8 km away) and returned. The speed is found from the distance 2d travelled and the time t taken, where t = \u03b8/\u03c9 and \u03b8 is the angle between one tooth and the next gap. The light disappears when the returning beam meets a tooth, which fixes the time.",
"Refraction at a single spherical surface: for paraxial rays from a point object O in a medium of index n1 to an image I in a medium of index n2, separated by a spherical surface of radius R: n2/v \u2212 n1/u = (n2 \u2212 n1)/R (6.56). This is the basic equation from which the lens equation is obtained."],

wr:[
{m:2,q:"Define radius of curvature, principal axis and focal length of a spherical mirror.",a:"The radius of curvature R of a spherical mirror is the radius of the sphere of which the mirror is a part. The principal axis is the line joining the pole P of the mirror and the centre of curvature C. The focal length f is the distance between the pole P and the focus F of the mirror.",k:[["radius","sphere"],["pole","centre of curvature"],["principal axis","line joining"],["focal length","focus","distance"]]},
{m:2,q:"Derive the relation between f and R for a spherical mirror.",a:"Consider a ray parallel to the principal axis striking a spherical mirror close to the pole P. It is reflected through the focus F. For a small aperture the reflected ray meets the principal axis at a point F close to P, and the angle of incidence equals the angle of reflection. The centre of curvature C lies on the normal at the point of incidence, so the normal PC bisects the angle, and the triangle gives PF = PC/2. Hence f = R/2 (6.4).",k:[["r/2","r / 2","f = r/2","f=r/2"],["focus","focal point"],["angle of incidence","angle of reflection"],["normal"],["centre of curvature"]]},
{m:2,q:"State the Cartesian sign convention for spherical mirrors.",a:"(i) The incident light is taken to travel from left to right. (ii) All distances are measured from the pole of the mirror. (iii) Distances measured to the right of the pole along the principal axis are positive. (iv) Distances measured to the left of the pole are negative. (v) Heights measured upwards perpendicular to the principal axis are positive. (vi) Heights measured downwards are negative.",k:[["left to right"],["pole"],["positive"],["negative"],["upward","upwards"],["downward","downwards"]]},
{m:2,q:"What is critical angle and total internal reflection?",a:"The critical angle ic is the angle of incidence in a denser medium for which the angle of refraction in the rarer medium is 90\u00b0, so the refracted ray grazes the boundary. When the angle of incidence in the denser medium exceeds the critical angle, no refraction occurs and the entire light is reflected back into the denser medium. This phenomenon is called total internal reflection.",k:[["grazes","90"],["denser"],["rarer"],["reflect"],["exceeds","greater","beyond"]]},
{m:5,q:"Derive the mirror equation for a spherical mirror.",a:"Consider an object AB on the principal axis of a concave mirror, beyond the centre of curvature C. Take three paraxial rays from the top point B of the object: (1) the ray BD parallel to the principal axis, which after reflection passes through the focus F; (2) the ray BP incident at the pole P, which is reflected making the same angle with the axis; (3) the ray BC through the centre of curvature C, which falls normally on the mirror and retraces its path. The three reflected rays meet at A\u2032B\u2032, the real and inverted image.\nBy the law of reflection, the angle of incidence \u2220BPA equals the angle of reflection \u2220B\u2032PA\u2032, so triangles BPA and B\u2032PA\u2032 are similar. Also the triangles DPF and B\u2032A\u2032F are similar, since PD is small. From the similar triangles BPA and B\u2032PA\u2032: A\u2032B\u2032/AB = PA\u2032/PA, i.e. the magnification is \u2212v/u (6.13). From the similar triangles DPF and B\u2032A\u2032F with PD = AB: PF/FA\u2032 = PD/A\u2032B\u2032, which gives (v \u2212 f)/f = \u2212 v/... Applying the Cartesian sign convention (u negative, v negative for a real image, f negative for a concave mirror) the relation reduces to\n1/u + 1/v = 1/f   (mirror equation)\nwith f = R/2.",k:[["paraxial"],["focus","f"],["centre of curvature","centre"],["similar"],["angle of incidence","angle of reflection","law of reflection"],["1/u + 1/v","1/u+1/v","1/v + 1/u","mirror equation"],["magnification","\u2212v/u","-v/u"],["sign convention","cartesian"]]},
,
{m:2,q:"What is apparent depth? Give the expression for it when an object is viewed from air.",a:"Apparent depth is the depth at which an object appears to be when viewed from a medium of different refractive index. For an object at real depth d in a denser medium of refractive index n, viewed along the normal from air (refractive index 1), the apparent depth is d\u2032 = d/n (6.27). This is why the bottom of a tank of water appears raised.",k:[["apparent"],["d/n","d / n","real depth"],["air"],["raised","closer","shallower"]]},
{m:2,q:"Why do stars twinkle?",a:"Stars do not actually twinkle. Light from a star passes through layers of the atmosphere whose refractive index keeps changing because the layers move. The light is refracted by varying amounts, so the apparent position and brightness of the star change continuously and it appears to twinkle.",k:[["refract"],["atmospher","atmosphere"],["refractive index","varying"],["layers","move"],["apparent"]]},
{m:2,q:"Define power of a lens. Give its unit.",a:"The power of a lens is a measure of its ability to converge or diverge light. It is the reciprocal of the focal length, P = 1/f (f in metre). Its SI unit is the dioptre (D). A lens of shorter focal length has greater power.",k:[["reciprocal","1/f","p = 1/f"],["dioptre","diopter","d"],["converge","diverge","deviat"],["shorter","focal length"]]},
{m:2,q:"State the lens maker\u2019s formula.",a:"The lens maker\u2019s formula gives the focal length of a thin lens of refractive index n placed in air, with surface radii of curvature R1 and R2: 1/f = (n \u2212 1)(1/R1 \u2212 1/R2). It tells us how the focal length depends on the refractive index and the curvatures of the two surfaces.",k:[["1/f","1/f = (n"],["n \u2212 1","n-1","(n \u2212 1)","n - 1"],["r1","r2","radii","radius"],["thin lens"]]},
,
{m:2,q:"Define angle of deviation and angle of prism for a prism.",a:"The angle of prism A (refracting angle or apex angle) is the angle between the two refracting faces of the prism. The angle of deviation d is the angle between the direction of the incident ray and the direction of the emergent ray.",k:[["refracting faces","two faces","faces"],["angle between"],["incident","emergent"],["deviation"]]},
{m:2,q:"What is dispersion of light?",a:"Dispersion is the splitting of white light into its constituent colours. When a narrow beam of white light is refracted by a prism, a band of colours called the spectrum is obtained in the order VIBGYOR. Violet is the most deviated colour and red the least deviated.",k:[["splitting","split"],["colours","colors"],["spectrum"],["violet"],["red"]]},
{m:2,q:"Why is the sky blue during the day and reddish during sunrise and sunset?",a:"Air molecules scatter light by Rayleigh scattering, whose intensity is inversely proportional to the fourth power of wavelength. Violet and blue, which have short wavelengths, are scattered most, and the eye is more sensitive to blue, so the sky looks blue by day. At sunrise and sunset the light travels a longer path through the atmosphere; the blue light is scattered away, and the less scattered red light reaches the eye, so the sky looks reddish.",k:[["rayleigh","scatter"],["fourth power","1/\u03bb","wavelength"],["blue"],["red"],["sunrise","sunset"],["longer path","distance"]]},
{m:2,q:"Why do clouds appear white?",a:"Clouds contain water droplets and dust particles whose size is much larger than the wavelength of light (a >> \u03bb). For such large particles the scattering does not depend on wavelength, so all colours are scattered equally, and the mixture of colours appears white.",k:[["large","greater"],["droplets","dust"],["wavelength"],["equal","all colours","independent"],["white"]]},
,
{m:2,q:"Define optical path of a medium.",a:"The optical path of a medium is the distance d\u2032 that light would travel in vacuum in the same time it takes to travel a distance d in the medium. For a medium of refractive index n and thickness d, the optical path is d\u2032 = nd, since light is slower in the medium.",k:[["vacuum"],["same time","time"],["nd","n d","n \u00d7 d"],["distance"]]},
{m:2,q:"State the principle of reversibility of light.",a:"The principle of reversibility states that light follows exactly the same path if its direction of travel is reversed. This is true for both reflection and refraction. For refraction between two media it gives n12 = 1/n21.",k:[["same path","path"],["reversed","reverse"],["reflection","refraction"],["1/n","n21"]]},
{m:2,q:"Why does diamond glitter?",a:"Diamond glitters because of total internal reflection inside it. Its refractive index (about 2.417) is much higher than that of glass, and its critical angle (about 24.4\u00b0) is small. A skilled cutter shapes the faces so that light entering the diamond is totally internally reflected several times before it leaves, giving the sparkling effect.",k:[["total internal reflection","total internal"],["refractive index","2.417"],["critical angle","24.4"],["cut","faces"],["sparkl"]]},
{m:2,q:"What are mirage and looming?",a:"A mirage is an illusion caused by refraction and total internal reflection in hot air. Near the hot ground the refractive index decreases, and light from a tall object bends away from the normal until it is totally reflected, so the object appears reflected in a pool of water below it. Looming is the reverse effect in cold regions, where the refractive index increases towards the ground and an inverted image appears above the surface.",k:[["hot"],["refractive index"],["total internal","totally reflected","reflect"],["cold"],["inverted"]]},
{m:2,q:"What is Snell\u2019s window?",a:"Snell\u2019s window is the circular patch of the water surface through which an observer inside the water can see the outside world. Light from outside enters the water only through a circle whose angle is the critical angle, so the view from inside is restricted to this window, of angle 2ic.",k:[["circular","circle"],["critical angle","ic"],["inside","water"],["restrict","window"]]},
{m:2,q:"What is the principle of an optical fibre?",a:"An optical fibre works on total internal reflection. It has a core of higher refractive index and a cladding of lower refractive index. Light entering the core at a suitable angle strikes the core\u2013cladding boundary at an angle greater than the critical angle, so it is repeatedly totally internally reflected and travels along the fibre with little loss of intensity.",k:[["total internal reflection","total internal"],["core"],["cladding"],["higher","greater"],["critical angle"],["loss"]]},
{m:5,q:"Derive the expression for the acceptance angle and numerical aperture of an optical fibre.",a:"Consider light entering the fibre from an outer medium of refractive index n3 at an angle ia with the axis, refracting into the core (refractive index n1) at angle ra. At the core\u2013cladding boundary (refractive index n2) the ray must meet the critical angle ic for total internal reflection. Since ic = 90\u00b0 \u2212 ra, the Snell\u2019s law at the core\u2013cladding boundary gives n1 sin ic = n2 sin 90\u00b0 = n2, so sin ic = n2/n1 and cos ra = n2/n1.\nSin ra = \u221a(1 \u2212 cos\u00b2ra) = \u221a(n1\u00b2 \u2212 n2\u00b2)/n1.\nAt the entry point, Snell\u2019s law gives n3 sin ia = n1 sin ra = \u221a(n1\u00b2 \u2212 n2\u00b2).\nThe maximum angle of incidence for which total internal reflection occurs inside the core is the acceptance angle ia, with sin ia = \u221a(n1\u00b2 \u2212 n2\u00b2)/n3.\nThe numerical aperture is NA = n3 sin ia = \u221a(n1\u00b2 \u2212 n2\u00b2). For air (n3 = 1), NA = sin ia. A larger numerical aperture lets the fibre accept light over a wider cone of entry angles.",k:[["critical angle","ic"],["core","n1"],["cladding","n2"],["snell","snell\u2019s"],["cos","cos ra"],["sin ra"],["n3 sin","n3sin"],["\u221a(n1","n1\u00b2 \u2212 n2\u00b2","n1^2 - n2^2","n1 2 - n2 2"],["numerical aperture","na"],["acceptance"]]},
,
{m:2,q:"What is lateral displacement of light passing through a glass slab?",a:"When light passes through a parallel-sided glass slab, it emerges parallel to its original direction but shifted sideways. The perpendicular distance between the emergent ray and the extended incident ray is called the lateral displacement L. It depends on the thickness of the slab, the angle of incidence and the refractive index of the slab.",k:[["parallel","direction"],["shift","sideways","displacement"],["perpendicular"],["thickness"],["refractive index"]]},
{m:2,q:"Define lateral magnification of a spherical mirror.",a:"The lateral (transverse) magnification m is the ratio of the height of the image h\u2032 to the height of the object h, both measured perpendicular to the principal axis: m = h\u2032/h. With the Cartesian sign convention it is also given by m = \u2212v/u.",k:[["height","h\u2032/h","h\u2032 / h","h'/h"],["ratio"],["perpendicular"],["-v/u","\u2212v/u"]]},
{m:2,q:"How does an endoscope work?",a:"An endoscope is a flexible bundle of optical fibres. Light is carried into the body through some of the fibres to illuminate the inside, and the image is carried back out through other fibres. Light is transmitted along each fibre by repeated total internal reflection, so the inside of the body can be examined without surgery.",k:[["optical fibre","fibres","fibers"],["total internal reflection"],["light"],["image"],["body","surgery"]]},
{m:5,q:"Obtain an expression for the lateral displacement of light passing through a glass slab.",a:"Consider a glass slab of thickness t and refractive index n in air. A ray ABCD is incident at B with angle of incidence i and refracts to angle r; it refracts again at C and leaves the slab parallel to the incident ray. The lateral displacement L is the perpendicular distance CE between the emergent ray and the undeviated (extended) incident path.\nIn triangle BCE: sin(i \u2212 r) = L/BC, so BC = L/sin(i \u2212 r)   (6.48).\nIn triangle BCF: cos r = t/BC, so BC = t/cos r   (6.49).\nEquating: L/sin(i \u2212 r) = t/cos r, so L = t sin(i \u2212 r)/cos r   (6.50).\nThe lateral displacement is larger for a thicker slab, a larger angle of incidence and a larger refractive index (which decreases r). For example, a 0.25 m slab of index 1.5 with i = 60\u00b0 (r = 35.25\u00b0) gives L = 0.128 m (12.8 cm).",k:[["bc","bc ="],["sin(i","sin (i","i \u2212 r","i - r"],["cos r","cos(r","cos (r"],["t sin","t \u00d7","l = t"],["thicker","thickness"],["angle of incidence"],["refractive index"]]},
,
{m:2,q:"State the lens equation for a thin lens.",a:"The lens equation for a thin lens relates the object distance u, the image distance v and the focal length f: 1/v \u2212 1/u = 1/f, using the sign convention for lenses. It holds for all types of thin lens.",k:[["1/v","1/v \u2212 1/u","1/v - 1/u"],["1/f"],["object distance"],["image distance"],["sign convention"]]},
{m:2,q:"Define lateral magnification for a lens.",a:"The lateral magnification m of a lens is the ratio of the height of the image to the height of the object, both measured perpendicular to the principal axis. It is given by m = h\u2032/h = v/u. A real image formed by a convex lens is inverted, so m is negative.",k:[["height","h\u2032/h","ratio"],["v/u","v / u"],["inverted","negative"]]},
{m:5,q:"Derive the lens equation for a thin lens from the refraction at its two spherical surfaces.",a:"Consider a thin lens of refractive index n2 placed in a medium of refractive index n1, with radii of curvature R1 and R2. A point object O on the principal axis forms an image after refraction at the first surface and then at the second surface.\nRefraction at the first surface (light goes from n1 to n2): n2/v\u2032 \u2212 n1/u = (n2 \u2212 n1)/R1   (6.58).\nRefraction at the second surface (light goes from n2 to n1; the intermediate image acts as a virtual object): n1/v \u2212 n2/v\u2032 = (n1 \u2212 n2)/R2   (6.59).\nAdding (6.58) and (6.59) eliminates v\u2032: n1/v \u2212 n1/u = (n2 \u2212 n1)(1/R1 \u2212 1/R2).\nDividing by n1 and writing n = n2/n1 (the lens refractive index relative to the medium): 1/v \u2212 1/u = (n \u2212 1)(1/R1 \u2212 1/R2) (6.60).\nThe right side is 1/f from the lens maker\u2019s formula, so 1/v \u2212 1/u = 1/f (6.63). This is the lens equation, valid for any type of thin lens.",k:[["refraction","refract"],["first surface","second surface"],["virtual object","intermediate"],["add","adding"],["n1/v","1/v"],["lens maker","1/f"],["n \u2212 1","n-1","(n \u2212 1)"],["1/v \u2212 1/u","1/v - 1/u"]]},
{m:5,q:"Describe Fizeau\u2019s method to determine the speed of light.",a:"Fizeau\u2019s apparatus has a light source S, a partially silvered glass plate G at 45\u00b0 to the beam, a rotating toothed wheel with N teeth and N gaps of equal width, and a distant mirror M about 8 km away. Light passes through one gap, is reflected by M, and returns through the same gap to the observer. If the wheel is not rotating the observer sees the light.\nWorking: the angular speed \u03c9 of the wheel is increased from zero until the returning light passing through one gap is blocked by the adjacent tooth, so the light disappears for the first time. The angle between one tooth and the next gap is \u03b8 = 2\u03c0/(2N) = \u03c0/N. The time the wheel takes to turn through \u03b8 is t = \u03b8/\u03c9.\nIn this time the light travels the distance 2d from the wheel to the mirror and back, so the speed of light is v = 2d/t. Substituting t = \u03b8/\u03c9 gives v in terms of d, N and \u03c9. Fizeau obtained a value close to 3 \u00d7 10\u2078 m s\u207b\u00b9 by this method.",k:[["partially silvered","partially"],["toothed","teeth"],["gap","cut","slot"],["mirror"],["angular speed","\u03c9"],["disappear","blocked"],["\u03b8","theta"],["2d","2 d"],["v = 2d/t","2d/t","v = 2d"]]},
,
{m:2,q:"State the equation for refraction at a single spherical surface.",a:"For paraxial rays from a point object O in a medium of refractive index n1 that refracts at a spherical surface of radius R into a medium of refractive index n2, the image I is formed where n2/v \u2212 n1/u = (n2 \u2212 n1)/R (6.56), with the Cartesian sign convention. It is the basic equation from which the lens equation is derived.",k:[["n2/v","n2 / v","n2/v"],["n1/u","n1 / u"],["(n2","n2 \u2212 n1","n2-n1"],["/r","/ r","r"],["paraxial"]]},
{m:2,q:"Give the formula for the refractive index of a prism material in terms of its angle of minimum deviation.",a:"At minimum deviation the ray inside the prism is parallel to the base, with i1 = i2 and r1 = r2 = A/2. The refractive index of the prism material is n = sin((A + D)/2) / sin(A/2), where A is the angle of the prism and D the angle of minimum deviation (6.89).",k:[["sin((a + d)/2)","sin ((a+d)/2)","(a+d)/2","a + d"],["sin(a/2)","sin a/2","a/2"],["n ="],["minimum deviation"]]},
{m:3,q:"The angle of minimum deviation for an equilateral prism is 37\u00b0. Find the refractive index of the material of the prism.",a:"(Worked by me from equation 6.89; the result matches the book\u2019s answer.)\nA = 60\u00b0 for an equilateral prism, D = 37\u00b0.\nn = sin((A + D)/2)/sin(A/2) = sin(48.5\u00b0)/sin(30\u00b0) = 0.749/0.5 \u2248 1.5.\nThe refractive index of the prism material is about 1.5.",k:[["sin(48","48.5","(a+d)/2","(a + d)/2"],["0.749","0.75"],["sin30","sin 30","0.5"],["1.5","1.50"]]},
{m:5,q:"Derive the equation for refraction at a single spherical surface.",a:"Consider a point object O in a medium of refractive index n1, and a spherical surface of radius R and centre C separating it from a medium of index n2. Take a paraxial ray from O that meets the surface at N, close to the pole P, and is refracted to meet the axis at I. Let the angles of the ray with the axis be \u03b1 (at O), \u03b2 (at C, the normal) and \u03b3 (at I). For paraxial rays the small angles satisfy tan\u03b1 \u2248 \u03b1 \u2248 h/u, tan\u03b2 \u2248 h/R, tan\u03b3 \u2248 h/v, where h is the height of N above the axis.\nFrom triangle NOC the exterior angle gives \u03b2 = \u03b1 + i and, from triangle NCI, \u03b3 = \u03b2 \u2212 r. Snell\u2019s law for small angles gives n1 i = n2 r. Eliminating i and r and substituting the small-angle values gives\nn1 (\u03b2 \u2212 \u03b1) = n2 (\u03b2 \u2212 \u03b3)\nor, with the values above, n1 (h/R \u2212 h/u) = n2 (h/R \u2212 h/v). Dividing by h and rearranging:\nn2/v \u2212 n1/u = (n2 \u2212 n1)/R   (6.56)\nThis is the equation for refraction at a single spherical surface, valid for paraxial rays with the Cartesian sign convention.",k:[["paraxial"],["n1","n2"],["snell"],["small angle","tan"],["h/u","h / u"],["h/v","h / v"],["h/r","h / r"],["n2/v","n2 / v"],["n1/u","n1 / u"],["(n2 \u2212 n1)/r","(n2-n1)/r","n2 \u2212 n1"]]},
,
{m:3,q:"An object of 4 cm height is placed 6 cm in front of a concave mirror of radius of curvature 24 cm. Find the position, height, magnification and nature of the image.",a:"(Worked by me; the result matches the book\u2019s answer.)\nf = R/2 = \u221212 cm (concave, Cartesian convention), u = \u22126 cm.\n1/v = 1/f \u2212 1/u = (\u22121/12) + (1/6) = 1/12, so v = +12 cm.\nThe image is 12 cm behind the mirror, so it is virtual.\nm = \u2212v/u = \u221212/(\u22126) = 2, so h\u2032 = 2 \u00d7 4 = 8 cm and the image is erect and twice the object height.",k:[["12 cm","v = 12","v=12","+12"],["virtual"],["erect"],["2"],["8 cm","h\u2032 = 8","8"]]},
{m:3,q:"An object is placed in front of a concave mirror of focal length 20 cm. The image formed is three times the size of the object. Calculate the two possible distances of the object from the mirror.",a:"(Worked by me; the results match the book\u2019s answers.)\nf = \u221220 cm. For m = +3 (virtual image): v = \u22123u. Using 1/v + 1/u = 1/f: (\u22121/(3u)) + 1/u = \u22121/20, so (2/3)(1/u) = \u22121/20 and u = \u221240/3 cm.\nFor m = \u22123 (real image): v = 3u. Then (1/(3u)) + 1/u = \u22121/20, so (4/3)(1/u) = \u22121/20 and u = \u221280/3 cm.\nThe two object distances are \u221240/3 cm (about 13.3 cm) and \u221280/3 cm (about 26.7 cm).",k:[["40/3","13.3"],["80/3","26.7"],["m = +3","v = \u22123u","+3"],["m = \u22123","v = 3u","\u22123"]]},
{m:3,q:"A beam of light consisting of red, green and blue is incident on a right-angled prism as shown in the figure. The refractive index of the material of the prism for red, green and blue colours are 1.39, 1.44 and 1.47 respectively. Which of the colours suffer total internal reflection? [Figure described in words: a right-angled prism with the light entering one short face normally and striking the hypotenuse at 45\u00b0.]",a:"(Worked by me; the result matches the book\u2019s answer.)\nThe light enters normally, so it is not deviated, and strikes the hypotenuse at 45\u00b0. Total internal reflection needs 45\u00b0 > critical angle, i.e. sin 45\u00b0 > 1/n.\nRed (n = 1.39): sin ic = 1/1.39 = 0.719, ic = 46.0\u00b0. Since 45\u00b0 < 46.0\u00b0, red is refracted out.\nGreen (n = 1.44): sin ic = 0.694, ic = 44.0\u00b0. Since 45\u00b0 > 44.0\u00b0, green is totally internally reflected.\nBlue (n = 1.47): sin ic = 0.680, ic = 42.9\u00b0. Blue is also totally internally reflected.\nAnswer: green and blue suffer total internal reflection.",k:[["green"],["blue"],["red"],["critical","sin ic","1/n"],["45"],["total internal"]]},
{m:3,q:"An object is placed at a certain distance from a convex lens of focal length 20 cm. Find the object distance if the image obtained is magnified 4 times.",a:"(Worked by me; the result matches the book\u2019s answer of u = \u221215 cm.)\nFor a convex lens f = +20 cm. Magnified image: m = v/u = +4 (virtual, erect), so v = 4u.\nUsing 1/v \u2212 1/u = 1/f: 1/(4u) \u2212 1/u = 1/20, so \u2212(3/(4u)) = 1/20 and u = \u221215 cm.\nThe image is 60 cm on the same side as the object, and the object is 15 cm from the lens.",k:[["15 cm","\u221215","-15","u = \u221215"],["v = 4u","4u","m = 4"],["1/v \u2212 1/u","1/v - 1/u","1/f"],["virtual"]]},
{m:3,q:"A thin converging lens of refractive index 1.5 has a power of +5.0 D. When this lens is immersed in a liquid, it acts as a divergent lens of focal length 100 cm. What must be the value of n of the liquid?",a:"(Worked by me; the result matches the book\u2019s answer n = 5/3.)\nIn air the lens has f = 1/P = 0.2 m, so the lens-maker factor is K = 1/R1 \u2212 1/R2 = 5/(0.5) = 10 m\u207b\u00b9 (from (1.5 \u2212 1)K = 5 D).\nIn a liquid of index n: 1/f\u2032 = (n_lens/n \u2212 1) K = (1.5/n \u2212 1) \u00d7 10.\nFor a divergent lens f\u2032 = \u22121 m, so \u22121 = (1.5/n \u2212 1) \u00d7 10, which gives 1.5/n = 0.9 and n = 5/3.",k:[["5/3","1.67"],["1/f","(1.5/n","1.5/n"],["10","k"],["0.9"],["divergent"]]},
{m:3,q:"If the distance D between an object and a screen is greater than 4 times the focal length f of a convex lens, then there are two positions for which the lens forms an enlarged image and a diminished image respectively. If d is the distance between the two positions of the lens, obtain the equation for focal length of the convex lens (conjugate foci method).",a:"(Worked by me; the result matches the book\u2019s answer f = (D\u00b2 \u2212 d\u00b2)/(4D).)\nFor the two conjugate positions, the object and image distances are interchanged: u1 + v1 = D and v1 = |u2|. The separation of the two lens positions is d = u1 \u2212 u2 (in magnitude).\nSolving the lens equation with these relations gives u1 = (D + \u221a(D\u00b2 \u2212 4Df))/2 and d = \u221a(D\u00b2 \u2212 4Df).\nEliminating: d\u00b2 = D\u00b2 \u2212 4Df, so f = (D\u00b2 \u2212 d\u00b2)/(4D).",k:[["d\u00b2 \u2212 d\u00b2","d2","d\u00b2","d^2"],["4d","4 d","4D"],["conjugate"],["d\u00b2 = d\u00b2","d\u00b2 = d\u00b2 \u2212 4df","d\u00b2 \u2212 4"],["f ="]]},
{m:3,q:"Find the ratio of the intensities of lights with wavelengths 500 nm and 300 nm which undergo Rayleigh scattering.",a:"(Worked by me; the result matches the book\u2019s answer of 81 : 625.)\nRayleigh scattering intensity I \u221d 1/\u03bb\u2074.\nI(500 nm) / I(300 nm) = (300/500)\u2074 = (3/5)\u2074 = 81/625.\nSo the ratio is 81 : 625.",k:[["81","81/625"],["625"],["1/\u03bb","\u03bb4","\u03bb\u2074","fourth"],["300","500"]]},
,
{m:2,q:"(Conceptual) Why are dish antennas curved?",a:"A dish antenna is a concave reflector shaped like a paraboloid. Incoming parallel radio waves from a distant source are reflected by the curved surface and converge at its focus, where the receiver is placed. The curvature therefore concentrates the weak signal onto the receiver, increasing its strength.",k:[["concave","reflector","curved"],["parallel"],["focus","focal"],["converge","concentrat"],["receiver","signal"]]},
{m:2,q:"(Conceptual) What type of lens is formed by a bubble inside water?",a:"An air bubble inside water acts as a diverging (concave) lens. Air has a lower refractive index than water, so light is refracted away from the axis at the bubble's surfaces, which makes the bubble diverge light. The bubble is a double concave lens in shape, and it has a negative focal length.",k:[["diverging","concave"],["air","lower refractive"],["water"],["negative","double concave"]]},
{m:2,q:"(Conceptual) Is it possible for two lenses to produce zero power?",a:"Yes. A convex lens and a concave lens of equal magnitude of power, placed in contact, have powers that add to zero. Their focal lengths are equal in magnitude but opposite in sign, so the combination has zero power and acts as a plane sheet of glass.",k:[["yes"],["convex","concave"],["equal","same magnitude"],["add","sum","zero"],["plane"]]},
{m:2,q:"(Conceptual) Why is yellow light preferred to blue light during fog?",a:"Fog contains droplets whose size is comparable to or larger than the wavelength of light, and the scattering from them is not strongly wavelength-dependent for such droplets. Yellow light has a longer wavelength than blue light, so it is scattered less by the fine particles in fog and penetrates it better. Blue light is scattered more strongly and is therefore less useful for seeing through fog.",k:[["longer wavelength","wavelength"],["scatter"],["penetrat"],["blue"],["yellow"]]},
,
{m:2,q:"What are primary focus and secondary focus of a lens?",a:"The primary focus F1 of a lens is the point at which a point source placed there produces parallel emergent rays after passing through the lens. Its distance from the optical centre P is the primary focal length f1. The secondary focus F2 is the point where parallel rays travelling close to the principal axis converge (or appear to diverge from) after passing through the lens. A converging lens has a real secondary focus and a diverging lens a virtual one. If the media on both sides have the same refractive index, the two focal lengths are equal.",k:[["parallel"],["point source","point source"],["converge","diverge"],["optical centre","p"],["same refractive","equal"],["real","virtual"]]},
{m:2,q:"State the sign conventions followed for focal lengths of a lens.",a:"The sign conventions for thin lenses differ only in the signs of focal lengths. With the Cartesian convention, the incident light travels from left to right, distances are measured from the optical centre, distances measured to the right are positive and to the left negative. A converging (convex) lens has a positive focal length, and a diverging (concave) lens has a negative focal length.",k:[["left to right"],["optical centre","centre"],["positive"],["negative"],["converging","convex"],["diverging","concave"]]},
{m:2,q:"What is the angle of deviation due to refraction?",a:"The angle of deviation due to refraction is the angle between the direction of the incident ray and the direction of the refracted ray. When light travels from a rarer to a denser medium it bends towards the normal, and the deviation is d = i \u2212 r. When it travels from a denser to a rarer medium, the deviation is d = r \u2212 i.",k:[["angle between","between"],["incident","refracted"],["normal"],["i \u2212 r","i - r","d = i"],["r \u2212 i","r - i","d = r"]]},
,
{m:2,q:"What is relative refractive index? Give its expression.",a:"The refractive index of the second medium with respect to the first medium is called the relative refractive index, denoted n21. It is given by n21 = n2/n1 (6.22), where n1 and n2 are the absolute refractive indices of the first and second media. It is the ratio of the speeds of light in the two media: n21 = v1/v2.",k:[["second","first"],["n2/n1","n2 / n1","n21"],["ratio"],["speed","velocity"],["absolute"]]},
{m:2,q:"What is angle of minimum deviation?",a:"For a prism, the deviation changes with the angle of incidence and reaches a minimum value. This minimum value is called the angle of minimum deviation D. At minimum deviation the angle of incidence equals the angle of emergence (i1 = i2), and the angles of refraction at the two faces are equal (r1 = r2). The ray inside the prism is then parallel to the base of the prism.",k:[["minimum"],["angle of incidence","incidence"],["emergence","emergent"],["refraction","refracted"],["parallel","base"]]},
,
{m:5,q:"Obtain an expression for the radius of illumination (Snell\u2019s window) for a fish at depth d in water of refractive index n.",a:"A fish at depth d in water (refractive index n1 = n) sees the outside world only through a circular window at the surface, called Snell\u2019s window. Light from outside that reaches the fish must enter the water at angles up to the critical angle ic of water with respect to air.\nFrom the fish, a ray travels upward to the surface at the critical angle ic. The radius R of the window is the distance from the point directly above the fish to the edge of the circle, so from the right-angled triangle formed by the depth d, the radius R and the ray:\nR = d tan ic\nFor water to air, sin ic = n2/n1 = 1/n. Then\ntan ic = sin ic/cos ic = (1/n)/\u221a(1 \u2212 1/n\u00b2) = 1/\u221a(n\u00b2 \u2212 1)\nSo the radius of illumination is R = d/\u221a(n\u00b2 \u2212 1)   (6.36).\nIf the medium outside is air, n2 = 1 and n1 = n. The radius depends only on the depth and the refractive index of water.",k:[["critical","ic"],["tan","tan ic"],["sin ic","1/n","sin"],["d/","d /","\u221a(n","\u221a(n\u00b2","n\u00b2 \u2212 1","n2 - 1","n2 \u2212 1"],["circle","circular"],["depth"],["triangle"]]},
{m:3,q:"Find the radius of Snell\u2019s window for a fish at a depth of 10 m in water of refractive index 4/3.",a:"(Worked by me from R = d/\u221a(n\u00b2 \u2212 1); the result matches the book\u2019s value of about 11.3 m.)\nn = 4/3, so n\u00b2 \u2212 1 = 16/9 \u2212 1 = 7/9, and \u221a(7/9) = 0.882.\nR = d/0.882 = 10/0.882 = 11.3 m.",k:[["11.3","11.34"],["7/9","0.882","0.88"],["d/","\u221a(n","\u221a(n\u00b2"],["10 m","10"]]},
,
{m:3,q:"A point object is placed at 20 cm from a thin plano-convex lens of focal length 15 cm whose plane surface is silvered. Locate the position and nature of the final image.",a:"(Worked by me; the result matches the book\u2019s answer v = \u221212 cm.)\nLight enters the curved surface, reflects from the silvered plane face and leaves through the curved surface again. The lens acts twice, so the silvered lens is equivalent to a concave mirror of focal length F = f/2 = \u22127.5 cm.\nWith the Cartesian convention, u = \u221220 cm and F = \u22127.5 cm. Using 1/v + 1/u = 1/F:\n1/v = 1/F \u2212 1/u = \u22121/7.5 + 1/20 = \u22121/12, so v = \u221212 cm.\nThe negative value means the final image is 12 cm in front of the mirror, so it is real and inverted.",k:[["12 cm","\u221212","-12","v = \u221212"],["real"],["inverted"],["f/2","7.5","f / 2"],["concave"]]},
{m:5,q:"Derive the lens maker\u2019s formula for a thin lens of refractive index n placed in air, with radii of curvature R1 and R2.",a:"Consider a thin lens of refractive index n in air (n1 = 1). Take a point object O on the principal axis at distance u from the lens; the image I is formed at distance v.\nRefraction at the first surface (radius R1, medium changes from air to glass): n/v1 \u2212 1/u = (n \u2212 1)/R1   (from equation 6.56 with n1 = 1, n2 = n).\nRefraction at the second surface (radius R2, glass back to air, the image from the first surface acting as the object): 1/v \u2212 n/v1 = (1 \u2212 n)/R2.\nAdding the two equations, v1 cancels: 1/v \u2212 1/u = (n \u2212 1)(1/R1 \u2212 1/R2).\nThe focal length f is the image distance when the object is at infinity (u = \u221e, so 1/u = 0), giving\n1/f = (n \u2212 1)(1/R1 \u2212 1/R2)\nwhich is the lens maker\u2019s formula. With the sign convention, R is positive for a surface whose centre of curvature lies on the far side of the lens.",k:[["56","6.56","first surface"],["second surface"],["add","adding","cancel"],["1/u = 0","infinity","1/u"],["n \u2212 1","n-1","(n \u2212 1)"],["1/f","1/f ="],["sign convention"]]},
{m:5,q:"Prove that a concave lens can form only a virtual, erect and diminished image.",a:"For a concave (diverging) lens the focal length f is negative. Take a real object placed at distance u (negative with the Cartesian convention, so u < 0).\nLens equation: 1/v \u2212 1/u = 1/f, so 1/v = 1/f + 1/u. Both 1/f and 1/u are negative for any real object, so 1/v is negative and the image distance v is negative. A negative v lies on the same side as the object, so the image is virtual.\nMagnification m = v/u. Since v and u are both negative, m is positive, so the image is erect. Moreover |v| < |u| always, because 1/|v| = 1/|f| + 1/|u| \u2192 |v| < |f| and |v| < |u| for any object distance: the image is always smaller than the object, so it is diminished.\nHence a concave lens always forms a virtual, erect and diminished image.",k:[["virtual"],["erect"],["diminish","smaller"],["negative"],["1/v","1/f + 1/u","1/f+1/u"],["m = v/u","v/u"],["same side"]]}
]},
7:{exp:[
"Refractive index of a prism with a spectrometer: first the angle of the prism A is measured. Parallel light from the collimator falls on the two faces, and the telescope is set to the two reflected images (positions T1 and T2); half the difference of the two readings gives A. Then the minimum deviation D is measured: the prism table is rotated until the image stops and returns, and the reading at that position gives the minimum deviation. The refractive index is n = sin((A + D)/2)/sin(A/2).",
"Spectrometer: an instrument used to analyse spectra, measure the wavelength of colours and measure the refractive index of prism materials. It has three parts: a collimator (a convex lens with an adjustable vertical slit at its focus, giving a parallel beam), a prism table (two circular discs with three levelling screws, read by two verniers V1 and V2) and a telescope (an astronomical type with cross wires in the eyepiece, whose distance from the objective can be adjusted).",
"Wavelength by a diffraction grating: the grating is mounted on the prism table perpendicular to the beam. The telescope is set on the first-order image on one side and then on the other, and the difference of the two readings gives 2\u03b8. With N rulings per metre, the wavelength is \u03bb = (sin\u03b8)/(Nm) (7.51), where m is the order of the image.",
"Fresnel\u2019s biprism and Lloyd\u2019s mirror: these are instruments that obtain two coherent sources from a single source by the method of source and its images. Fresnel\u2019s biprism uses two virtual images of the source formed by two prisms placed base to base, which act as two coherent sources. Lloyd\u2019s mirror uses the reflected image of the source, so that the source and its image are coherent. The two sources are in phase or have a constant phase difference, and their interference fringes appear in the region of superposition.",
"Special cases of single-slit diffraction: (i) if a < \u03bb, sin\u03b8 would exceed 1, so no diffraction takes place. (ii) If a = \u03bb, the first minimum is at \u03b8 = 90\u00b0, and the central maximum spreads fully into the geometrical shadow. (iii) If a > \u03bb and comparable to \u03bb (for example a = 2\u03bb, giving \u03b8 = 30\u00b0), a measurable diffraction spread is observed, so the slit width must be a few times the wavelength to see the pattern. (iv) If a is much larger than \u03bb, the spread is very small and the light appears to travel in straight lines.",
"Uses of polaroids: polaroids are used in goggles and cameras to avoid glare; to make 3D pictures; to improve the contrast in old oil paintings; in optical stress analysis; in window glasses to control the intensity of incoming light; and in liquid crystal displays (LCD). A polarised laser beam is used to read and write on compact discs (CDs).",
"Corpuscular theory: proposed by Newton (1672) (and earlier by Descartes) to explain reflection and refraction. Light was taken as a stream of tiny, massless, perfectly elastic particles called corpuscles, which travel in straight lines. It could explain rectilinear propagation and reflection, but not interference and diffraction, and it predicted that light travels faster in denser media, which is wrong.",
"Quantum theory of light: Einstein (1905), building on Planck (1900), explained the photoelectric effect by treating light as a stream of photons. Each photon has energy E = hv, where h = 6.625 \u00d7 10\u207b³\u2074 J s. Light propagates as a wave and interacts with matter as a particle, which is its dual nature.",
"Fresnel and Fraunhofer diffraction: diffraction is bending of waves around sharp edges into the geometrically shadowed region. In Fresnel diffraction the wavefront is spherical or cylindrical and the source or screen is at a finite distance; it is difficult to observe and analyse, and no convex lens is needed. In Fraunhofer diffraction the wavefront is plane (source and screen effectively at infinity); it is easy to observe and analyse, and convex lenses are used in the laboratory.",
"Phase difference and path difference: one wavelength \u03bb of path corresponds to a phase of 2\u03c0, so a path difference \u03b4 gives a phase difference \u03c6 = 2\u03c0\u03b4/\u03bb. For maximum intensity the path difference is \u03b4 = n\u03bb (n = 0, 1, 2, ...) (7.24), and for minimum intensity it is \u03b4 = (2n \u2212 1)\u03bb/2 (7.25).",
"Interference in white light: white light is polychromatic, so each colour produces its own fringe system. The central fringe (zero path difference) is white for all colours. Around it, coloured fringes appear; the violet edge of each fringe is nearer the centre and the red edge farther away, because the fringe width is proportional to the wavelength.",
"Resolving power of a microscope and a telescope: the resolution is the smallest distance dmin between two points that can be distinguished, and the resolving power is its reciprocal. For a microscope the image plane is at distance v from the objective, so the radius of the central maximum is r0 = 1.22\u03bbv/a, and the resolving power depends on the numerical aperture, RM = 2 n sin\u03b2/(1.22\u03bb). For a telescope the resolving power is the reciprocal of its angular resolution, RT = a/(1.22\u03bb), where a is the diameter of the objective.",
"Accommodation of the eye: the eye lens changes its focal length to focus objects at different distances on the retina, which is fixed at about 2.5 cm from the eye lens. For an object at infinity the eye is relaxed and the focal length is f_max = 2.5 cm. For an object at the near point (25 cm) the eye is strained and the focal length is f_min = 2.27 cm. So by changing its focal length by only about 0.23 cm, the eye sees objects from infinity to the near point.",
"Magnifying (simple) lens: a convex lens of short focal length used to read small print. The book is placed between the lens and its focus. For near point focusing the magnification is m = 1 + D/f, and for normal focusing (image at infinity) it is m = D/f.",
"Astronomical telescope: used to view distant objects such as stars and planets. It has an objective of long focal length fo and a much larger aperture than the eyepiece of focal length fe. The objective forms a real image at its focal point, and the eyepiece magnifies it into a final inverted image. In normal adjustment the magnification is m = fo/fe and the length of the telescope is L = fo + fe.",
"Terrestrial telescope: used to see distant objects on the surface of the earth. Because the final image must be erect, it has an additional erecting lens between the objective and the eyepiece.",
"Defects of vision: myopia (nearsightedness) occurs when the eye lens has too short a focal length, or the eyeball is too long, so distant objects are focused in front of the retina; a concave lens corrects it. Hypermetropia (farsightedness) occurs when the eye lens has too long a focal length, or the eyeball is too short, so near objects are focused behind the retina; a convex lens corrects it. Hypermetropia arising from ageing is called presbyopia.",
"Simple microscope: a single convex lens of small focal length, used with the object placed between the focus and the lens so that an erect, magnified and virtual image is formed. For a healthy eye the near point (least distance of distinct vision) is D = 25 cm. When the image is formed at the near point the magnification is m = 1 + D/f (7.60). For normal focusing (image at infinity) the magnification is m = D/f, one less than that for near point focusing.",
"Compound microscope: an objective of short focal length fo forms a real, inverted and magnified image, which acts as the object for the eyepiece of focal length fe. The eyepiece works as a simple microscope. If L is the tube length (the distance between the focal point of the eyepiece and the far focal point of the objective), the total magnification for near point focusing is m = (L/fo)(1 + D/fe) (7.77).",
"Optically active (birefringent) crystals: crystals with one optic axis, such as calcite, quartz, tourmaline and ice, are uniaxial. Crystals with two optic axes, such as mica, topaz, selenite and aragonite, are biaxial.",
"Pile of plates: a set of glass plates placed one on another, tilted so that light falls on them at the polarising angle. Each reflection at the polarising angle, by Brewster\u2019s law, removes part of the unwanted component, and after several reflections the transmitted light is plane polarised. For glass of index 1.65 the polarising angle is 58.8\u00b0, so the pile is inclined at 90\u00b0 \u2212 58.8\u00b0 = 31.2\u00b0 to the horizontal.",
"Double refraction (birefringence): when unpolarised light is incident on a calcite crystal, two refracted rays are produced, so two images of an object are seen. The ordinary ray obeys the laws of refraction and the extraordinary ray does not; the extraordinary ray is plane polarised. Along the optic axis the two rays travel with the same velocity and there is no double refraction.",
"Nicol prism: a device for producing and analysing plane-polarised light, invented by William Nicol (1828). It is a calcite crystal cut diagonally and cemented again with Canada balsam. The ordinary ray is totally internally reflected at the balsam layer (its refractive index in calcite, 1.658, is greater than that of the balsam, 1.523, and it meets the layer at a large angle), and only the plane-polarised extraordinary ray is transmitted.",
"Polarisation by scattering: sunlight scattered by molecules in the atmosphere is partly plane polarised. The scattered light is most strongly polarised in the direction perpendicular to the incident sunlight, because the vibrating electrons radiate only perpendicular to their vibration direction.",
"Polarisation: in unpolarised light the vibrations of the electric vector are in all directions perpendicular to the direction of propagation. Light is plane (linearly) polarised when the vibrations are confined to one direction in that plane. Polarisation is produced by selective absorption (polaroids, which transmit only one set of vibrations; also called dichroism), by reflection (at the polarising angle), by double refraction, and by scattering.",
"Polariser and analyser: a polariser is a polaroid that converts unpolarised light into plane-polarised light. An analyser is a second polaroid used to test whether light is polarised: its intensity is maximum when its axis is parallel to that of the polariser, and zero (extinction) when the axes are crossed at 90\u00b0.",
"Malus\u2019 law: when plane-polarised light of intensity I0 is incident on an analyser whose transmission axis makes an angle \u03b8 with the polariser, the transmitted intensity is I = I0 cos\u00b2\u03b8 (7.55). The amplitude a of the polarised light splits into a cos\u03b8 along the analyser axis, and only this component is transmitted.\nBrewster\u2019s law: at the polarising angle ip the reflected and refracted rays are perpendicular, and tan ip = n (7.58). The polarising angle depends on the refractive index of the medium; for glass of index 1.5 it is about 56.3\u00b0.",
"Diffraction grating: a plane transmission grating with N = 1/(a + b) rulings per unit width (a = width of a slit, b = width of an opaque part). The path difference between corresponding points of adjacent slits is (a + b) sin\u03b8, and the principal maxima occur where (a + b) sin\u03b8 = m\u03bb, m = 0, 1, 2, ... The grating gives sharp, widely separated maxima, unlike the double slit.",
"Resolution and resolving power: the Airy discs from a circular aperture have their first minimum at a sin\u03b8 = 1.22\u03bb. By Rayleigh\u2019s criterion two point images are just resolved when the central maximum of one coincides with the first minimum of the other, so the angular resolution is \u03b8 = 1.22\u03bb/a. Resolving power is the ability of an instrument to distinguish two close objects; it is the reciprocal of the resolution, and it improves with a larger aperture and a shorter wavelength.",
"Single-slit diffraction: light from a slit of width a spreads out and interferes with itself on the screen. The slit is divided into pairs of corresponding points, and the waves from each pair cancel at a point where a sin\u03b8 = n\u03bb (n = 1, 2, 3, ...), giving the diffraction minima. The central maximum lies between the first minima on either side, so its width is 2\u03bbD/a. The minima are at y_n = nD\u03bb/a for small angles, and the intensity of the higher-order fringes falls rapidly.",
"Young\u2019s double slit: two narrow slits S1 and S2 a distance d apart are illuminated by a single source. The path difference at a point P at distance D from the slits and at angular position \u03b8 is \u03b4 = d sin\u03b8. Bright fringes occur where \u03b4 = n\u03bb, giving y_n = n\u03bbD/d; dark fringes occur where \u03b4 = (2n \u2212 1)\u03bb/2, giving y = (2n \u2212 1)\u03bbD/2d. The fringe width (distance between consecutive bright or dark fringes) is \u03b2 = \u03bbD/d.",
"Interference of light: the superposition of two light waves that produces increase of intensity at some points and decrease at others. For two waves y1 = a1 sin \u03c9t and y2 = a2 sin(\u03c9t + \u03c6), the resultant amplitude is A = \u221a(a1\u00b2 + a2\u00b2 + 2a1a2 cos\u03c6). The intensity I = I1 + I2 + 2\u221a(I1I2) cos\u03c6 is maximum when \u03c6 = 0, \u00b12\u03c0, ... (constructive) and minimum when \u03c6 = \u00b1\u03c0, \u00b13\u03c0, ... (destructive).",
"Coherent sources: two sources that emit waves of the same frequency, the same waveform and a constant phase difference. Two independent sources are incoherent, because atoms emit light in random phases. Coherent sources are obtained by wavefront division (for example, by a double slit), by amplitude division (for example, a partially silvered mirror in Michelson\u2019s interferometer), or from a source and its image.",
"Wavefront: the locus of all points in the same state (phase) of vibration. The wavefront is always perpendicular to the direction of propagation, so it is perpendicular to the ray. A point source gives spherical wavefronts, a line source gives cylindrical wavefronts, and a source at a large distance gives a plane wavefront.",
"Huygens\u2019 principle: each point on a wavefront acts as a source of secondary wavelets that spread out in all directions with the speed of the wave. The envelope of these wavelets gives the position and shape of the new wavefront at a later time. The principle explains the propagation of a wavefront, and with it the laws of reflection and refraction.",
"Wave theory of light: Huygens (1678) proposed that light is a disturbance travelling as a longitudinal mechanical wave through an ether medium. The theory explained reflection, refraction, interference and diffraction, but not the propagation of light through vacuum, and not polarisation, which is a property of transverse waves only. Maxwell\u2019s electromagnetic theory later showed that light is a transverse electromagnetic wave that needs no medium.",
"Shortcoming of Huygens\u2019 construction: it does not explain the absence of the backward wave that the construction also predicts. Electromagnetic wave theory rules out the backward wave inherently. Huygens\u2019 principle remains a good diagrammatic construction for the propagation of wavefronts."],
