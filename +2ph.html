wr:[
{m:2,q:"Define wavefront and give the shape of wavefront from (a) a point source, (b) a line source and (c) a source at infinity.",a:"A wavefront is the locus of all points which are in the same state (phase) of vibration. (a) A point source gives spherical wavefronts. (b) A line source gives cylindrical wavefronts. (c) A source at infinity (or at a large distance) gives plane wavefronts.",k:[["locus","same phase","same state"],["spherical"],["cylindrical"],["plane"],["infinity","large distance"]]},
{m:2,q:"State Huygens\u2019 principle.",a:"Huygens\u2019 principle states that each point on a wavefront acts as a source of secondary wavelets, which spread out in all directions with the speed of the wave. The envelope of these secondary wavelets, after a time t, gives the new position and shape of the wavefront at that time.",k:[["secondary wavelets","wavelets"],["envelope"],["speed"],["new wavefront","later time"]]},
{m:2,q:"State one shortcoming of Huygens\u2019 construction.",a:"Huygens\u2019 construction does not explain the absence of the backward wave, which also appears in the construction. Electromagnetic wave theory rules out the backward wave inherently, so the construction is a diagrammatic aid rather than a complete theory.",k:[["backward"],["absence"],["electromagnetic"]]},
{m:2,q:"Why do two independent monochromatic sources not produce a stationary interference pattern?",a:"Two independent sources can emit waves of the same frequency and amplitude, but their phases change randomly because the atoms emit light in independent, unsynchronised bursts. The phase difference therefore keeps changing, and the bright and dark fringes shift continuously, so no stationary pattern is formed. Such sources are called incoherent.",k:[["phase"],["random","changing","keeps changing"],["incoherent"],["stationary"],["atoms"]]},
{m:2,q:"What are coherent sources? How are they obtained?",a:"Coherent sources are sources of light that emit waves of the same frequency (monochromatic), the same waveform and a constant phase difference. They are obtained by wavefront division (for example by a double slit placed in front of a point source), by amplitude division (for example by a partially silvered mirror), or from a source and its image.",k:[["same frequency","monochromatic"],["constant phase","phase difference"],["wavefront division","double slit"],["amplitude division","partially silvered"],["image"]]},
{m:2,q:"Give the condition for constructive and destructive interference.",a:"The resultant intensity is I = I1 + I2 + 2\u221a(I1I2) cos\u03c6, where \u03c6 is the phase difference. Constructive interference (maximum intensity, Imax = (\u221aI1 + \u221aI2)\u00b2) occurs when \u03c6 = 0, \u00b12\u03c0, \u00b14\u03c0, ... Destructive interference (minimum intensity, Imin = (\u221aI1 \u2212 \u221aI2)\u00b2) occurs when \u03c6 = \u00b1\u03c0, \u00b13\u03c0, \u00b15\u03c0, ...",k:[["cos","\u03c6"],["constructive","maximum"],["destructive","minimum"],["0, \u00b12\u03c0","0, 2\u03c0","2\u03c0"],["\u03c0, 3\u03c0","\u03c0","\u00b1\u03c0"]]},
{m:2,q:"Define bandwidth (fringe width) of an interference pattern and give its expression for Young\u2019s double slit.",a:"The bandwidth \u03b2 (fringe width) is the distance between any two consecutive bright fringes or any two consecutive dark fringes. In Young\u2019s double slit experiment it is \u03b2 = \u03bbD/d, where \u03bb is the wavelength, D the distance from the slits to the screen and d the slit separation. The fringe width is the same for all consecutive fringes.",k:[["consecutive"],["\u03bbd/d","\u03bbd / d","\u03bbd","\u03bb d"],["\u03bbd/d","\u03bb d / d","\u03bbd / d","\u03bb"],["slit separation","separation"],["same"]]},
{m:3,q:"In Young\u2019s double slit experiment, the two slits are 0.15 mm apart. The light source has a wavelength of 450 nm. The screen is 2 m away from the slits. (a) Find the distance of the second bright fringe and also the third dark fringe from the central maximum. (b) Find the fringe width.",a:"(Worked by me from y = n\u03bbD/d and y = (2n \u2212 1)\u03bbD/2d; the results match the book\u2019s values.)\n\u03bb = 450 \u00d7 10\u207b\u2079 m, D = 2 m, d = 0.15 \u00d7 10\u207b\u00b3 m, so \u03bbD/d = (450 \u00d7 10\u207b\u2079 \u00d7 2)/(0.15 \u00d7 10\u207b\u00b3) = 6 \u00d7 10\u207b\u00b3 m.\n(a) Second bright fringe: y2 = 2\u03bbD/d = 2 \u00d7 6 mm = 12 mm.\nThird dark fringe: y = (2 \u00d7 3 \u2212 1)\u03bbD/(2d) = 5\u03bbD/(2d) = 5 \u00d7 3 mm = 15 mm.\n(b) Fringe width \u03b2 = \u03bbD/d = 6 \u00d7 10\u207b\u00b3 m = 6 mm.",k:[["12 mm","12"],["15 mm","15"],["6 mm","6"],["\u03bbd/d","\u03bbd / d","\u03bbd","\u03bbd/d"],["dark"]]},
{m:3,q:"Lights of two wavelengths 560 nm and 420 nm are used in Young\u2019s double slit experiment. Find the least distance from the central fringe where the bright fringes of the two wavelengths coincide. Given D = 1 m and d = 3 mm.",a:"(Worked by me; the result matches the book\u2019s answer.)\nCoincidence of a bright fringe of \u03bb1 (order n1) and of \u03bb2 (order n2) requires n1\u03bb1 = n2\u03bb2, so 560 n1 = 420 n2, i.e. 4 n1 = 3 n2. The smallest orders are n1 = 3 and n2 = 4.\nThe distance of this coincident fringe from the centre is y = n1\u03bb1D/d = 3 \u00d7 560 \u00d7 10\u207b\u2079 \u00d7 1/(3 \u00d7 10\u207b\u00b3) = 0.56 mm.",k:[["0.56"],["3 \u00d7 560","n1","n1 \u03bb1","560 n"],["4 n","4n","3 n2"],["coincide","coincid"],["least","smallest"]]},
{m:2,q:"State the condition for the first minimum in single-slit diffraction.",a:"For a slit of width a, the condition for the diffraction minima is a sin\u03b8 = n\u03bb, where n = 1, 2, 3, ... The first minimum corresponds to n = 1, so a sin\u03b8 = \u03bb. The central maximum is spread up to the first minima on both sides.",k:[["a sin","asin","a sinq","a sin\u03b8"],["\u03bb"],["n = 1","n=1","first"],["minim"]]},
{m:3,q:"A slit of width 0.2 mm is illuminated by light of wavelength 500 nm. The screen is 60 cm away. Find (a) the angle of the first minimum and (b) the distance of the first minimum from the central maximum. Also find the distance between the central maximum and the second minimum.",a:"(Worked by me from a sin\u03b8 = n\u03bb and y = \u03bbD/a for small angles; the results match the book\u2019s values.)\n(a) sin\u03b8 = \u03bb/a = (500 \u00d7 10\u207b\u2079)/(0.2 \u00d7 10\u207b\u00b3) = 2.5 \u00d7 10\u207b\u00b3, so \u03b8 \u2248 0.0025 rad.\n(b) y1 = \u03bbD/a = (500 \u00d7 10\u207b\u2079 \u00d7 0.6)/(0.2 \u00d7 10\u207b\u00b3) = 1.5 mm.\nThe second minimum lies at y2 = 2\u03bbD/a = 3 mm, so the distance between the first and second minima is y2 \u2212 y1 = 1.5 mm.",k:[["0.0025","2.5"],["1.5 mm","1.5"],["3 mm","3"],["\u03bbd/a","\u03bbd / a","\u03bbd","\u03bbd/a","\u03bbd / a"],["second","2\u03bb"]]},
{m:3,q:"A monochromatic light of wavelength 5000 \u00c5 passes through a single slit producing a diffraction pattern in which the central maximum is spread up to 30\u00b0 on each side. Determine the width of the slit.",a:"(Worked by me from a sin\u03b8 = \u03bb with n = 1; the result matches the book\u2019s answer of 1 \u00d7 10\u207b\u2076 m.)\n\u03bb = 5000 \u00c5 = 5000 \u00d7 10\u207b\u00b9\u2070 m = 5 \u00d7 10\u207b\u2077 m, and sin30\u00b0 = 0.5.\na = \u03bb/sin\u03b8 = (5 \u00d7 10\u207b\u2077)/0.5 = 1 \u00d7 10\u207b\u2076 m = 1 \u00b5m (0.001 mm).",k:[["1 \u00d7 10\u207b\u2076","1x10-6","10\u207b\u2076","1 \u00b5m","1 um","0.001"],["5000","5 \u00d7 10\u207b\u2077","5x10"],["sin30","0.5"],["a = \u03bb"]]},
{m:2,q:"State the condition for principal maxima in a diffraction grating.",a:"For a diffraction grating with slit width a and opaque width b, the condition for principal (bright) maxima is (a + b) sin\u03b8 = m\u03bb, where m = 0, 1, 2, ... is the order of the maximum and (a + b) is the grating element.",k:[["a + b","a+b"],["sin"],["m\u03bb","m \u03bb","m lambda"],["order"],["maxim"]]},
{m:2,q:"Define resolution and resolving power of an optical instrument, and give the angular resolution of a circular aperture.",a:"Resolving power is the ability of an optical instrument to distinguish two closely adjacent objects or points; resolution is the corresponding quality of the image, and the two are reciprocals of each other. For a circular aperture of diameter a, the angular resolution (by Rayleigh\u2019s criterion) is \u03b8 = 1.22\u03bb/a.",k:[["distinguish"],["reciprocal"],["1.22"],["\u03bb/a","\u03bb / a","\u03bb a"],["aperture"]]},
{m:3,q:"A diffraction grating has 4000 slits per centimetre and is illuminated by monochromatic light. The second order diffraction maximum is produced at an angle of 30\u00b0. What is the wavelength of the light used?",a:"(Worked by me from (a + b) sin\u03b8 = m\u03bb; the result matches the book\u2019s answer of 625 nm.)\nN = 4000 per cm = 4 \u00d7 10\u2075 per m, so a + b = 1/N = 2.5 \u00d7 10\u207b\u2076 m.\nFor m = 2 and \u03b8 = 30\u00b0: \u03bb = (a + b) sin\u03b8/m = (2.5 \u00d7 10\u207b\u2076 \u00d7 0.5)/2 = 6.25 \u00d7 10\u207b\u2077 m = 625 nm.",k:[["625","6.25"],["2.5","1/n","1/N","a + b"],["0.5","sin30","sin 30"],["m = 2","m=2","second"]]},
{m:3,q:"The optical telescope in the Vainu Bappu observatory has an objective lens of diameter 2.3 m. What is its angular resolution if the wavelength of light used is 589 nm?",a:"(Worked by me from \u03b8 = 1.22\u03bb/a; the result matches the book\u2019s answer.)\n\u03b8 = 1.22 \u00d7 589 \u00d7 10\u207b\u2079 / 2.3 = 3.124 \u00d7 10\u207b\u2077 rad, which is about 0.0011\u2032 (arc minute).",k:[["3.124","3.12"],["1.22"],["10\u207b\u2077","10-7","10^-7"],["rad"]]},
{m:2,q:"What is a polariser and what is an analyser?",a:"A polariser is a polaroid that converts unpolarised light into plane-polarised light by transmitting only the vibrations along its transmission axis. An analyser is a second polaroid used to examine whether a beam is polarised: when its axis is parallel to that of the polariser the intensity is maximum, and when the axes are crossed at 90\u00b0 there is complete extinction.",k:[["polarise"],["unpolarised"],["plane"],["analyser"],["maximum"],["90","extinction"]]},
{m:2,q:"State Malus\u2019 law.",a:"When plane-polarised light of intensity I0 is incident on an analyser, the intensity I of the light transmitted by the analyser varies as the square of the cosine of the angle \u03b8 between the transmission axes of the polariser and the analyser: I = I0 cos\u00b2\u03b8.",k:[["cos"],["square","cos\u00b2","cos2"],["angle"],["i0","i = i0"],["analyser","polariser"]]},
{m:2,q:"State Brewster\u2019s law.",a:"Brewster\u2019s law states that the tangent of the polarising angle for a transparent medium is equal to its refractive index: tan ip = n. At this angle the reflected and refracted rays are perpendicular to each other, and the reflected light is completely plane-polarised.",k:[["tangent","tan"],["polarising angle","polarizing angle","brewster"],["refractive index","n"],["perpendicular"],["plane"]]},
{m:3,q:"Find the polarising angles for (i) glass of refractive index 1.5 and (ii) water of refractive index 1.33.",a:"(Worked by me from tan ip = n; the results match the book\u2019s answers.)\n(i) Glass: tan ip = 1.5, so ip = tan\u207b\u00b9(1.5) = 56.3\u00b0.\n(ii) Water: tan ip = 1.33, so ip = tan\u207b\u00b9(1.33) = 53.1\u00b0.",k:[["56.3"],["53.1"],["tan"],["tan\u207b\u00b9","arctan","tan-1"],["polarising","polarizing"]]},
{m:2,q:"What is double refraction? Name the two rays produced.",a:"Double refraction (birefringence) is the phenomenon in which a ray of unpolarised light incident on a calcite crystal splits into two refracted rays. The ordinary ray obeys the laws of refraction, and the extraordinary ray does not; the extraordinary ray is plane polarised. The two rays produce two images of a single object.",k:[["two refracted","two rays","split"],["ordinary"],["extraordinary"],["plane polarised","plane-polarised"],["birefringence"]]},
{m:2,q:"What is a Nicol prism? State its two uses.",a:"A Nicol prism is a calcite crystal cut diagonally and cemented with Canada balsam. It is used to produce plane-polarised light (as a polariser) and to analyse it (as an analyser). The ordinary ray is totally internally reflected at the balsam layer, and only the plane-polarised extraordinary ray emerges.",k:[["calcite"],["canada balsam","balsam"],["polarise","polarize","produce"],["analys"],["total internal","totally internally"]]},
{m:2,q:"Explain polarisation by scattering.",a:"When sunlight is scattered by atmospheric molecules, the electrons in the molecules vibrate in the direction of the electric field of the incident light. They radiate only in directions perpendicular to their vibration, so the scattered light is partly plane polarised. The polarisation is greatest when the scattered light is viewed at right angles to the incident sunlight.",k:[["scatter"],["electron"],["perpendicular"],["partly","partially"],["right angle","90"]]},
{m:2,q:"Distinguish between uniaxial and biaxial crystals, giving one example of each.",a:"A uniaxial crystal has one optic axis, along which there is no double refraction; examples are calcite, quartz, tourmaline and ice. A biaxial crystal has two optic axes; examples are mica, topaz, selenite and aragonite.",k:[["uniaxial","one optic axis"],["biaxial","two optic axes"],["calcite","quartz","tourmaline","ice"],["mica","topaz","selenite","aragonite"]]},
{m:2,q:"Explain the principle of a pile of plates for producing plane-polarised light.",a:"A pile of plates is a set of glass plates placed one above another and inclined at the polarising angle of the glass. By Brewster\u2019s law, the reflected light at each surface is plane polarised, and after several reflections the light transmitted through the pile is nearly completely plane polarised. The polarising angle depends on the refractive index of the glass, tan ip = n.",k:[["brewster"],["polarising angle","polarizing angle"],["plane polarised","plane-polarised","plane polarized"],["reflect"],["refractive index","tan"]]},
{m:3,q:"A pile of glass plates of refractive index 1.65 is used to produce plane-polarised light. Find the polarising angle and the inclination of the pile with the horizontal.",a:"(Worked by me from tan ip = n; the results match the book\u2019s values.)\ntan ip = 1.65, so ip = tan\u207b\u00b9(1.65) = 58.8\u00b0.\nThe pile is inclined at 90\u00b0 \u2212 ip = 90\u00b0 \u2212 58.8\u00b0 = 31.2\u00b0 to the horizontal.",k:[["58.8"],["31.2"],["tan\u207b\u00b9","arctan","tan-1"],["90"],["horizontal"]]},
{m:2,q:"What is a simple microscope and what is the near point?",a:"A simple microscope is a single convex lens of small focal length. The object is placed within the focal length, so that the lens forms an erect, magnified and virtual image. The near point is the nearest distance at which the eye can see an object clearly, the least distance of distinct vision; for a healthy eye it is 25 cm.",k:[["convex","lens"],["erect"],["virtual"],["near point"],["25"],["least distance"]]},
{m:2,q:"What is the role of objective and eyepiece in a compound microscope?",a:"The objective lens, near the object, forms a real, inverted and magnified image of the object. This image acts as the object for the eyepiece, the lens near the eye, which works as a simple microscope and produces a final enlarged, virtual image. The final image is inverted with respect to the object.",k:[["real","inverted"],["objective"],["eyepiece"],["simple microscope"],["virtual","enlarged"]]},
{m:5,q:"Obtain an expression for the total magnification of a compound microscope when the final image is formed at the near point.",a:"The objective of focal length fo forms an image of magnification mo = L/fo, where L is the tube length (the separation between the focal point of the eyepiece and the far focal point of the objective). This is because the image size is h\u2032 = hL/fo, with the image distance approximately L for a small object.\nThe eyepiece of focal length fe acts as a simple microscope. When the final image is formed at the near point D, its magnification is me = 1 + D/fe (7.76).\nThe total magnification is the product of the two: m = mo \u00d7 me = (L/fo)(1 + D/fe)   (7.77).\nFor a large tube length, this gives a much larger magnification than a simple microscope can give, which is why compound microscopes are used to see very small objects.",k:[["mo = l/fo","l/fo","l / fo","mo"],["me = 1","1 + d/fe","1+d/fe","d/fe"],["product","multiplied","\u00d7"],["tube length","tube"],["near point"],["7.77","(l/fo)"]]},
{m:2,q:"Give the magnification and the length of an astronomical telescope in normal adjustment.",a:"In normal adjustment the magnification of an astronomical telescope is m = fo/fe, where fo is the focal length of the objective and fe that of the eyepiece. The length of the telescope is L = fo + fe. The final image is inverted.",k:[["fo/fe","fo / fe"],["fo + fe","fo+fe"],["inverted"],["normal"]]},
{m:2,q:"Name the defect of vision corrected by a concave lens and by a convex lens.",a:"Myopia (nearsightedness), in which distant objects are focused in front of the retina, is corrected by a concave (diverging) lens. Hypermetropia (farsightedness), in which near objects are focused behind the retina, is corrected by a convex (converging) lens.",k:[["myopia","nearsight"],["concave","diverging"],["hypermetropia","farsight"],["convex","converging"]]},
{m:3,q:"A small telescope has an objective lens of focal length 125 cm and an eyepiece of focal length 2 cm. (a) What is the magnification of the telescope? (b) What is the separation between the objective and the eyepiece?",a:"(Worked by me from m = fo/fe and L = fo + fe; the results match the book\u2019s values.)\n(a) m = fo/fe = 125/2 = 62.5.\n(b) L = fo + fe = 125 + 2 = 127 cm.",k:[["62.5"],["127"],["fo/fe","125/2"],["fo + fe","125 + 2"],["cm"]]},
{m:5,q:"Discuss the defects of vision: myopia, hypermetropia and presbyopia, and state how each is corrected.",a:"MYOPIA (nearsightedness): a person cannot see distant objects clearly, because the eye lens has too short a focal length or the eyeball is too long. Parallel rays from a distant object are focused before the retina. A concave (diverging) lens of suitable power is used, so that the rays diverge and are focused on the retina.\nHYPERMETROPIA (farsightedness): a person cannot see near objects clearly, because the eye lens has too long a focal length or the eyeball is too short. Rays from an object at the near point are focused behind the retina. A convex (converging) lens of suitable power corrects it.\nPRESBYOPIA: hypermetropia arising mainly from ageing. The eye loses the ability to strain and reduce its focal length, so the near point moves further away; the same convex-lens correction is used, usually as bifocal or reading glasses.",k:[["myopia","nearsight"],["hypermetropia","farsight"],["presbyopia"],["concave","diverging"],["convex","converging"],["retina"],["ageing","aging"],["near point"]]},
{m:3,q:"A man with a near point of 25 cm reads a book with small print using a magnifying lens of focal length 5 cm. (a) What are the closest and the farthest distances at which he should keep the lens from the book? (b) What are the maximum and minimum magnifications possible?",a:"(Worked by me from the lens equation and m = 1 + D/f and m = D/f; the results match the book\u2019s values.)\n(a) Closest: the image is at the near point, v = \u221225 cm. From 1/v \u2212 1/u = 1/f: 1/u = 1/v \u2212 1/f = \u22121/25 \u2212 1/5 = \u22126/25, so u = \u221225/6 \u2248 \u22124.17 cm. The closest distance is about 4.17 cm.\nFarthest: the image is at infinity, so 1/u = \u22121/f and u = \u22125 cm. The farthest distance is 5 cm.\n(b) Maximum magnification (near point focusing): m = 1 + D/f = 1 + 25/5 = 6. Minimum magnification (normal focusing): m = D/f = 25/5 = 5.",k:[["4.17","25/6"],["5 cm","\u22125","-5"],["6"],["5"],["1/v","1/f","lens equation"],["near point","infinity"]]},
{m:3,q:"Calculate the focal length of the eye lens when the eye sees (a) an object at infinity and (b) an object at the near point of 25 cm. The distance between the eye lens and the retina is 2.5 cm.",a:"(Worked by me from the lens equation with v = 2.5 cm; the results match the book\u2019s values.)\n(a) Object at infinity (u = \u221e): 1/f = 1/v = 1/2.5, so f_max = 2.5 cm.\n(b) Object at near point (u = \u221225 cm): 1/f = 1/v \u2212 1/u = 1/2.5 + 1/25 = 0.44, so f_min = 2.27 cm.",k:[["2.5"],["2.27"],["1/f","lens equation"],["infinity"],["25"]]},
{m:2,q:"Define resolution and resolving power of a microscope.",a:"The resolution of a microscope is the smallest distance dmin between two points on the object that can be seen as separate. Its resolving power is the reciprocal of the resolution. The radius of the central maximum of the image is r0 = 1.22\u03bbv/a, and the resolving power depends on the numerical aperture of the objective and the wavelength of light.",k:[["smallest distance","dmin"],["reciprocal"],["1.22"],["numerical aperture","aperture"],["wavelength"]]},
{m:2,q:"What is the resolving power of a telescope?",a:"The resolving power of a telescope is the reciprocal of its spatial or angular resolution. For an objective of diameter a and light of wavelength \u03bb it is RT = a/(1.22\u03bb). A larger objective diameter and a shorter wavelength give a better resolving power.",k:[["reciprocal"],["a/1.22","a / 1.22","1.22\u03bb","1.22 \u03bb"],["diameter","aperture","objective"],["wavelength"]]},
{m:2,q:"Obtain the relation between phase difference and path difference.",a:"One wavelength \u03bb of path corresponds to a phase change of 2\u03c0. So a path difference \u03b4 corresponds to a phase difference \u03c6 given by \u03c6/2\u03c0 = \u03b4/\u03bb, i.e. \u03c6 = (2\u03c0/\u03bb)\u03b4.",k:[["2\u03c0","2 \u03c0","2pi"],["\u03bb"],["\u03c6 = 2\u03c0\u03b4/\u03bb","2\u03c0/\u03bb","2pi/\u03bb","2\u03c0\u03b4/\u03bb"],["phase"],["path"]]},
{m:2,q:"What is observed in interference with white light?",a:"With white light (polychromatic light), each colour forms its own fringe system. The central fringe is white, because all colours have zero path difference there. The fringes on either side are coloured, with the violet edge nearer the centre and the red edge farther away, because the fringe width is proportional to the wavelength.",k:[["white"],["colour","color"],["central"],["violet"],["red"],["wavelength","fringe width"]]},
{m:2,q:"State the path difference conditions for maximum and minimum intensity in interference.",a:"Maximum (constructive) interference occurs when the path difference is an integral multiple of the wavelength, \u03b4 = n\u03bb (n = 0, 1, 2, ...). Minimum (destructive) interference occurs when the path difference is an odd multiple of half a wavelength, \u03b4 = (2n \u2212 1)\u03bb/2 (n = 1, 2, 3, ...).",k:[["n\u03bb","n \u03bb"],["(2n","2n \u2212 1","2n-1","odd"],["half"],["maxim","constructive"],["minim","destructive"]]},
{m:2,q:"Differentiate between Fresnel and Fraunhofer diffraction.",a:"In Fresnel diffraction the wavefront incident on the aperture is spherical or cylindrical, and the source or screen is at a finite distance; it is difficult to observe and analyse, and no convex lens is required. In Fraunhofer diffraction the incident wavefront is plane, the source and screen are effectively at infinity, and convex lenses are used in the laboratory; it is easy to observe and analyse.",k:[["spherical","cylindrical"],["plane"],["finite distance","infinity"],["convex lens"],["difficult","easy"]]},
{m:2,q:"What is diffraction of light?",a:"Diffraction is the bending of waves around sharp edges or through apertures, into the region of the geometrical shadow. It is a characteristic of all waves, including sound waves, and it shows that light is a wave.",k:[["bending","bend"],["edge","aperture"],["shadow"],["wave"]]},
{m:2,q:"State the main points of the corpuscular theory of light.",a:"Newton\u2019s corpuscular theory (1672) states that light is emitted by a source as tiny, massless and perfectly elastic particles called corpuscles. The corpuscles travel in straight lines and explain the laws of reflection and refraction. The theory could not explain interference and diffraction, and it predicted that light travels faster in a denser medium, which is not correct.",k:[["corpuscle","particle"],["elastic"],["straight"],["reflection","refraction"],["interference","diffraction"],["denser","faster"]]},
{m:2,q:"Write a short note on the quantum theory of light.",a:"Einstein (1905), following Planck (1900), explained the photoelectric effect by treating light as photons, each a discrete packet of energy E = hv, where h is Planck\u2019s constant and v is the frequency. Light propagates as a wave but interacts with matter as a particle, so it has a dual nature.",k:[["photon"],["energy","e = hv","hv"],["planck"],["einstein"],["dual"],["photoelectric"]]},
{m:2,q:"State any two uses of polaroids.",a:"Polaroids are used in goggles and cameras to avoid glare of light, and in liquid crystal displays (LCD). They are also used to take 3D pictures, to improve the contrast in old oil paintings, in optical stress analysis, and as window glasses to control the intensity of incoming light.",k:[["glare"],["goggles","camera"],["lcd","liquid crystal"],["3d"],["contrast"],["stress"],["window"]]},
{m:2,q:"Distinguish between polarised light and unpolarised light.",a:"Polarised light consists of waves whose electric and magnetic field vibrations lie in a single plane normal to the direction of the ray; it is asymmetrical about the ray direction and is obtained by converting unpolarised light using polaroids. Unpolarised light consists of waves whose vibrations are in all directions normal to the ray; it is symmetrical about the ray direction and is produced by conventional light sources.",k:[["single plane","one plane"],["all directions"],["asymmetrical"],["symmetrical"],["polaroid"],["conventional","source"]]},
{m:2,q:"Discuss the special cases on the first minimum in single-slit diffraction.",a:"(i) If the slit width a is less than \u03bb, sin\u03b8 would be greater than 1, which is not possible, so no diffraction takes place. (ii) If a = \u03bb, sin\u03b8 = 1 and the first minimum is at 90\u00b0, so the central maximum spreads fully into the geometrically shadowed region. (iii) If a > \u03bb and comparable to \u03bb (for example a = 2\u03bb, giving \u03b8 = 30\u00b0), a measurable spread is observed. Hence the slit must be only a few times the wavelength for the diffraction pattern to be seen.",k:[["a < \u03bb","less than"],["not possible","greater than 1","sin"],["90"],["30"],["measurable","few times","comparable"]]},
{m:2,q:"State the special cases of Malus\u2019 law.",a:"(i) When \u03b8 = 0\u00b0, cos0\u00b0 = 1 and I = I0: when the transmission axes of the polariser and analyser are parallel, all the light transmitted by the polariser passes through the analyser. (ii) When \u03b8 = 90\u00b0, cos90\u00b0 = 0 and I = 0: when the axes are perpendicular, no light is transmitted by the analyser.",k:[["0\u00b0","0","parallel"],["90\u00b0","90","perpendicular"],["i0","i = i0","i = i0"],["zero","0"]]},
{m:3,q:"Two polaroids are kept with their transmission axes inclined at 30\u00b0. Unpolarised light of intensity I falls on the first polaroid. Find the intensity of light emerging from the second polaroid.",a:"(Worked by me; the result matches the book\u2019s answer of 3I/8.)\nThe first polaroid transmits half of the unpolarised light: I1 = I/2 (polarised).\nBy Malus\u2019 law, the second polaroid transmits I2 = I1 cos\u00b230\u00b0 = (I/2)(3/4) = 3I/8.",k:[["3i/8","3/8","3 i/8","3I/8"],["i/2","half","i/2"],["cos","cos\u00b2","30"],["malus"]]},
{m:2,q:"How are coherent sources obtained using a source and its images? Name two such instruments.",a:"A source and its image act as a pair of coherent sources, because the waves from the source and from its image are in phase or have a constant phase difference. Two instruments that use this method are Fresnel\u2019s biprism, which uses two virtual images of the source produced by two prisms, and Lloyd\u2019s mirror, which uses the reflected image of the source.",k:[["image"],["coherent"],["constant phase","in phase"],["biprism"],["lloyd"],["virtual"]]},
{m:3,q:"The wavelength of a light is 450 nm. How much phase will it differ for a path of 3 mm?",a:"(Worked by me from \u03c6 = 2\u03c0\u03b4/\u03bb; the result is the phase difference the book derives in Example 7.5.)\n\u03b4 = 3 \u00d7 10\u207b\u00b3 m and \u03bb = 450 \u00d7 10\u207b\u2079 m.\n\u03c6 = 2\u03c0 \u00d7 (3 \u00d7 10\u207b\u00b3)/(450 \u00d7 10\u207b\u2079) = 2\u03c0 \u00d7 6.67 \u00d7 10\u00b3 \u2248 4.19 \u00d7 10\u2074 rad.",k:[["2\u03c0","2 \u03c0","2pi"],["4.19","4.2","41887","4.1"],["\u03c6 = 2\u03c0\u03b4/\u03bb","2\u03c0\u03b4/\u03bb","2pi d/l"],["rad"],["6.67","6.6"]]},
{m:3,q:"A microscope has an objective and eyepiece of focal lengths 5 cm and 50 cm respectively, with a tube length of 30 cm. Find the magnification of the microscope (a) for near point focusing and (b) for normal focusing.",a:"(Worked by me from m = (L/fo)(1 + D/fe) and m = (L/fo)(D/fe), with D = 25 cm.)\nL/fo = 30/5 = 6.\n(a) Near point focusing: m = 6 \u00d7 (1 + 25/50) = 6 \u00d7 1.5 = 9.\n(b) Normal focusing: m = 6 \u00d7 (25/50) = 3.",k:[["9"],["3"],["l/fo","30/5","6"],["1 + d/fe","1+25/50","1.5","25/50"],["near point"],["normal"]]},
{m:3,q:"In Young\u2019s double slit experiment, 62 fringes are seen on a screen for sodium light of wavelength 5893 \u00c5. If violet light of wavelength 4359 \u00c5 is used in place of sodium light, how many fringes will be seen?",a:"(Worked by me; the result matches the book\u2019s answer of 84.)\nThe number of fringes in a fixed region varies inversely with the wavelength: N \u221d 1/\u03bb.\nN_violet = 62 \u00d7 5893/4359 = 83.8 \u2248 84 fringes.",k:[["84","83.8"],["1/\u03bb","inversely","wavelength"],["62"]]},
{m:3,q:"Light of wavelength 600 nm that falls on a pair of slits produces a bright fringe separation of 7.2 mm. What must be the wavelength of another light which produces bright fringes separated by 8.1 mm with the same apparatus?",a:"(Worked by me from \u03b2 = \u03bbD/d; the result matches the book\u2019s answer of 675 nm.)\n\u03b2 is proportional to \u03bb, so \u03bb2 = \u03bb1 \u00d7 \u03b22/\u03b21 = 600 \u00d7 8.1/7.2 = 675 nm.",k:[["675"],["\u03bb2","\u03b2","fringe width"],["8.1/7.2","8.1 / 7.2","1.125"]]},
{m:3,q:"A beam of light of wavelength 600 nm from a distant source falls on a single slit 1 mm wide and the resulting diffraction pattern is observed on a screen 2 m away. What is the distance between the first dark fringes on either side of the central bright fringe?",a:"(Worked by me from y = \u03bbD/a; the result matches the book\u2019s answer of 2.4 mm.)\nThe first dark fringe is at y = \u03bbD/a = (600 \u00d7 10\u207b\u2079 \u00d7 2)/(1 \u00d7 10\u207b\u00b3) = 1.2 mm.\nThe distance between the two first dark fringes on either side is 2y = 2.4 mm.",k:[["2.4"],["1.2"],["\u03bbd/a","\u03bbd / a","\u03bbD/a"],["either side","2y","2 y"]]},
{m:3,q:"Light of wavelength 5000 \u00c5 produces diffraction pattern of a single slit of width 2.5 \u00b5m. What is the maximum order of diffraction possible?",a:"(Worked by me from a sin\u03b8 = n\u03bb with sin\u03b8 \u2264 1; the result matches the book\u2019s answer of 5.)\nn \u2264 a/\u03bb = (2.5 \u00d7 10\u207b\u2076)/(5 \u00d7 10\u207b\u2077) = 5, so the maximum order is 5.",k:[["5"],["a/\u03bb","a/\u03bb","2.5"],["sin"],["maximum","order"]]},
{m:3,q:"I0 is the intensity of light existing between two cross polaroids kept with their axes perpendicular to each other. A third polaroid is introduced between them. What must be the angle between the axes of the first and the newly introduced polaroid to get the maximum light from the whole arrangement?",a:"(Worked by me; the result matches the book\u2019s answer of 45\u00b0.)\nWith the middle polaroid at angle \u03b8 to the first, the intensity transmitted is I = I0 cos\u00b2\u03b8 \u00b7 cos\u00b2(90\u00b0 \u2212 \u03b8) = I0 cos\u00b2\u03b8 sin\u00b2\u03b8 = (I0/4) sin\u00b2 2\u03b8.\nThe maximum is at sin2\u03b8 = 1, so 2\u03b8 = 90\u00b0 and \u03b8 = 45\u00b0.",k:[["45"],["cos","sin"],["maximum"],["2\u03b8","2\u03b8","sin 2"]]},
{m:3,q:"An unpolarised light of intensity 32 W m\u207b\u00b2 passes through three polaroids such that the axes of the first and the last polaroids are at 90\u00b0. What is the angle between the axes of the first and middle polaroids so that the emerging light has an intensity of only 3 W m\u207b\u00b2?",a:"(Worked by me; the result matches the book\u2019s answer of 30\u00b0.)\nAfter the first polaroid I1 = 16 W m\u207b\u00b2. Let the middle axis be at \u03b8 to the first, so the last is at 90\u00b0 \u2212 \u03b8 to the middle.\nI = 16 cos\u00b2\u03b8 cos\u00b2(90\u00b0 \u2212 \u03b8) = 16 cos\u00b2\u03b8 sin\u00b2\u03b8 = 4 sin\u00b2 2\u03b8 = 3, so sin\u00b2 2\u03b8 = 0.75, 2\u03b8 = 60\u00b0, \u03b8 = 30\u00b0.",k:[["30"],["16"],["sin"],["2\u03b8","2\u03b8","60"]]},
{m:3,q:"The reflected light is found to be plane polarised when an unpolarised light falls on a denser medium at 60\u00b0 with the normal. Find the angle of refraction, and the critical angle for total internal reflection in the denser to rarer medium.",a:"(Worked by me from Brewster\u2019s law; the results match the book\u2019s answers of 30\u00b0 and about 35\u00b0.)\nBrewster\u2019s law: tan60\u00b0 = n = 1.732, so the polarising angle is 60\u00b0.\nAt the polarising angle the refracted and reflected rays are perpendicular, so the angle of refraction is r = 90\u00b0 \u2212 60\u00b0 = 30\u00b0.\nCritical angle: sin ic = 1/n = 1/1.732 = 0.577, so ic \u2248 35.2\u00b0 (the book gives 35.15\u00b0).",k:[["30"],["35"],["tan","1.732","\u221a3"],["sin ic","1/n","0.577"],["90"]]},
{m:3,q:"The near point and the far point for a person are 50 cm and 500 cm respectively. Calculate the power of the lens the person should wear to read a book held in hand at 25 cm. What maximum distance is clearly visible for the person with this lens on the eye?",a:"(Worked by me from the lens equation; the results match the book\u2019s answers of 2 D and 45.45 cm.)\nTo read at 25 cm the lens must form a virtual image at the near point, v = \u221250 cm, for u = \u221225 cm.\n1/f = 1/v \u2212 1/u = \u22121/50 + 1/25 = 1/50, so f = 50 cm and P = +2 D (convex).\nFor the far point (v = \u2212500 cm): 1/u = 1/v \u2212 1/f = \u22121/500 \u2212 1/50 = \u221211/500, so u \u2248 \u221245.45 cm. The maximum distance clearly visible is 45.45 cm.",k:[["2 d","2d","+2","2 d"],["50 cm","50"],["45.45"],["1/f","lens equation"],["convex"]]},
{m:3,q:"A compound microscope has a magnifying power of 100 when the image is formed at infinity. The objective has a focal length of 0.5 cm and the tube length is 6.5 cm. What is the focal length of the eyepiece?",a:"(Worked by me from the normal-focusing magnification m = (L/fo)(D/fe); the result matches the book\u2019s answer of 3.25 cm.)\nL/fo = 6.5/0.5 = 13, so 100 = 13 \u00d7 (25/fe), giving fe = 13 \u00d7 25/100 = 3.25 cm.",k:[["3.25"],["13"],["l/fo","6.5/0.5","6.5 / 0.5"],["25/fe","25 / fe"],["normal","infinity"]]},
{m:5,q:"Obtain an expression for the magnification of an astronomical telescope in normal adjustment.",a:"Let an object subtend an angle \u03b1 at the objective of the telescope. The objective forms a real image of the distant object at its focal plane, subtending an angle \u03b1 at the objective; the eyepiece then views this image with an angle \u03b2 at its optical centre.\nFor small angles the image formed by the objective has height h = fo\u03b1, and the eyepiece views this image with angle \u03b2 = h/fe = fo\u03b1/fe.\nThe magnification m is the ratio of the angle \u03b2 subtended by the final image to the angle \u03b1 subtended by the object (as seen by the unaided eye):\nm = \u03b2/\u03b1 = fo/fe   (7.81)\nThe final image is inverted, and the length of the telescope in normal adjustment is L = fo + fe. A telescope with a long objective focal length and a short eyepiece focal length has a large magnification.",k:[["\u03b2","beta"],["\u03b1","alpha"],["angle"],["fo/fe","fo / fe","fo\u03b1/fe"],["inverted"],["fo + fe","fo+fe","length"]]},
{m:2,q:"Name the three parts of a spectrometer and state the function of the collimator.",a:"The three parts of a spectrometer are the collimator, the prism table and the telescope. The collimator produces a parallel beam of light: it has a convex lens and a vertical slit of adjustable width placed at the focus of the lens.",k:[["collimator"],["prism table"],["telescope"],["parallel"],["slit"],["lens"]]},
{m:5,q:"Describe how the wavelength of a spectral line is determined using a plane transmission grating and a spectrometer.",a:"First the spectrometer is adjusted, and the slit of the collimator is illuminated by the monochromatic light whose wavelength is to be found. The telescope is brought in line with the collimator to view the image of the slit.\nThe plane transmission grating is then mounted on the prism table with its plane perpendicular to the incident beam. The telescope is turned to one side until the first-order diffraction image of the slit is seen, and its reading is noted. The telescope is then turned to the other side to find the first-order image there, and its reading is noted.\nThe difference between the two readings gives 2\u03b8, and half of it gives the angle \u03b8 of the first-order maximum. With N rulings per metre, the wavelength is calculated from \u03bb = (sin\u03b8)/(Nm) (7.51), where m is the order of the image (m = 1 here).",k:[["spectrometer"],["collimator"],["grating"],["perpendicular"],["first order","first-order"],["2\u03b8","2 \u03b8","difference"],["sin","\u03bb"],["rulings","n"]]},
{m:5,q:"Describe the experiment to determine the refractive index of the material of a prism using a spectrometer.",a:"Preliminary adjustments of the spectrometer are made first. The refractive index of the prism is found by measuring the angle of the prism A and the angle of minimum deviation D.\n(i) Angle of the prism: the prism is placed on the prism table with its refracting angle A facing the collimator. The slit is illuminated by sodium light, and the parallel rays from the collimator fall on the two faces AB and AC and are reflected. The telescope is turned to the two reflected images, positions T1 and T2, and both readings are noted. The difference between the readings is twice the angle of the prism, so half of it gives A.\n(ii) Angle of minimum deviation: the prism is set so that the refracted image is seen through the telescope. The prism table is rotated so that the angle of deviation decreases, until a stage is reached where the image stops and returns on further rotation. The reading at this position, observed simultaneously through the telescope, gives the minimum deviation D.\nThe refractive index of the prism material is then calculated from n = sin((A + D)/2)/sin(A/2).",k:[["preliminary","adjust"],["angle of the prism","prism angle","a"],["minimum deviation","minimum"],["sodium"],["reflect"],["telescope"],["sin((a + d)/2)","sin((a+d)/2)","(a+d)/2","(a + d)/2"],["sin(a/2)","sin a/2","a/2"]]},
{m:5,q:"Explain the preliminary adjustments of a spectrometer before doing an experiment.",a:"The following adjustments must be made before the experiment:\n(a) Adjustment of the eyepiece: the telescope is turned towards an illuminated surface, and the eyepiece is moved to and fro until the cross wires are clearly seen.\n(b) Adjustment of the telescope: the telescope is focused on a distant object so that it receives parallel rays and forms a clear image on the cross wires.\n(c) Adjustment of the collimator: the telescope is brought in line with the collimator, and the distance between the illuminated slit and the collimator lens is adjusted until a clear image of the slit is seen at the cross wires. This makes the slit lie at the focus of the lens, so the emergent beam is parallel.\n(d) Levelling of the prism table: the prism table is brought to the horizontal by adjusting its levelling screws, checked with a spirit level.\nOnly after these adjustments are the angle of the prism and the angle of minimum deviation measured.",k:[["eyepiece","cross wire"],["telescope","distant object","parallel"],["collimator","slit"],["levelling","leveling","horizontal"],["spirit level","sprit level"],["focus","clear image"]]},
{m:5,q:"Describe the construction and working of a Nicol prism.",a:"CONSTRUCTION: a Nicol prism is made from a calcite crystal whose length is three times its breadth, with the end angles of 72\u00b0 and 108\u00b0. The crystal is cut into two halves along a diagonal plane, and the two cut faces are pasted together with a thin layer of Canada balsam, a transparent cement.\nWORKING: a ray of unpolarised light entering the prism is split by double refraction into an ordinary ray and an extraordinary ray. The refractive index of calcite for the ordinary ray (1.658 for sodium light) is greater than that of Canada balsam (1.523), so the ordinary ray meets the balsam layer at a large angle and is totally internally reflected, and it is absorbed by the blackened side. The extraordinary ray (refractive index 1.486) is not reflected, and it is transmitted through the crystal. The emergent light is plane polarised.\nUSES: the Nicol prism is used both as a polariser, to produce plane-polarised light, and as an analyser, to examine whether light is plane polarised. Its drawbacks are the high cost, because large flawless calcite crystals are scarce, the lateral displacement of the emergent ray, the limited field of view, and the fact that the emergent light is not uniformly plane polarised.",k:[["calcite"],["three times","length"],["72","108"],["canada balsam","balsam"],["ordinary"],["extraordinary"],["totally internally","total internal"],["plane polarised","plane-polarised"],["polariser","analyser"],["drawback","cost"]]},
{m:5,q:"Prove Malus\u2019 law.",a:"Let the transmission axis of the polariser make an angle \u03b8 with the transmission axis of the analyser. Let the plane-polarised light leaving the polariser have intensity I0 and electric-vector amplitude a.\nThe amplitude a resolves into two rectangular components: a cos\u03b8 parallel to the analyser\u2019s transmission axis and a sin\u03b8 perpendicular to it. Only the component a cos\u03b8 is transmitted by the analyser; the perpendicular component is absorbed.\nSince intensity is proportional to the square of the amplitude, the transmitted intensity is I \u221d (a cos\u03b8)\u00b2 = a\u00b2 cos\u00b2\u03b8. Also I0 \u221d a\u00b2. Therefore\nI = I0 cos\u00b2\u03b8   (7.55)\nSo the intensity is maximum (I0) when \u03b8 = 0\u00b0 and zero when \u03b8 = 90\u00b0 (crossed polaroids).",k:[["amplitude"],["cos\u03b8","cos \u03b8","cos"],["sin\u03b8","perpendicular"],["square","intensity"],["i0","i = i0"],["90","zero","extinction"]]},
{m:5,q:"Prove the laws of reflection using Huygens\u2019 principle.",a:"Let a parallel beam of light be incident on a plane reflecting surface XY. The incident wavefront is AB, perpendicular to the incident rays, and the reflected wavefront is A\u2032B\u2032. When the point A of the incident wavefront touches the surface, the point B is still a distance BB\u2032 away. The secondary wavelet from A spreads out and, in the same time, the light from B travels to B\u2032. Since the speed is the same before and after reflection, the time taken from B to B\u2032 equals the time taken from A to A\u2032, so BB\u2032 = AA\u2032.\n(i) The incident ray, the reflected ray and the normal lie in the same plane.\n(ii) Consider the right-angled triangles ABB\u2032 and B\u2032A\u2032A. Both have a right angle at B and at A\u2032, the side AA\u2032 equals BB\u2032, and the side AB\u2032 is common. The triangles are congruent. Hence \u2220BAB\u2032 = \u2220A\u2032B\u2032A. But \u2220BAB\u2032 is the angle of incidence i and \u2220A\u2032B\u2032A is the angle of reflection r, so\ni = r\nThis proves the laws of reflection.",k:[["parallel"],["wavefront"],["time","same time"],["aa\u2032","aa'","bb\u2032","bb'","equal"],["congruent"],["same plane","plane"],["i = r","i=r","angle of incidence"]]},
{m:5,q:"Prove the laws of refraction using Huygens\u2019 principle.",a:"Let a parallel beam of light be incident on a plane refracting surface XY, from a rarer medium (speed v1) into a denser medium (speed v2), with v1 > v2. The incident wavefront AB and the refracted wavefront A\u2032B\u2032 are perpendicular to their rays.\nWhen A reaches the surface, B is still a distance BB\u2032 away. The light from B takes time t = BB\u2032/v1 to reach B\u2032, and in the same time the wavelet from A travels to A\u2032 in the denser medium: t = AA\u2032/v2. Hence BB\u2032/v1 = AA\u2032/v2.\n(i) The incident ray, the refracted ray and the normal lie in the same plane.\n(ii) In the right-angled triangle ABB\u2032, sin i = BB\u2032/AB\u2032. In the right-angled triangle AA\u2032B\u2032, sin r = AA\u2032/AB\u2032. Dividing:\nsin i/sin r = (BB\u2032/AB\u2032)/(AA\u2032/AB\u2032) = BB\u2032/AA\u2032 = v1/v2.\nSince v1/v2 = n2/n1 (the refractive index of the denser medium relative to the rarer), we get\nn1 sin i = n2 sin r   (7.4)\nThis proves Snell\u2019s law of refraction.",k:[["parallel"],["wavefront"],["time"],["speed","v1","v2"],["same plane","plane"],["bb\u2032/v1","bb'/v1","aa\u2032/v2","aa'/v2"],["sin i/sin r","sin i / sin r","n1 sin","n1sin"],["snell"]]},
{m:2,q:"What is the significance of electromagnetic wave theory of light?",a:"Electromagnetic wave theory, due to Maxwell, shows that light is a transverse electromagnetic wave that needs no material medium and travels at speed c in vacuum. It explains polarisation, which the mechanical wave theory of Huygens could not, and it explains the propagation of light through vacuum.",k:[["transverse"],["electromagnetic"],["vacuum","medium"],["polarisation","polarization"]]}
]},
8:{exp:[
"Electron microscope: the wave nature of electrons is used in the electron microscope. Its resolving power is inversely proportional to the wavelength of the radiation, and the de Broglie wavelength of electrons is a few thousand times smaller than that of visible light, so electron microscopes have much higher resolving power and magnification (above 200 000 times). The electron beam is accelerated by high potentials, made parallel by a magnetic condenser lens, and focused by magnetic or electrostatic objective and projector lenses onto a screen.",
"X-ray spectra: X-rays are produced when fast electrons strike a metal target. The spectrum has a continuous part, which depends on the accelerating voltage, and sharp characteristic peaks, which depend on the target material. Continuous (Bremsstrahlung) X-rays are emitted when electrons are decelerated in the target; the cut-off wavelength is given by the Duane\u2013Hunt formula \u03bb0 = hc/eV (8.14), which depends only on the accelerating voltage. Characteristic X-rays arise when an electron removes an inner-shell (for example K-shell) electron of the target atom, and electrons from outer orbits fall into the vacancy, emitting X-ray photons of definite energy.",
"Davisson\u2013Germer experiment (1927): confirmed de Broglie\u2019s hypothesis. Electrons from a hot filament are accelerated through a potential difference V (for example 54 V) and collimated by two thin diaphragms into a beam that strikes a single crystal of nickel. The crystal acts as a three-dimensional diffraction grating for matter waves, so the electrons scatter in specific directions. A detector, which can rotate about the crystal, measures the intensity of the scattered electrons as a function of the angle \u03b8 between the incident and scattered beams; a sharp maximum appears at a particular angle. Neutrons and alpha particles also show diffraction, and neutron diffraction is used to study crystal structures.",
"Einstein\u2019s photoelectric equation: each photon of energy hv gives its energy to one electron. Part of this energy overcomes the work function \u03c60 (the threshold energy, h\u03bd0 = \u03c60), and the rest appears as the kinetic energy of the photoelectron: h\u03bd = h\u03bd0 + (1/2)mv\u00b2 (8.7), so Kmax = h\u03bd \u2212 \u03c60 (8.8). A graph of Kmax against \u03bd is a straight line of slope h. Millikan verified this: the slope is the same for all metals and gives Planck\u2019s constant h = 6.626 \u00d7 10\u207b\u00b3\u2074 J s.",
"de Broglie hypothesis: moving material particles such as electrons, protons and neutrons are associated with waves, called matter waves or de Broglie waves. The wavelength of a particle of momentum p is \u03bb = h/p (8.9), so for a particle of mass m and speed v, \u03bb = h/mv (8.10). For an electron accelerated through a potential difference V, \u03bb = h/\u221a(2meV) (8.11).",
"Photoelectric effect: the ejection of electrons from a metal plate when illuminated by light (or other electromagnetic radiation) of suitable frequency. The emitted electrons are photoelectrons and the current they form is the photocurrent. Materials that emit photoelectrons are photosensitive: zinc and cadmium respond to ultraviolet light, while alkali metals such as lithium, sodium and caesium respond even to visible light.",
"Stopping potential: the negative (retarding) potential V0 on the collector that just stops the most energetic photoelectrons, so that the photocurrent becomes zero. Kmax = eV0 (in joule), or Kmax = V0 (in eV). The stopping potential is independent of the intensity of light, but it increases linearly with the frequency of the incident light above the threshold frequency.",
"Laws of photoelectric effect: (i) emission takes place only if the frequency exceeds a threshold frequency; (ii) above threshold, the number of photoelectrons, and so the saturation current, is proportional to the intensity; (iii) the maximum kinetic energy is independent of intensity; (iv) it is proportional to the frequency of the incident light; (v) there is no time lag between incidence and emission (less than 10\u207b\u2079 s).",
"Failure of the wave theory: the wave theory predicts that the kinetic energy would depend on intensity, that emission would occur at any frequency if the intensity were high enough, and that there would be a time lag of several hours while electrons absorb enough energy from the spread-out wavefront. None of these is observed, so the photoelectric effect cannot be explained by the classical wave theory."],

{q:"The wavelength \u03bbe of an electron and \u03bbp of a photon of same energy E are related by (NEET 2013)",o:["\u03bbp \u221d \u03bbe","\u03bbp \u221d \u221a\u03bbe","\u03bbp \u221d 1/\u03bbe","\u03bbp \u221d \u03bbe\u00b2"],a:3},
{q:"In an electron microscope, the electrons are accelerated by a voltage of 14 kV. If the voltage is changed to 224 kV, then the de Broglie wavelength associated with the electrons would",o:["increase by 2 times","decrease by 2 times","decrease by 4 times","increase by 4 times"],a:2},
{q:"The wave associated with a moving particle of mass 3 \u00d7 10\u207b\u2076 g has the same wavelength as an electron moving with a velocity 6 \u00d7 10\u2076 m s\u207b\u00b9. The velocity of the particle is",o:["1.82 \u00d7 10\u207b\u00b9\u2078 m s\u207b\u00b9","9 \u00d7 10\u207b\u00b2 m s\u207b\u00b9","3 \u00d7 10\u207b\u00b3\u00b9 m s\u207b\u00b9","1.82 \u00d7 10\u207b\u00b9\u2075 m s\u207b\u00b9"],a:3},
{q:"When a metallic surface is illuminated with radiation of wavelength \u03bb, the stopping potential is V. If the same surface is illuminated with radiation of wavelength 2\u03bb, the stopping potential is V/4. The threshold wavelength for the metallic surface is (NEET 2016)",o:["4\u03bb","5\u03bb","5\u03bb/2","3\u03bb"],a:3},
{q:"If a light of wavelength 330 nm is incident on a metal with work function 3.55 eV, the electrons are emitted. Then the wavelength of the wave associated with the emitted electron is (Take h = 6.6 \u00d7 10\u207b\u00b3\u2074 Js)",o:["< 2.75 \u00d7 10\u207b\u2079 m","\u2265 2.75 \u00d7 10\u207b\u2079 m","\u2264 2.75 \u00d7 10\u207b\u00b9\u00b2 m","< 2.5 \u00d7 10\u207b\u00b9\u2070 m"],a:1},
{q:"A photoelectric surface is illuminated successively by monochromatic light of wavelength \u03bb and \u03bb/2. If the maximum kinetic energy of the emitted photoelectrons in the second case is 3 times that in the first case, the work function of the material is (NEET 2015)",o:["hc/\u03bb","2hc/\u03bb","hc/3\u03bb","hc/2\u03bb"],a:3},
{q:"In photoelectric emission, a radiation whose frequency is 4 times threshold frequency of a certain metal is incident on the metal. Then the maximum possible velocity of the emitted electron will be",o:["\u221a(hv0/m)","\u221a(6hv0/m)","2\u221a(hv0/m)","\u221a(hv0/2m)"],a:1},
{q:"Two radiations with photon energies 0.9 eV and 3.3 eV respectively are falling on a metallic surface successively. If the work function of the metal is 0.6 eV, then the ratio of maximum speeds of emitted electrons in the two cases will be",o:["1:4","1:3","1:1","1:9"],a:1},
{q:"A light source of wavelength 520 nm emits 1.04 \u00d7 10\u00b9\u2075 photons per second while the second source of 460 nm produces 1.38 \u00d7 10\u00b9\u2075 photons per second. Then the ratio of power of second source to that of first source is",o:["1.00","1.02","1.5","0.98"],a:2},
