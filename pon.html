<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee On-Boarding System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .tabs-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .tabs {
            display: flex;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            overflow-x: auto;
            padding: 0 10px;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            font-weight: 600;
            color: #555;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.3);
            color: #667eea;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .form-container {
            padding: 30px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .form-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-prev {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #e9ecef;
        }

        .btn-prev:hover {
            background: #e9ecef;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }

        .progress-bar {
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.5s ease;
        }

        .tab-content-header {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-content-header h3 {
            color: #333;
            font-size: 1.4rem;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .required::after {
            content: " *";
            color: #ff4757;
        }

        .test-btn {
            background: #ff9800;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .tabs {
                flex-wrap: wrap;
            }
            
            .tab {
                flex: 1;
                min-width: 120px;
                text-align: center;
            }
            
            .form-actions {
                flex-direction: column;
                gap: 10px;
            }
            
            .form-actions > div {
                display: flex;
                gap: 10px;
                justify-content: center;
            }
        }
    </style>
</head>

        class OnBoardingApp {
            constructor() {
                this.currentTab = 0;
                this.formData = {};
                this.init();
            }

            init() {
                this.createTabs();
                this.createForms();
                this.setupEventListeners();
                this.showTab(this.currentTab);
                this.updateProgress();
            }

            createTabs() {
                const tabHeaders = document.getElementById('tabHeaders');
                FORM_CONFIG.sheets.forEach((sheet, index) => {
                    const tab = document.createElement('div');
                    tab.className = `tab ${index === 0 ? 'active' : ''}`;
                    tab.textContent = `${index + 1}. ${sheet.tabName}`;
                    tab.dataset.index = index;
                    tab.addEventListener('click', () => this.showTab(index));
                    tabHeaders.appendChild(tab);
                });
            }

            createForms() {
                const formContainer = document.getElementById('formContainer');
                
                FORM_CONFIG.sheets.forEach((sheet, index) => {
                    const formSection = document.createElement('div');
                    formSection.className = `form-section ${index === 0 ? 'active' : ''}`;
                    formSection.id = `form-${index}`;
                    
                    const header = document.createElement('div');
                    header.className = 'tab-content-header';
                    header.innerHTML = `<h3>${sheet.tabName}</h3><p>Section ${index + 1} of ${FORM_CONFIG.sheets.length}</p>`;
                    
                    const formGrid = document.createElement('div');
                    formGrid.className = 'form-grid';
                    
                    sheet.fields.forEach(field => {
                        const formGroup = document.createElement('div');
                        formGroup.className = 'form-group';
                        
                        const label = document.createElement('label');
                        label.htmlFor = field.id;
                        label.className = field.required ? 'required' : '';
                        label.textContent = field.label;
                        
                        let input;
                        
                        switch(field.type) {
                            case 'select':
                                input = document.createElement('select');
                                input.id = field.id;
                                input.name = field.id;
                                
                                // Add empty option
                                const emptyOption = document.createElement('option');
                                emptyOption.value = '';
                                emptyOption.textContent = '-- Select --';
                                input.appendChild(emptyOption);
                                
                                // Add options
                                if (field.options) {
                                    field.options.forEach(option => {
                                        const optionElement = document.createElement('option');
                                        optionElement.value = option;
                                        optionElement.textContent = option;
                                        if (field.defaultValue === option) {
                                            optionElement.selected = true;
                                        }
                                        input.appendChild(optionElement);
                                    });
                                }
                                break;
                                
                            case 'textarea':
                                input = document.createElement('textarea');
                                input.id = field.id;
                                input.name = field.id;
                                input.rows = 4;
                                break;
                                
                            default:
                                input = document.createElement('input');
                                input.type = field.type;
                                input.id = field.id;
                                input.name = field.id;
                                
                                if (field.min !== undefined) input.min = field.min;
                                if (field.max !== undefined) input.max = field.max;
                                
                                if (field.type === 'date') {
                                    input.max = new Date().toISOString().split('T')[0];
                                }
                                
                                if (field.defaultValue) {
                                    input.value = field.defaultValue;
                                }
                                
                                if (field.type === 'tel') {
                                    input.pattern = "[0-9]{10}";
                                    input.title = "Please enter a 10-digit phone number";
                                }
                        }
                        
                        if (field.required) {
                            input.required = true;
                        }
                        
                        input.placeholder = `Enter ${field.label.toLowerCase()}`;
                        
                        formGroup.appendChild(label);
                        formGroup.appendChild(input);
                        formGrid.appendChild(formGroup);
                    });
                    
                    formSection.appendChild(header);
                    formSection.appendChild(formGrid);
                    formContainer.appendChild(formSection);
                });
            }

            showTab(n) {
                // Save current form data before switching
                this.saveCurrentFormData();
                
                // Hide all tabs
                document.querySelectorAll('.form-section').forEach(section => {
                    section.classList.remove('active');
                });
                document.querySelectorAll('.tab').forEach(tab => {
                    tab.classList.remove('active');
                });
                
                // Show current tab
                document.getElementById(`form-${n}`).classList.add('active');
                document.querySelectorAll('.tab')[n].classList.add('active');
                
                // Update current tab index
                this.currentTab = n;
                
                // Update buttons
                this.updateButtons();
                this.updateProgress();
            }

            updateButtons() {
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                const submitBtn = document.getElementById('submitBtn');
                
                if (this.currentTab === 0) {
                    prevBtn.style.display = 'none';
                } else {
                    prevBtn.style.display = 'inline-block';
                }
                
                if (this.currentTab === FORM_CONFIG.sheets.length - 1) {
                    nextBtn.style.display = 'none';
                    submitBtn.style.display = 'inline-block';
                } else {
                    nextBtn.style.display = 'inline-block';
                    submitBtn.style.display = 'none';
                }
            }

            updateProgress() {
                const progress = ((this.currentTab + 1) / FORM_CONFIG.sheets.length) * 100;
                document.getElementById('progressFill').style.width = `${progress}%`;
            }

            saveCurrentFormData() {
                const currentForm = document.getElementById(`form-${this.currentTab}`);
                const inputs = currentForm.querySelectorAll('input, select, textarea');
                
                inputs.forEach(input => {
                    this.formData[input.name] = input.value;
                });
            }

            validateCurrentForm() {
                const currentForm = document.getElementById(`form-${this.currentTab}`);
                const requiredInputs = currentForm.querySelectorAll('[required]');
                
                for (let input of requiredInputs) {
                    if (!input.value.trim()) {
                        input.focus();
                        this.showMessage(`Please fill in "${input.previousElementSibling.textContent}"`, 'error');
                        return false;
                    }
                }
                
                // Email validation
                const emailInputs = currentForm.querySelectorAll('input[type="email"]');
                for (let input of emailInputs) {
                    if (input.value && !this.isValidEmail(input.value)) {
                        input.focus();
                        this.showMessage('Please enter a valid email address', 'error');
                        return false;
                    }
                }
                
                // Phone validation
                const phoneInputs = currentForm.querySelectorAll('input[type="tel"]');
                for (let input of phoneInputs) {
                    if (input.value && !this.isValidPhone(input.value)) {
                        input.focus();
                        this.showMessage('Please enter a valid 10-digit phone number', 'error');
                        return false;
                    }
                }
                
                return true;
            }

            isValidEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            isValidPhone(phone) {
                const re = /^[0-9]{10}$/;
                return re.test(phone.replace(/\D/g, ''));
            }

            async submitAllData() {
                // Save final form data
                this.saveCurrentFormData();
                
                // Validate all forms
                for (let i = 0; i < FORM_CONFIG.sheets.length; i++) {
                    const sheet = FORM_CONFIG.sheets[i];
                    const requiredFields = sheet.fields.filter(f => f.required);
                    
                    for (let field of requiredFields) {
                        if (!this.formData[field.id]) {
                            this.showMessage(`Please fill required field: "${field.label}" in "${sheet.tabName}"`, 'error');
                            this.showTab(i);
                            return;
                        }
                    }
                }
                
                // Submit to Google Sheets
                try {
                    this.showMessage('Submitting data... Please wait.', 'info');
                    
                    // Submit each sheet separately
                    for (let sheet of FORM_CONFIG.sheets) {
                        const sheetData = {};
                        
                        // Collect data for this sheet
                        sheet.fields.forEach(field => {
                            sheetData[field.id] = this.formData[field.id] || '';
                        });
                        
                        // Submit to Google Apps Script
                        const response = await fetch(FORM_CONFIG.scriptUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                sheetName: sheet.name,
                                rowData: sheetData
                            })
                        });
                        
                        // Note: With no-cors, we can't read the response
                        // But the data should still be sent
                        console.log(`Submitted to ${sheet.name}:`, sheetData);
                    }
                    
                    this.showMessage('✅ All data submitted successfully to Google Sheets!', 'success');
                    
                    // Reset form after 3 seconds
                    setTimeout(() => {
                        this.resetForm();
                        this.showTab(0);
                    }, 3000);
                    
                } catch (error) {
                    console.error('Submission error:', error);
                    this.showMessage(`❌ Error submitting data: ${error.message}`, 'error');
                }
            }

            resetForm() {
                // Clear all form inputs
                document.querySelectorAll('input, select, textarea').forEach(input => {
                    if (input.type === 'select-one') {
                        input.selectedIndex = 0;
                    } else {
                        input.value = '';
                    }
                });
                
                // Clear form data
                this.formData = {};
                
                // Clear status message after a delay
                setTimeout(() => {
                    this.showMessage('', '');
                }, 5000);
            }

            showMessage(message, type) {
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.textContent = message;
                statusDiv.className = 'status-message';
                
                if (type) {
                    statusDiv.classList.add(type);
                }
                
                if (message) {
                    statusDiv.style.display = 'block';
                    
                    // Auto-hide success messages after 5 seconds
                    if (type === 'success') {
                        setTimeout(() => {
                            statusDiv.style.display = 'none';
                        }, 5000);
                    }
                } else {
                    statusDiv.style.display = 'none';
                }
            }

            setupEventListeners() {
                // Next button
                document.getElementById('nextBtn').addEventListener('click', () => {
                    if (this.validateCurrentForm()) {
                        this.saveCurrentFormData();
                        this.showTab(this.currentTab + 1);
                    }
                });
                
                // Previous button
                document.getElementById('prevBtn').addEventListener('click', () => {
                    this.saveCurrentFormData();
                    this.showTab(this.currentTab - 1);
                });
                
                // Submit button
                document.getElementById('submitBtn').addEventListener('click', () => {
                    if (this.validateCurrentForm()) {
                        this.submitAllData();
                    }
                });
                
                // Auto-save on input change
                document.addEventListener('input', (e) => {
                    if (e.target.matches('input, select, textarea')) {
                        this.formData[e.target.name] = e.target.value;
                    }
                });
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        if (this.currentTab < FORM_CONFIG.sheets.length - 1) {
                            document.getElementById('nextBtn').click();
                        }
                    }
                    
                    // Ctrl + Enter to submit on last tab
                    if (e.ctrlKey && e.key === 'Enter' && this.currentTab === FORM_CONFIG.sheets.length - 1) {
                        e.preventDefault();
                        document.getElementById('submitBtn').click();
                    }
                });
            }
        }

        // Test connection function
        async function testConnection() {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = 'Testing connection to Google Sheets...';
            statusDiv.className = 'status-message info';
            statusDiv.style.display = 'block';
            
            try {
                const response = await fetch(FORM_CONFIG.scriptUrl);
                const data = await response.json();
                
                if (data.status === 'Connected') {
                    statusDiv.textContent = `✅ Connection successful! Found ${data.sheets.length} sheets: ${data.sheets.map(s => s.name).join(', ')}`;
                    statusDiv.className = 'status-message success';
                } else {
                    statusDiv.textContent = '❌ Connection failed. Please check your Google Apps Script deployment.';
                    statusDiv.className = 'status-message error';
                }
            } catch (error) {
                statusDiv.textContent = `❌ Connection error: ${error.message}`;
                statusDiv.className = 'status-message error';
            }
        }

        // Initialize app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new OnBoardingApp();
        });
    </script>
</body>
</html>
