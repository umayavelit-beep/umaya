<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee On-Boarding System</title>
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Main Container */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Header */
        .app-header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 35px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .app-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #e74c3c, #f39c12, #2ecc71, #3498db);
        }
        
        .app-title {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .app-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 25px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }
        
        /* Status Bar */
        .status-bar {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        .status-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e74c3c;
            position: relative;
        }
        
        .status-indicator.connected {
            background: #2ecc71;
            box-shadow: 0 0 0 5px rgba(46, 204, 113, 0.2);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
        
        /* Progress Section */
        .progress-section {
            background: #f8f9fa;
            padding: 25px 40px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .progress-bar {
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 5px;
        }
        
        /* Tabs Navigation */
        .tabs-container {
            background: white;
            border-bottom: 2px solid #f1f3f4;
            padding: 0 20px;
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
        }
        
        .tabs-container::-webkit-scrollbar {
            display: none;
        }
        
        .tab {
            padding: 20px 25px;
            cursor: pointer;
            font-weight: 600;
            color: #5f6368;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }
        
        .tab:hover {
            background: #f8f9fa;
            color: #3498db;
        }
        
        .tab.active {
            color: #3498db;
            border-bottom-color: #3498db;
            background: linear-gradient(to bottom, #f8f9fa, white);
        }
        
        .tab-number {
            width: 28px;
            height: 28px;
            background: #e8eaed;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        
        .tab.active .tab-number {
            background: #3498db;
            color: white;
            transform: scale(1.1);
        }
        
        .tab-icon {
            font-size: 1.3rem;
        }
        
        /* Message Container */
        .message-container {
            padding: 0 40px;
            margin-top: 20px;
        }
        
        .message {
            padding: 18px 24px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            animation: slideDown 0.4s ease;
            font-weight: 500;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.success {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            border: 1px solid #b1dfbb;
            display: block;
        }
        
        .message.error {
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            color: #721c24;
            border: 1px solid #f1b0b7;
            display: block;
        }
        
        .message.info {
            background: linear-gradient(135deg, #d1ecf1, #bee5eb);
            color: #0c5460;
            border: 1px solid #abdde5;
            display: block;
        }
        
        /* Form Container */
        .form-container {
            padding: 40px;
            min-height: 550px;
            max-height: 600px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #3498db #f1f3f4;
        }
        
        .form-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .form-container::-webkit-scrollbar-track {
            background: #f1f3f4;
            border-radius: 4px;
        }
        
        .form-container::-webkit-scrollbar-thumb {
            background: #3498db;
            border-radius: 4px;
        }
        
        .form-section {
            display: none;
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-section.active {
            display: block;
        }
        
        .section-header {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .section-header h2 {
            color: #2c3e50;
            font-size: 1.9rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .section-header p {
            color: #7f8c8d;
            font-size: 1.05rem;
        }
        
        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        
        .form-group {
            margin-bottom: 10px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #34495e;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .required::after {
            content: " *";
            color: #e74c3c;
            font-weight: bold;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            color: #2d3436;
        }
        
        input:hover, select:hover, textarea:hover {
            border-color: #b2bec3;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.2);
            transform: translateY(-2px);
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.5;
        }
        
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232c3e50' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 45px;
        }
        
        /* Buttons */
        .actions-container {
            padding: 25px 40px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .btn {
            padding: 16px 35px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        
        .btn-prev {
            background: #6c757d;
            color: white;
        }
        
        .btn-prev:hover:not(:disabled) {
            background: #5a6268;
            transform: translateX(-5px);
            box-shadow: 0 10px 25px rgba(108, 117, 125, 0.3);
        }
        
        .btn-next {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }
        
        .btn-next:hover:not(:disabled) {
            transform: translateX(5px);
            box-shadow: 0 15px 35px rgba(52, 152, 219, 0.4);
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 16px 45px;
        }
        
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(46, 204, 113, 0.4);
        }
        
        .btn-test {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            padding: 14px 28px;
            font-size: 15px;
        }
        
        .btn-test:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(243, 156, 18, 0.3);
        }
        
        /* Loading Animation */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive Design */
        @media (max-width: 1200px) {
            .form-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }
        
        @media (max-width: 992px) {
            .app-title {
                font-size: 2.2rem;
            }
            
            .app-header {
                padding: 25px 30px;
            }
            
            .form-container {
                padding: 30px;
            }
            
            .form-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 25px;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .app-container {
                border-radius: 15px;
            }
            
            .app-title {
                font-size: 1.9rem;
                flex-direction: column;
                gap: 10px;
            }
            
            .app-header, .form-container, .actions-container {
                padding: 20px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .tabs-container {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .tab {
                flex: 1;
                min-width: 160px;
                padding: 15px;
                justify-content: center;
            }
            
            .tab-icon {
                display: none;
            }
            
            .actions-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .btn-prev, .btn-next, .btn-submit {
                padding: 18px;
            }
        }
        
        /* Form Validation */
        input:invalid, select:invalid, textarea:invalid {
            border-color: #e74c3c;
        }
        
        input:valid, select:valid, textarea:valid {
            border-color: #2ecc71;
        }
        
        /* Tooltip */
        .form-group {
            position: relative;
        }
        
        .form-group:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 0;
            background: #2c3e50;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
            z-index: 1000;
            margin-bottom: 5px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        
        .form-group:hover::after {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

                {

                    title: "ESI Nominee",

                    fields: [
                        { id: "Branch Office", label: "Branch Office", type: "text" },
                        { id: "Dispensery", label: "Dispensary", type: "text" },
                        { id: "Date of Appoinment", label: "Date of Appointment", type: "date" },

                        { id: "Employer code No", label: "Employer Code", type: "text" },
                        { id: "Employer Name", label: "Employer Name", type: "text" },
                        { id: "Email Address", label: "Email Address", type: "email" },
                        { id: "Address of the Employer", label: "Employer Address", type: "text" },
                        { id: "Relation Ship", label: "Relationship", type: "select", options: ["Spouse", "Child", "Parent", "Sibling", "Other"] },
                        { id: "Relation Ship Name", label: "Nominee Name", type: "text" },
                        { id: "Date of Birth", label: "Date of Birth", type: "date" },
                        { id: "Address of the Employee", label: "Employee Address", type: "text" }
                    ]
                },
                {
                    name: "Gratuity nominee details (FORM",
                    title: "Gratuity Nominee",
                    icon: "💰",
                    description: "Gratuity nominee details",
                    fields: [
                        { id: "Relation Ship", label: "Relationship", type: "select", options: ["Spouse", "Child", "Parent", "Sibling", "Other"] },
                        { id: "Relation Ship Name", label: "Nominee Name", type: "text" },
                        { id: "Date of Birth", label: "Date of Birth", type: "date" },
                        { id: "% Amount of Nominee", label: "Percentage Amount", type: "number", min: 0, max: 100 },
                        { id: "Name and Address of Guardian", label: "Guardian Name & Address", type: "textarea" }
                    ]
                }
            ]
        };

        // ========== APPLICATION STATE ==========
        let currentSection = 0;
        let formData = {};
        let isSubmitting = false;

        // ========== INITIALIZATION ==========
        function init() {
            createTabs();
            createForms();
            showSection(0);
            updateProgress();
            updateButtons();
            autoTestConnection();
        }

        // ========== TAB MANAGEMENT ==========
        function createTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            CONFIG.sheets.forEach((sheet, index) => {
                const tab = document.createElement('div');
                tab.className = `tab ${index === 0 ? 'active' : ''}`;
                tab.innerHTML = `
                    <span class="tab-number">${index + 1}</span>
                    <span class="tab-icon">${sheet.icon}</span>
                    <span>${sheet.title}</span>
                `;
                tab.onclick = () => switchToSection(index);
                tabsContainer.appendChild(tab);
            });
        }

        function createForms() {
            const formContainer = document.getElementById('formContainer');
            CONFIG.sheets.forEach((sheet, index) => {
                const section = document.createElement('div');
                section.className = `form-section ${index === 0 ? 'active' : ''}`;
                section.id = `section-${index}`;
                
                const header = document.createElement('div');
                header.className = 'section-header';
                header.innerHTML = `
                    <h2>${sheet.icon} ${sheet.title}</h2>
                    <p>${sheet.description} - Section ${index + 1} of ${CONFIG.sheets.length}</p>
                `;
                section.appendChild(header);
                
                const grid = document.createElement('div');
                grid.className = 'form-grid';
                
                sheet.fields.forEach(field => {
                    const group = document.createElement('div');
                    group.className = 'form-group';
                    
                    const label = document.createElement('label');
                    label.htmlFor = field.id;
                    label.textContent = field.label;
                    if (field.required) label.className = 'required';
                    
                    let input;
                    if (field.type === 'select') {
                        input = document.createElement('select');
                        input.id = field.id;
                        input.name = field.id;
                        
                        const defaultOption = document.createElement('option');
                        defaultOption.value = '';
                        defaultOption.textContent = '-- Select --';
                        input.appendChild(defaultOption);
                        
                        if (field.options) {
                            field.options.forEach(option => {
                                const optionEl = document.createElement('option');
                                optionEl.value = option;
                                optionEl.textContent = option;
                                if (field.defaultValue === option) {
                                    optionEl.selected = true;
                                }
                                input.appendChild(optionEl);
                            });
                        }
                    } else if (field.type === 'textarea') {
                        input = document.createElement('textarea');
                        input.id = field.id;
                        input.name = field.id;
                        input.rows = 4;
                        input.placeholder = field.placeholder || '';
                    } else {
                        input = document.createElement('input');
                        input.type = field.type;
                        input.id = field.id;
                        input.name = field.id;
                        input.placeholder = field.placeholder || '';
                        
                        if (field.defaultValue) {
                            input.value = field.defaultValue;
                        }
                        
                        if (field.min !== undefined) input.min = field.min;
                        if (field.max !== undefined) input.max = field.max;
                        
                        if (field.type === 'date') {
                            const today = new Date().toISOString().split('T')[0];
                            input.max = today;
                        }
                    }
                    
                    if (field.required) input.required = true;
                    
                    input.oninput = saveCurrentSectionData;
                    
                    group.appendChild(label);
                    group.appendChild(input);
                    grid.appendChild(group);
                });
                
                section.appendChild(grid);
                formContainer.appendChild(section);
            });
        }

        // ========== NAVIGATION ==========
        function showSection(index) {
            if (!validateCurrentSection()) return false;
            
            saveCurrentSectionData();
            
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(`section-${index}`).classList.add('active');
            document.querySelectorAll('.tab')[index].classList.add('active');
            
            currentSection = index;
            updateProgress();
            updateButtons();
            
            return true;
        }

        function switchToSection(index) {
            if (index !== currentSection) {
                showSection(index);
            }
        }

        function nextSection() {
            if (validateCurrentSection()) {
                if (currentSection < CONFIG.sheets.length - 1) {
                    showSection(currentSection + 1);
                }
            }
        }

        function prevSection() {
            if (currentSection > 0) {
                showSection(currentSection - 1);
            }
        }

        // ========== VALIDATION ==========
        function validateCurrentSection() {
            const currentForm = document.getElementById(`section-${currentSection}`);
            const requiredInputs = currentForm.querySelectorAll('[required]');
            
            for (const input of requiredInputs) {
                if (!input.value.trim()) {
                    showMessage(`Please fill in: ${input.previousElementSibling.textContent}`, 'error');
                    input.focus();
                    return false;
                }
                
                // Email validation
                if (input.type === 'email' && input.value) {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(input.value)) {
                        showMessage('Please enter a valid email address', 'error');
                        input.focus();
                        return false;
                    }
                }
                
                // Phone validation
                if (input.type === 'tel' && input.value) {
                    const phoneRegex = /^[0-9]{10}$/;
                    if (!phoneRegex.test(input.value.replace(/\D/g, ''))) {
                        showMessage('Please enter a valid 10-digit phone number', 'error');
                        input.focus();
                        return false;
                    }
                }
            }
            
            return true;
        }

        // ========== DATA MANAGEMENT ==========
        function saveCurrentSectionData() {
            const currentForm = document.getElementById(`section-${currentSection}`);
            const inputs = currentForm.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                formData[input.name] = input.value;
            });
        }

        // ========== PROGRESS & UI ==========
        function updateProgress() {
            const progress = ((currentSection + 1) / CONFIG.sheets.length) * 100;
            const percent = Math.round(progress);
            
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `Step ${currentSection + 1} of ${CONFIG.sheets.length}`;
            document.getElementById('completionPercent').textContent = `${percent}% Complete`;
        }

        function updateButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const submitBtn = document.getElementById('submitBtn');
            
            prevBtn.disabled = currentSection === 0;
            
            if (currentSection === CONFIG.sheets.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'inline-flex';
            } else {
                nextBtn.style.display = 'inline-flex';
                submitBtn.style.display = 'none';
            }
        }

        // ========== MESSAGES ==========
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }

        // ========== CONNECTION TEST ==========
        async function autoTestConnection() {
            try {
                const response = await fetch(`${CONFIG.scriptUrl}?test=true`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('statusText').textContent = `Connected to: ${data.spreadsheet}`;
                    document.getElementById('statusIndicator').className = 'status-indicator connected';
                    console.log('✅ Connection successful:', data);
                }
            } catch (error) {
                console.log('Auto-connection test failed');
            }
        }

        async function testConnection() {
            const testBtn = document.getElementById('testBtn');
            const originalText = testBtn.innerHTML;
            
            testBtn.innerHTML = '<span class="loader"></span> Testing...';
            testBtn.disabled = true;
            
            try {
                const response = await fetch(`${CONFIG.scriptUrl}?test=true`);
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`✅ Connected to "${data.spreadsheet}" with ${data.sheetCount} sheets`, 'success');
                    document.getElementById('statusText').textContent = `Connected to: ${data.spreadsheet}`;
                    document.getElementById('statusIndicator').className = 'status-indicator connected';
                } else {
                    showMessage(`❌ Connection failed: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Connection error: ${error.message}`, 'error');
            } finally {
                testBtn.innerHTML = originalText;
                testBtn.disabled = false;
            }
        }

        // ========== SUBMISSION ==========
        async function submitAllData() {
            if (isSubmitting) return;
            
            if (!validateCurrentSection()) return;
            saveCurrentSectionData();
            
            isSubmitting = true;
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = '<span class="loader"></span> Submitting...';
            submitBtn.disabled = true;
            
            showMessage('Submitting data to Google Sheets... Please wait.', 'info');
            
            try {
                let successCount = 0;
                let failedSheets = [];
                
                // Submit each sheet
                for (const sheet of CONFIG.sheets) {
                    const sheetData = {};
                    sheet.fields.forEach(field => {
                        sheetData[field.id] = formData[field.id] || '';
                    });
                    
                    const response = await fetch(CONFIG.scriptUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sheetName: sheet.name,
                            rowData: sheetData
                        })
                    });
                    
                    const result = await response.json();
                    if (result.success) {
                        successCount++;
                        console.log(`✅ ${sheet.name}: ${result.message}`);
                    } else {
                        failedSheets.push(sheet.name);
                        console.error(`❌ ${sheet.name}: ${result.error}`);
                    }
                }
                
                if (successCount === CONFIG.sheets.length) {
                    showMessage('✅ All data submitted successfully! Form will reset in 3 seconds...', 'success');
                    
                    setTimeout(() => {
                        document.querySelectorAll('input, select, textarea').forEach(input => {
                            if (input.type === 'select-one') {
                                input.selectedIndex = 0;
                            } else {
                                input.value = '';
                            }
                        });
                        formData = {};
                        showSection(0);
                        showMessage('Form reset. Ready for next employee!', 'info');
                    }, 3000);
                    
                } else {
                    showMessage(`Submitted ${successCount}/${CONFIG.sheets.length} sheets. Failed: ${failedSheets.join(', ')}`, 'error');
                }
                
            } catch (error) {
                showMessage(`❌ Submission error: ${error.message}`, 'error');
                console.error('Submission error:', error);
                
            } finally {
                isSubmitting = false;
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        // ========== KEYBOARD SHORTCUTS ==========
        document.addEventListener('keydown', (e) => {
            // Ctrl + Enter to submit
            if (e.ctrlKey && e.key === 'Enter' && currentSection === CONFIG.sheets.length - 1) {
                e.preventDefault();
                submitAllData();
            }
            
            // Enter to go to next (except in textareas)
            if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
                if (currentSection < CONFIG.sheets.length - 1) {
                    nextSection();
                }
            }
            
            // Arrow keys for navigation
            if (e.key === 'ArrowLeft' && currentSection > 0) {
                e.preventDefault();
                prevSection();
            }
            if (e.key === 'ArrowRight' && currentSection < CONFIG.sheets.length - 1) {
                e.preventDefault();
                nextSection();
            }
        });

        // ========== INITIALIZE ==========
        document.addEventListener('DOMContentLoaded', init);
    </script>
