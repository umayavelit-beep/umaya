<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qr scan & share csv online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #333;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            flex-grow: 1;
            font-size: 16px;
        }
        .icon-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        .icon-btn:hover { background-color: #0056b3; }
        .icon-btn.delete-all { background-color: #dc3545; }
        .icon-btn.delete-all:hover { background-color: #a71d2a; }
        
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .results-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        li:last-child { border-bottom: none; }
        .delete-person {
            color: #dc3545;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }
        .delete-person:hover { color: #a71d2a; }
    </style>
</head>
<body>

    <h1>qr scan & share csv online</h1>

    <div class="controls">
        <input type="text" id="csvFileName" placeholder="Enter CSV file name" value="Scanned_List">
        <button id="downloadBtn" class="icon-btn" title="Download CSV"><i class="fas fa-download"></i></button>
        <button id="deleteAllBtn" class="icon-btn delete-all" title="Clear All Data"><i class="fas fa-trash-alt"></i></button>
    </div>

    <div id="reader"></div>

    <div class="results-container">
        <h3>Scanned Data (<span id="count">0</span>):</h3>
        <ul id="scannedList">
            </ul>
    </div>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script>
        let scannedData = [];

        // 1. Setup QR Scanner
        function onScanSuccess(decodedText, decodedResult) {
            // Prevent duplicate scans back-to-back
            if (!scannedData.includes(decodedText)) {
                scannedData.push(decodedText);
                updateList();
            }
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: {width: 250, height: 250} }, 
            false
        );
        html5QrcodeScanner.render(onScanSuccess);

        // 2. Update the UI List
        function updateList() {
            const list = document.getElementById('scannedList');
            const count = document.getElementById('count');
            list.innerHTML = '';
            count.innerText = scannedData.length;

            scannedData.forEach((personInfo, index) => {
                const li = document.createElement('li');
                li.innerText = personInfo;

                // Small delete icon for any specific person
                const deleteIcon = document.createElement('i');
                deleteIcon.className = 'fas fa-times delete-person';
                deleteIcon.title = 'Remove person';
                deleteIcon.onclick = () => {
                    scannedData.splice(index, 1); // Remove from array
                    updateList(); // Refresh list
                };

                li.appendChild(deleteIcon);
                list.appendChild(li);
            });
        }

        // 3. Download CSV Logic
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (scannedData.length === 0) {
                alert("No data to download!");
                return;
            }

            let filename = document.getElementById('csvFileName').value.trim();
            if (!filename) filename = "Scanned_List";
            if (!filename.toLowerCase().endsWith('.csv')) filename += '.csv';

            // Create CSV formatting
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Scanned Info\n"; // Header row
            
            scannedData.forEach(row => {
                // Escape quotes and commas
                let formattedRow = `"${row.replace(/"/g, '""')}"`;
                csvContent += formattedRow + "\n";
            });

            // Trigger download
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // 4. Delete All Logic
        document.getElementById('deleteAllBtn').addEventListener('click', () => {
            if (scannedData.length > 0 && confirm("Are you sure you want to delete all scanned data?")) {
                scannedData = [];
                updateList();
            }
        });
    </script>

</body>
</html>
