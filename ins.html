<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>10x Reels · ArtStudio Filters</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0b;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      touch-action: pan-y;
    }

    .reels-container {
      width: 100%;
      max-width: 420px;
      background: #000;
      border-radius: 36px 36px 24px 24px;
      overflow: hidden;
      box-shadow: 0 30px 50px rgba(0,0,0,0.9);
      border: 1px solid #262626;
      position: relative;
      aspect-ratio: 9 / 16;
    }

    .canvas-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
      object-fit: cover;
      pointer-events: none;
    }

    .overlay-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 16px 26px 16px;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 20%, transparent);
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: none;
    }

    .film-strip {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 4px;
    }
    .thumb-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #1e1e1e;
      border: 2px solid #3a3a3a;
      object-fit: cover;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
      transition: all 0.2s;
    }
    .thumb-badge.active {
      border-color: #f02e65;
      transform: scale(1.02);
    }

    /* filter selector – new artistic row */
    .filter-selector {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .filter-pill {
      background: rgba(30,30,34,0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #4f4f4f;
      color: #ddd;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .filter-pill i {
      font-size: 16px;
    }
    .filter-pill.active {
      background: #f02e65;
      color: white;
      border-color: #f02e65;
      box-shadow: 0 0 12px #f02e65;
    }

    .action-bar {
      background: rgba(22, 22, 26, 0.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 42px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border: 1px solid #3d3d3d;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: #f0f0f0;
      font-size: 22px;
      width: 44px;
      height: 44px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      cursor: pointer;
    }
    .btn-icon:active { background: #2f2f2f; }

    .duration-picker {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1b1b1e;
      padding: 6px 12px;
      border-radius: 60px;
      border: 1px solid #3b3b3b;
    }
    .duration-picker span { color: #fff; font-size: 15px; font-weight: 500; }
    .duration-picker input {
      width: 48px;
      background: #0e0e0e;
      border: 1px solid #5c5c5c;
      color: white;
      padding: 6px 0 6px 12px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
    }

    .render-btn {
      background: #f02e65;
      border: none;
      border-radius: 48px;
      padding: 12px 28px;
      font-weight: 700;
      font-size: 16px;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 18px rgba(240,46,101,0.4);
      cursor: pointer;
      transition: 0.15s;
    }
    .render-btn:active { transform: scale(0.96); background: #d11f54; }
    .render-btn:disabled { opacity: 0.5; filter: grayscale(0.8); pointer-events: none; }

    #file-input {
      display: none;
    }

    .preview-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 4px;
    }
    .preview-video {
      display: none;
      width: 70%;
      height: 48px;
      border-radius: 30px;
      background: #121212;
      border: 1px solid #333;
      object-fit: cover;
    }
    .preview-video[src] { display: block; }
    .download-btn {
      background: #1c1c1c;
      border: 1px solid #5b5b5b;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      gap: 8px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .download-btn:active { background: #2d2d2d; }
    .download-btn:disabled { opacity: 0.2; }

    .status-text {
      font-size: 12px;
      color: #aaa;
      margin-top: 6px;
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    i { pointer-events: none; }
  </style>
</head>
<body>
<div class="reels-container">
  <div class="canvas-wrapper">
    <canvas id="reelsCanvas" width="432" height="768"></canvas>
  </div>

  <div class="film-strip" id="filmStrip"></div>

  <div class="overlay-controls">
    <!-- filter row: four artistic designs -->
    <div class="filter-selector" id="filterSelector">
      <div class="filter-pill" data-filter="pencil"><i class="fas fa-pencil-alt"></i> Pencil</div>
      <div class="filter-pill" data-filter="stitch"><i class="fas fa-tshirt"></i> Stitch</div>
      <div class="filter-pill" data-filter="oil"><i class="fas fa-paint-brush"></i> Oil</div>
      <div class="filter-pill" data-filter="pop"><i class="fas fa-star"></i> Pop Art</div>
    </div>

    <div class="preview-section">
      <video id="videoPreview" class="preview-video" muted playsinline></video>
      <button id="downloadVideoBtn" class="download-btn" disabled><i class="fas fa-arrow-down"></i> HD</button>
    </div>

    <div class="action-bar">
      <label for="file-input" class="btn-icon"><i class="fas fa-images"></i></label>
      <input type="file" id="file-input" accept="image/*" multiple hidden>

      <div class="duration-picker">
        <span><i class="far fa-clock"></i></span>
        <input type="number" id="durationInput" value="38" min="25" max="58" step="1">
      </div>

      <button id="renderStartBtn" class="render-btn"><i class="fas fa-magic"></i> Render</button>
    </div>
    <div class="status-text" id="statusMsg"><i class="fas fa-palette"></i> pick a style · 2‑3 photos</div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('reelsCanvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('file-input');
    const filmStrip = document.getElementById('filmStrip');
    const renderBtn = document.getElementById('renderStartBtn');
    const downloadBtn = document.getElementById('downloadVideoBtn');
    const previewVideo = document.getElementById('videoPreview');
    const statusMsg = document.getElementById('statusMsg');
    const durationInput = document.getElementById('durationInput');
    const filterPills = document.querySelectorAll('.filter-pill');

    // ---------- ART FILTERS ----------
    let currentFilter = 'pencil'; // default pencil
    filterPills.forEach(pill => {
      pill.addEventListener('click', () => {
        filterPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.filter;
        statusMsg.innerHTML = `🎨 ${currentFilter} filter active`;
        // redraw first image if any
        if (loadedImages.length > 0) {
          drawImageOnCanvas(loadedImages[0], 1.0, 0, 0, 0);
        }
      });
    });
    // set pencil active on load
    document.querySelector('[data-filter="pencil"]').classList.add('active');

    // state
    let loadedImages = [];
    let isRendering = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let animationFrame = null;

    function resizeCanvasToDisplay() {
      const container = canvas.parentElement;
      const w = container.clientWidth;
      const h = container.clientHeight;
      canvas.width = w;
      canvas.height = h;
    }
    window.addEventListener('resize', resizeCanvasToDisplay);
    resizeCanvasToDisplay();

    function updateFilmStrip(images) {
      filmStrip.innerHTML = '';
      if (!images.length) {
        for (let i = 0; i < 3; i++) {
          const emptyDiv = document.createElement('div');
          emptyDiv.className = 'thumb-badge';
          emptyDiv.style.background = '#1a1a1a';
          emptyDiv.style.border = '2px dashed #3c3c3c';
          filmStrip.appendChild(emptyDiv);
        }
        return;
      }
      images.forEach((img, idx) => {
        const thumb = document.createElement('img');
        thumb.src = img.src;
        thumb.className = 'thumb-badge';
        if (idx === 0) thumb.classList.add('active');
        filmStrip.appendChild(thumb);
      });
      for (let i = images.length; i < 3; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'thumb-badge';
        emptyDiv.style.background = '#222';
        emptyDiv.style.opacity = '0.5';
        filmStrip.appendChild(emptyDiv);
      }
    }

    // ---------- FILTER KERNELS & EFFECTS ----------
    function applyFilter(imageData, filterName) {
      const data = imageData.data;
      const w = imageData.width, h = imageData.height;
      const len = data.length;

      if (filterName === 'pencil') {
        // simple desaturate + edge emphasis: grayscale + contrast
        for (let i = 0; i < len; i += 4) {
          let r = data[i], g = data[i+1], b = data[i+2];
          let gray = 0.3 * r + 0.59 * g + 0.11 * b;
          // invert and boost contrast for sketch look
          gray = 255 - gray;
          gray = gray < 128 ? 0 : (gray - 128) * 2.2;
          data[i] = data[i+1] = data[i+2] = Math.min(255, gray + 30);
        }
      } 
      else if (filterName === 'stitch') {
        // "modern stitch" -> patchwork / pixelated + warm tint
        for (let i = 0; i < len; i += 4) {
          let r = data[i], g = data[i+1], b = data[i+2];
          // posterize + crosshatch (simple block)
          let gray = (r + g + b) / 3;
          let block = Math.floor(gray / 43) * 43; // 6 levels
          data[i] = Math.min(255, block + 30);
          data[i+1] = Math.min(255, block * 0.7 + 80);
          data[i+2] = Math.min(255, block * 0.5 + 100);
        }
      }
      else if (filterName === 'oil') {
        // oil painting effect: heavy smooth + saturation + swirl (emulated by median-like)
        // simplified: strong saturation, slight blur feel by averaging neighbors? too heavy. use vibrant + fake brush
        for (let i = 0; i < len; i += 4) {
          let r = data[i], g = data[i+1], b = data[i+2];
          // boost saturation (simple)
          let gray = (r + g + b) / 3;
          let intensity = 1.8;
          r = gray + intensity * (r - gray);
          g = gray + intensity * (g - gray);
          b = gray + intensity * (b - gray);
          data[i] = Math.min(255, r * 1.1);
          data[i+1] = Math.min(255, g * 0.9);
          data[i+2] = Math.min(255, b * 1.05);
        }
      }
      else if (filterName === 'pop') {
        // pop art: high contrast, color quantization, comic style
        for (let i = 0; i < len; i += 4) {
          let r = data[i], g = data[i+1], b = data[i+2];
          let gray = (r + g + b) / 3;
          // posterize 4 levels per channel
          r = Math.floor(r / 64) * 64 + 32;
          g = Math.floor(g / 64) * 64 + 32;
          b = Math.floor(b / 64) * 64 + 32;
          // add cyan / magenta pop
          data[i] = Math.min(255, r + 20);
          data[i+1] = Math.min(255, g);
          data[i+2] = Math.min(255, b + 30);
        }
      }
      return imageData;
    }

    // draw image with current filter + optional shift/zoom (same signature as before)
    function drawImageOnCanvas(img, opacity = 1.0, zoomExtra = 0, shiftX = 0, shiftY = 0) {
      const w = canvas.width, h = canvas.height;
      // draw image off-screen to apply filter
      const offscreen = document.createElement('canvas');
      offscreen.width = w;
      offscreen.height = h;
      const offCtx = offscreen.getContext('2d');

      const imgW = img.width, imgH = img.height;
      const scaleCover = Math.max(w / imgW, h / imgH);
      let finalScale = scaleCover * (1.0 + 0.06 * zoomExtra);
      let drawW = imgW * finalScale;
      let drawH = imgH * finalScale;
      let x = (w - drawW) / 2;
      let y = (h - drawH) / 2;

      // shift logic (auto adaptor kept)
      if (imgW / imgH > w / h) {
        const maxShift = (finalScale * imgW - w) / 2 / finalScale;
        x -= shiftX * maxShift * 0.8 * finalScale;
      } else {
        const maxShift = (finalScale * imgH - h) / 2 / finalScale;
        y -= shiftY * maxShift * 0.8 * finalScale;
      }
      x = Math.min(0, Math.max(x, w - drawW));
      y = Math.min(0, Math.max(y, h - drawH));

      offCtx.drawImage(img, x, y, drawW, drawH);

      // apply selected artistic filter
      let imageData = offCtx.getImageData(0, 0, w, h);
      imageData = applyFilter(imageData, currentFilter);
      offCtx.putImageData(imageData, 0, 0);

      // draw onto main canvas with opacity
      ctx.clearRect(0, 0, w, h);
      ctx.globalAlpha = opacity;
      ctx.drawImage(offscreen, 0, 0, w, h);
      ctx.globalAlpha = 1;
    }

    // renderFrame with filter applied via drawImageOnCanvas
    function renderFrame(time, imgArray) {
      const n = imgArray.length;
      if (n === 0) return;
      if (n === 1) return drawImageOnCanvas(imgArray[0], 1, 0.5, 0, 0);

      const segDuration = 1 / n;
      const segIndex = Math.min(Math.floor(time / segDuration), n - 1);
      const segProgress = (time - segStart) / segDuration; // 0..1

      // recompute segStart inside loop? define inside
      const segStartLocal = segIndex * segDuration;
      const segProgressLocal = (time - segStartLocal) / segDuration;

      const currentImg = imgArray[segIndex];
      const nextImg = imgArray[(segIndex + 1) % n];
      const fadeDuration = 0.4;
      let blend = 0;
      const crossStart = 0.6;
      if (segProgressLocal >= crossStart) {
        blend = (segProgressLocal - crossStart) / (1 - crossStart);
        blend = Math.min(blend, 1);
        blend = easeInOutCubic(blend);
      }

      // dynamic shift for current
      const tCycle = time * 2 * Math.PI;
      let shiftX = Math.sin(tCycle * 0.8) * 0.7;
      let shiftY = Math.cos(tCycle * 0.6) * 0.5;
      let zoomExtra = 0.3 + 0.3 * Math.sin(tCycle * 1.2);
      drawImageOnCanvas(currentImg, 1, zoomExtra, shiftX, shiftY);

      if (blend > 0) {
        // next with slightly different params
        let shiftX2 = Math.sin(tCycle * 0.8 + 1.5) * 0.7;
        let shiftY2 = Math.cos(tCycle * 0.6 + 2.0) * 0.5;
        let zoomExtra2 = 0.3 + 0.3 * Math.cos(tCycle * 1.2 + 1.0);
        // we need to draw on top using same drawImageOnCanvas but separate opacity handling
        const w = canvas.width, h = canvas.height;
        const offscreen = document.createElement('canvas');
        offscreen.width = w; offscreen.height = h;
        const offCtx = offscreen.getContext('2d');

        const img = nextImg;
        const imgW = img.width, imgH = img.height;
        const scaleCover = Math.max(w / imgW, h / imgH);
        let finalScale = scaleCover * (1.0 + 0.06 * zoomExtra2);
        let drawW = imgW * finalScale;
        let drawH = imgH * finalScale;
        let x = (w - drawW) / 2;
        let y = (h - drawH) / 2;

        if (imgW / imgH > w / h) {
          const maxShift = (finalScale * imgW - w) / 2 / finalScale;
          x -= shiftX2 * maxShift * 0.8 * finalScale;
        } else {
          const maxShift = (finalScale * imgH - h) / 2 / finalScale;
          y -= shiftY2 * maxShift * 0.8 * finalScale;
        }
        x = Math.min(0, Math.max(x, w - drawW));
        y = Math.min(0, Math.max(y, h - drawH));

        offCtx.drawImage(img, x, y, drawW, drawH);
        let imageData = offCtx.getImageData(0, 0, w, h);
        imageData = applyFilter(imageData, currentFilter);
        offCtx.putImageData(imageData, 0, 0);

        ctx.globalAlpha = blend;
        ctx.drawImage(offscreen, 0, 0, w, h);
        ctx.globalAlpha = 1;
      }
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
      if (files.length < 2 || files.length > 3) {
        statusMsg.innerHTML = '⚠️ need 2 or 3 images (selected ' + files.length + ')';
        return;
      }
      statusMsg.innerHTML = '🔄 loading with ' + currentFilter + ' filter...';
      const promises = files.map(file => {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = URL.createObjectURL(file);
        });
      });
      const imgs = await Promise.all(promises);
      loadedImages = imgs.filter(Boolean);
      if (loadedImages.length >= 2) {
        statusMsg.innerHTML = `✅ ${currentFilter} filter · ${loadedImages.length} images`;
        updateFilmStrip(loadedImages);
        drawImageOnCanvas(loadedImages[0], 1, 0.2, 0, 0);
      } else {
        statusMsg.innerHTML = '❌ failed to load some images';
      }
    });

    async function startRendering() {
      if (loadedImages.length < 2) {
        statusMsg.innerHTML = '⚠️ upload 2–3 images first';
        return;
      }
      if (isRendering) {
        if (mediaRecorder) mediaRecorder.stop();
        if (animationFrame) cancelAnimationFrame(animationFrame);
      }

      const durationSec = Math.min(58, Math.max(25, Number(durationInput.value) || 38));
      const fps = 30;
      const totalFrames = durationSec * fps;

      canvas.width = 540;
      canvas.height = 960;

      const stream = canvas.captureStream(fps);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      recordedChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        previewVideo.src = url;
        previewVideo.style.display = 'block';
        downloadBtn.disabled = false;
        statusMsg.innerHTML = `✅ reels with ${currentFilter} filter · ready`;
        isRendering = false;
        renderBtn.disabled = false;
      };

      mediaRecorder.start();
      isRendering = true;
      renderBtn.disabled = true;
      downloadBtn.disabled = true;
      statusMsg.innerHTML = `🎥 rendering ${currentFilter} filter ...`;

      let frame = 0;
      function animate() {
        if (!isRendering) return;
        const t = frame / totalFrames;
        renderFrame(t, loadedImages);
        frame++;
        if (frame < totalFrames) {
          animationFrame = requestAnimationFrame(animate);
        } else {
          mediaRecorder.stop();
          isRendering = false;
          renderBtn.disabled = false;
        }
      }
      animate();
    }

    renderBtn.addEventListener('click', startRendering);

    downloadBtn.addEventListener('click', () => {
      if (!recordedChunks.length) return;
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reels_${currentFilter}_${Date.now()}.webm`;
      a.click();
    });

    // initial draw
    (function initDraw() {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = 'bold 22px system-ui';
      ctx.fillStyle = '#aaa';
      ctx.textAlign = 'center';
      ctx.fillText('⬆️ upload', canvas.width/2, canvas.height/2);
    })();

    updateFilmStrip([]);
  })();
</script>
</body>
</html>
