<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>10x Reels Studio · Pro</title>
  <!-- Font & Icons for modern look -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0b;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      touch-action: pan-y; /* preserve vertical swipe */
    }

    /* Main container — real mobile first, max width like premium app */
    .reels-container {
      width: 100%;
      max-width: 420px; /* typical mobile width */
      background: #000;
      border-radius: 36px 36px 24px 24px;
      overflow: hidden;
      box-shadow: 0 30px 50px rgba(0,0,0,0.9);
      border: 1px solid #262626;
      position: relative;
      aspect-ratio: 9 / 16; /* reels classic ratio */
    }

    /* canvas fills the reels area */
    .canvas-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
      object-fit: cover;
      pointer-events: none; /* allow buttons to work through */
    }

    /* overlay UI: like Reels right side + bottom modern bar */
    .overlay-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 16px 26px 16px;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 20%, transparent);
      display: flex;
      flex-direction: column;
      gap: 20px;
      border: none;
    }

    /* top indicator for selected images */
    .film-strip {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 4px;
    }
    .thumb-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #1e1e1e;
      border: 2px solid #3a3a3a;
      object-fit: cover;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
      transition: all 0.2s;
    }
    .thumb-badge.active {
      border-color: #f02e65;
      transform: scale(1.02);
    }

    /* main control bar — sleek glassmorph */
    .action-bar {
      background: rgba(22, 22, 26, 0.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 42px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border: 1px solid #3d3d3d;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: #f0f0f0;
      font-size: 22px;
      width: 44px;
      height: 44px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      cursor: pointer;
    }
    .btn-icon:active { background: #2f2f2f; }
    .btn-icon.disabled, .btn-icon:disabled { opacity: 0.3; pointer-events: none; }

    .upload-hint {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #272727;
      border-radius: 40px;
      padding: 4px 14px 4px 10px;
      border: 1px solid #4a4a4a;
      font-size: 14px;
      font-weight: 500;
      color: #ddd;
      cursor: pointer;
    }
    .upload-hint i { font-size: 18px; color: #f02e65; }

    .duration-picker {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1b1b1e;
      padding: 6px 12px;
      border-radius: 60px;
      border: 1px solid #3b3b3b;
    }
    .duration-picker span { color: #fff; font-size: 15px; font-weight: 500; }
    .duration-picker input {
      width: 48px;
      background: #0e0e0e;
      border: 1px solid #5c5c5c;
      color: white;
      padding: 6px 0 6px 12px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
    }

    .render-btn {
      background: #f02e65;
      border: none;
      border-radius: 48px;
      padding: 12px 28px;
      font-weight: 700;
      font-size: 16px;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 18px rgba(240,46,101,0.4);
      cursor: pointer;
      transition: 0.15s;
    }
    .render-btn:active { transform: scale(0.96); background: #d11f54; }
    .render-btn:disabled { opacity: 0.5; filter: grayscale(0.8); pointer-events: none; }

    /* hidden file input */
    #file-input {
      display: none;
    }

    /* mini preview row & download button */
    .preview-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 4px;
    }
    .preview-video {
      display: none;
      width: 70%;
      height: 48px;
      border-radius: 30px;
      background: #121212;
      border: 1px solid #333;
      object-fit: cover;
    }
    .preview-video[src] { display: block; }
    .download-btn {
      background: #1c1c1c;
      border: 1px solid #5b5b5b;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      gap: 8px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .download-btn:active { background: #2d2d2d; }
    .download-btn:disabled { opacity: 0.2; }

    .status-text {
      font-size: 12px;
      color: #aaa;
      margin-top: 6px;
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    i { pointer-events: none; }
  </style>
</head>
<body>
<div class="reels-container">
  <div class="canvas-wrapper">
    <canvas id="reelsCanvas" width="432" height="768"></canvas> <!-- 9:16 approx -->
  </div>

  <!-- Dynamic film strip (generated from images) -->
  <div class="film-strip" id="filmStrip"></div>

  <!-- Overlay controls like reels -->
  <div class="overlay-controls">
    <div class="preview-section">
      <video id="videoPreview" class="preview-video" muted playsinline></video>
      <button id="downloadVideoBtn" class="download-btn" disabled><i class="fas fa-arrow-down"></i> HD</button>
    </div>

    <!-- modern action row -->
    <div class="action-bar">
      <!-- hidden file input + custom trigger -->
      <label for="file-input" class="btn-icon"><i class="fas fa-images"></i></label>
      <input type="file" id="file-input" accept="image/*" multiple hidden>

      <div class="duration-picker">
        <span><i class="far fa-clock"></i></span>
        <input type="number" id="durationInput" value="38" min="25" max="58" step="1">
      </div>

      <button id="renderStartBtn" class="render-btn"><i class="fas fa-magic"></i> Render</button>
    </div>
    <div class="status-text" id="statusMsg"><i class="fas fa-chevron-up" style="opacity:0.7;"></i> drop 2-3 photos • 10x pro</div>
  </div>
</div>

<script>
  (function() {
    // --- 10x ENHANCED: more features, smooth transitions, optimised ---
    const canvas = document.getElementById('reelsCanvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('file-input');
    const filmStrip = document.getElementById('filmStrip');
    const renderBtn = document.getElementById('renderStartBtn');
    const downloadBtn = document.getElementById('downloadVideoBtn');
    const previewVideo = document.getElementById('videoPreview');
    const statusMsg = document.getElementById('statusMsg');
    const durationInput = document.getElementById('durationInput');

    // State
    let loadedImages = [];            // Array of HTMLImageElement
    let isRendering = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let animationFrame = null;

    // Helper to resize canvas to actual display (maintain 9:16)
    function resizeCanvasToDisplay() {
      const container = canvas.parentElement;
      const w = container.clientWidth;
      const h = container.clientHeight;
      canvas.width = w;
      canvas.height = h;
    }
    window.addEventListener('resize', resizeCanvasToDisplay);
    resizeCanvasToDisplay();

    // Update film strip thumbnails
    function updateFilmStrip(images) {
      filmStrip.innerHTML = '';
      if (!images.length) {
        // placeholder strip
        for (let i = 0; i < 3; i++) {
          const emptyDiv = document.createElement('div');
          emptyDiv.className = 'thumb-badge';
          emptyDiv.style.background = '#1a1a1a';
          emptyDiv.style.border = '2px dashed #3c3c3c';
          filmStrip.appendChild(emptyDiv);
        }
        return;
      }
      images.forEach((img, idx) => {
        const thumb = document.createElement('img');
        thumb.src = img.src;
        thumb.className = 'thumb-badge';
        if (idx === 0) thumb.classList.add('active');
        filmStrip.appendChild(thumb);
      });
      // if less than 3, fill empty faded
      for (let i = images.length; i < 3; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'thumb-badge';
        emptyDiv.style.background = '#222';
        emptyDiv.style.opacity = '0.5';
        filmStrip.appendChild(emptyDiv);
      }
    }

    // Load images from FileList
    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
      if (files.length < 2 || files.length > 3) {
        statusMsg.innerHTML = '⚠️ need 2 or 3 images (selected ' + files.length + ')';
        return;
      }
      statusMsg.innerHTML = '🔄 loading high quality...';
      const promises = files.map(file => {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = URL.createObjectURL(file);
        });
      });
      const imgs = await Promise.all(promises);
      loadedImages = imgs.filter(Boolean);
      if (loadedImages.length >= 2) {
        statusMsg.innerHTML = `✅ ${loadedImages.length} images ready • cinematic 10x`;
        updateFilmStrip(loadedImages);
        // Pre-draw first image on canvas
        if (loadedImages[0]) drawImageOnCanvas(loadedImages[0], 1);
      } else {
        statusMsg.innerHTML = '❌ failed to load some images';
      }
    });

    // Draw image with cover sizing
    function drawImageOnCanvas(img, opacity = 1.0) {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const imgW = img.width, imgH = img.height;
      const scale = Math.max(w / imgW, h / imgH);
      const drawW = imgW * scale, drawH = imgH * scale;
      const x = (w - drawW) / 2, y = (h - drawH) / 2;
      ctx.globalAlpha = opacity;
      ctx.drawImage(img, x, y, drawW, drawH);
      ctx.globalAlpha = 1;
    }

    // Easing for smooth crossfade
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // Render frame given time [0,1] and images
    function renderFrame(time, imgArray) {
      const n = imgArray.length;
      if (n === 0) return;
      if (n === 1) return drawImageOnCanvas(imgArray[0], 1);

      const segDuration = 1 / n; // each image gets equal time
      const segIndex = Math.min(Math.floor(time / segDuration), n - 1);
      const segStart = segIndex * segDuration;
      const segProgress = (time - segStart) / segDuration; // [0..1]

      const currentImg = imgArray[segIndex];
      const nextImg = imgArray[(segIndex + 1) % n];
      const fadeDuration = 0.4; // 40% of segment used for transition (makes it smooth)
      let blend = 0;

      if (segProgress < fadeDuration) {
        // fade in from previous? Actually we use crossfade between current and next for last part and first part
        // but we want also smooth loop. Use overlapping: for simplicity, make transition window at end of segment.
        // Better: start crossfade at 60% of segment, end at 100% (or overlap)
        const crossStart = 0.6; // start fading at 60% through segment
        if (segProgress >= crossStart) {
          blend = (segProgress - crossStart) / (1 - crossStart);
          blend = Math.min(blend, 1);
          blend = easeInOutCubic(blend);
        } else {
          blend = 0;
        }
      } else {
        blend = 0; // after segment? Actually next segment will handle
      }

      // draw current image fully
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      drawImageOnCanvas(currentImg, 1);

      if (blend > 0) {
        // draw next image on top with blend
        const img = nextImg;
        const imgW = img.width, imgH = img.height;
        const scale = Math.max(w / imgW, h / imgH);
        const drawW = imgW * scale, drawH = imgH * scale;
        const x = (w - drawW) / 2, y = (h - drawH) / 2;
        ctx.globalAlpha = blend;
        ctx.drawImage(img, x, y, drawW, drawH);
        ctx.globalAlpha = 1;
      }
    }

    // start recording and animation
    async function startRendering() {
      if (loadedImages.length < 2) {
        statusMsg.innerHTML = '⚠️ upload 2–3 images first';
        return;
      }
      if (isRendering) {
        if (mediaRecorder) mediaRecorder.stop();
        if (animationFrame) cancelAnimationFrame(animationFrame);
      }

      const durationSec = Math.min(58, Math.max(25, Number(durationInput.value) || 38));
      const fps = 30;
      const totalFrames = durationSec * fps;

      // resize canvas to consistent 9:16 (540x960) for high quality output
      canvas.width = 540;
      canvas.height = 960;

      const stream = canvas.captureStream(fps);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      recordedChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        previewVideo.src = url;
        previewVideo.style.display = 'block';
        downloadBtn.disabled = false;
        statusMsg.innerHTML = '✅ reels ready — preview & download';
        isRendering = false;
        renderBtn.disabled = false;
      };

      mediaRecorder.start();
      isRendering = true;
      renderBtn.disabled = true;
      downloadBtn.disabled = true;
      statusMsg.innerHTML = '🎥 rendering 10x reels...';

      let frame = 0;
      function animate() {
        if (!isRendering) return;
        const t = frame / totalFrames;
        renderFrame(t, loadedImages);
        frame++;
        if (frame < totalFrames) {
          animationFrame = requestAnimationFrame(animate);
        } else {
          // finish
          mediaRecorder.stop();
          isRendering = false;
          renderBtn.disabled = false;
        }
      }
      animate();
    }

    renderBtn.addEventListener('click', startRendering);

    downloadBtn.addEventListener('click', () => {
      if (!recordedChunks.length) return;
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reels_10x_${Date.now()}.webm`;
      a.click();
    });

    // Also allow click on film strip to set active? not needed but nice
    // Draw default background on load
    (function initDraw() {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = 'bold 22px system-ui';
      ctx.fillStyle = '#aaa';
      ctx.textAlign = 'center';
      ctx.fillText('⬆️ upload', canvas.width/2, canvas.height/2);
    })();

    // Additional 10x features: dynamic orientation, loop preview
    // Double tap to reset demo (secret)
    canvas.addEventListener('dblclick', () => {
      if (loadedImages[0]) drawImageOnCanvas(loadedImages[0], 1);
    });

    // clean object URLs on unload
    window.addEventListener('beforeunload', () => {
      if (previewVideo.src) URL.revokeObjectURL(previewVideo.src);
    });

    // Update filmstrip when images change, show first image
    updateFilmStrip([]);
  })();
</script>
</body>
</html>
