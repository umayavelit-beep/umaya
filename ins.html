<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- important meta for touch & scaling: allow user scaling but also enable pinch zoom on canvas -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover" />
  <title>10x Reels · finger zoom + auto‑rotate</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0b;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      touch-action: pan-y; /* allow vertical scroll, but canvas will handle pinch */
    }

    .reels-container {
      width: 100%;
      max-width: 420px;
      background: #000;
      border-radius: 36px 36px 24px 24px;
      overflow: hidden;
      box-shadow: 0 30px 50px rgba(0,0,0,0.9);
      border: 1px solid #262626;
      position: relative;
      aspect-ratio: 9 / 16;
    }

    .canvas-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      /* allow touch events on canvas so we can zoom */
      touch-action: none;  /* we'll handle pinch via js */
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
      object-fit: cover;
      /* pointer-events removed -> we need them for touch */
      pointer-events: auto;
      touch-action: none;
    }

    .overlay-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 16px 26px 16px;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 20%, transparent);
      display: flex;
      flex-direction: column;
      gap: 20px;
      border: none;
      pointer-events: none; /* let touches pass through to canvas, but clickable children need override */
    }
    .overlay-controls > * {
      pointer-events: auto; /* make controls clickable again */
    }

    .film-strip {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 4px;
      position: relative;
      z-index: 5;
      pointer-events: auto;
    }
    .thumb-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #1e1e1e;
      border: 2px solid #3a3a3a;
      object-fit: cover;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
      transition: all 0.2s;
      cursor: pointer;
    }
    .thumb-badge.active {
      border-color: #f02e65;
      transform: scale(1.02);
    }

    .action-bar {
      background: rgba(22, 22, 26, 0.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 42px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border: 1px solid #3d3d3d;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: #f0f0f0;
      font-size: 22px;
      width: 44px;
      height: 44px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      cursor: pointer;
    }
    .btn-icon:active { background: #2f2f2f; }
    .btn-icon.disabled, .btn-icon:disabled { opacity: 0.3; pointer-events: none; }

    .upload-hint {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #272727;
      border-radius: 40px;
      padding: 4px 14px 4px 10px;
      border: 1px solid #4a4a4a;
      font-size: 14px;
      font-weight: 500;
      color: #ddd;
      cursor: pointer;
    }
    .upload-hint i { font-size: 18px; color: #f02e65; }

    .duration-picker {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1b1b1e;
      padding: 6px 12px;
      border-radius: 60px;
      border: 1px solid #3b3b3b;
    }
    .duration-picker span { color: #fff; font-size: 15px; font-weight: 500; }
    .duration-picker input {
      width: 48px;
      background: #0e0e0e;
      border: 1px solid #5c5c5c;
      color: white;
      padding: 6px 0 6px 12px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
    }

    .render-btn {
      background: #f02e65;
      border: none;
      border-radius: 48px;
      padding: 12px 28px;
      font-weight: 700;
      font-size: 16px;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 18px rgba(240,46,101,0.4);
      cursor: pointer;
      transition: 0.15s;
    }
    .render-btn:active { transform: scale(0.96); background: #d11f54; }
    .render-btn:disabled { opacity: 0.5; filter: grayscale(0.8); pointer-events: none; }

    #file-input {
      display: none;
    }

    .preview-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 4px;
    }
    .preview-video {
      display: none;
      width: 70%;
      height: 48px;
      border-radius: 30px;
      background: #121212;
      border: 1px solid #333;
      object-fit: cover;
    }
    .preview-video[src] { display: block; }
    .download-btn {
      background: #1c1c1c;
      border: 1px solid #5b5b5b;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      gap: 8px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .download-btn:active { background: #2d2d2d; }
    .download-btn:disabled { opacity: 0.2; }

    .status-text {
      font-size: 12px;
      color: #aaa;
      margin-top: 6px;
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* auto‑adaptor badge */
    .auto-adaptor-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #2b2b2b;
      border-radius: 40px;
      padding: 4px 14px 4px 10px;
      border: 1px solid #f02e65;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      margin-right: 8px;
      cursor: pointer;
    }
    .auto-adaptor-badge i { color: #39e58c; }

    i { pointer-events: none; }
  </style>
</head>
<body>
<div class="reels-container">
  <div class="canvas-wrapper">
    <canvas id="reelsCanvas" width="432" height="768"></canvas>
  </div>

  <!-- film strip visible above overlay (z-index) -->
  <div class="film-strip" id="filmStrip"></div>

  <div class="overlay-controls">
    <div class="preview-section">
      <video id="videoPreview" class="preview-video" muted playsinline></video>
      <button id="downloadVideoBtn" class="download-btn" disabled><i class="fas fa-arrow-down"></i> HD</button>
    </div>

    <div class="action-bar">
      <label for="file-input" class="btn-icon"><i class="fas fa-images"></i></label>
      <input type="file" id="file-input" accept="image/*" multiple hidden>

      <!-- auto‑adaptor pill (visual + toggle) -->
      <div class="auto-adaptor-badge" id="autoAdaptorPill">
        <i class="fas fa-robot"></i> <span>Auto‑fit</span> <i class="fas fa-toggle-on" style="color:#f02e65; font-size:20px;" id="adaptorToggleIcon"></i>
      </div>

      <div class="duration-picker">
        <span><i class="far fa-clock"></i></span>
        <input type="number" id="durationInput" value="38" min="25" max="58" step="1">
      </div>

      <button id="renderStartBtn" class="render-btn"><i class="fas fa-magic"></i> Render</button>
    </div>
    <div class="status-text" id="statusMsg"><i class="fas fa-microchip"></i> auto adaptor ON · pinch to zoom</div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('reelsCanvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('file-input');
    const filmStrip = document.getElementById('filmStrip');
    const renderBtn = document.getElementById('renderStartBtn');
    const downloadBtn = document.getElementById('downloadVideoBtn');
    const previewVideo = document.getElementById('videoPreview');
    const statusMsg = document.getElementById('statusMsg');
    const durationInput = document.getElementById('durationInput');
    const adaptorPill = document.getElementById('autoAdaptorPill');
    const toggleIcon = document.getElementById('adaptorToggleIcon');

    // ---------- AUTO ADAPTOR / ZOOM + PAN ----------
    let autoAdaptorEnabled = true;  // default ON

    adaptorPill.addEventListener('click', (e) => {
      autoAdaptorEnabled = !autoAdaptorEnabled;
      if (autoAdaptorEnabled) {
        toggleIcon.className = 'fas fa-toggle-on';
        toggleIcon.style.color = '#f02e65';
        statusMsg.innerHTML = '<i class="fas fa-robot"></i> auto adaptor ON · pinch to zoom';
      } else {
        toggleIcon.className = 'fas fa-toggle-off';
        toggleIcon.style.color = '#aaa';
        statusMsg.innerHTML = '<i class="fas fa-image"></i> auto adaptor OFF · manual zoom';
      }
      redrawCurrentImage(); 
    });

    // state for images
    let loadedImages = [];
    let currentImageIndex = 0;          // for manual preview (thumb click / fallback)
    let isRendering = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let animationFrame = null;

    // ----- ZOOM & PAN STATE (finger controlled) -----
    let zoomLevel = 1.0;                // additional multiplicative zoom on top of base cover
    let panX = 0, panY = 0;             // in canvas pixels (after zoom)
    let lastTouchDistance = 0;
    let lastTouchCenter = { x: 0, y: 0 };
    let isTouching = false;
    let touchStartDistance = 0;
    let initialZoom = 1.0;
    let initialPanX = 0, initialPanY = 0;
    let dragStart = { x: 0, y: 0 };

    // resize canvas
    function resizeCanvasToDisplay() {
      const container = canvas.parentElement;
      const w = container.clientWidth;
      const h = container.clientHeight;
      canvas.width = w;
      canvas.height = h;
      redrawCurrentImage();
    }
    window.addEventListener('resize', resizeCanvasToDisplay);
    resizeCanvasToDisplay();

    // redraw based on current image + zoom/pan
    function redrawCurrentImage() {
      if (loadedImages.length === 0) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 22px system-ui';
        ctx.fillStyle = '#aaa';
        ctx.textAlign = 'center';
        ctx.fillText('⬆️ upload', canvas.width/2, canvas.height/2);
        return;
      }
      const img = loadedImages[currentImageIndex % loadedImages.length];
      drawImageOnCanvasWithZoom(img);
    }

    // core drawing respecting zoom & pan
    function drawImageOnCanvasWithZoom(img) {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      if (!img) return;

      const imgW = img.width, imgH = img.height;
      // base cover scale (fill canvas)
      const baseScale = Math.max(w / imgW, h / imgH);
      // final scale = base * zoomLevel
      const finalScale = baseScale * zoomLevel;

      // compute image dimensions in canvas pixels
      const drawW = imgW * finalScale;
      const drawH = imgH * finalScale;

      // default centered position without pan
      let x0 = (w - drawW) / 2;
      let y0 = (h - drawH) / 2;

      // apply pan (panX, panY) in canvas coordinate space
      let x = x0 + panX;
      let y = y0 + panY;

      // clamp pan to avoid leaving empty areas (optional: keep image covering canvas)
      // we allow some overflow, but keep at least one edge inside to avoid black borders? 
      // better: clamp so that image always fills canvas (no black edges)
      // maximum left shift: drawW must cover left edge: x <= 0, and x >= w - drawW
      if (drawW > w) {
        x = Math.min(0, Math.max(x, w - drawW));
      } else {
        // if drawW smaller than canvas, keep centered (no pan actually)
        x = (w - drawW) / 2;
      }
      if (drawH > h) {
        y = Math.min(0, Math.max(y, h - drawH));
      } else {
        y = (h - drawH) / 2;
      }

      ctx.drawImage(img, x, y, drawW, drawH);
    }

    // ---- TOUCH HANDLERS for PINCH ZOOM & DRAG ----
    function handleTouchStart(e) {
      e.preventDefault();
      if (loadedImages.length === 0) return;
      const touches = e.touches;
      if (touches.length === 2) {
        // pinch start
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        lastTouchDistance = Math.hypot(dx, dy);
        touchStartDistance = lastTouchDistance;
        initialZoom = zoomLevel;

        // center of pinch
        lastTouchCenter.x = (touches[0].clientX + touches[1].clientX) / 2;
        lastTouchCenter.y = (touches[0].clientY + touches[1].clientY) / 2;
      } else if (touches.length === 1 && isTouching === false) {
        // single touch for pan
        dragStart.x = touches[0].clientX;
        dragStart.y = touches[0].clientY;
        initialPanX = panX;
        initialPanY = panY;
      }
      isTouching = true;
    }

    function handleTouchMove(e) {
      e.preventDefault();
      if (loadedImages.length === 0) return;
      const touches = e.touches;
      if (touches.length === 2) {
        // pinch zoom
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (lastTouchDistance > 0) {
          const scaleFactor = dist / touchStartDistance;
          let newZoom = initialZoom * scaleFactor;
          newZoom = Math.max(0.8, Math.min(3.5, newZoom)); // limit zoom
          zoomLevel = newZoom;

          // optional: re-center based on pinch center? we'll just keep pan as is for simplicity
          // you could implement pinch-to-zoom toward center, but for simplicity we keep current pan
        }
        redrawCurrentImage();
      } else if (touches.length === 1) {
        // pan
        const tx = touches[0].clientX;
        const ty = touches[0].clientY;
        const deltaX = tx - dragStart.x;
        const deltaY = ty - dragStart.y;
        panX = initialPanX + deltaX;
        panY = initialPanY + deltaY;
        redrawCurrentImage();
      }
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      isTouching = false;
      // reset start values? keep zoom
    }

    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    canvas.addEventListener('touchend', handleTouchEnd);
    canvas.addEventListener('touchcancel', handleTouchEnd);

    // optional double-tap reset
    canvas.addEventListener('dblclick', (e) => {
      e.preventDefault();
      zoomLevel = 1.0;
      panX = 0; panY = 0;
      redrawCurrentImage();
    });

    // ---- FILM STRIP & IMAGE LOADING ----
    function updateFilmStrip(images) {
      filmStrip.innerHTML = '';
      if (!images.length) {
        for (let i = 0; i < 3; i++) {
          const emptyDiv = document.createElement('div');
          emptyDiv.className = 'thumb-badge';
          emptyDiv.style.background = '#1a1a1a';
          emptyDiv.style.border = '2px dashed #3c3c3c';
          filmStrip.appendChild(emptyDiv);
        }
        return;
      }
      images.forEach((img, idx) => {
        const thumb = document.createElement('img');
        thumb.src = img.src;
        thumb.className = 'thumb-badge';
        if (idx === currentImageIndex) thumb.classList.add('active');
        thumb.addEventListener('click', () => {
          currentImageIndex = idx;
          // reset zoom/pan on manual thumb click? optional: keep zoom? we reset to 1
          zoomLevel = 1.0;
          panX = 0; panY = 0;
          redrawCurrentImage();
          document.querySelectorAll('.thumb-badge').forEach((el, i) => {
            if (i === idx) el.classList.add('active');
            else el.classList.remove('active');
          });
        });
        filmStrip.appendChild(thumb);
      });
      for (let i = images.length; i < 3; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'thumb-badge';
        emptyDiv.style.background = '#222';
        emptyDiv.style.opacity = '0.5';
        filmStrip.appendChild(emptyDiv);
      }
    }

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
      if (files.length < 2 || files.length > 3) {
        statusMsg.innerHTML = '⚠️ need 2 or 3 images (selected ' + files.length + ')';
        return;
      }
      statusMsg.innerHTML = '🔄 loading with auto adaptor...';
      const promises = files.map(file => {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = URL.createObjectURL(file);
        });
      });
      const imgs = await Promise.all(promises);
      loadedImages = imgs.filter(Boolean);
      if (loadedImages.length >= 2) {
        currentImageIndex = 0;
        zoomLevel = 1.0; panX = 0; panY = 0;
        statusMsg.innerHTML = autoAdaptorEnabled ? 
          '✅ auto adaptor active · pinch to zoom' : 
          '✅ images ready · auto adaptor off';
        updateFilmStrip(loadedImages);
        redrawCurrentImage();
      } else {
        statusMsg.innerHTML = '❌ failed to load some images';
      }
    });

    // ---- RENDER (video generation) ----
    // We keep the auto‑adaptor dynamic effect only when autoAdaptorEnabled = true,
    // but the preview/manual zoom is separate. For render we use the same effect as before.
    // But we also incorporate current zoom/pan? no — render uses its own dynamic parameters.
    // However we reset zoom for video render to avoid confusion.
    function renderFrame(time, imgArray) {
      const n = imgArray.length;
      if (n === 0) return;
      if (n === 1) return drawImageOnCanvasWithZoom(imgArray[0]); // but zoom should be reset for video? we'll set zoom=1 inside render
      // For video we ignore manual zoom, use dynamic auto‑adaptor (if enabled)
      // We'll use a dedicated draw function similar to original but incorporate autoAdaptorEnabled.
      // Since we have drawImageOnCanvasWithZoom which uses global zoomLevel, but we need to override for render.
      // Better: copy of original logic, but with autoAdaptorEnabled flag.
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const segDuration = 1 / n;
      const segIndex = Math.min(Math.floor(time / segDuration), n - 1);
      const segProgress = (time - segIndex * segDuration) / segDuration;

      const currentImg = imgArray[segIndex];
      const nextImg = imgArray[(segIndex + 1) % n];
      const crossStart = 0.6;
      let blend = 0;
      if (segProgress >= crossStart) {
        blend = (segProgress - crossStart) / (1 - crossStart);
        blend = Math.min(blend, 1);
        blend = easeInOutCubic(blend);
      }

      if (autoAdaptorEnabled) {
        // dynamic gentle oscillation for zoom/pan (like original)
        const tCycle = time * 2 * Math.PI;
        let shiftX = Math.sin(tCycle * 0.8) * 0.7;
        let shiftY = Math.cos(tCycle * 0.6) * 0.5;
        let zoomExtra = 0.3 + 0.3 * Math.sin(tCycle * 1.2); // 0..0.6

        drawImageAuto(currentImg, 1.0, zoomExtra, shiftX, shiftY);
        if (blend > 0) {
          let shiftX2 = Math.sin(tCycle * 0.8 + 1.5) * 0.7;
          let shiftY2 = Math.cos(tCycle * 0.6 + 2.0) * 0.5;
          let zoomExtra2 = 0.3 + 0.3 * Math.cos(tCycle * 1.2 + 1.0);
          ctx.globalAlpha = blend;
          drawImageAuto(nextImg, 1.0, zoomExtra2, shiftX2, shiftY2);
          ctx.globalAlpha = 1;
        }
      } else {
        // plain cover, no dynamic
        drawImageAuto(currentImg, 1.0, 0, 0, 0);
        if (blend > 0) {
          ctx.globalAlpha = blend;
          drawImageAuto(nextImg, 1.0, 0, 0, 0);
          ctx.globalAlpha = 1;
        }
      }
    }

    function drawImageAuto(img, opacity = 1.0, extraZoom = 0, shiftX = 0, shiftY = 0) {
      const w = canvas.width, h = canvas.height;
      const imgW = img.width, imgH = img.height;
      const scaleCover = Math.max(w / imgW, h / imgH);
      let finalScale = scaleCover * (1.0 + 0.06 * extraZoom);
      let offsetX = 0, offsetY = 0;
      if (autoAdaptorEnabled) {
        if (imgW / imgH > w / h) {
          const maxShift = (finalScale * imgW - w) / 2 / finalScale;
          offsetX = shiftX * maxShift * 0.8;
        } else {
          const maxShift = (finalScale * imgH - h) / 2 / finalScale;
          offsetY = shiftY * maxShift * 0.8;
        }
      }
      const drawW = imgW * finalScale;
      const drawH = imgH * finalScale;
      let x = (w - drawW) / 2 - offsetX * finalScale;
      let y = (h - drawH) / 2 - offsetY * finalScale;
      if (autoAdaptorEnabled) {
        x = Math.min(0, Math.max(x, w - drawW));
        y = Math.min(0, Math.max(y, h - drawH));
      }
      ctx.globalAlpha = opacity;
      ctx.drawImage(img, x, y, drawW, drawH);
      ctx.globalAlpha = 1;
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    async function startRendering() {
      if (loadedImages.length < 2) {
        statusMsg.innerHTML = '⚠️ upload 2–3 images first';
        return;
      }
      if (isRendering) {
        if (mediaRecorder) mediaRecorder.stop();
        if (animationFrame) cancelAnimationFrame(animationFrame);
      }

      const durationSec = Math.min(58, Math.max(25, Number(durationInput.value) || 38));
      const fps = 30;
      const totalFrames = durationSec * fps;

      // set canvas size for output
      canvas.width = 540;
      canvas.height = 960;

      const stream = canvas.captureStream(fps);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      recordedChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        previewVideo.src = url;
        previewVideo.style.display = 'block';
        downloadBtn.disabled = false;
        statusMsg.innerHTML = autoAdaptorEnabled ? '✅ reels with auto‑adaptor · ready' : '✅ reels ready (standard)';
        isRendering = false;
        renderBtn.disabled = false;
        // restore canvas size to display size after render
        resizeCanvasToDisplay();
        redrawCurrentImage();
      };

      mediaRecorder.start();
      isRendering = true;
      renderBtn.disabled = true;
      downloadBtn.disabled = true;
      statusMsg.innerHTML = autoAdaptorEnabled ? '🎥 rendering with auto‑adaptor...' : '🎥 rendering standard...';

      let frame = 0;
      function animate() {
        if (!isRendering) return;
        const t = frame / totalFrames;
        renderFrame(t, loadedImages);
        frame++;
        if (frame < totalFrames) {
          animationFrame = requestAnimationFrame(animate);
        } else {
          mediaRecorder.stop();
        }
      }
      animate();
    }

    renderBtn.addEventListener('click', startRendering);

    downloadBtn.addEventListener('click', () => {
      if (!recordedChunks.length) return;
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reels_auto_${Date.now()}.webm`;
      a.click();
    });

    // initial draw
    (function initDraw() {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = 'bold 22px system-ui';
      ctx.fillStyle = '#aaa';
      ctx.textAlign = 'center';
      ctx.fillText('⬆️ upload', canvas.width/2, canvas.height/2);
    })();

    updateFilmStrip([]);
  })();
</script>
</body>
